map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ath_blazor { server 127.0.0.1:5293; }
upstream meitar_web { server 127.0.0.1:5105; }

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        proxy_pass http://ath_blazor;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name ath.petel.site;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://ath.petel.site$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ath.petel.site;

    ssl_certificate     /etc/letsencrypt/live/ath.petel.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ath.petel.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://ath_blazor;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name meitar.petel.site;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://meitar.petel.site$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name meitar.petel.site;

    ssl_certificate     /etc/letsencrypt/live/meitar.petel.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meitar.petel.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://meitar_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
