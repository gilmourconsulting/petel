<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swagger API Documentation</title>
    <style>
        .swagger-container {
            width: 100%;
            height: calc(100vh - 100px);
            border: none;
            background: white;
        }

        .swagger-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 20px;
        }

        .swagger-header h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 24px;
        }

        .swagger-header p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        .swagger-iframe {
            width: 100%;
            height: 100%;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background: white;
        }

        .swagger-content {
            padding: 0 20px 20px 20px;
            height: calc(100vh - 180px);
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .info-box p {
            margin: 0;
            color: #1976d2;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="school-title-section">
        <h1 class="page-title">Swagger API Documentation</h1>
    </div>

    <div class="students-container">
        <!-- Context buttons -->
        <div class="context-buttons-section screenwithtable-context">
            <button class="context-btn" onclick="refreshSwagger()">
                רענן
            </button>
            <button class="context-btn" onclick="openSwaggerInNewTab()">
                פתח בכרטיסייה חדשה
            </button>
            <button class="context-btn" onclick="navigateToMainDashboard()">
                חזרה לדף ראשי
            </button>
        </div>

        <!-- Main content -->
        <div class="students-content">
            <div class="content-card">
                <div class="swagger-header">
                    <h1>Swagger API Documentation</h1>
                    <p>תיעוד אינטראקטיבי של כל ה-API endpoints במערכת</p>
                </div>

                <div class="info-box">
                    <p>💡 טיפ: אתה כבר מחובר למערכת. ה-token שלך יועבר אוטומטית ל-Swagger.</p>
                </div>

                <div class="swagger-content">
                    <iframe id="swaggerFrame" class="swagger-iframe" src="about:blank"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Load Swagger UI in iframe with auth token
         */
        function loadSwagger() {
            console.log('📚 Loading Swagger UI...');
            
            const authToken = sessionStorage.getItem('authToken');
            if (!authToken) {
                console.error('❌ No auth token found');
                alert('נדרש אימות. אנא התחבר מחדש.');
                return;
            }

            // Get Swagger URL from AppConfig
            const apiBaseUrl = window.AppConfig ? window.AppConfig.apiBaseUrl : '';
            const swaggerUrl = apiBaseUrl.replace('/api', '') + '/swagger';
            
            console.log('🔗 Swagger URL:', swaggerUrl);
            
            // Load Swagger in iframe
            const iframe = document.getElementById('swaggerFrame');
            iframe.src = swaggerUrl;
            
            // Try to inject auth token once iframe loads (may not work due to CORS)
            iframe.onload = function() {
                try {
                    console.log('✅ Swagger loaded');
                    // Note: Cannot access iframe content due to CORS, but Swagger should work anyway
                } catch (error) {
                    console.log('⚠️ Cannot access iframe content (expected due to CORS)');
                }
            };
        }

        /**
         * Refresh Swagger iframe
         */
        function refreshSwagger() {
            console.log('🔄 Refreshing Swagger...');
            const iframe = document.getElementById('swaggerFrame');
            iframe.src = iframe.src;
        }

        /**
         * Open Swagger in new tab
         */
        function openSwaggerInNewTab() {
            const apiBaseUrl = window.AppConfig ? window.AppConfig.apiBaseUrl : '';
            const swaggerUrl = apiBaseUrl.replace('/api', '') + '/swagger';
            window.open(swaggerUrl, '_blank');
        }

        /**
         * Navigate to main dashboard
         */
        async function navigateToMainDashboard() {
            console.log('🔄 Navigating to main dashboard...');
            await window.navigateTo('maindashboard');
        }

        /**
         * Cleanup function for PageLifecycleManager
         */
        function cleanupSwaggerPage() {
            console.log('🧹 Cleaning up swagger page...');
            const iframe = document.getElementById('swaggerFrame');
            if (iframe) {
                iframe.src = 'about:blank';
            }
        }

        // Export functions
        window.cleanupSwaggerPage = cleanupSwaggerPage;
        window.refreshSwagger = refreshSwagger;
        window.openSwaggerInNewTab = openSwaggerInNewTab;
        window.navigateToMainDashboard = navigateToMainDashboard;

        // Initialize on load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎬 Swagger page initialized');
            loadSwagger();
        });
    </script>
</body>
</html>
