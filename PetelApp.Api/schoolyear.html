<div class="schoolyear-container">
    <!-- Main content area -->
    <div class="schoolyear-content">
        <div class="content-card">
            <h2 id="schoolYearTitle" style="margin-bottom: 20px; color: #333;">שנת לימודים</h2>
            <div id="schoolYearInfo" style="font-size: 18px; color: #667eea; text-align: center;">
                <!-- The year info will be loaded here -->
            </div>
            
            <div id="budgetDetails" style="margin-top: 32px;">
                <h3 style="color: #333;">פרטי תקציב שעות</h3>
                <table style="width:100%; border-collapse:collapse;">
                    <tr>
                        <td style="font-weight:600;">גרסת תקציב שעות:</td>
                        <td>
                            <div id="budgetVersion"></div>
                            <div id="budgetVersion2" style="color:#888; font-size:14px;"></div>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-weight:600;">סטטוס תקציב שעות:</td>
                        <td>
                            <div id="budgetStatus"></div>
                            <div id="budgetStatus2" style="color:#888; font-size:14px;"></div>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-weight:600;">שם תקציב שעות:</td>
                        <td>
                            <div id="budgetName"></div>
                            <div id="budgetName2" style="color:#888; font-size:14px;"></div>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-weight:600;">תיאור תקציב שעות:</td>
                        <td>
                            <div id="budgetDescription"></div>
                            <div id="budgetDescription2" style="color:#888; font-size:14px;"></div>
                        </td>
                    </tr>
                </table>
            </div>
            
            <!-- Content area for the selected section -->
            <div id="schoolYearSectionContent" style="margin-top: 20px;">
                <!-- Dynamic content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Context buttons positioned to the right (in RTL layout) -->
    <div class="context-buttons-section schoolyear-context">
        <button class="context-btn" onclick="showSchoolYearSection('students')" style="background: #C15A16; color: #fff; border: none; margin: 0 10px;">תלמידים</button>
        <button class="context-btn" onclick="showSchoolYearSection('personnel')" style="background: #008031; color: #fff; border: none; margin: 0 10px;">עובדי הוראה</button>
        <button class="context-btn" onclick="showSchoolYearSection('budget')" style="background: #1D9CF3; color: #fff; border: none; margin: 0 10px;">תקציב שעות</button>
    </div>
</div>

<script>
    let schoolYears = [];

    async function loadSchoolYears() {
        try {
            const response = await fetch(AppConfig.getApiUrl('utils/schoolyears'), {
                headers: {
                    'Authorization': `Bearer ${sessionManager.getToken()}`
                }
            });

            if (response.ok) {
                schoolYears = await response.json();
                displaySchoolYears(schoolYears);
                await loadCurrentSchoolYear();
            }
        } catch (error) {
            console.error('Error loading school years:', error);
            alert('שגיאה בטעינת שנות לימוד');
        }
    }

    async function loadCurrentSchoolYear() {
        try {
            const response = await fetch(AppConfig.getApiUrl('session'), {
                headers: {
                    'Authorization': `Bearer ${sessionManager.getToken()}`
                }
            });

            if (response.ok) {
                const session = await response.json();
                const currentYearId = session.currentSchoolYearId;
                
                if (currentYearId) {
                    const yearCards = document.querySelectorAll('.year-card');
                    yearCards.forEach(card => {
                        if (card.dataset.yearId === currentYearId) {
                            card.classList.add('selected');
                        }
                    });
                }
            }
        } catch (error) {
            console.error('Error loading current school year:', error);
        }
    }

    async function selectSchoolYear(yearId) {
        try {
            const response = await fetch(AppConfig.getApiUrl('session/property'), {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${sessionManager.getToken()}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    key: 'CurrentSchoolYearId',
                    value: yearId
                })
            });

            if (response.ok) {
                document.querySelectorAll('.year-card').forEach(card => {
                    card.classList.remove('selected');
                });
                document.querySelector(`[data-year-id="${yearId}"]`)?.classList.add('selected');

                window.dispatchEvent(new CustomEvent('schoolYearChanged', {
                    detail: { schoolYearId: yearId }
                }));

                alert('שנת הלימוד עודכנה בהצלחה');
            } else {
                alert('שגיאה בעדכון שנת הלימוד');
            }
        } catch (error) {
            console.error('Error setting school year:', error);
            alert('שגיאה בעדכון שנת הלימוד');
        }
    }

    function displaySchoolYears(years) {
        const container = document.getElementById('schoolYearsContainer');
        container.innerHTML = years.map(year => `
            <div class="year-card" data-year-id="${year.id}" onclick="selectSchoolYear('${year.id}')">
                <div class="year-name">${year.name}</div>
                <div class="year-dates">${new Date(year.startDate).toLocaleDateString('he-IL')} - ${new Date(year.endDate).toLocaleDateString('he-IL')}</div>
            </div>
        `).join('');
    }

    loadSchoolYears();
</script>
