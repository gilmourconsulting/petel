<script>
    window.entityDetailsData = null;

    window.potentialOwners = [];
    window.isEntityEditMode = false;

async function initializeEntityDetails() {
    console.log('🏗️ Initializing Entity Details page...');
    
    // Load lookups first
    await Promise.all([loadEntityTypes(), loadPotentialOwners()]);
    
    // Setup edit button
    setupEditEntityDetailsButton();
    
    // Load entity data
    await loadEntityDetails();
}

    async function loadEntityTypes() {
        try {
            const response = await fetch(AppConfig.getApiUrl('entities/entity-types'), AppConfig.getDefaultFetchOptions());
            if (response.ok) {
                window.entityTypes = await response.json();
                const select = document.getElementById('edit_entityType');
               /* select.innerHTML = '<option value="">בחר סוג ישות...</option>';
                window.entityTypes.forEach(type => {
                    select.innerHTML += `<option value="${type.id}">${type.name}</option>`;
                });*/
            }
        } catch (error) {
            console.error('❌ Error loading entity types:', error);
        }
    }

async function loadPotentialOwners() {
    try {
        // ✅ Use centralized owner-options endpoint
        const response = await fetch(
            AppConfig.getApiUrl('entities/owner-options'), 
            AppConfig.getDefaultFetchOptions()
        );
        
        if (response.ok) {
            const data = await response.json();
            
            if (data.success && Array.isArray(data.ownerOptions)) {
                window.potentialOwners = data.ownerOptions;
                window.isOwnerDropdownLocked = data.isLocked;
                
                console.log('✅ Loaded owner options:', {
                    count: window.potentialOwners.length,
                    isLocked: window.isOwnerDropdownLocked
                });
            } else {
                console.warn('⚠️ Invalid owner options response:', data);
                window.potentialOwners = [];
                window.isOwnerDropdownLocked = false;
            }
        } else {
            console.error('❌ Failed to load owner options:', response.status);
            window.potentialOwners = [];
            window.isOwnerDropdownLocked = false;
        }
    } catch (error) {
        console.error('❌ Error loading owners:', error);
        window.potentialOwners = [];
        window.isOwnerDropdownLocked = false;
    }
}

    async function loadEntityDetails() {
        try {
            // Get ID from session property set by dashboard
            const entityId = await window.SessionState.getProperty('ViewEntityId');
            
            if (!entityId) {
                console.error('❌ No entity ID found in session');
                return;
            }

            const response = await fetch(AppConfig.getApiUrl(`entitydetails/${entityId}`), AppConfig.getDefaultFetchOptions());
            
            if (!response.ok) throw new Error('Failed to load entity details');
            
            const data = await response.json();
            window.entityDetailsData = data;

            updateEntityPageTitle(data);
            displayEntityDetails(data);
            
        } catch (error) {
            console.error('❌ Error loading entity details:', error);
            alert('שגיאה בטעינת פרטי הישות');
        }
    }


    // ✅ Update page title with entity name and type
function updateEntityPageTitle(data) {
    const titleElement = document.querySelector('.page-title');
    if (!titleElement) return;

    const entityName = data.name || 'לא ידוע';
    const entityType = data.entityTypeDescription || 'לא ידוע';
    
    titleElement.textContent = `פרטי - ${entityName} - ${entityType}`;
    console.log('✅ Page title updated:', titleElement.textContent);
}

// Add change listeners to input fields
function addEntityDetailsChangeListeners() {
    const fields = [
        'name',
        'ownerId',
        'entityTypeId',
        'phone',
        'email',
        'taxNumber'
    ];

    fields.forEach(fieldId => {
        const element = document.getElementById(fieldId);
        if (element) {
            // ✅ Remove existing listeners first to avoid duplicates
            element.removeEventListener('change', handleEntityDetailsChange);
            element.removeEventListener('input', handleEntityDetailsChange);

            // ✅ Add both change and input listeners
            element.addEventListener('change', handleEntityDetailsChange);
            element.addEventListener('input', handleEntityDetailsChange);

            console.log('✅ Change listener added to:', fieldId);
        }
    });
}

// Separate change handler function
function handleEntityDetailsChange(event) {
    window.hasUnsavedEntityDetailsChanges = true;
    updateEntityDetailsCardTitle();
    console.log('📝 Entity details field changed:', event.target.id);
}



// Update card title to show unsaved changes indicator
function updateEntityDetailsCardTitle() {
    const card = document.querySelector('.detail-card');
    const titleElement = card?.querySelector('.detail-card-title');

    if (!titleElement) return;

    // Remove existing indicator if present
    const existingIndicator = titleElement.querySelector('.unsaved-indicator');
    if (existingIndicator) {
        existingIndicator.remove();
    }

    // Add indicator if there are unsaved changes
    if (window.hasUnsavedEntityDetailsChanges) {
        const indicator = document.createElement('span');
        indicator.className = 'unsaved-indicator';
        indicator.style.cssText = `
            color: #dc3545;
            font-size: 0.9em;
            margin-right: 10px;
            font-weight: normal;
        `;
        indicator.textContent = '(שינויים לא נשמרו)';
        titleElement.appendChild(indicator);
    }
}

// Edit entity address modal 
async function editEntityAddress() {
    console.log('📍 Opening edit entity address modal');

    try {
        // Load councils if not already loaded
        if (!window.councils || window.councils.length === 0) {
            await loadCouncils();
        }

        const data = window.lastEntityDetailsData;
        if (!data) {
            alert('לא נמצאו נתוני הישות');
            return;
        }

        const street = data.street || '';
        const houseNumber = data.houseNumber || '';
        const city = data.city || '';
        const postCode = data.postCode || '';

        const overlay = document.createElement('div');
        overlay.className = 'dialog-overlay';

        const dialog = document.createElement('div');
        dialog.className = 'dialog-box';
        dialog.style.minWidth = '500px';

        dialog.innerHTML = `
            <h3 class="dialog-title">עריכת כתובת</h3>
            <div style="margin: 20px 0;">
                <div style="margin-bottom: 15px;">
                    <label for="addressStreet" style="display: block; margin-bottom: 5px; font-weight: 600;">רחוב:</label>
                    <input type="text" 
                           id="addressStreet" 
                           value="${street}"
                           placeholder="הזן שם רחוב"
                           style="
                               width: 100%;
                               padding: 8px;
                               border: 1px solid #dee2e6;
                               border-radius: 4px;
                               font-size: 14px;
                               direction: rtl;
                           ">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label for="addressHouseNumber" style="display: block; margin-bottom: 5px; font-weight: 600;">מספר בית:</label>
                    <input type="text" 
                           id="addressHouseNumber" 
                           value="${houseNumber}"
                           placeholder="הזן מספר בית"
                           style="
                               width: 100%;
                               padding: 8px;
                               border: 1px solid #dee2e6;
                               border-radius: 4px;
                               font-size: 14px;
                               direction: ltr;
                               text-align: left;
                           ">
                </div>
                
                <div style="margin-bottom: 15px; position: relative;">
                    <label for="addressCity" style="display: block; margin-bottom: 5px; font-weight: 600;">עיר:</label>
                    <input type="text" 
                           id="addressCity"
                           value="${city}"
                           placeholder="הקלד לחיפוש..."
                           autocomplete="off"
                           style="
                               width: 100%;
                               padding: 8px;
                               border: 1px solid #dee2e6;
                               border-radius: 4px;
                               font-size: 14px;
                               direction: rtl;
                           ">
                    <div id="citySuggestions" style="
                        position: absolute;
                        top: 100%;
                        left: 0;
                        right: 0;
                        background: white;
                        border: 1px solid #dee2e6;
                        border-top: none;
                        border-radius: 0 0 4px 4px;
                        max-height: 200px;
                        overflow-y: auto;
                        display: none;
                        z-index: 1000;
                        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                    "></div>
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label for="addressPostCode" style="display: block; margin-bottom: 5px; font-weight: 600;">מיקוד:</label>
                    <input type="text" 
                           id="addressPostCode" 
                           value="${postCode}"
                           placeholder="הזן מיקוד"
                           maxlength="10"
                           style="
                               width: 100%;
                               padding: 8px;
                               border: 1px solid #dee2e6;
                               border-radius: 4px;
                               font-size: 14px;
                               direction: ltr;
                               text-align: left;
                           ">
                </div>
            </div>
            <div class="dialog-buttons">
                <button id="addressOkBtn" class="dialog-btn save">אישור</button>
                <button id="addressCancelBtn" class="dialog-btn cancel">ביטול</button>
            </div>
        `;

        overlay.appendChild(dialog);
        document.body.appendChild(overlay);

        const cityInput = document.getElementById('addressCity');
        const citySuggestions = document.getElementById('citySuggestions');
        let selectedCouncilId = null;

        // Setup autocomplete
        function showSuggestions(filter) {
            if (!citySuggestions || !cityInput) return;

            const filtered = window.councils.filter(c =>
                c.councilShortName.includes(filter) ||
                (c.councilFullName && c.councilFullName.includes(filter))
            ).slice(0, 10);

            if (filtered.length === 0 || !filter) {
                citySuggestions.style.display = 'none';
                return;
            }

            citySuggestions.innerHTML = filtered.map(c => `
                <div class="city-suggestion-item" 
                     data-council-id="${c.id}"
                     data-council-name="${c.councilShortName}"
                     style="
                         padding: 8px 12px;
                         cursor: pointer;
                         border-bottom: 1px solid #f0f0f0;
                         direction: rtl;
                     "
                     onmouseover="this.style.background='#f8f9fa'"
                     onmouseout="this.style.background='white'">
                    ${c.councilShortName}
                </div>
            `).join('');

            citySuggestions.style.display = 'block';

            citySuggestions.querySelectorAll('.city-suggestion-item').forEach(item => {
                item.onclick = function () {
                    selectedCouncilId = parseInt(this.dataset.councilId);
                    cityInput.value = this.dataset.councilName;
                    citySuggestions.style.display = 'none';
                };
            });
        }

        cityInput.oninput = function () {
            showSuggestions(this.value.trim());
        };

        // OK button handler
        document.getElementById('addressOkBtn').onclick = () => {
            const newStreet = document.getElementById('addressStreet').value.trim();
            const newHouseNumber = document.getElementById('addressHouseNumber').value.trim();
            const newCity = document.getElementById('addressCity').value.trim();
            const newPostCode = document.getElementById('addressPostCode').value.trim();

            if (!newStreet) {
                alert('נא להזין שם רחוב');
                return;
            }

            if (!newCity) {
                alert('נא להזין עיר');
                return;
            }

            // Build formatted address
            let formattedAddress = newStreet;
            if (newHouseNumber) formattedAddress += ' ' + newHouseNumber;
            formattedAddress += ', ' + newCity;
            if (newPostCode && newPostCode !== '0000000' && newPostCode !== '0') {
                formattedAddress += ', ' + newPostCode;
            }

            // Update cached data
            if (window.lastEntityDetailsData) {
                window.lastEntityDetailsData.address = formattedAddress;
                window.lastEntityDetailsData.street = newStreet;
                window.lastEntityDetailsData.houseNumber = newHouseNumber;
                window.lastEntityDetailsData.city = newCity;
                window.lastEntityDetailsData.postCode = newPostCode;

                window.hasUnsavedEntityDetailsChanges = true;
                updateEntityDetailsCardTitle();
                displayEntityDetails(window.lastEntityDetailsData);
            }

            document.body.removeChild(overlay);
        };

        document.getElementById('addressCancelBtn').onclick = () => {
            document.body.removeChild(overlay);
        };

    } catch (error) {
        console.error('💥 Error opening address edit modal:', error);
        alert('שגיאה בפתיחת חלון עריכת כתובת');
    }
}





// Edit entity contact person (using person management modal)
function editEntityContactPerson() {
    console.log('👤 Edit entity contact person clicked');
    
    if (typeof PersonManagement === 'undefined') {
        alert('מודול ניהול אנשי קשר לא נטען');
        return;
    }

    // ✅ Parse name from contactPersonName
    let currentPerson = null;
    if (window.lastEntityDetailsData?.contactPersonId) {
        const fullName = window.lastEntityDetailsData.contactPersonName || '';
        const nameParts = fullName.split(' ');
        const firstName = nameParts[0] || '';
        const lastName = nameParts.slice(1).join(' ') || '';

        currentPerson = {
            id: window.lastEntityDetailsData.contactPersonId,
            firstName: firstName,
            lastName: lastName,
            position: 'איש קשר'
        };
    }

    // ✅ Show modal with callback
    PersonManagement.showPersonEditModal('contactPerson', currentPerson, (selectedPerson) => {
        console.log('✅ Person management callback:', selectedPerson);
        
        // ✅ If null, user cancelled - do nothing
        if (!selectedPerson) {
            console.log('❌ Person selection cancelled');
            return;
        }
        
        // ✅ Update cached data with person ID and combined name
        if (window.lastEntityDetailsData) {
            window.lastEntityDetailsData.contactPersonId = selectedPerson.id;
            window.lastEntityDetailsData.contactPersonName = `${selectedPerson.firstName || ''} ${selectedPerson.lastName || ''}`.trim();
            
            console.log('📝 Updated entity data:', {
                contactPersonId: window.lastEntityDetailsData.contactPersonId,
                contactPersonName: window.lastEntityDetailsData.contactPersonName
            });
            
            // Mark as changed
            window.hasUnsavedEntityDetailsChanges = true;
            updateEntityDetailsCardTitle();
            
            // Re-render to show updated contact person
            displayEntityDetails(window.lastEntityDetailsData);
            
            console.log('✅ Contact person updated in entity details - UI refreshed');
        }
    });
}


// Load councils from database
async function loadCouncils() {
    try {
        console.log('📋 Loading councils...');

        const response = await fetch(AppConfig.getApiUrl('systemAttributes/councils'), {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
            }
        });

        if (response.ok) {
            const result = await response.json();
            if (result.success && result.data) {
                window.councils = result.data;
                console.log('✅ Councils loaded:', window.councils.length);
            }
        } else {
            console.error('❌ Failed to load councils:', response.status);
        }
    } catch (error) {
        console.error('💥 Error loading councils:', error);
    }
}

// Setup edit button without reloading data
function setupEditEntityDetailsButton() {
    const editBtn = document.getElementById('editEntityDetailsBtn');

    if (editBtn) {
        editBtn.onclick = async function (event) {
            event.stopPropagation();

            if (!window.entityDetailsEditMode) {
                // Entering edit mode
                window.entityDetailsEditMode = true;
                window.hasUnsavedEntityDetailsChanges = false;

                // ✅ Store current user entity type for owner field lock check
                const session = await window.SessionState.getSession();
                window.currentUserEntityTypeId = parseInt(session.entityTypeId, 10);

                // ✅ Store a DEEP COPY of original data
                window.originalEntityDetailsData = JSON.parse(JSON.stringify(window.lastEntityDetailsData));
                console.log('💾 Original data stored:', window.originalEntityDetailsData);

                // Load dropdown data ONCE
                await loadCouncils();

                // Re-render with edit mode
                displayEntityDetails(window.lastEntityDetailsData);

                // Add change listeners
                addEntityDetailsChangeListeners();

                const btnImg = editBtn.querySelector('img');
                if (btnImg) {
                    btnImg.alt = 'סגור עריכה';
                }

                console.log('✏️ Entity details edit mode: ON');
            } else {
                // Exiting edit mode
                if (window.hasUnsavedEntityDetailsChanges) {
                    const confirmed = await confirmSaveEntityDetails();

                    if (!confirmed) {
                        console.log('❌ Save cancelled by user');
                        return;
                    }

                    const saveSuccess = await saveEntityDetails();

                    if (saveSuccess) {
                        window.entityDetailsEditMode = false;
                        window.hasUnsavedEntityDetailsChanges = false;
                        window.originalEntityDetailsData = null;

                        // ✅ Reload fresh data from server
                        await loadEntityDetails();

                        const btnImg = editBtn.querySelector('img');
                        if (btnImg) {
                            btnImg.alt = 'עריכה';
                        }

                        console.log('✏️ Entity details edit mode: OFF (saved)');
                    }
                } else {
                    // No changes - just exit edit mode
                    window.entityDetailsEditMode = false;
                    window.originalEntityDetailsData = null;

                    // Re-render in read-only mode with current data
                    displayEntityDetails(window.lastEntityDetailsData);
                    const btnImg = editBtn.querySelector('img');
                    if (btnImg) {
                        btnImg.alt = 'עריכה';
                    }

                    console.log('✏️ Entity details edit mode: OFF (no changes)');
                }
            }
        };
        console.log('✅ Edit entity details button initialized');
    } else {
        console.warn('⚠️ Edit entity details button not found');
    }
}

// ✅ Add confirmation dialog before saving
async function confirmSaveEntityDetails() {
    return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'dialog-overlay';

        const dialog = document.createElement('div');
        dialog.className = 'dialog-box';

        dialog.innerHTML = `
            <h3 class="dialog-title">אישור שמירת שינויים</h3>
            <p class="dialog-message">האם אתה בטוח שברצונך לשמור את השינויים בפרטי הישות?</p>
            <div class="dialog-buttons">
                <button id="confirmSaveBtn" class="dialog-btn save">כן, שמור</button>
                <button id="cancelSaveBtn" class="dialog-btn cancel">ביטול</button>
            </div>
        `;

        overlay.appendChild(dialog);
        document.body.appendChild(overlay);

        document.getElementById('confirmSaveBtn').onclick = () => {
            document.body.removeChild(overlay);
            resolve(true);
        };

        document.getElementById('cancelSaveBtn').onclick = () => {
            document.body.removeChild(overlay);
            resolve(false);
        };
    });
}


// Save entity details to server


async function saveEntityDetails() {
    console.log('💾 Saving entity details...');

    try {
        const entityId = window.entityDetailsData.id;

        // ✅ Get values from form fields
        const name = document.getElementById('name')?.value.trim();
        const entityTypeId = document.getElementById('entityTypeId')?.value;
        const ownerId = document.getElementById('ownerId')?.value;
        const phone = document.getElementById('phone')?.value.trim();
        const email = document.getElementById('email')?.value.trim();
        const taxNumber = document.getElementById('taxNumber')?.value.trim();

        // ✅ Get address and person data from cached data
        const currentData = window.lastEntityDetailsData;
        const street = currentData.street || '';
        const houseNumber = currentData.houseNumber || '';
        const city = currentData.city || '';
        const postCode = currentData.postCode || '';
        const contactPersonId = currentData.contactPersonId || null;  // ✅ Only ID needed

        // Validate required fields
        if (!name) {
            alert('נא להזין שם ישות');
            document.getElementById('name')?.focus();
            return false;
        }

        if (!entityTypeId) {
            alert('נא לבחור סוג ישות');
            document.getElementById('entityTypeId')?.focus();
            return false;
        }

        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            alert('כתובת דוא"ל לא תקינה');
            document.getElementById('email')?.focus();
            return false;
        }

        // ✅ Build complete payload (simplified - no person details)
        const payload = {
            name: name,
            entityTypeId: parseInt(entityTypeId),
            ownerId: ownerId ? parseInt(ownerId) : null,
            phone: phone || '',
            email: email || '',
            taxNumber: taxNumber || '',
            contactPersonId: contactPersonId,  // ✅ Only person ID
            isActive: true,
            // ✅ Send address components - backend will format
            street: street || '',
            houseNumber: houseNumber || '',
            city: city || '',
            postCode: postCode || ''
        };

        console.log('📝 Sending entity details update:', payload);

        const response = await fetch(AppConfig.getApiUrl(`entitydetails/${entityId}`), {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
            },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            const errorText = await response.text();
            console.error('❌ Server response:', errorText);
            throw new Error('Failed to update entity');
        }

        const result = await response.json();

        if (result.success) {
            console.log('✅ Entity details saved successfully');

            // Reset flags
            window.hasUnsavedEntityDetailsChanges = false;
            updateEntityDetailsCardTitle();

            alert('פרטי הישות עודכנו בהצלחה');
            return true;
        } else {
            console.error('❌ Failed to save entity details:', result);
            alert(result.message || 'שגיאה בשמירת פרטי הישות');
            return false;
        }

    } catch (error) {
        console.error('💥 Error saving entity details:', error);
        alert('שגיאה בשמירת פרטי הישות');
        return false;
    }
}
