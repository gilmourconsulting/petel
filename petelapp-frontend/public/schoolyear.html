<div class="schoolyear-container">
    <!-- Main content area -->
    <div class="schoolyear-content">
        <div class="content-card">
            <h2 id="schoolYearTitle" style="margin-bottom: 20px; color: #333;">שנת לימודים</h2>
            <div id="schoolYearInfo" style="font-size: 18px; color: #667eea; text-align: center;">
                <!-- The year info will be loaded here -->
            </div>
            
            <div id="budgetDetails" style="margin-top: 32px;">
                <h3 style="color: #333;">פרטי תקציב שעות</h3>
                <table style="width:100%; border-collapse:collapse;">
                    <tr>
                        <td style="font-weight:600;">גרסת תקציב שעות:</td>
                        <td>
                            <div id="budgetVersion"></div>
                            <div id="budgetVersion2" style="color:#888; font-size:14px;"></div>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-weight:600;">סטטוס תקציב שעות:</td>
                        <td>
                            <div id="budgetStatus"></div>
                            <div id="budgetStatus2" style="color:#888; font-size:14px;"></div>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-weight:600;">שם תקציב שעות:</td>
                        <td>
                            <div id="budgetName"></div>
                            <div id="budgetName2" style="color:#888; font-size:14px;"></div>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-weight:600;">תיאור תקציב שעות:</td>
                        <td>
                            <div id="budgetDescription"></div>
                            <div id="budgetDescription2" style="color:#888; font-size:14px;"></div>
                        </td>
                    </tr>
                </table>
            </div>
            
            <!-- Content area for the selected section -->
            <div id="schoolYearSectionContent" style="margin-top: 20px;">
                <!-- Dynamic content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Context buttons positioned to the right (in RTL layout) -->
    <div class="context-buttons-section schoolyear-context">
        <button class="context-btn" onclick="showSchoolYearSection('students')" style="background: #C15A16; color: #fff; border: none; margin: 0 10px;">תלמידים</button>
        <button class="context-btn" onclick="showSchoolYearSection('personnel')" style="background: #008031; color: #fff; border: none; margin: 0 10px;">עובדי הוראה</button>
        <button class="context-btn" onclick="showSchoolYearSection('budget')" style="background: #1D9CF3; color: #fff; border: none; margin: 0 10px;">תקציב שעות</button>
    </div>
</div>

<script>
function showSchoolYearSection(section) {
    const contentDiv = document.getElementById('schoolYearSectionContent');
    const dynamicContent = document.getElementById('dynamicContent');
    
    switch(section) {
        case 'students':
            // Load the students screen
            if (dynamicContent) {
                // If we're in the main layout, use dynamic content
                document.getElementById('dashboardContent').style.display = 'none';
                dynamicContent.style.display = 'block';
                
                fetch('students.html')
                    .then(response => response.text())
                    .then(html => {
                        dynamicContent.innerHTML = html;
                        // Execute scripts in the loaded HTML
                        const scripts = dynamicContent.querySelectorAll('script');
                        scripts.forEach(script => {
                            const newScript = document.createElement('script');
                            newScript.textContent = script.textContent;
                            document.head.appendChild(newScript);
                        });
                    })
                    .catch(error => {
                        console.error('Error loading students page:', error);
                        dynamicContent.innerHTML = '<div class="content-card"><p>שגיאה בטעינת עמוד התלמידים</p></div>';
                    });
            } else {
                // If we're in the school year page, show inline
                contentDiv.innerHTML = `
                    <div class="content-card">
                        <h3 style="color: #C15A16;">תלמידים</h3>
                        <p>מידע על תלמידים - <a href="#" onclick="navigateTo('students')">עבור לעמוד התלמידים המלא</a></p>
                    </div>
                `;
            }
            break;
        case 'personnel':
            contentDiv.innerHTML = `
                <div class="content-card">
                    <h3 style="color: #008031;">עובדי הוראה</h3>
                    <p>מידע על עובדי הוראה יוצג כאן</p>
                </div>
            `;
            break;
        case 'budget':
            contentDiv.innerHTML = `
                <div class="content-card">
                    <h3 style="color: #1D9CF3;">תקציב שעות הוראה</h3>
                    <p>מידע על תקציב שעות הוראה יוצג כאן</p>
                </div>
            `;
            break;
    }
}

// Function to update the title with school year info
function updateSchoolYearTitle(yearInfo) {
    const titleElement = document.getElementById('schoolYearTitle');
    if (titleElement && yearInfo) {
        titleElement.textContent = `שנת לימודים - ${yearInfo}`;
    }
}

// Make the function globally available
window.updateSchoolYearTitle = updateSchoolYearTitle;
</script>
