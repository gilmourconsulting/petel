<!-- petelapp-frontend/public/schoolyearconfig.html -->
<!-- School Year Config Title Section -->
<div class="school-title-section">
    <h1 class="page-title">הגדרות שנת לימודים</h1>
</div>

<div class="students-container">
    <!-- Context buttons -->
    <div class="context-buttons-section screenwithtable-context">
        <button class="context-btn" onclick="window.navigateTo('maindashboard')">חזרה ללוח בקרה</button>
    </div>

    <!-- Main content -->
    <div class="students-content">
        <div class="content-card">
            <!-- Year Selection Card -->
            <div class="detail-card">
                <div class="detail-card-header">
                    <h2 class="detail-card-title">בחירת שנה</h2>
                </div>
                <div class="detail-card-content">
                    <div style="padding: 15px;">
                        <label for="yearSelect" style="display: block; margin-bottom: 8px; font-weight: 600;"> שנת לימודים:</label>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <select id="yearSelect" onchange="handleYearChange()" style="
                                        padding: 8px 12px;
                                        border: 1px solid #dee2e6;
                                        border-radius: 4px;
                                        font-size: 14px;
                                        width: 300px;
                                        direction: rtl;
                                        cursor: pointer;
                                    ">
                                <option value="">טוען...</option>
                            </select>
                            <button id="exportYearBtn" class="btn-icon" onclick="exportYearConfiguration()" 
                                    title="ייצא הגדרות שנה" style="display: none;">
                                <img src="download_icon.png" alt="ייצוא" class="action-icon-natural">
                            </button>
                            <button id="importYearBtn" class="btn-icon" onclick="showImportYearModal()" 
                                    title="ייבא הגדרות שנה" style="display: none;">
                                <img src="upload_icon.png" alt="ייבוא" class="action-icon-natural">
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabs Container -->
            <div id="tabsContainer" style="display: none; margin-top: 20px;">
                <!-- Tab Headers -->
                <div class="tabs-header" style="
                    display: flex;
                    gap: 10px;
                    padding: 0 15px;
                    border-bottom: 2px solid #dee2e6;
                    margin-bottom: 20px;
                ">
                    <button class="tab-button active" onclick="switchTab('documents')" data-tab="documents" style="
                        padding: 12px 24px;
                        border: none;
                        background: none;
                        cursor: pointer;
                        font-weight: 600;
                        border-bottom: 3px solid transparent;
                        transition: all 0.3s;
                    ">מסמכים</button>
                    <button class="tab-button" onclick="switchTab('pricing')" data-tab="pricing" style="
                        padding: 12px 24px;
                        border: none;
                        background: none;
                        cursor: pointer;
                        font-weight: 600;
                        border-bottom: 3px solid transparent;
                        transition: all 0.3s;
                    ">רכיבי תמחור</button>
                    <button class="tab-button" onclick="switchTab('tracks')" data-tab="tracks" style="
                        padding: 12px 24px;
                        border: none;
                        background: none;
                        cursor: pointer;
                        font-weight: 600;
                        border-bottom: 3px solid transparent;
                        transition: all 0.3s;
                    ">מגמות</button>
                    <button class="tab-button" onclick="switchTab('studyprograms')" data-tab="studyprograms" style="
                        padding: 12px 24px;
                        border: none;
                        background: none;
                        cursor: pointer;
                        font-weight: 600;
                        border-bottom: 3px solid transparent;
                        transition: all 0.3s;
                    ">תוכניות לימוד נוספות</button>
                </div>

                <!-- Tab Content - Documents -->
                <div id="documentsTab" class="tab-content" style="display: block;">
                    <!-- Document Types Card -->
                    <div class="detail-card collapsed" id="documentTypesCard">
                        <div class="detail-card-header">
                            <h2 class="detail-card-title">סוגי מסמכים</h2>
                            <div class="card-header-actions">
                                <button class="collapse-toggle" aria-label="הרחב/כווץ">+</button>
                            </div>
                        </div>
                        <div class="detail-card-content">
                            <div id="documentTypesTableContainer" class="table-container">
                                <div class="loading-spinner">טוען...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab Content - Pricing -->
                <div id="pricingTab" class="tab-content" style="display: none;">
                    <!-- Pricing Elements Card -->
                    <div class="detail-card collapsed" id="pricingElementsCard">
                        <div class="detail-card-header">
                            <h2 class="detail-card-title">רכיבי תמחור</h2>
                            <div class="card-header-actions">
                                <button id="addPricingElementBtn" class="btn-icon" onclick="showAddPricingElementModal();" title="הוסף רכיב תמחור" style="display: none;">
                                    <img src="Plus icon.png" alt="הוסף" class="action-icon-natural">
                                </button>
                                <button class="collapse-toggle" aria-label="הרחב/כווץ">+</button>
                            </div>
                        </div>
                        <div class="detail-card-content">
                            <div id="pricingElementsTableContainer" class="table-container">
                                <div class="loading-spinner">טוען...</div>
                            </div>
                        </div>
                    </div>

                    <!-- Pricing Categories Card -->
                    <div class="detail-card collapsed" id="pricingCategoriesCard" style="display: none;">
                        <div class="detail-card-header">
                            <h2 class="detail-card-title">קטגוריות תמחור - <span id="selectedElementName"></span></h2>
                            <div class="card-header-actions">
                                <button id="addPricingCategoryBtn" class="btn-icon" onclick="showAddPricingCategoryModal();" title="הוסף קטגוריה" style="display: none;">
                                    <img src="Plus icon.png" alt="הוסף" class="action-icon-natural">
                                </button>
                                <button class="collapse-toggle" aria-label="הרחב/כווץ">+</button>
                            </div>
                        </div>
                        <div class="detail-card-content">
                            <div id="pricingCategoriesTableContainer" class="table-container">
                                <div class="loading-spinner">טוען...</div>
                            </div>
                        </div>
                    </div>

                    <!-- Pricing Steps Card -->
                    <div class="detail-card collapsed" id="pricingStepsCard" style="display: none;">
                        <div class="detail-card-header">
                            <h2 class="detail-card-title">שלבי תמחור - קטגוריה <span id="selectedCategoryNumber"></span></h2>
                            <div class="card-header-actions">
                                <button id="addPricingStepBtn" class="btn-icon" onclick="showAddPricingStepModal();" title="הוסף שלב תמחור" style="display: none;">
                                    <img src="Plus icon.png" alt="הוסף" class="action-icon-natural">
                                </button>
                                <button class="collapse-toggle" aria-label="הרחב/כווץ">+</button>
                            </div>
                        </div>
                        <div class="detail-card-content">
                            <div id="pricingStepsTableContainer" class="table-container">
                                <div class="loading-spinner">טוען...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab Content - Tracks -->
                <div id="tracksTab" class="tab-content" style="display: none;">
                    <!-- Tracks Card -->
                    <div class="detail-card collapsed" id="tracksCard">
                        <div class="detail-card-header">
                            <h2 class="detail-card-title">מגמות</h2>
                            <div class="card-header-actions">
                                <button id="addTrackBtn" class="btn-icon" onclick="showAddTrackModal();" title="הוסף מגמה" style="display: none;">
                                    <img src="Plus icon.png" alt="הוסף" class="action-icon-natural">
                                </button>
                                <button class="collapse-toggle" aria-label="הרחב/כווץ">+</button>
                            </div>
                        </div>
                        <div class="detail-card-content">
                            <div id="tracksTableContainer" class="table-container">
                                <div class="loading-spinner">טוען...</div>
                            </div>
                        </div>
                    </div>

                    <!-- Track Levels Card -->
                    <div class="detail-card collapsed" id="trackLevelsCard" style="display: none;">
                        <div class="detail-card-header">
                            <h2 class="detail-card-title">רמות מגמה - <span id="selectedTrackName"></span></h2>
                            <div class="card-header-actions">
                                <button id="addTrackLevelBtn" class="btn-icon" onclick="showAddTrackLevelModal();" title="הוסף רמה" style="display: none;">
                                    <img src="Plus icon.png" alt="הוסף" class="action-icon-natural">
                                </button>
                                <button class="collapse-toggle" aria-label="הרחב/כווץ">+</button>
                            </div>
                        </div>
                        <div class="detail-card-content">
                            <div id="trackLevelsTableContainer" class="table-container">
                                <div class="loading-spinner">טוען...</div>
                            </div>
                        </div>
                    </div>

                    <!-- Track Pricing Card -->
                    <div class="detail-card collapsed" id="trackPricingCard" style="display: none;">
                        <div class="detail-card-header">
                            <h2 class="detail-card-title">תמחור רמה - <span id="selectedLevelName"></span></h2>
                            <div class="card-header-actions">
                                <button id="addTrackPricingBtn" class="btn-icon" onclick="showAddTrackPricingModal();" title="הוסף תמחור" style="display: none;">
                                    <img src="Plus icon.png" alt="הוסף" class="action-icon-natural">
                                </button>
                                <button class="collapse-toggle" aria-label="הרחב/כווץ">+</button>
                            </div>
                        </div>
                        <div class="detail-card-content">
                            <div id="trackPricingTableContainer" class="table-container">
                                <div class="loading-spinner">טוען...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab Content - Study Programs -->
                <div id="studyprogramsTab" class="tab-content" style="display: none;">
                    <!-- Study Programs Card -->
                    <div class="detail-card collapsed" id="studyProgramsCard">
                        <div class="detail-card-header">
                            <h2 class="detail-card-title">תוכניות לימוד נוספות</h2>
                            <div class="card-header-actions">
                                <button id="addStudyProgramBtn" class="btn-icon" onclick="showAddStudyProgramModal();" title="הוסף תוכנית לימודים" style="display: none;">
                                    <img src="Plus icon.png" alt="הוסף" class="action-icon-natural">
                                </button>
                                <button class="collapse-toggle" aria-label="הרחב/כווץ">+</button>
                            </div>
                        </div>
                        <div class="detail-card-content">
                            <div id="studyProgramsTableContainer" class="table-container">
                                <div class="loading-spinner">טוען...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .tab-button {
        color: #666;
    }
    .tab-button.active {
        color: #007bff;
        border-bottom-color: #007bff !important;
    }
    .tab-button:hover {
        color: #0056b3;
        background-color: #f8f9fa;
    }
    .tab-content {
        animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>

<script>
    // Global state
    window.schoolYearConfigState = {
        selectedYearId: null,
        activeTab: 'documents',
        
        // Pricing state
        selectedElementId: null,
        selectedElementName: '',
        selectedCategoryId: null,
        selectedCategoryNumber: null,
        
        // Tracks state
        selectedTrackId: null,
        selectedTrackName: '',
        selectedLevelId: null,
        selectedLevelName: '',
        
        // Data arrays
        hebrewYears: [],
        documentTypes: [],
        pricingElements: [],
        pricingCategories: [],
        pricingSteps: [],
        studyPrograms: [],
        tracks: [],
        trackLevels: [],
        trackPricing: []
    };

    // Tab switching function
    async function switchTab(tabName) {
        console.log(`🔄 Switching to tab: ${tabName}`);
        
        // Update active tab button
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.classList.remove('active');
        });
        document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
        
        // Hide all tab contents
        document.querySelectorAll('.tab-content').forEach(content => {
            content.style.display = 'none';
        });
        
        // Show selected tab content
        const tabContent = document.getElementById(`${tabName}Tab`);
        if (tabContent) {
            tabContent.style.display = 'block';
        }
        
        // Update state
        window.schoolYearConfigState.activeTab = tabName;
        
        // Initialize collapsible cards for newly shown tab
        initializeCollapsibleCards();
        
        // Load data for the selected tab
        await loadTabData(tabName);
    }

    // Initialize collapsible cards
    function initializeCollapsibleCards() {
        console.log('🎴 Initializing collapsible cards for school year config...');

        document.querySelectorAll('.detail-card').forEach(card => {
            const header = card.querySelector('.detail-card-header');
            const toggle = card.querySelector('.collapse-toggle');

            if (!header || !toggle) return;

            // Check if already initialized
            if (header.dataset.initialized === 'true') {
                console.log('⚠️ Card already initialized, skipping');
                return;
            }

            // Mark as initialized
            header.dataset.initialized = 'true';

            // Get action buttons
            const addButton = card.querySelector('.btn-icon[id^="add"]');

            // Hide add buttons initially (cards start collapsed)
            if (addButton) addButton.style.display = 'none';

            // Toggle button click handler
            toggle.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleCardExpansion(card, toggle, addButton);
            });

            // Header click handler (excluding buttons)
            header.addEventListener('click', function (e) {
                if (e.target.closest('.btn-icon')) {
                    return;
                }
                toggleCardExpansion(card, toggle, addButton);
            });
        });

        console.log('✅ Collapsible cards initialized');
    }

    // Toggle card expansion
    function toggleCardExpansion(card, toggle, addButton) {
        const isCollapsed = card.classList.contains('collapsed');

        if (isCollapsed) {
            // Expand
            card.classList.remove('collapsed');
            card.classList.add('expanded');
            toggle.textContent = '×';

            // Show add button when expanded
            if (addButton) {
                addButton.style.display = 'inline-flex';
            }
        } else {
            // Collapse
            card.classList.remove('expanded');
            card.classList.add('collapsed');
            toggle.textContent = '+';

            // Hide add button when collapsed
            if (addButton) {
                addButton.style.display = 'none';
            }
        }
    }

    // Initialize page
    async function initializeSchoolYearConfig() {
        console.log('🏗️ Initializing School Year Config page...');

        try {
            // Initialize collapsible cards first
            initializeCollapsibleCards();

            // Load data
            await loadHebrewYears();
        } catch (error) {
            console.error('❌ Error initializing school year config:', error);
            alert('שגיאה באתחול הגדרות שנת לימודים');
        }
    }

    // Load Hebrew years dropdown
    async function loadHebrewYears() {
        try {
            console.log('📋 Loading Hebrew years...');

            const response = await fetch(
                AppConfig.getApiUrl('schoolyearconfig/hebrew-years'),
                AppConfig.getDefaultFetchOptions()
            );

            if (!response.ok) {
                throw new Error(`Failed to load Hebrew years: ${response.status}`);
            }

            const years = await response.json();
            window.schoolYearConfigState.hebrewYears = years;

            // Get current year from system attributes cache
            const currentYearId = await window.SessionState.getProperty('CurrentYearId');

            const select = document.getElementById('yearSelect');
            select.innerHTML = '<option value="">בחר שנה...</option>';

            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year.id;
                option.textContent = year.hebrewYear;

                // Set as selected if it matches the current year from system attributes
                if (currentYearId && year.id == currentYearId) {
                    option.selected = true;
                }

                select.appendChild(option);
            });

            console.log(`✅ Loaded ${years.length} Hebrew years`);

            // If a year is selected (current year), automatically load its data
            if (currentYearId) {
                console.log(`📌 Auto-selecting current year ID: ${currentYearId}`);
                window.schoolYearConfigState.selectedYearId = parseInt(currentYearId);
                
                // Show tabs container
                document.getElementById('tabsContainer').style.display = 'block';

                // Initialize collapsible cards for newly shown cards
                initializeCollapsibleCards();

                // Load data for the active tab
                await loadTabData('documents');
            }
        } catch (error) {
            console.error('❌ Error loading Hebrew years:', error);
            alert('שגיאה בטעינת שנים עבריות');
        }
    }

    // Handle year selection change
    async function handleYearChange() {
        const yearSelect = document.getElementById('yearSelect');
        const selectedYearId = parseInt(yearSelect.value);

        if (!selectedYearId) {
            // Hide tabs if no year selected
            document.getElementById('tabsContainer').style.display = 'none';
            document.getElementById('exportYearBtn').style.display = 'none';
            document.getElementById('importYearBtn').style.display = 'none';
            window.schoolYearConfigState.selectedYearId = null;
            return;
        }

        window.schoolYearConfigState.selectedYearId = selectedYearId;
        window.schoolYearConfigState.selectedElementId = null;
        window.schoolYearConfigState.selectedTrackId = null;
        window.schoolYearConfigState.selectedLevelId = null;

        // Hide and clear tracks-related cards
        const trackLevelsCard = document.getElementById('trackLevelsCard');
        if (trackLevelsCard) {
            trackLevelsCard.style.display = 'none';
        }
        
        const trackPricingCard = document.getElementById('trackPricingCard');
        if (trackPricingCard) {
            trackPricingCard.style.display = 'none';
        }

        // Clear track levels table
        const trackLevelsContainer = document.getElementById('trackLevelsTableContainer');
        if (trackLevelsContainer) {
            trackLevelsContainer.innerHTML = '<div class="loading-spinner">טוען...</div>';
        }

        // Clear track pricing table
        const trackPricingContainer = document.getElementById('trackPricingTableContainer');
        if (trackPricingContainer) {
            trackPricingContainer.innerHTML = '<div class="loading-spinner">טוען...</div>';
        }

        // Show tabs container
        document.getElementById('tabsContainer').style.display = 'block';

        // Show export/import buttons
        document.getElementById('exportYearBtn').style.display = 'inline-flex';
        document.getElementById('importYearBtn').style.display = 'inline-flex';

        // Initialize collapsible cards
        initializeCollapsibleCards();

        // Load data for the active tab
        await loadTabData(window.schoolYearConfigState.activeTab);
    }

    // Load data for specific tab
    async function loadTabData(tabName) {
        console.log(`📋 Loading data for tab: ${tabName}`);
        
        const yearId = window.schoolYearConfigState.selectedYearId;
        if (!yearId) return;

        switch(tabName) {
            case 'documents':
                await loadDocumentTypes(yearId);
                break;
            case 'pricing':
                await loadPricingElements(yearId);
                break;
            case 'tracks':
                await loadTracks(yearId);
                break;
            case 'studyprograms':
                await loadStudyPrograms(yearId);
                break;
        }
    }

    // Load pricing elements for selected year
    async function loadPricingElements(yearId) {
        try {
            console.log(`📋 Loading pricing elements for year ${yearId}...`);

            const container = document.getElementById('pricingElementsTableContainer');
            container.innerHTML = '<div class="loading-spinner">טוען...</div>';

            const response = await fetch(
                AppConfig.getApiUrl(`schoolyearconfig/pricing-elements/${yearId}`),
                AppConfig.getDefaultFetchOptions()
            );

            if (!response.ok) {
                throw new Error(`Failed to load pricing elements: ${response.status}`);
            }

            const elements = await response.json();
            window.schoolYearConfigState.pricingElements = elements;

            renderPricingElementsTable(elements);

            console.log(`✅ Loaded ${elements.length} pricing elements`);
        } catch (error) {
            console.error('❌ Error loading pricing elements:', error);
            document.getElementById('pricingElementsTableContainer').innerHTML =
                '<div style="padding: 20px; text-align: center; color: #dc3545;">שגיאה בטעינת רכיבי תמחור</div>';
        }
    }

    // Load document types for selected year
    async function loadDocumentTypes(yearId) {
        try {
            console.log(`📋 Loading document types for year ${yearId}...`);

            const container = document.getElementById('documentTypesTableContainer');
            container.innerHTML = '<div class="loading-spinner">טוען...</div>';

            const response = await fetch(
                AppConfig.getApiUrl(`documents/document-types/${yearId}`),
                AppConfig.getDefaultFetchOptions()
            );

            if (!response.ok) {
                throw new Error(`Failed to load document types: ${response.status}`);
            }

            const documentTypes = await response.json();
            window.schoolYearConfigState.documentTypes = documentTypes;

            renderDocumentTypesTable(documentTypes);

            console.log(`✅ Loaded ${documentTypes.length} document types`);
        } catch (error) {
            console.error('❌ Error loading document types:', error);
            document.getElementById('documentTypesTableContainer').innerHTML =
                '<div style="padding: 20px; text-align: center; color: #dc3545;">שגיאה בטעינת סוגי מסמכים</div>';
        }
    }

    // Render pricing elements table
    function renderPricingElementsTable(elements) {
        const container = document.getElementById('pricingElementsTableContainer');

        if (elements.length === 0) {
            container.innerHTML = '<div style="padding: 20px; text-align: center;">אין רכיבי תמחור לשנה זו</div>';
            return;
        }

        let tableHtml = `
        <table class="data-table">
            <thead>
                <tr>
                    <th>סדר</th>
                    <th>שם</th>
                    <th>כותרת</th>
                    <th>תיאור</th>
                    <th>רמת חישוב</th>
                    <th>תכונה לבדיקה</th>
                    <th>תאריך יצירה</th>
                    <th>פעולות</th>
                </tr>
            </thead>
            <tbody>
    `;

        elements.forEach(element => {
            const createdAt = new Date(element.createdAt).toLocaleDateString('he-IL');
            const description = element.description || '';
            const name = element.name || '';
            const title = element.title || '';
            const sortOrder = element.sortOrder !== undefined ? element.sortOrder : 0;
            const calculationLevel = element.calculationLevel || '';
            const attributeToCheck = element.attributeToCheck || '';
            
            tableHtml += `
            <tr>
                <td>${sortOrder}</td>
                <td>${name}</td>
                <td>${title}</td>
                <td>${description}</td>
                <td>${calculationLevel}</td>
                <td>${attributeToCheck}</td>
                <td>${createdAt}</td>
                <td>
                    <button class="btn-icon" onclick="selectPricingElement(${element.id}, '${name.replace(/'/g, "\\'")}')"; title="הצג קטגוריות">
                        <img src="view_icon.png" alt="צפייה" class="action-icon-natural">
                    </button>
                </td>
            </tr>
        `;
        });

        tableHtml += `
            </tbody>
        </table>
    `;

        container.innerHTML = tableHtml;
    }

    // Render document types table
    function renderDocumentTypesTable(documentTypes) {
        const container = document.getElementById('documentTypesTableContainer');

        if (documentTypes.length === 0) {
            container.innerHTML = '<div style="padding: 20px; text-align: center;">אין סוגי מסמכים לשנה זו</div>';
            return;
        }

        let tableHtml = `
        <table class="data-table">
            <thead>
                <tr>
                    <th>מזהה</th>
                    <th>שם</th>
                    <th>רמה</th>
                </tr>
            </thead>
            <tbody>
    `;

        documentTypes.forEach(dt => {
            tableHtml += `
            <tr>
                <td>${dt.id}</td>
                <td>${dt.name}</td>
                <td>${dt.level}</td>
            </tr>
        `;
        });

        tableHtml += `
            </tbody>
        </table>
    `;

        container.innerHTML = tableHtml;
    }

    // Select pricing element to show categories
    async function selectPricingElement(elementId, elementName) {
        console.log(`📋 Selected pricing element: ${elementId} - ${elementName}`);

        window.schoolYearConfigState.selectedElementId = elementId;
        window.schoolYearConfigState.selectedElementName = elementName;

    // Add pricing element
    async function addPricingElement(overlay) {
        const name = document.getElementById('elementName').value.trim();
        const title = document.getElementById('elementTitle').value.trim();
        const description = document.getElementById('elementDescription').value.trim();
        const calculationLevel = document.getElementById('elementCalculationLevel').value.trim();
        const attributeToCheck = document.getElementById('elementAttributeToCheck').value.trim();

            return;
        }

        if (!title) {
            alert('נא להזין כותרת');
            return;
        }

        try {
            const response = await fetch(
                AppConfig.getApiUrl('schoolyearconfig/pricing-elements'),
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                    },
                    body: JSON.stringify({
                        yearId: window.schoolYearConfigState.selectedYearId,
                        name: name,
                        title: title,
                        description: description || null,
                        calculationLevel: calculationLevel || null,
                        attributeToCheck: attributeToCheck || null,
                        sortOrder: parseInt(document.getElementById('elementSortOrder').value) || 0
                    })
                }
            );

            const result = await response.json();

            if (response.ok && result.success) {
                alert('רכיב התמחור נוסף בהצלחה');
                document.body.removeChild(overlay);
                await loadPricingElements(window.schoolYearConfigState.selectedYearId);
            } else {
                alert(result.message || 'שגיאה בהוספת רכיב תמחור');
            }
        } catch (error) {

            alert('שגיאה בהוספת רכיב תמחור');
        }
    }

    // Add pricing step
    async function addPricingStep(overlay) {
        const selectedElementId = document.getElementById('stepPricingElement') ? 
            parseInt(document.getElementById('stepPricingElement').value) : 
            window.schoolYearConfigState.selectedElementId;
        const selectedCategory = document.getElementById('stepCategory') ? 
            parseInt(document.getElementById('stepCategory').value) : 
            window.schoolYearConfigState.selectedCategoryNumber;

        const objectCheck = document.getElementById('stepObjectCheck').value.trim();
        const objectElementCheck = document.getElementById('stepObjectElementCheck').value.trim();
        const objectElementValue = document.getElementById('stepObjectElementValue').value.trim();
        const priceValue = document.getElementById('stepPrice').value.trim();
        const price = priceValue ? parseFloat(priceValue) : null;

        if (!objectCheck || !objectElementCheck || !objectElementValue) {
            alert('נא למלא את כל השדות החובה');
            return;
        }

        try {
            const response = await fetch(
                AppConfig.getApiUrl('schoolyearconfig/pricing-steps'),
                {
                    ...AppConfig.getDefaultFetchOptions(),
                    method: 'POST',
                    body: JSON.stringify({
                        pricingElement: selectedElementId,
                        category: selectedCategory,
                        objectCheck: objectCheck,
                        objectElementCheck: objectElementCheck,
                        objectElementValue: objectElementValue,
                        price: price
                    })
                }
            );

            const result = await response.json();

            if (response.ok && result.success) {
                alert('שלב התמחור נוסף בהצלחה');
                document.body.removeChild(overlay);
                
                // If element or category changed, reload the correct view
                if (selectedElementId !== window.schoolYearConfigState.selectedElementId) {
                    const element = window.schoolYearConfigState.pricingElements.find(e => e.id === selectedElementId);
                    await selectPricingElement(selectedElementId, element?.name || '');
                    // After loading element, find and select the category
                    const categories = window.schoolYearConfigState.pricingCategories;
                    const category = categories.find(c => c.category === selectedCategory);
                    if (category) {
                        await selectPricingCategory(category.id, selectedCategory);
                    }
                } else if (selectedCategory !== window.schoolYearConfigState.selectedCategoryNumber) {
                    // Same element, different category
                    const categories = window.schoolYearConfigState.pricingCategories;
                    const category = categories.find(c => c.category === selectedCategory);
                    if (category) {
                        await selectPricingCategory(category.id, selectedCategory);
                    }
                } else {
                    // Same element and category, just reload steps
                    await loadPricingSteps(window.schoolYearConfigState.selectedCategoryId);
                }
            } else {
                alert(result.message || 'שגיאה בהוספת שלב תמחור');
            }
        } catch (error) {
            console.error('❌ Error adding pricing step:', error);
            alert('שגיאה בהוספת שלב תמחור');
        }
    }

    // Load pricing steps for selected category
    async function loadPricingSteps(categoryId) {
        try {
            console.log(`📋 Loading pricing steps for category ${categoryId}...`);

            const container = document.getElementById('pricingStepsTableContainer');
            container.innerHTML = '<div class="loading-spinner">טוען...</div>';

            const response = await fetch(
                AppConfig.getApiUrl(`schoolyearconfig/pricing-steps/${categoryId}`),
                AppConfig.getDefaultFetchOptions()
            );

            if (!response.ok) {
                throw new Error(`Failed to load pricing steps: ${response.status}`);
            }

            const steps = await response.json();
            window.schoolYearConfigState.pricingSteps = steps;

            renderPricingStepsTable(steps);

            console.log(`✅ Loaded ${steps.length} pricing steps`);
        } catch (error) {
            console.error('❌ Error loading pricing steps:', error);
            document.getElementById('pricingStepsTableContainer').innerHTML =
                '<div style="padding: 20px; text-align: center; color: #dc3545;">שגיאה בטעינת שלבי תמחור</div>';
        }
    }

    // Render pricing steps table
    function renderPricingStepsTable(steps) {
        const container = document.getElementById('pricingStepsTableContainer');

        if (steps.length === 0) {
            container.innerHTML = '<div style="padding: 20px; text-align: center;">אין שלבי תמחור לקטגוריה זו</div>';
            return;
        }

        let tableHtml = `
        <table class="data-table">
            <thead>
                <tr>
                    <th>בדיקת אובייקט</th>
                    <th>בדיקת רכיב אובייקט</th>

                    <th>מחיר</th>
                    <th>פעולות</th>
                </tr>
            </thead>
            <tbody>
    `;

        steps.forEach(step => {
            const price = step.price ? step.price.toFixed(2) : '';

            tableHtml += `
            <tr>
                <td>${step.objectCheck}</td>
                <td>${step.objectElementCheck}</td>
                <td>${step.objectElementValue}</td>
                <td>${price}</td>

                    </button>
                    <button class="btn-icon" onclick="editPricingStep(${step.id})" title="עריכה">
                        <img src="edit_icon.png" alt="עריכה" class="action-icon-natural">
                    </button>
                    <button class="btn-icon" onclick="deletePricingStep(${step.id})" title="מחיקה">
                        <img src="delete_icon.png" alt="מחיקה" class="action-icon-natural">
                    </button>
                </td>
            </tr>
        `;
        });

        tableHtml += `
            </tbody>
        </table>
    `;

        container.innerHTML = tableHtml;
    }

    // Export all year configuration to JSON file
    async function exportYearConfiguration() {
        const yearId = window.schoolYearConfigState.selectedYearId;
        if (!yearId) {
            alert('אנא בחר שנת לימודים');
            return;
        }

        try {
            console.log('📥 Exporting year configuration...');

            const authToken = sessionStorage.getItem('authToken');
            const response = await fetch(
                AppConfig.getApiUrl(`schoolyearexport?yearId=${yearId}`), 
                {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                }
            );

            if (!response.ok) {
                throw new Error(`Export failed: ${response.status}`);
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            // Get year name for filename
            const yearSelect = document.getElementById('yearSelect');
            const yearName = yearSelect.options[yearSelect.selectedIndex].text;
            a.download = `school_year_config_${yearName}_${new Date().toISOString().slice(0,10)}.json`;
            
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);

            console.log('✅ Export completed successfully');
            alert('ייצוא הושלם בהצלחה');

        } catch (error) {
            console.error('❌ Error exporting year configuration:', error);
            alert('שגיאה בייצוא הגדרות שנה');
        }
    }

        const file = fileInput.files[0];

        if (!file) {
            alert('אנא בחר קובץ לייבוא');
            return;
        }

        if (!file.name.endsWith('.json')) {
            alert('אנא בחר קובץ JSON תקין');
            return;
        }

        try {
            console.log('📤 Importing year configuration...');

            const formData = new FormData();
            formData.append('file', file);
            formData.append('yearId', yearId);
            formData.append('clearExisting', clearExisting);

            const authToken = sessionStorage.getItem('authToken');
            const response = await fetch(
                AppConfig.getApiUrl('schoolyearconfig/import'), {
                method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
            });

            const result = await response.json();

            if (response.ok && result.success) {
                document.body.removeChild(overlay);
                alert(`ייבוא הושלם בהצלחה!\n\nיובאו:\n` +
                      `${result.imported.pricingElements || 0} רכיבי תמחור\n` +
                      `${result.imported.pricingCategories || 0} קטגוריות תמחור\n` +
                      `${result.imported.pricingSteps || 0} שלבי תמחור\n` +
                      `${result.imported.documentTypes || 0} סוגי מסמכים\n` +
                      `${result.imported.studyPrograms || 0} תוכניות לימוד נוספות\n` +
                      `${result.imported.tracks || 0} מגמות\n` +
                      `${result.imported.trackLevels || 0} רמות מגמה\n` +
                      `${result.imported.trackPricing || 0} תמחורי מגמה`);
                
                // Reload all data
                await loadTabData(window.schoolYearConfigState.activeTab);

            } else {
                alert(`שגיאה בייבוא: ${result.message || 'שגיאה לא ידועה'}\n\n` +
                      (result.errors ? `שגיאות:\n${result.errors.join('\n')}` : ''));
            }

        } catch (error) {
            console.error('❌ Error importing year configuration:', error);
            alert('שגיאה בייבוא הגדרות שנה');
        }
    }
