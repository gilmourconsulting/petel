<!-- Upload Modal with Column Mapping -->
<div id="uploadDialog" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 800px; width: 90%;">
        <div class="modal-header">
            <h3 id="uploadModalTitle">העלאת קובץ תלמידים</h3>
            <button class="modal-close" onclick="closeUploadDialog()">&times;</button>
        </div>
        <div class="modal-body">
            <!-- Step 1: File Selection -->
            <div id="fileSelectionStep">
                <div class="form-group">
                    <label for="studentFile">בחר קובץ (CSV, XLS, XLSX) *</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="studentFile" name="file" accept=".csv,.xls,.xlsx" required
                            style="display: none;">
                        <button type="button" class="btn-file-select"
                            onclick="document.getElementById('studentFile').click()">
                            <span id="fileNameDisplay">לא נבחר קובץ</span>
                        </button>
                    </div>
                </div>
                <div class="upload-status" id="fileSelectionStatus" style="display: none;"></div>
            </div>

            <!-- Step 2: Column Mapping -->
            <div id="columnMappingStep" style="display: none;">
                <p style="margin-bottom: 15px; color: #666; direction: rtl;">
                    התאם את העמודות בקובץ לשדות המערכת. המערכת זיהתה אוטומטית את השדות המתאימים, אך ניתן לשנות את
                    המיפוי.
                </p>
                <div style="max-height: 400px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 8px;">
                    <table class="mapping-table" style="width: 100%; border-collapse: collapse;">
                        <thead style="position: sticky; top: 0; background: #f8f9fa; z-index: 1;">
                            <tr style="border-bottom: 2px solid #dee2e6;">
                                <th style="padding: 12px; text-align: right; font-weight: bold;">עמודה בקובץ</th>
                                <th style="padding: 12px; text-align: right; font-weight: bold;">שדה במערכת</th>
                            </tr>
                        </thead>
                        <tbody id="mappingTableBody" style="direction: rtl;">
                            <!-- Mapping rows will be inserted here -->
                        </tbody>
                    </table>
                </div>
                <div class="upload-status" id="mappingStatus" style="display: none; margin-top: 15px;"></div>
            </div>

            <!-- Upload Status -->
            <div class="upload-status" id="uploadStatus" style="display: none;"></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeUploadDialog()">ביטול</button>
            <button type="button" id="backToFileBtn" class="btn-secondary" style="display: none;"
                onclick="backToFileSelection()">חזרה</button>
            <button type="button" id="submitFileBtn" class="btn-primary" onclick="handleFileSelection()">המשך</button>
            <button type="button" id="uploadFileBtn" class="btn-primary" style="display: none;"
                onclick="handleFileUpload()">העלה קובץ</button>
        </div>
    </div>
</div>

<script>
    // Global variable to store selected file
    // Use window scope to prevent redeclaration errors
    window.selectedFile = window.selectedFile || null;
    window.columnMappings = window.columnMappings || {};
    window.availableFields = window.availableFields || {};
    window.currentHeaders = window.currentHeaders || []; // Store headers to preserve mappings

    // Attach file input change listener after page loads
    function initializeFileInputListener() {
        const fileInput = document.getElementById('studentFile');
        if (fileInput) {
            fileInput.addEventListener('change', function () {
                const fileNameDisplay = document.getElementById('fileNameDisplay');
                if (this.files && this.files.length > 0) {
                    fileNameDisplay.textContent = this.files[0].name;
                    console.log('📄 File selected:', this.files[0].name);
                } else {
                    fileNameDisplay.textContent = 'לא נבחר קובץ';
                }
            });
            console.log('✅ File input listener attached');
        } else {
            console.warn('⚠️ File input not found, retrying...');
            setTimeout(initializeFileInputListener, 100);
        }
    }

    // Call on page load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeFileInputListener);
    } else {
        initializeFileInputListener();
    }

    // Update buildMappingTable function - remove inline styles, use CSS classes
    // Go back to file selection step - preserve mappings if same file
    function buildMappingTable(headers, suggestedMappings, availableFields) {
        const tbody = document.getElementById('mappingTableBody');
        tbody.innerHTML = '';

        // ✅ Store headers for later use
        currentHeaders = headers;

        headers.forEach((header, index) => {
            const row = document.createElement('tr');
            row.style.borderBottom = '1px solid #dee2e6';

            // File column name
            const fileColCell = document.createElement('td');
            fileColCell.style.padding = '12px';
            fileColCell.style.fontWeight = 'bold';
            fileColCell.textContent = header;

            // System field dropdown
            const systemFieldCell = document.createElement('td');
            systemFieldCell.style.padding = '12px';

            const select = document.createElement('select');
            select.className = 'form-control mapping-select';
            select.dataset.fileColumn = header;

            // Add options
            const emptyOption = document.createElement('option');
            emptyOption.value = '';
            emptyOption.textContent = '-- לא ממופה --';
            select.appendChild(emptyOption);

            Object.entries(availableFields).forEach(([key, label]) => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = label;

                // ✅ Use existing mapping if available, otherwise use suggestion
                const existingMapping = columnMappings[header];
                if (existingMapping === key || (!existingMapping && suggestedMappings[header] === key)) {
                    option.selected = true;
                    // Make sure to update columnMappings with the selected value
                    if (!existingMapping) {
                        columnMappings[header] = key;
                    }
                }
                select.appendChild(option);
            });

            // Update mapping on change
            select.addEventListener('change', function () {
                if (this.value) {
                    columnMappings[header] = this.value;
                } else {
                    delete columnMappings[header];
                }
                console.log('📋 Updated mapping:', header, '->', this.value);
            });

            systemFieldCell.appendChild(select);

            row.appendChild(fileColCell);
            row.appendChild(systemFieldCell);
            tbody.appendChild(row);
        });

        console.log('✅ Mapping table built with', headers.length, 'columns');
        console.log('📋 Current mappings:', columnMappings);
    }

    // Update showUploadDialog to reset file input display
function showUploadDialog() {
    const modal = document.getElementById('uploadDialog');
    if (!modal) {
        console.error('❌ Upload modal not found in DOM');
        return;
    }
    
    // Reset to step 1 - with null checks
    const fileSelectionStep = document.getElementById('fileSelectionStep');
    const columnMappingStep = document.getElementById('columnMappingStep');
    const uploadStatus = document.getElementById('uploadStatus');
    const submitFileBtn = document.getElementById('submitFileBtn');
    const uploadFileBtn = document.getElementById('uploadFileBtn');
    const backToFileBtn = document.getElementById('backToFileBtn');
    const uploadModalTitle = document.getElementById('uploadModalTitle');
    
    if (fileSelectionStep) fileSelectionStep.style.display = 'block';
    if (columnMappingStep) columnMappingStep.style.display = 'none';
    if (uploadStatus) uploadStatus.style.display = 'none';
    if (submitFileBtn) submitFileBtn.style.display = 'inline-block';
    if (uploadFileBtn) uploadFileBtn.style.display = 'none';
    if (backToFileBtn) backToFileBtn.style.display = 'none';
    if (uploadModalTitle) uploadModalTitle.textContent = 'העלאת קובץ תלמידים';

    // Reset file input
    const fileInput = document.getElementById('studentFile');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    if (fileInput) fileInput.value = '';
    if (fileNameDisplay) fileNameDisplay.textContent = 'לא נבחר קובץ';
    
    selectedFile = null;
    columnMappings = {}; // ✅ Clear mappings on fresh open
    currentHeaders = [];

    modal.style.display = 'flex';
}
    

    // Go back to file selection step - preserve mappings if same file
    function backToFileSelection() {
        // Hide mapping step, show file selection
        document.getElementById('columnMappingStep').style.display = 'none';
        document.getElementById('fileSelectionStep').style.display = 'block';
        document.getElementById('uploadModalTitle').textContent = 'העלאת קובץ תלמידים';

        // Update buttons
        document.getElementById('backToFileBtn').style.display = 'none';
        document.getElementById('uploadFileBtn').style.display = 'none';
        document.getElementById('submitFileBtn').style.display = 'inline-block';
        document.getElementById('submitFileBtn').disabled = false;

        // Clear mapping status
        document.getElementById('mappingStatus').style.display = 'none';

        // ✅ Keep columnMappings - will be reused if same file is selected
        console.log('🔙 Returned to file selection step (mappings preserved)');
    }

   
        // Close upload dialog
    function closeUploadDialog() {
        const modal = document.getElementById('uploadDialog');
        if (!modal) {
            console.error('❌ Upload modal not found in DOM');
            return;
        }
        
        modal.style.display = 'none';
    
        // Reset everything - with null checks
        const fileSelectionStep = document.getElementById('fileSelectionStep');
        const columnMappingStep = document.getElementById('columnMappingStep');
        const uploadStatus = document.getElementById('uploadStatus');
        const fileSelectionStatus = document.getElementById('fileSelectionStatus');
        const mappingStatus = document.getElementById('mappingStatus');
        
        if (fileSelectionStep) fileSelectionStep.style.display = 'block';
        if (columnMappingStep) columnMappingStep.style.display = 'none';
        if (uploadStatus) uploadStatus.style.display = 'none';
        if (fileSelectionStatus) fileSelectionStatus.style.display = 'none';
        if (mappingStatus) mappingStatus.style.display = 'none';
    
        // Reset file input
        const fileInput = document.getElementById('studentFile');
        if (fileInput) fileInput.value = '';
    
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        if (fileNameDisplay) fileNameDisplay.textContent = 'לא נבחר קובץ';
    
        // Clear state variables
        selectedFile = null;
        columnMappings = {};
        currentHeaders = [];
    
        // ✅ Reset modal buttons to initial state - with null checks
        const submitFileBtn = document.getElementById('submitFileBtn');
        const uploadFileBtn = document.getElementById('uploadFileBtn');
        const backToFileBtn = document.getElementById('backToFileBtn');
        const uploadModalTitle = document.getElementById('uploadModalTitle');
        
        if (submitFileBtn) {
            submitFileBtn.style.display = 'inline-block';
            submitFileBtn.disabled = false;
        }
        if (uploadFileBtn) {
            uploadFileBtn.style.display = 'none';
            uploadFileBtn.disabled = false;
            uploadFileBtn.textContent = 'העלה קובץ';
        }
        if (backToFileBtn) backToFileBtn.style.display = 'none';
        if (uploadModalTitle) uploadModalTitle.textContent = 'העלאת קובץ תלמידים';
    
        // ✅ Restore original modal footer (in case it was replaced)
        const modalFooter = document.querySelector('#uploadDialog .modal-footer');
        if (modalFooter) {
            modalFooter.innerHTML = `
            <button type="button" class="btn-secondary" onclick="closeUploadDialog()">ביטול</button>
            <button type="button" id="backToFileBtn" class="btn-secondary" style="display: none;"
                onclick="backToFileSelection()">חזרה</button>
            <button type="button" id="submitFileBtn" class="btn-primary" onclick="handleFileSelection()">המשך</button>
            <button type="button" id="uploadFileBtn" class="btn-primary" style="display: none;"
                onclick="handleFileUpload()">העלה קובץ</button>
        `;
        }
    }

    // Handle file selection and preview
    async function handleFileSelection() {
        const fileInput = document.getElementById('studentFile');
        const file = fileInput.files[0];

        if (!file) {
            showFileSelectionStatus('אנא בחר קובץ', 'error');
            return;
        }

        selectedFile = file;

        // Show loading
        showFileSelectionStatus('קורא קובץ...', 'loading');
        document.getElementById('submitFileBtn').disabled = true;

        try {
            const token = window.sessionManager.getToken();
            if (!token) {
                showFileSelectionStatus('נדרש אימות. אנא התחבר מחדש.', 'error');
                document.getElementById('submitFileBtn').disabled = false;
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            const response = await fetch(AppConfig.getApiUrl('studentsfileupload/preview'), {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                body: formData
            });

            const result = await response.json();

            if (response.ok && result.success) {
                availableFields = result.availableFields;

                // ✅ Only update suggested mappings if columnMappings is empty (first time)
                // This preserves user's previous selections when going back
                const suggestedMappings = result.suggestedMappings || {};
                if (Object.keys(columnMappings).length === 0) {
                    columnMappings = { ...suggestedMappings };
                }

                // Show mapping step
                document.getElementById('fileSelectionStep').style.display = 'none';
                document.getElementById('columnMappingStep').style.display = 'block';
                document.getElementById('submitFileBtn').style.display = 'none';
                document.getElementById('uploadFileBtn').style.display = 'inline-block';
                document.getElementById('backToFileBtn').style.display = 'inline-block';
                document.getElementById('uploadModalTitle').textContent = 'מיפוי עמודות';

                // Build mapping table with preserved or suggested mappings
                buildMappingTable(result.headers, columnMappings, result.availableFields);

            } else {
                showFileSelectionStatus(`❌ שגיאה: ${result.message || 'לא ניתן לקרוא את הקובץ'}`, 'error');
                document.getElementById('submitFileBtn').disabled = false;
            }
        } catch (error) {
            console.error('Error previewing file:', error);
            showFileSelectionStatus('❌ שגיאה בקריאת הקובץ. אנא נסה שנית.', 'error');
            document.getElementById('submitFileBtn').disabled = false;
        }
    }


    // Class field validation logic
    async function handleFileUpload() {
        if (!selectedFile) {
            showMappingStatus('לא נבחר קובץ', 'error');
            return;
        }

        // Create reverse mapping FIRST (system field -> file column)
        const reverseMapping = {};
        Object.entries(columnMappings).forEach(([fileCol, sysField]) => {
            if (sysField && sysField !== 'ignore') {
                reverseMapping[sysField] = fileCol;
            }
        });

        console.log('📋 Reverse mapping (system field -> file column):', reverseMapping);

        // Validate required fields are mapped - check reverseMapping keys
        const requiredFields = ['id_number', 'first_name', 'last_name', 'gender', 'start_date', 'end_date', 'street', 'house_number', 'city', 'post_code', 'sending_council'];
        const mappedSystemFields = Object.keys(reverseMapping); // System fields that have been mapped

        console.log('📋 Mapped system fields:', mappedSystemFields);

        // Check if class is mapped either as full name OR as level+number
        const hasClassName = mappedSystemFields.includes('class');
        const hasClassLevel = mappedSystemFields.includes('class_level');
        const hasClassNumber = mappedSystemFields.includes('class_number');
        const hasClassParts = hasClassLevel && hasClassNumber;

        console.log('🔍 Class mapping check:', {
            hasClassName,
            hasClassLevel,
            hasClassNumber,
            hasClassParts
        });

        // ✅ Either 'class' alone OR both 'class_level' and 'class_number'
        if (!hasClassName && !hasClassParts) {
            let errorMsg = '❌ שגיאה: יש למפות כיתה בדרך אחת מהאפשרויות הבאות:\n';
            errorMsg += '• כיתה (שם מלא) - לדוגמה: "א1", "ב2"\n';
            errorMsg += '• שכבה + מספר כיתה - לדוגמה: שכבה="א", מספר="1"';

            if (hasClassLevel && !hasClassNumber) {
                errorMsg += '\n\n⚠️ מופתה רק שכבה, חסר מספר כיתה';
            } else if (!hasClassLevel && hasClassNumber) {
                errorMsg += '\n\n⚠️ מופה רק מספר כיתה, חסרה שכבה';
            }

            showMappingStatus(errorMsg, 'error');
            return;
        }

        const missingFields = requiredFields.filter(field => !mappedSystemFields.includes(field));

        if (missingFields.length > 0) {
            const fieldLabels = missingFields.map(f => availableFields[f] || f).join(', ');
            showMappingStatus(`❌ שגיאה: שדות חובה לא ממופים: ${fieldLabels}`, 'error');
            return;
        }

        // Show loading
        showMappingStatus('מעלה קובץ...', 'loading');
        document.getElementById('uploadFileBtn').disabled = true;
        document.getElementById('uploadFileBtn').textContent = 'מעלה...';

        try {
            const token = window.sessionManager.getToken();
            if (!token) {
                showMappingStatus('נדרש אימות. אנא התחבר מחדש.', 'error');
                document.getElementById('uploadFileBtn').disabled = false;
                document.getElementById('uploadFileBtn').textContent = 'העלה קובץ';
                return;
            }

            const schoolYearId = await window.SessionState.getProperty('SelectedSchoolYearId');
            const schoolId = await window.SessionState.getProperty('SelectedSchoolId');
            const hebrewYear = await window.SessionState.getProperty('SelectedYearValue');

            if (!schoolYearId) {
                showMappingStatus('לא נבחרה שנת לימודים. אנא בחר שנת לימודים ונסה שנית.', 'error');
                document.getElementById('uploadFileBtn').disabled = false;
                document.getElementById('uploadFileBtn').textContent = 'העלה קובץ';
                return;
            }

            console.log('📤 Uploading with mapping:', reverseMapping);

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('schoolYearId', schoolYearId);
            formData.append('schoolId', schoolId);
            formData.append('hebrewYear', hebrewYear);
            formData.append('mappingJson', JSON.stringify(reverseMapping));

            const response = await fetch(AppConfig.getApiUrl('studentsfileupload/upload'), {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                body: formData
            });

            const result = await response.json();

            if (response.ok && result.success) {
                const summaryMessage =
                    `✅ הקובץ עובד בהצלחה!\n\n` +
                    `📊 סיכום העלאה:\n` +
                    `➕ נוצרו: ${result.created}\n` +
                    `✏️ עודכנו: ${result.updated}\n` +
                    `➖ ללא שינוי: ${result.unchanged}\n` +
                    (result.errors > 0 ? `\n❌ שגיאות: ${result.errors}` : '');

                let finalMessage = summaryMessage;
                if (result.errors > 0 && result.details?.errorList) {
                    console.log('Upload errors:', result.details.errorList);
                    const errorDetails = result.details.errorList.slice(0, 5).join('\n');
                    finalMessage += '\n\n⚠️ שגיאות:\n' + errorDetails;
                    if (result.details.errorList.length > 5) {
                        finalMessage += '\n... ועוד';
                    }
                }

                // Hide mapping step, show final status
                document.getElementById('columnMappingStep').style.display = 'none';
                document.getElementById('uploadStatus').style.display = 'block';
                document.getElementById('uploadStatus').innerHTML = finalMessage.replace(/\n/g, '<br>');
                document.getElementById('uploadStatus').className = 'upload-status upload-status-success';

                // Update footer to show only OK button
                const modalFooter = document.querySelector('#uploadDialog .modal-footer');
                modalFooter.innerHTML = `
                <button type="button" class="btn-primary" onclick="closeUploadDialogAndRefresh()">אישור</button>
            `;
            } else {
                showMappingStatus(`❌ שגיאה: ${result.message || 'העלאת הקובץ נכשלה'}`, 'error');
                document.getElementById('uploadFileBtn').disabled = false;
                document.getElementById('uploadFileBtn').textContent = 'העלה קובץ';
            }
        } catch (error) {
            console.error('Upload error:', error);
            showMappingStatus('❌ שגיאה בהעלאת הקובץ. אנא נסה שנית.', 'error');
            document.getElementById('uploadFileBtn').disabled = false;
            document.getElementById('uploadFileBtn').textContent = 'העלה קובץ';
        }
    }

    // Show status helpers
    function showFileSelectionStatus(message, type) {
        const statusDiv = document.getElementById('fileSelectionStatus');
        statusDiv.innerHTML = message.replace(/\n/g, '<br>');
        statusDiv.className = `upload-status upload-status-${type}`;
        statusDiv.style.display = 'block';
    }

    function showMappingStatus(message, type) {
        const statusDiv = document.getElementById('mappingStatus');
        statusDiv.innerHTML = message.replace(/\n/g, '<br>');
        statusDiv.className = `upload-status upload-status-${type}`;
        statusDiv.style.display = 'block';
    }

    // Close upload dialog and refresh
    function closeUploadDialogAndRefresh() {
        closeUploadDialog();
        console.log('🔄 Refreshing students data after upload...');
        // ✅ Immediate refresh - no delay needed
        refreshStudentsData();
    }

    // Close modal when clicking on overlay (outside modal content)
    window.addEventListener('click', function (event) {
        const modal = document.getElementById('uploadDialog');
        if (event.target === modal) {
            closeUploadDialog();
        }
    });

    // Load students data from API following API Communication Pattern
    async function loadStudentsData() {
        console.log('🔄 Loading students data from API...');

        try {
            const authToken = sessionStorage.getItem('authToken');
            if (!authToken) {
                console.error('❌ No auth token found');
                showTableError('נדרש אימות. אנא התחבר מחדש.');
                return;
            }
            const schoolYearId = await window.SessionState.getProperty('SelectedSchoolYearId')

            // Show loading indicator
            const container = document.getElementById('studentsTableContainer');
            if (container) {
                container.innerHTML = `
                <div class="loading-spinner" style="text-align: center; padding: 20px; direction: rtl;">
                    טוען נתוני תלמידים...
                </div>
            `;
            }


            const apiUrl = AppConfig.getApiUrl(`students?schoolYearId=${schoolYearId}`);

            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                }
            });
            console.log('📥 Students API response:', response.status, response.ok);

            if (response.ok) {
                const result = await response.json();
                console.log('✅ Students data received:', result);

                if (result.success && result.data) {
                    // Transform API data using enriched fields from backend following Entity-Based Request Flow
                    const transformedData = result.data.map(student => {
                        // Determine total amount - specific value for student 123456358
                        //  let totalAmount;

                        //  totalAmount = '0';

                        const totalAmount = student.cost != null ? student.cost.toString() : '0';

                        return {
                            id: student.id,
                            idNumber: student.idNumber || '',
                            name: `${student.firstName || ''} ${student.lastName || ''}`.trim(),
                            gender: student.gender === 1 ? 'זכר' : student.gender === 2 ? 'נקבה' : '',
                            address: [

                                student.postCode
                            ].filter(Boolean).join(', '),
                            // Use enriched class name from backend
                            class: student.className || student.classId?.toString() || '',
                            classId: student.classId, // Keep for reference
                            startDate: student.startDate ? new Date(student.startDate).toLocaleDateString('he-IL') : '',
                            endDate: student.endDate ? new Date(student.endDate).toLocaleDateString('he-IL') : '',

                            status: student.status || '',

                            sendingCouncilId: student.sendingCouncil // Keep ID for reference
                        };
                    });

                    console.log('🔄 Transformed students data with enriched fields:', transformedData);

                    // Store data globally for Cross-Component Communication
                    window.currentStudentsData = transformedData;

                    // Update summary statistics
                    updateStudentsSummary(transformedData);

        } catch (error) {

    // Load ReusableTable component dynamically following Single-Page Application with Module Loading
    function loadReusableTableComponent(data) {
        // Check if script already exists to prevent duplicates
        const existingScript = document.querySelector('script[src="table-component.js"]');
        if (existingScript) {
            console.log('table-component.js already loaded, waiting for ReusableTable...');
            // Wait a bit for the script to execute
            setTimeout(() => {
                if (typeof ReusableTable !== 'undefined') {
                    initializeStudentsTable(data);
                } else {
                    console.error('❌ ReusableTable still not available after script load');
                    showTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
                }
            }, 500);
            return;
        }

        // Load the script
        const script = document.createElement('script');
        script.src = 'table-component.js';
        script.onload = () => {
            console.log('✅ table-component.js loaded');
            setTimeout(() => {
                if (typeof ReusableTable !== 'undefined') {
                    initializeStudentsTable(data);
                } else {
                    console.error('❌ ReusableTable not available after script load');
                    showTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
                }
            }, 100);
        };
        script.onerror = () => {
            console.error('❌ Failed to load table-component.js');
            showTableError('שגיאה בטעינת רכיב הטבלה');
        };
        document.head.appendChild(script);
    }

    // Update the bulk pricing calculation to track new student IDs
    async function calculateBulkStudentPricing() {
        try {
            console.log('💰 Starting bulk pricing calculation...');

            // Check if we have students data
            if (!window.currentStudentsData || window.currentStudentsData.length === 0) {
                alert('אין תלמידים לחישוב תמחור');
                return;
            }

            const totalStudents = window.currentStudentsData.length;

            // Show confirmation dialog with warning
            const confirmMsg = `⚠️ אזהרה: חישוב תמחור לכל התלמידים\n\n` +
                `פעולה זו תחשב רכיבי תמחור עבור ${totalStudents} תלמידים.\n` +
                `רכיבי התמחור הקיימים יוחלפו.\n\n` +
                `הפעולה עשויה לקחת מספר דקות.\n\n` +
                `האם להמשיך?`;

            if (!confirm(confirmMsg)) {
                console.log('⚠️ Bulk pricing calculation cancelled by user');
                return;
            }

            // Create progress modal
            const progressModal = createProgressModal();
            document.body.appendChild(progressModal);

            // Get auth token
            const token = window.sessionManager.getToken();
            if (!token) {
                throw new Error('No authentication token found');
            }

            // Initialize counters
            let successCount = 0;
            let failCount = 0;
            let processedCount = 0;
            const errors = [];
            const newStudentIds = new Map(); // ✅ Track old ID -> new ID mapping

            // Update progress
            function updateProgress() {
                const percentage = Math.round((processedCount / totalStudents) * 100);
                const progressBar = document.getElementById('bulkPricingProgressBar');
                const progressText = document.getElementById('bulkPricingProgressText');
                const progressStats = document.getElementById('bulkPricingProgressStats');

                if (progressBar) progressBar.style.width = `${percentage}%`;
                if (progressText) progressText.textContent = `${percentage}%`;
                if (progressStats) {
                    progressStats.innerHTML = `
                    <div style="direction: rtl; text-align: center;">
                        <div>עובד: ${processedCount} / ${totalStudents}</div>
                        <div style="color: #28a745;">✅ הצליחו: ${successCount}</div>
                        <div style="color: #dc3545;">❌ נכשלו: ${failCount}</div>
                    </div>
                `;
                }
            }

            console.log(`🔄 Processing ${totalStudents} students...`);

            // Process students one by one
            for (const student of window.currentStudentsData) {
                try {
                    console.log(`📊 Calculating pricing for student ${student.id}: ${student.name}`);

                    const response = await fetch(AppConfig.getApiUrl(`studentpricing/calculate/${student.id}?save=true`), {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    const result = await response.json();

                    if (response.ok && result.success) {
                        successCount++;
                        // ✅ Track the new student ID
                        if (result.data.newStudentId) {
                            newStudentIds.set(student.id, result.data.newStudentId);
                        }
                        console.log(`✅ Success for student ${student.id}: ${result.data.elementsCount} elements calculated`);
                    } else {
                        failCount++;
                        const errorMsg = `${student.name} (${student.idNumber}): ${result.message || 'חישוב נכשל'}`;
                        errors.push(errorMsg);
                        console.warn(`⚠️ Failed for student ${student.id}:`, result.message);
                    }
                } catch (error) {
                    failCount++;
                    const errorMsg = `${student.name} (${student.idNumber}): ${error.message}`;
                    errors.push(errorMsg);
                    console.error(`❌ Error for student ${student.id}:`, error);
                }

                processedCount++;
                updateProgress();

                // Small delay to prevent overwhelming the server
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            console.log('✅ Bulk pricing calculation complete', {
                total: totalStudents,
                success: successCount,
                failed: failCount
            });

            // Remove progress modal
            document.body.removeChild(progressModal);

            // Show summary
            showBulkPricingSummary(totalStudents, successCount, failCount, errors);

            // ✅ Refresh the students list to show new versions with updated costs
            if (successCount > 0) {
                console.log('🔄 Refreshing students list to show updated data...');
                setTimeout(() => {
                    refreshStudentsData();
                }, 2000);
            }

        } catch (error) {
            console.error('❌ Error in bulk pricing calculation:', error);

            // Remove progress modal if exists
            const progressModal = document.getElementById('bulkPricingProgressModal');
            if (progressModal) {
                document.body.removeChild(progressModal);
            }

            alert(`❌ שגיאה בחישוב תמחור המוני:\n${error.message}`);
        }
    }
