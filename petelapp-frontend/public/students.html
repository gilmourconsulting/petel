// Update summary statistics
function updateStudentsSummary(data) {
    const totalStudents = data.length;
    const activeStudents = data.filter(s => s.status === 'בטיפול').length;
    const newStudents = data.filter(s => s.status === 'חדש').length;
    const finishedStudents = data.filter(s => s.status === 'הסתיים').length;

    const totalClasses = [...new Set(data.map(s => s.class))].length;

    const totalElement = document.getElementById('totalStudents');
    const activeElement = document.getElementById('activeStudents');
    const classesElement = document.getElementById('totalClasses');

    if (totalElement) totalElement.textContent = totalStudents;
    if (activeElement) activeElement.textContent = activeStudents;
    if (classesElement) classesElement.textContent = totalClasses;

    console.log('✅ Summary updated:', { totalStudents, newStudents, activeStudents, finishedStudents, totalClasses });
}

// Create students table using ReusableTable component following Frontend Architecture Patterns
function createStudentsTable(data) {
    console.log('📊 Creating students table with ReusableTable component');
    
    // Check if ReusableTable is already loaded
    if (typeof ReusableTable === 'undefined') {
        console.log('Loading ReusableTable component...');
        loadReusableTableComponent(data);
        return;
    }
    
    initializeStudentsTable(data);
}

// Load ReusableTable component dynamically following Single-Page Application with Module Loading
function loadReusableTableComponent(data) {
    // Check if script already exists to prevent duplicates
    const existingScript = document.querySelector('script[src="table-component.js"]');
    if (existingScript) {
        console.log('table-component.js already loaded, waiting for ReusableTable...');
        // Wait a bit for the script to execute
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                initializeStudentsTable(data);
            } else {
                console.error('❌ ReusableTable still not available after script load');
                showTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 500);
        return;
    }

    // Load the script
    const script = document.createElement('script');
    script.src = 'table-component.js';
    script.onload = () => {
        console.log('✅ table-component.js loaded');
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                initializeStudentsTable(data);
            } else {
                console.error('❌ ReusableTable not available after script load');
                showTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 100);
    };
    script.onerror = () => {
        console.error('❌ Failed to load table-component.js');
        showTableError('שגיאה בטעינת רכיב הטבלה');
    };
    document.head.appendChild(script);
}

// Initialize the ReusableTable following Project-Specific Patterns
function initializeStudentsTable(data) {
    console.log('🔧 Initializing ReusableTable with data:', data);
    
    // Define table columns with PNG icons following Hebrew/RTL Specific Patterns
    const columns = [
        { key: 'id', label: 'ת"ז', sortable: true, readOnly: true },
        { key: 'name', label: 'שם', sortable: true, readOnly: false },
        { key: 'address', label: 'כתובת', sortable: true, readOnly: false },
        { key: 'class', label: 'כיתה', sortable: true, readOnly: false },
        { 
            key: 'status', 
            label: 'סטטוס תלמיד', 
            sortable: true, 
            readOnly: false,
            render: (student) => `<span class="status-badge status-${student.status}">${student.status}</span>`
        },
        { 
            key: 'category', 
            label: 'קטגוריה', 
            sortable: true, 
            readOnly: false
            // Removed render function to use plain text display
        },
         { 
            key: 'totalAmount', 
            label: 'סכום שנדרש', 
            sortable: true, 
            readOnly: false
            // Removed render function to use plain text display
        },       {
            key: 'actions',
            label: 'פעולות',
            sortable: false,
            readOnly: true,
            render: (student) => `
                <div class="actions-cell">
                    <button class="btn btn-sm btn-icon" onclick="viewStudentDetails('${student.id}')" title="צפייה">
                        <img src="view_icon.png" alt="צפייה" class="action-icon-natural">
                    </button>

                </div>
            `
        }
    ];

    try {
        // Create ReusableTable instance following Project-Specific Patterns
        const studentsTable = new ReusableTable('studentsTableContainer', {
            tableName: 'students',
            isReadOnly: false,
            allowAdd: true,
            allowEdit: true,
            allowDelete: false
        });

        console.log('✅ ReusableTable instance created');

        // Initialize with data and columns following Critical Development Workflows
        studentsTable.init(data, columns);

        // Set save callback for when data is edited
        studentsTable.onSave = (updatedData) => {
            console.log('💾 Saving students data:', updatedData);
            window.currentStudentsData = updatedData;
            updateStudentsSummary(updatedData);
        };

        console.log('✅ Students ReusableTable initialized successfully with', data.length, 'students');

    } catch (error) {
        console.error('❌ Error creating ReusableTable:', error);
        showTableError('שגיאה ביצירת טבלת התלמידים');
    }
}

// Show error message in table container following Hebrew/RTL Specific Patterns

                <button onclick="refreshStudentsData()" class="btn btn-primary" style="margin-top: 10px;">

        `;
    }
}

function viewStudentDetails(studentId) {
    console.log('👁️ Viewing student details:', studentId);
    
    const student = getStudentById(studentId);
    if (student) {
        // Store in session following Authentication & Session Management
        sessionStorage.setItem('selectedStudentId', studentId);
        sessionStorage.setItem('selectedStudentName', student.name);
        
        // Navigate to student.html following Single-Page Application with Module Loading
        console.log('📄 Navigating to student details page...');
        
        // Check if navigateTo function is available (from main app)
        if (typeof navigateTo === 'function') {
            navigateTo('student');
        } else if (typeof window.navigateTo === 'function') {
            window.navigateTo('student');
        } else {
            // Fallback: Load student.html directly into main content area
            loadStudentPageDirectly();
        }
    }
}

    const mainContainer = document.getElementById('mainContent') || 
                         document.querySelector('.main-content') || 
                         document.querySelector('main') ||
                         document.body;
    
    if (!mainContainer) {
        console.error('❌ Could not find main content container');
        return;
    }
    
    // Show loading state
    mainContainer.innerHTML = `
        <div class="loading-spinner" style="text-align: center; padding: 40px; direction: rtl;">
            טוען דף תלמיד...
        </div>
    `;
    
    // Fetch and load student.html following API Communication Pattern
    fetch('student.html')
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
        })
        .then(html => {
            console.log('✅ student.html loaded successfully');
            
            // Insert the HTML content
            mainContainer.innerHTML = html;
            
            // Execute any scripts in the loaded content following Critical Development Workflows
            const scripts = mainContainer.querySelectorAll('script');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                if (script.src) {
                    newScript.src = script.src;
                } else {
                    newScript.textContent = script.textContent;
                }
                document.head.appendChild(newScript);
                script.remove();
            });
            
            console.log('✅ Student page loaded and initialized');
        })
        .catch(error => {
            console.error('❌ Error loading student.html:', error);
            
            // Show error message following Hebrew/RTL Specific Patterns
            mainContainer.innerHTML = `
                <div class="error-message" style="
                    text-align: center; 
                    padding: 40px; 
                    direction: rtl;
                    background: #f8d7da;
                    color: #721c24;
                    border: 1px solid #f5c6cb;
                    border-radius: 8px;
                    margin: 20px;
                ">
                    <h3>שגיאה בטעינת דף התלמיד</h3>
                    <p>לא ניתן לטעון את דף פרטי התלמיד. אנא נסה שוב.</p>
                    <button onclick="window.history.back()" class="btn btn-primary" style="
                        margin-top: 15px;
                        padding: 8px 16px;
                        background-color: #007bff;
                        color: white;
                        border: none;
                        border-radius: 4px;
                        cursor: pointer;
                    ">
                        חזרה
                    </button>
                </div>
            `;
        });
}

// Make the fallback function globally available following Cross-Component Communication
window.loadStudentPageDirectly = loadStudentPageDirectly;

// Get student by ID from current data following Cross-Component Communication
function getStudentById(studentId) {
    if (window.currentStudentsData && Array.isArray(window.currentStudentsData)) {
        return window.currentStudentsData.find(student => student.id === studentId);
    }
    console.warn('⚠️ No current students data available');
    return null;
}

// Refresh students data function
function refreshStudentsData() {
    console.log('🔄 Refreshing students data...');
    
    // Show loading state
    const container = document.getElementById('studentsTableContainer');
    if (container) {
        container.innerHTML = `
            <div class="loading-spinner" style="text-align: center; padding: 20px; direction: rtl;">
                רענון נתוני תלמידים...
            </div>
        `;
    }
    
    // Reload data
    loadStudentsData();
}

// Initialize the page when loaded following Critical Development Workflows
document.addEventListener('DOMContentLoaded', function() {
    console.log('🏁 Students page DOMContentLoaded');
    
    // Load students data after a small delay to ensure DOM is ready
    setTimeout(() => {
        loadStudentsData();
    }, 100);
});

// Also try immediate call if DOM is already ready following Frontend Architecture Patterns
if (document.readyState !== 'loading') {
    console.log('📄 Document already ready, calling loadStudentsData immediately');
    setTimeout(() => {
        loadStudentsData();
    }, 50);
}

// Make functions globally available following Cross-Component Communication
window.loadStudentsData = loadStudentsData;
window.useMockStudentsData = useMockStudentsData;
window.createStudentsTable = createStudentsTable;
window.loadReusableTableComponent = loadReusableTableComponent;
window.initializeStudentsTable = initializeStudentsTable;
window.updateStudentsSummary = updateStudentsSummary;
window.showTableError = showTableError;
window.refreshStudentsData = refreshStudentsData;
window.viewStudentDetails = viewStudentDetails;
window.editStudent = editStudent;
window.viewStudentGrades = viewStudentGrades;
window.getStudentById = getStudentById;

console.log('✅ Students page functions registered globally');
</script>
