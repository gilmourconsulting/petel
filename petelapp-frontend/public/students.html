<!-- Replace the upload dialog div with modal styling -->
<div id="uploadDialog" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>העלאת קובץ תלמידים</h3>
            <button class="modal-close" onclick="closeUploadDialog()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="uploadForm" onsubmit="handleFileUpload(event)">
                <div class="form-group">
                    <label for="studentFile">בחר קובץ (CSV, XLS, XLSX) *</label>
                    <input type="file" id="studentFile" name="file" accept=".csv,.xls,.xlsx" required>
                </div>
                <div class="form-group">
                    <label for="mappingJson">מיפוי עמודות (אופציונלי - JSON)</label>
                    <textarea id="mappingJson" name="mappingJson" rows="4" placeholder='{"id_number": "ת.ז", "first_name": "שם פרטי"}'></textarea>
                </div>
               
            </form>
        </div>
         <div class="upload-status" id="uploadStatus" style="display: none;"></div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeUploadDialog()">ביטול</button>
            <button type="submit" form="uploadForm" class="btn-primary">העלה קובץ</button>
        </div>
    </div>
</div>



<script>
async function handleFileUpload(event) {
    event.preventDefault();
    
    const statusDiv = document.getElementById('uploadStatus');
    statusDiv.style.display = 'none';
    
    // Disable submit button during upload
    const submitBtn = document.querySelector('#uploadDialog .btn-primary');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'מעלה...';
    
    try {
        // Show loading status
        showUploadStatus('מעלה קובץ...', 'loading');
        
        const token = window.sessionManager.getToken();
        if (!token) {
            showUploadStatus('נדרש אימות. אנא התחבר מחדש.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
            return;
        }
        
        const schoolYearId = await window.SessionState.getProperty('SelectedSchoolYearId');
        
        const schoolId = await window.SessionState.getProperty('SelectedSchoolId');
        const hebrewYear = await window.SessionState.getProperty('SelectedYearValue');
        
        if (!schoolYearId) {
            showUploadStatus('לא נבחרה שנת לימודים. אנא בחר שנת לימודים ונסה שנית.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
            return;
        }
        
        const formData = new FormData();
        const fileInput = document.getElementById('studentFile');
        formData.append('file', fileInput.files[0]);
        formData.append('schoolYearId', schoolYearId);
        formData.append('schoolId', schoolId);
        formData.append('hebrewYear', hebrewYear);
        
        const mappingJson = document.getElementById('mappingJson').value.trim();
        if (mappingJson) {
            formData.append('mappingJson', mappingJson);
        }
        
        const response = await fetch(AppConfig.getApiUrl('studentsfileupload/upload'), {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`
            },
            body: formData
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
            const summaryMessage = 
                `✅ הקובץ עובד בהצלחה!\n\n` +
                `📊 סיכום העלאה:\n` +
                `➕ נוצרו: ${result.created}\n` +
                `✏️ עודכנו: ${result.updated}\n` +
                `➖ ללא שינוי: ${result.unchanged}\n` +
                `❌ שגיאות: ${result.errors}`;
            
            // Show detailed errors if any
            let finalMessage = summaryMessage;
            if (result.errors > 0 && result.details?.errorList) {
                console.log('Upload errors:', result.details.errorList);
                const errorDetails = result.details.errorList.slice(0, 5).join('\n');
                finalMessage += '\n\n⚠️ שגיאות:\n' + errorDetails;
                if (result.details.errorList.length > 5) {
                    finalMessage += '\n... ועוד';
                }
            }
            
            showUploadStatus(finalMessage, 'success');
            
            // Hide form, show only status and OK button
            document.getElementById('uploadForm').style.display = 'none';
            
            // Update footer to show only OK button
            const modalFooter = document.querySelector('#uploadDialog .modal-footer');
            modalFooter.innerHTML = `
                <button type="button" class="btn-primary" onclick="closeUploadDialogAndRefresh()">אישור</button>
            `;
        } else {
            showUploadStatus(`❌ שגיאה: ${result.message || 'העלאת הקובץ נכשלה'}`, 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    } catch (error) {
        console.error('Upload error:', error);
        showUploadStatus('❌ שגיאה בהעלאת הקובץ. אנא נסה שנית.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
    }
}

// Show upload dialog as modal popup
function showUploadDialog() {
    const modal = document.getElementById('uploadDialog');
    if (modal) {
        modal.style.display = 'flex'; // ✅ Use flex to center content
    }
}

// Close upload dialog
function closeUploadDialog() {
    const modal = document.getElementById('uploadDialog');
    if (modal) {
        modal.style.display = 'none';
    }
    document.getElementById('uploadForm').reset();
    document.getElementById('uploadStatus').style.display = 'none';
}

// Close modal when clicking on overlay (outside modal content)
window.addEventListener('click', function(event) {
    const modal = document.getElementById('uploadDialog');
    if (event.target === modal) {
        closeUploadDialog();
    }
});

// Load students data from API following API Communication Pattern
async function loadStudentsData() {
    console.log('🔄 Loading students data from API...');
    
    try {
        const authToken = sessionStorage.getItem('authToken');
        if (!authToken) {
            console.error('❌ No auth token found');
            showTableError('נדרש אימות. אנא התחבר מחדש.');
            return;
        }
        const schoolYearId = await window.SessionState.getProperty('SelectedSchoolYearId')

        // Show loading indicator
        const container = document.getElementById('studentsTableContainer');
        if (container) {
            container.innerHTML = `
                <div class="loading-spinner" style="text-align: center; padding: 20px; direction: rtl;">
                    טוען נתוני תלמידים...
                </div>
            `;
        }


        const apiUrl = AppConfig.getApiUrl(`students?schoolYearId=${schoolYearId}`);

        const response = await fetch(apiUrl, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`
            }
        });
        console.log('📥 Students API response:', response.status, response.ok);

        if (response.ok) {
            const result = await response.json();
            console.log('✅ Students data received:', result);

             if (result.success && result.data) {
                // Transform API data using enriched fields from backend following Entity-Based Request Flow
                const transformedData = result.data.map(student => {
                    // Determine total amount - specific value for student 123456358
                  //  let totalAmount;
                    
                  //  totalAmount = '0';

                    const totalAmount = student.cost != null ? student.cost.toString() : '0';

                    return {
                        id: student.id,
                        idNumber: student.idNumber || '',
                        name: `${student.firstName || ''} ${student.lastName || ''}`.trim(),
                        gender: student.gender === 1 ? 'זכר' : student.gender === 2 ? 'נקבה' : '',
                        address: [
                            student.street,
                            student.houseNumber,
                            student.city,
                            student.postCode
                        ].filter(Boolean).join(', '),
                        // Use enriched class name from backend
                        class: student.className || student.classId?.toString() || '',
                        classId: student.classId, // Keep for reference
                        startDate: student.startDate ? new Date(student.startDate).toLocaleDateString('he-IL') : '' ,
                        endDate: student.endDate ? new Date(student.endDate).toLocaleDateString('he-IL') : '',
 
                        status: 'איסוף נתונים',
                        category: student.disabilityCategory || '',
                        totalAmount: totalAmount,
                        // Use enriched council short name from backend
                        sendingCouncil: student.councilShortName || student.sendingCouncil?.toString() || '',
                        sendingCouncilId: student.sendingCouncil // Keep ID for reference
                    };
                });

                console.log('🔄 Transformed students data with enriched fields:', transformedData);

                // Store data globally for Cross-Component Communication
                window.currentStudentsData = transformedData;
                
                // Update summary statistics
                updateStudentsSummary(transformedData);
                
                // Create table with transformed data
                createStudentsTable(transformedData);
            } else {
                console.error('❌ Invalid response format:', result);
                showTableError('פורמט תגובה לא תקין מהשרת');
            }
        } else {
            const errorText = await response.text();
            console.error('❌ Failed to load students:', response.status, errorText);
            
            if (response.status === 401) {
                showTableError('נדרש אימות. אנא התחבר מחדש.');
            } else {
                showTableError(`שגיאה בטעינת נתוני תלמידים: ${response.status}`);
            }
        }
    } catch (error) {
        console.error('💥 Error loading students data:', error);
        showTableError('שגיאה בטעינת נתוני תלמידים. אנא נסה שוב.');
    }
}

function cleanupStudentsPage() {
    console.log('🧹 Cleaning up students page...');
    
    if (window.currentStudentsData) {
        window.currentStudentsData = null;
    }
    
    console.log('✅ Students page cleanup complete');
}

window.cleanupStudentsPage = cleanupStudentsPage;

// Update summary statistics to count by name instead of ID
function updateStudentsSummary(data) {
    const totalStudents = data.length;
    const activeStudents = data.filter(s => s.status === 'בטיפול').length;
    const finishedStudents = data.filter(s => s.status === 'הסתיים').length;
    // Count unique council names (not IDs) for accurate statistics
    const totalClasses = [...new Set(data.map(s => s.sendingCouncil).filter(Boolean))].length;

    const totalElement = document.getElementById('totalStudents');
    const activeElement = document.getElementById('activeStudents');
    const finishedElement = document.getElementById('finishedStudents');
    const classesElement = document.getElementById('totalClasses');

    if (totalElement) totalElement.textContent = totalStudents;
    if (activeElement) activeElement.textContent = activeStudents;
    if (finishedElement) finishedElement.textContent = finishedStudents;
    if (classesElement) classesElement.textContent = totalClasses;

    console.log('✅ Summary updated:', { totalStudents, activeStudents, finishedStudents, totalClasses });
}

// Create students table using ReusableTable component following Frontend Architecture Patterns
function createStudentsTable(data) {
    console.log('📊 Creating students table with ReusableTable component');
    
    // Check if ReusableTable is already loaded
    if (typeof ReusableTable === 'undefined') {
        console.log('Loading ReusableTable component...');
        loadReusableTableComponent(data);
        return;
    }
    
    initializeStudentsTable(data);
}

// Load ReusableTable component dynamically following Single-Page Application with Module Loading
function loadReusableTableComponent(data) {
    // Check if script already exists to prevent duplicates
    const existingScript = document.querySelector('script[src="table-component.js"]');
    if (existingScript) {
        console.log('table-component.js already loaded, waiting for ReusableTable...');
        // Wait a bit for the script to execute
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                initializeStudentsTable(data);
            } else {
                console.error('❌ ReusableTable still not available after script load');
                showTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 500);
        return;
    }

    // Load the script
    const script = document.createElement('script');
    script.src = 'table-component.js';
    script.onload = () => {
        console.log('✅ table-component.js loaded');
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                initializeStudentsTable(data);
            } else {
                console.error('❌ ReusableTable not available after script load');
                showTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 100);
    };
    script.onerror = () => {
        console.error('❌ Failed to load table-component.js');
        showTableError('שגיאה בטעינת רכיב הטבלה');
    };
    document.head.appendChild(script);
}

// Initialize the ReusableTable following Project-Specific Patterns
function initializeStudentsTable(data) {
    console.log('🔧 Initializing ReusableTable with data:', data);
    
    // Define table columns following Hebrew/RTL Specific Patterns and Standard Icon Set
    const columns = [
        { key: 'id', label: 'מזהה', sortable: true, readOnly: true, hidden: true },
        { key: 'idNumber', label: 'תז', sortable: true, readOnly: true },
        { key: 'name', label: 'שם', sortable: true, readOnly: false },
        { key: 'gender', label: 'מין', sortable: true, readOnly: false },
        { key: 'address', label: 'כתובת', sortable: false, readOnly: false },
        { key: 'class', label: 'כיתה', sortable: true, readOnly: false },
        { key: 'startDate', label: 'התחלה', sortable: true, readOnly: false },
        { key: 'endDate', label: 'סיום', sortable: true, readOnly: false },
        { 
            key: 'status', 
            label: 'סטטוס', 
            sortable: true, 
            readOnly: false,
            render: (student) => `<span class="status-badge status-${student.status}">${student.status}</span>`
        },
        { 
            key: 'category', 
            label: 'קטגוריה', 
            sortable: true, 
            readOnly: false
        },
        { 
            key: 'totalAmount', 
            label: 'סכום כולל', 
            sortable: true, 
            readOnly: false
        },
        { key: 'sendingCouncil', label: 'רשות שולחת', sortable: true, readOnly: false },
        {
            key: 'actions',
            label: 'פעולות',
            sortable: false,
            readOnly: true,
            render: (student) => `
                <div class="actions-cell">
                    <button class="btn btn-sm btn-icon" onclick="viewStudentDetails('${student.id}')" title="צפייה">
                        <img src="view_icon.png" alt="צפייה" class="action-icon-natural">
                    </button>
                </div>
            `
        }
    ];

    try {
        // Create ReusableTable instance following Project-Specific Patterns
        const studentsTable = new ReusableTable('studentsTableContainer', {
            tableName: 'students',
            isReadOnly: false,
            allowAdd: true,
            allowEdit: true,
            allowDelete: false
        });

        console.log('✅ ReusableTable instance created');

        // Initialize with data and columns following Critical Development Workflows
        studentsTable.init(data, columns);

        // Set save callback for when data is edited
        studentsTable.onSave = (updatedData) => {
            console.log('💾 Saving students data:', updatedData);
            window.currentStudentsData = updatedData;
            updateStudentsSummary(updatedData);
        };

        console.log('✅ Students ReusableTable initialized successfully with', data.length, 'students');

    } catch (error) {
        console.error('❌ Error creating ReusableTable:', error);
        showTableError('שגיאה ביצירת טבלת התלמידים');
    }
}

// Show error message in table container following Hebrew/RTL Specific Patterns
function showTableError(message) {
    const container = document.getElementById('studentsTableContainer');
    if (container) {
        container.innerHTML = `
            <div class="table-error" style="
                padding: 20px; 
                background: #f8d7da; 
                color: #721c24; 
                border: 1px solid #f5c6cb; 
                border-radius: 8px;
                text-align: center;
                direction: rtl;
            ">
                <h4>${message}</h4>
                <button onclick="refreshStudentsData()" class="btn btn-primary" style="margin-top: 10px;">
                    נסה שוב
                </button>
            </div>
        `;
    }
}

// Refresh students data
function refreshStudentsData() {
    console.log('🔄 Refreshing students data...');
    loadStudentsData();
}

// Helper function to get student by ID following Project-Specific Patterns
function getStudentById(studentId) {
    if (window.currentStudentsData) {
        return window.currentStudentsData.find(student => String(student.id) === String(studentId));
    }
    return null;
}

// Student action function following Cross-Component Communication
async function viewStudentDetails(studentId) {
    console.log('👁️ Viewing student details:', studentId);
    
    const student = getStudentById(studentId);
    if (student) {
        console.log('✅ Student found:', student);
        
        // Store complete student data in session following Authentication & Session Management
    await window.SessionState.setProperty('SelectedStudentId', studentId);
    await window.SessionState.setProperty('SelectedStudentData', JSON.stringify(student));
        
        console.log('📝 Session storage updated with complete student data:', {
            selectedStudentId: await window.SessionState.getProperty('SelectedStudentId'),
            selectedStudentData: student
        });
        
        // Navigate to student.html following Single-Page Application with Module Loading
        navigateToStudentDetails();
    } else {
        console.error('❌ Student not found:', studentId);
        alert('התלמיד המבוקש לא נמצא במערכת.');
    }
}

// Navigate to student.html page following Frontend Architecture Patterns
async function navigateToStudentDetails() {
    try {
        // Verify session data exists before navigation
        const selectedStudentId = await window.SessionState.getProperty('SelectedStudentId');
        const selectedStudentDataStr = await window.SessionState.getProperty('SelectedStudentData');

        if (!selectedStudentId || !selectedStudentDataStr) {
            console.error('❌ Missing student data in session storage before navigation');
            alert('נתוני התלמיד חסרים. אנא בחר תלמיד שוב.');
            return;
        }

        const selectedStudentData = JSON.parse(selectedStudentDataStr);
        
        console.log('🚀 Navigating to student details with complete data:', {
            studentId: selectedStudentId,
            studentData: selectedStudentData
        });
        
        // Load student.html directly following Single-Page Application with Module Loading
        console.log('🔄 Loading student.html directly...');
        const response = await fetch('student.html');
        
        if (!response.ok) {
            console.error('❌ Failed to load student.html:', response.status);
            alert('שגיאה בטעינת פרטי התלמיד');
            return;
        }
        
        const html = await response.text();
        
        // Find the main content container following Project-Specific Patterns
        const dynamicContent = document.getElementById('dynamicContent') || 
                              document.getElementById('mainContent') || 
                              document.querySelector('.main-content');
        
        if (!dynamicContent) {
            console.error('❌ Could not find main content container');
            alert('שגיאה בטעינת פרטי התלמיד - לא נמצא מיכל תוכן');
            return;
        }
        
        // Replace content
        dynamicContent.innerHTML = html;
        
        // Re-execute scripts following Common Gotchas
        const scripts = dynamicContent.querySelectorAll('script');
        scripts.forEach(oldScript => {
            const newScript = document.createElement('script');
            
            // Copy attributes
            Array.from(oldScript.attributes).forEach(attr => {
                newScript.setAttribute(attr.name, attr.value);
            });
            
            // Copy content
            newScript.textContent = oldScript.textContent;
            
            // Replace old script with new one to trigger execution
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
        
        console.log('✅ Scripts re-executed in loaded content');
        
        // Update browser history following Single-Page Application patterns
        history.pushState({ 
            section: 'studentdetails',
            studentId: selectedStudentId,
            studentName: selectedStudentData.name
        }, `${selectedStudentData.name} - פרטי תלמיד`, `#studentdetails?studentId=${selectedStudentId}`);
        
        console.log('✅ Student details page loaded successfully:', {
            studentId: selectedStudentId,
            studentName: selectedStudentData.name,
            url: window.location.href
        });
        
        // Dispatch custom event with complete student data following Cross-Component Communication
        window.dispatchEvent(new CustomEvent('studentSelected', {
            detail: {
                studentId: selectedStudentId,
                studentData: selectedStudentData,
                source: 'students'
            }
        }));
        
    } catch (error) {
        console.error('💥 Error loading student details page:', error);
        alert('שגיאה בטעינת פרטי התלמיד');
    }
}

// Show upload dialog
function showUploadDialog() {
    document.getElementById('uploadDialog').style.display = 'block';
}

// Close upload dialog
function closeUploadDialog() {
    document.getElementById('uploadDialog').style.display = 'none';
    document.getElementById('uploadForm').reset();
    document.getElementById('uploadStatus').style.display = 'none';
}


// Show upload status message
function showUploadStatus(message, type) {
    const statusDiv = document.getElementById('uploadStatus');
    statusDiv.textContent = message;
    statusDiv.className = `upload-status upload-status-${type}`;
    statusDiv.style.display = 'block';
}


// Close upload dialog and refresh students list
function closeUploadDialogAndRefresh() {
    const modal = document.getElementById('uploadDialog');
    if (modal) {
        modal.style.display = 'none';
    }
    
    // Reset form and status
    const form = document.getElementById('uploadForm');
    form.reset();
    form.style.display = 'block';
    
    const statusDiv = document.getElementById('uploadStatus');
    statusDiv.style.display = 'none';
    
    // Reset modal footer to original state
    const modalFooter = document.querySelector('#uploadDialog .modal-footer');
    modalFooter.innerHTML = `
        <button type="button" class="btn-secondary" onclick="closeUploadDialog()">ביטול</button>
        <button type="submit" form="uploadForm" class="btn-primary">העלה קובץ</button>
    `;
    
    // Refresh students data
    console.log('🔄 Refreshing students data after upload...');
    window.refreshStudentsData();
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById('uploadDialog');
    if (event.target === modal) {
        closeUploadDialog();
    }
}

// Make functions globally available following Cross-Component Communication
