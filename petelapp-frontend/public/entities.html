<!-- entities.html -->
<div class="school-title-section">
  <h1 class="page-title">רשימת ישויות (לא מוסדות חינוך)</h1>
</div>

<div class="main-container">
  <div class="context-buttons-section">
    <button class="context-btn" onclick="window.navigateTo('maindashboard')">חזרה ללוח בקרה</button>
    <button class="context-btn" id="addEntityBtn">הוסף ישות</button>
  </div>

  <div class="students-content">
    <div class="content-card">
      <div class="table-container" id="entitiesTableContainer">
        <div class="loading-spinner">טוען...</div>
      </div>
    </div>
  </div>
</div>

<script>
  window.entitiesTable = window.entitiesTable || null;

  async function initEntitiesPage() {
    await loadEntitiesList();
    setupAddEntity();
  }

  async function loadEntitiesList() {
    try {
      const resp = await fetch(AppConfig.getApiUrl('entities/non-schools'), AppConfig.getDefaultFetchOptions());
      if (!resp.ok) throw new Error('Failed to load entities');
      const data = await resp.json();

      const columns = [
        { key: 'id', label: 'מזהה', sortable: true, readOnly: true },
        { key: 'name', label: 'שם', sortable: true, readOnly: false },
        { key: 'entityTypeDescription', label: 'סוג ישות', sortable: true, readOnly: true },
        { key: 'ownerName', label: 'בעלות', sortable: true, readOnly: true },
        { key: 'isActive', label: 'פעיל', sortable: true, readOnly: true },
        {
          key: 'actions',
          label: 'פעולות',
          sortable: false,
          readOnly: true,
          render: (row) => `
            <button class="btn-icon" title="עריכה" onclick="editEntity('${row.id}')">
              <img src="edit_icon.png" alt="עריכה" class="action-icon-natural">
            </button>
            <button class="btn-icon" title="מחיקה" onclick="deleteEntity('${row.id}')">
              <img src="delete_icon.png" alt="מחיקה" class="action-icon-natural">
            </button>
          `
        }
      ];

      window.entitiesTable = new ReusableTable('entitiesTableContainer', {
        tableName: 'entities',
        isReadOnly: false,
        allowAdd: false,
        allowEdit: true,
        allowDelete: true
      });
      window.entitiesTable.init(data, columns);
    } catch (err) {
      console.error('❌ Error loading entities:', err);
      const container = document.getElementById('entitiesTableContainer');
      if (container) container.innerHTML = '<div>שגיאה בטעינת ישויות</div>';
    }
  }

  function setupAddEntity() {
    const btn = document.getElementById('addEntityBtn');
    if (!btn) return;
    btn.onclick = async () => {
      const name = prompt('הזן שם ישות:');
      if (!name) return;

      // Minimal add form using allowed entity types (3,5,6). Owner defaults to current session entity.
      try {
        const allowedType = 3; // default choice; user can refine later in details screen
        //  Get entityId from session data directly
        const session = await window.SessionState.getSession();
        const sessionEntityId = session?.entityId ? parseInt(session.entityId) : null;

        const payload = { name, entityTypeId: allowedType, ownerId: sessionEntityId ? parseInt(sessionEntityId) : null };
        const resp = await fetch(AppConfig.getApiUrl('entities'), {
          method: 'POST',
          headers: { ...AppConfig.getDefaultFetchOptions().headers },
          body: JSON.stringify(payload)
        });
        const result = await resp.json();
        if (!resp.ok || !result?.success) {
          alert(result?.message || 'שגיאה ביצירת ישות');
          return;
        }
        // Navigate to details for editing full info
        await window.SessionState.setProperty('ViewEntityId', String(result.data.entityId));
        await window.navigateTo('entitydetails');
      } catch (err) {
        console.error('❌ Error adding entity:', err);
        alert('שגיאה ביצירת ישות');
      }
    };
  }

  async function editEntity(id) {
    await window.SessionState.setProperty('ViewEntityId', String(id));
    await window.navigateTo('entitydetails');
  }

  async function deleteEntity(id) {
    if (!confirm('האם למחוק ישות זו? הפעולה תהפוך את הישות ללא פעילה.')) return;
    try {
      const resp = await fetch(AppConfig.getApiUrl(`entities/${id}`), {
        method: 'DELETE',
        headers: { ...AppConfig.getDefaultFetchOptions().headers }
      });
      const result = await resp.json();
      if (resp.ok && result?.success) {
        await loadEntitiesList();
      } else {
        alert(result?.message || 'שגיאה במחיקה');
      }
    } catch (err) {
      console.error('❌ Error deleting entity:', err);
      alert('שגיאה במחיקה');
    }
  }

  function cleanupEntitiesPage() {
    try {
      if (window.entitiesTable && typeof window.entitiesTable.cleanup === 'function') {
        window.entitiesTable.cleanup();
      }
      window.entitiesTable = null;
      const container = document.getElementById('entitiesTableContainer');
      if (container) container.innerHTML = '<div class="loading-spinner">טוען...</div>';
    } catch (err) {
      console.error('❌ Error during cleanup:', err);
    }
  }

  document.addEventListener('DOMContentLoaded', initEntitiesPage);
  window.cleanupEntitiesPage = cleanupEntitiesPage;
</script>
