        // Update the loadSchoolTitle function in schooldetails.html
        async function loadSchoolTitle() {
            console.log('📋 Loading school title from SessionState...');

            try {
                // ✅ Use centralized SessionState
                const session = await window.SessionState.getSession();
                const yearValue = await window.SessionState.getProperty('SelectedYearValue');

                let schoolName = session.entityName;

             //   if (parseInt(session.entityTypeId, 10) === 5) {
                    // Multi-school network - get selected school name
                    const selectedSchoolName = await window.SessionState.getProperty('SelectedSchoolName');
                    if (selectedSchoolName) {
                        schoolName = selectedSchoolName;
                    }
              //  }

                console.log('🏫 School context:', { schoolName, yearValue });

                const titleElement = document.getElementById('schoolTitle');
                const yearElement = document.getElementById('schoolDetailsYearDisplay');
                
                if (titleElement) {
                    titleElement.textContent = schoolName;
                    console.log('✅ School title updated via SessionState');
                }
                
                if (yearElement && yearValue) {
                    yearElement.textContent = yearValue;
                }

            } catch (error) {
                console.error('❌ Error loading school title:', error);
                const titleElement = document.getElementById('schoolTitle');
                if (titleElement) {
                    titleElement.textContent = 'לוח בקרה של בית ספר';
                }
            }
        }


        // Generic Collapsible Cards - Auto-initialize ALL cards

        function initializeCollapsibleCards() {
            console.log('🎴 Initializing generic collapsible cards...');

            document.querySelectorAll('.detail-card').forEach(card => {
                const header = card.querySelector('.detail-card-header');
                const toggle = card.querySelector('.collapse-toggle');

                if (!header || !toggle) return;

                // ✅ Check if already initialized to prevent duplicate listeners
                if (header.dataset.initialized === 'true') {
                    console.log('⚠️ Card already initialized, skipping:', card.querySelector('.detail-card-title')?.textContent);
                    return;
                }

                // ✅ Mark as initialized
                header.dataset.initialized = 'true';

                // Get action buttons
                const editButton = card.querySelector('.btn-icon[id^="edit"]');
                const addButton = card.querySelector('.btn-icon[id^="add"]');

                // ✅ Check if card is currently expanded or collapsed
                const isExpanded = !card.classList.contains('collapsed');

                // Show/hide buttons based on initial state
                if (addButton) addButton.style.display = 'none'; // Always hide add button initially

                if (editButton) {
                    // ✅ Show edit button if card is already expanded, hide if collapsed
                    editButton.style.display = isExpanded ? 'inline-flex' : 'none';
                }

                // ✅ Set correct toggle symbol based on initial state
                toggle.textContent = isExpanded ? '▲' : '▼';

                // ✅ SEPARATE HANDLER 1: Toggle button click
                toggle.addEventListener('click', function (e) {
                    e.stopPropagation(); // Prevent bubbling to header
                    toggleCardExpansion(card, toggle, editButton, addButton);
                });

                // ✅ SEPARATE HANDLER 2: Header click (excluding buttons)
                header.addEventListener('click', function (e) {
                    // Don't toggle if clicking any button
                    if (e.target.closest('.btn-icon')) {
                        console.log('🚫 Click on button - ignoring');
                        return;
                    }

                    toggleCardExpansion(card, toggle, editButton, addButton);
                });
            });

            console.log('✅ Generic collapsible cards initialized');
        }

        // ✅ SEPARATE FUNCTION: Toggle card expansion logic
        function toggleCardExpansion(card, toggle, editButton, addButton) {
            const isCollapsed = card.classList.contains('collapsed');

            console.log('🎴 Toggling card:', {
                title: card.querySelector('.detail-card-title')?.textContent,
                currentlyCollapsed: isCollapsed,
                willExpand: isCollapsed
            });

            if (isCollapsed) {
                // Expand
                card.classList.remove('collapsed');
                card.classList.add('expanded');
                toggle.textContent = '▲';

                // Show edit button when expanded
                if (editButton) {
                    editButton.style.display = 'inline-flex';
                }

                // Only show add button if edit mode is active for this card
                if (addButton) {
                    let isEditMode = false;

                    if (addButton.id === 'addClassBtn') {
                        isEditMode = window.schoolClassesEditMode;
                    } else if (addButton.id === 'addTrackBtn') {
                        isEditMode = window.schoolTracksEditMode;
                    } else if (addButton.id === 'addAdditionalStudyBtn') {
                        isEditMode = window.schoolAdditionalStudyEditMode;
                    }

                    addButton.style.display = isEditMode ? 'inline-flex' : 'none';
                }

                console.log('✅ Card EXPANDED');
            } else {
                // Collapse
                card.classList.remove('expanded');
                card.classList.add('collapsed');
                toggle.textContent = '▼';

                // Hide all action buttons when collapsed
                if (editButton) {
                    editButton.style.display = 'none';
                }
                if (addButton) {
                    addButton.style.display = 'none';
                }

                console.log('✅ Card COLLAPSED');
            }
        }

        // Setup edit classes button - TOGGLE ACTIONS COLUMN VISIBILITY
        function setupEditClassesButton() {
            const editBtn = document.getElementById('editClassesBtn');
            const addBtn = document.getElementById('addClassBtn');

            if (editBtn) {
                editBtn.onclick = function (event) {
                    event.stopPropagation();

                    window.schoolClassesEditMode = !window.schoolClassesEditMode;


                    // Toggle actions column visibility
                    const actionsColumn = document.querySelectorAll('[data-column="actions"]');
                    actionsColumn.forEach(cell => {
                        cell.style.display = window.schoolClassesEditMode ? '' : 'none';
                    });

                    // Toggle add button ONLY if card is expanded
                    if (addBtn) {
                        const card = editBtn.closest('.detail-card');
                        const isExpanded = card && card.classList.contains('expanded');
                        addBtn.style.display = (window.schoolClassesEditMode && isExpanded) ? 'inline-flex' : 'none';
                    }

                    // Update button icon/text
                    const btnImg = editBtn.querySelector('img');
                    if (btnImg) {
                        btnImg.alt = window.schoolClassesEditMode ? 'סגור עריכה' : 'עריכה';
                    }

                    console.log('✏️ Classes edit mode toggled:', window.schoolClassesEditMode);
                };
                console.log('✅ Edit classes button initialized');
            } else {
                console.warn('⚠️ Edit classes button not found');
            }
        }

        // Load school classes
        async function loadSchoolClasses() {
            console.log('📚 Loading school classes...');

            const container = document.getElementById('schoolClassesContent');
            if (!container) {
                console.error('❌ schoolClassesContent container not found');
                return;
            }

            try {
                const selectedSchoolYearId = await sessionManager.getSessionProperty('SelectedSchoolYearId');

                if (!selectedSchoolYearId) {
                    console.error('❌ No school year ID in session');
                    container.innerHTML = '<p style="color: #721c24; padding: 20px;">לא נמצא מזהה שנת לימודים</p>';
                    return;
                }

                const authToken = sessionStorage.getItem('authToken');
                if (!authToken) {
                    console.error('❌ No auth token found');
                    container.innerHTML = '<p style="color: #721c24; padding: 20px;">נדרש אימות. אנא התחבר מחדש.</p>';
                    return;
                }

                container.innerHTML = '<div class="loading-spinner">טוען כיתות...</div>';

                const apiUrl = AppConfig.getApiUrl(`schoolClasses/by-school-year/${selectedSchoolYearId}`);
                console.log('🌐 Making API call to:', apiUrl);

                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log('📚 School classes received:', result);

                    if (result.success && result.data) {
                        displaySchoolClasses(result.data);
                    } else {
                        throw new Error('Invalid response format');
                    }
                } else {
                    const errorText = await response.text();
                    console.error('❌ API Error:', response.status, errorText);
                    container.innerHTML = `<div class="alert alert-danger">שגיאה בטעינת כיתות: ${response.status}</div>`;
                }
            } catch (error) {
                console.error('💥 Exception in loadSchoolClasses:', error);
                container.innerHTML = '<div class="alert alert-danger">שגיאה בטעינת כיתות בית הספר</div>';
            }
        }



        window.adjustTime = function (field, delta) {
            const hourInput = document.getElementById('endHour');
            const minuteInput = document.getElementById('endMinute');

            if (!hourInput || !minuteInput) return;

            let hour = parseInt(hourInput.value) || 0;
            let minute = parseInt(minuteInput.value) || 0;

            if (field === 'hour') {
                hour += delta;
                if (hour < 0) hour = 23;
                if (hour > 23) hour = 0;
                hourInput.value = hour.toString().padStart(2, '0');
            } else if (field === 'minute') {
                minute += delta;
                if (minute < 0) minute = 59;
                if (minute > 59) minute = 0;
                minuteInput.value = minute.toString().padStart(2, '0');
            }
        };

        window.clearEndTime = function () {
            const hourInput = document.getElementById('endHour');
            const minuteInput = document.getElementById('endMinute');

            if (hourInput) hourInput.value = '12';
            if (minuteInput) minuteInput.value = '00';
        };

        function getDefaultEndHour() {
            // Find attribute type 8 from loaded school attributes
            const endHourAttribute = window.lastSchoolAttributesData?.find(
                attr => attr.attributeTypeId === 8
            );

            if (endHourAttribute && endHourAttribute.value) {
                console.log('✅ Found end hour attribute:', endHourAttribute.value);
                return endHourAttribute.value; // Format: "HH:MM:SS" or "HH:MM"
            }

            console.log('ℹ️ No end hour attribute found, using default 13:00');
            return '13:00:00';
        }

        // unified add/edit class modal with time spinners
        async function showClassModal(classData = null) {
            console.log('📋 Opening class modal:', classData ? 'EDIT' : 'ADD');

            const gradeLevels = [
                'א', 'ב', 'ג', 'ד', 'ה', 'ו',
                'ז', 'ח', 'ט', 'י', 'י״א', 'י״ב'
            ];

            // ✅ Parse existing endHour from TimeOnly (HH:MM:SS format from backend)
            let initialHour = 13;
            let initialMinute = 0;

            if (classData && classData.endHour) {
                // Backend returns TimeOnly as string "HH:MM:SS"
                const timeParts = classData.endHour.split(':');
                if (timeParts.length >= 2) {
                    initialHour = parseInt(timeParts[0]) || 13;
                    initialMinute = parseInt(timeParts[1]) || 0;
                }
                console.log('✏️ Using existing class end hour:', classData.endHour);
            } else {
                // ADD MODE: Use default from attribute type 8
                const defaultEndHour = getDefaultEndHour();
                const timeParts = defaultEndHour.split(':');
                if (timeParts.length >= 2) {
                    initialHour = parseInt(timeParts[0]) || 13;
                    initialMinute = parseInt(timeParts[1]) || 0;
                }
                console.log('➕ Using default end hour from attributes:', defaultEndHour);
            }

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';

            const dialog = document.createElement('div');
            dialog.className = 'modal-content modal-small';

            const options = gradeLevels.map(level =>
                `<option value="${level}" ${classData && classData.level === level ? 'selected' : ''}>${level}</option>`
            ).join('');

            dialog.innerHTML = `
        <div class="modal-header">
            <h3>${classData ? 'עריכת כיתה' : 'הוספת כיתה חדשה'}</h3>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="classLevel">שכבה:</label>
                <select id="classLevel" class="form-control">
                    <option value="">בחר שכבה...</option>
                    ${options}
                </select>
            </div>
            
            <div class="form-group">
                <label for="classNumber">מספר כיתה:</label>
                <input type="text" id="classNumber" class="form-control" placeholder="הזן מספר כיתה" 
                    value="${classData ? classData.classNumber : ''}">
            </div>
            
            <div class="form-group">
                <label>
                    שעת סיום:
                    <span class="text-muted" style="font-size: 0.85em;">(אופציונלי)</span>
                </label>
                
                <div class="d-flex gap-2 align-center" style="direction: ltr;">
                    <!-- Hour Spinner -->
                    <div class="d-flex flex-column align-center">
                        <button type="button" class="time-spinner-btn" onclick="adjustTime('hour', 1)">▲</button>
                        <input type="text" id="endHour" value="${initialHour.toString().padStart(2, '0')}" maxlength="2" readonly class="time-input">
                        <button type="button" class="time-spinner-btn" onclick="adjustTime('hour', -1)">▼</button>
                        <small class="text-muted mt-1">שעה</small>
                    </div>
                    
                    <span class="time-separator">:</span>
                    
                    <!-- Minute Spinner -->
                    <div class="d-flex flex-column align-center">
                        <button type="button" class="time-spinner-btn" onclick="adjustTime('minute', 1)">▲</button>
                        <input type="text" id="endMinute" value="${initialMinute.toString().padStart(2, '0')}" maxlength="2" readonly class="time-input">
                        <button type="button" class="time-spinner-btn" onclick="adjustTime('minute', -1)">▼</button>
                        <small class="text-muted mt-1">דקות</small>
                    </div>
                    
                    <!-- Clear Button -->
                    <button type="button" onclick="clearEndTime()" class="btn-secondary" style="margin-right: 10px;">נקה</button>
                </div>
                
                <small class="text-muted d-block mt-1" style="direction: rtl;">
                    לדוגמה: 14:30
                </small>
            </div>
            
            <input type="hidden" id="classRecordId" value="${classData ? classData.id : ''}">
        </div>
        <div class="modal-footer">
            <button id="classOkBtn" class="dialog-btn save">אישור</button>
            <button id="classCancelBtn" class="dialog-btn cancel">ביטול</button>
        </div>
    `;

            overlay.appendChild(dialog);
            document.body.appendChild(overlay);


            setTimeout(() => document.getElementById('classLevel')?.focus(), 100);

            // OK button handler
            document.getElementById('classOkBtn').onclick = async () => {
                let level = document.getElementById('classLevel').value.trim();
                const classNumber = document.getElementById('classNumber').value.trim();
                const hour = document.getElementById('endHour').value;
                const minute = document.getElementById('endMinute').value;
                const recordId = document.getElementById('classRecordId').value;

                if (!level || !classNumber) {
                    alert('נא למלא את כל השדות הנדרשים');
                    return;
                }


                    // ✅ Normalize: Convert ASCII quotes to Hebrew Gershayim before saving
                level = level.replace(/"/g, '״').replace(/'/g, '׳');
                
                console.log('💾 Saving class with normalized level:', level);
                
                // ✅ Check if another class exists with same level and number
                const exists = window.lastSchoolClassesData.some(cls =>
                    cls.id !== parseInt(recordId || 0) &&
                    cls.level === level &&
                    cls.classNumber === classNumber
                );

                if (exists) {
                    alert(`כיתה ${level} ${classNumber} כבר קיימת`);
                    return;
                }

                // ✅ Build TimeOnly string in HH:MM:SS format (PostgreSQL expects this)
                const endHourValue = `${hour}:${minute}:00`;

                document.body.removeChild(overlay);

                // ✅ Call appropriate save function
                if (recordId) {
                    await updateClassInDatabase(parseInt(recordId), level, classNumber, endHourValue);
                } else {
                    await addClassToDatabase(level, classNumber, endHourValue);
                }
            };

            // Cancel button handler
            document.getElementById('classCancelBtn').onclick = () => {
                document.body.removeChild(overlay);
            };

            // ESC key handler
            const escHandler = (e) => {
                if (e.key === 'Escape' && document.body.contains(overlay)) {
                    document.body.removeChild(overlay);
                    document.removeEventListener('keydown', escHandler);
                }
            };

                        alert(`לא ניתן למחוק כיתה זו. יש תלמידים המשויכים לכיתה.`);

                    await addTranslatorToDatabase(personData.id, hours);
                }
            };

            // Cancel button
            document.getElementById('hoursCancelBtn').onclick = () => {
                document.body.removeChild(overlay);

            // ESC key handler

                    document.body.removeChild(overlay);

                console.error('❌ schoolTracksContent container not found');

            }

            try {
                const selectedSchoolYearId = await sessionManager.getSessionProperty('SelectedSchoolYearId');

                if (!selectedSchoolYearId) {

                    levelSelect.innerHTML = '<option value="">טוען רמות...</option>';
                    levelSelect.disabled = true;

                    if (hoursConstraint) hoursConstraint.textContent = '';
                    if (hoursError) hoursError.style.display = 'none';

                    if (!trackId) {
                        levelSelect.innerHTML = '<option value="">בחר תחילה מגמה...</option>';
                        return;
                    }

                    try {
                        // Load track levels for selected track
                        const levelsResponse = await fetch(AppConfig.getApiUrl(`trackLevels/by-track/${trackId}`), {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                            }
                        });

                        if (!levelsResponse.ok) {
                            throw new Error('Failed to load track levels');
                        }

                        const levelsResult = await levelsResponse.json();
                        const levels = levelsResult.success ? levelsResult.data : [];

                        if (levels.length === 0) {
                            levelSelect.innerHTML = '<option value="">אין רמות זמינות</option>';
                            levelSelect.disabled = true;
                            return;
                        }

                        // ✅ Store constraints for each level
                        window.trackLevelConstraints.clear();
                        levels.forEach(l => {
                            window.trackLevelConstraints.set(l.id, {
                                minHours: l.minHours,
                                maxHours: l.maxHours
                            });
                        });

                        const levelOptions = levels.map(l =>
                            `<option value="${l.id}" data-min="${l.minHours}" data-max="${l.maxHours || ''}">
                            ${l.levelName || l.level || ''}
                        </option>`
                        ).join('');

                        levelSelect.innerHTML = `<option value="">בחר רמת מגמה...</option>${levelOptions}`;
                        levelSelect.disabled = false;

                        // ✅ If editing, set the selected level
                        if (trackData && trackData.trackLevelId) {
                            levelSelect.value = trackData.trackLevelId;
                            if (levelSelect.onchange) {
                                levelSelect.onchange();
                            }
                        }

                    } catch (error) {
                        console.error('❌ Error loading track levels:', error);
                        levelSelect.innerHTML = '<option value="">שגיאה בטעינת רמות</option>';
                        levelSelect.disabled = true;
                    }
                };

                // ✅ Setup level selection change handler - update hours constraint display
                levelSelect.onchange = function () {
                    const levelId = parseInt(this.value);
                    if (hoursError) hoursError.style.display = 'none';

                    if (!levelId) {
                        if (hoursConstraint) hoursConstraint.textContent = '';
                        return;
                    }

                    const constraints = window.trackLevelConstraints.get(levelId);
                    if (constraints && hoursConstraint) {
                        const minText = `מינימום: ${constraints.minHours}`;
                        const maxText = constraints.maxHours ? `, מקסימום: ${constraints.maxHours}` : '';
                        hoursConstraint.textContent = `(${minText}${maxText})`;
                    }
                };

                // ✅ Validate hours on input
                hoursInput.oninput = function () {
                    const levelId = parseInt(levelSelect.value);
                    if (!levelId) return;

                    const hours = parseInt(this.value);
                    const constraints = window.trackLevelConstraints.get(levelId);

                    if (!constraints || isNaN(hours) || !hoursError) {
                        if (hoursError) hoursError.style.display = 'none';
                        return;
                    }

                    if (hours < constraints.minHours) {
                        hoursError.textContent = `מספר השעות חייב להיות לפחות ${constraints.minHours}`;
                        hoursError.style.display = 'block';
                    } else if (constraints.maxHours && hours > constraints.maxHours) {
                        hoursError.textContent = `מספר השעות לא יכול לעבור ${constraints.maxHours}`;
                        hoursError.style.display = 'block';
                    } else {
                        hoursError.style.display = 'none';
                    }
                };

                // ✅ If editing with pre-selected class, trigger class change to load tracks
                if (trackData && trackData.classId) {
                    classSelect.value = trackData.classId;
                    await classSelect.onchange.call(classSelect);
                }

                // OK button handler with validation and save
                document.getElementById('trackOkBtn').onclick = async () => {
                    const classId = document.getElementById('trackClass').value;
                    const trackId = document.getElementById('trackTrack').value;
                    const levelId = document.getElementById('trackLevel').value;
                    const hours = parseInt(document.getElementById('trackHours').value);
                    const recordId = document.getElementById('trackRecordId').value;

                    // Validate required fields
                    if (!classId || !trackId || !hours) {
                        alert('נא למלא את כל השדות הנדרשים');
                        return;
                    }

                    // ✅ Validate hours against track level constraints
                    if (levelId) {
                        const constraints = window.trackLevelConstraints.get(parseInt(levelId));
                        if (constraints) {
                            if (hours < constraints.minHours) {
                                alert(`מספר השעות חייב להיות לפחות ${constraints.minHours}`);
                                return;
                            }
                            if (constraints.maxHours && hours > constraints.maxHours) {
                                alert(`מספר השעות לא יכול לעבור ${constraints.maxHours}`);
                                return;
                            }
                        }
                    }

                    console.log('📝 Saving track:', {
                        recordId: recordId || null,
                        schoolYearId: selectedSchoolYearId,
                        trackId,
                        trackLevelId: levelId || null,
                        classId,
                        weeklyHours: hours,
                        isEdit: !!recordId
                    });

                    try {
                        const url = recordId
                            ? AppConfig.getApiUrl(`schoolTracks/${recordId}`)
                            : AppConfig.getApiUrl('schoolTracks');

                        const method = recordId ? 'PUT' : 'POST';

                        const payload = {
                            schoolYearId: parseInt(selectedSchoolYearId),
                            trackId: parseInt(trackId),
                            trackLevelId: levelId ? parseInt(levelId) : null,
                            classId: parseInt(classId),
                            weeklyHours: hours
                        };

                        if (recordId) {
                            payload.id = parseInt(recordId);
                        }

                        const response = await fetch(url, {
                            method: method,
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                            },
                            body: JSON.stringify(payload)
                        });

                        const result = await response.json();

                        if (response.ok && result.success) {
                            console.log('✅ Track saved successfully');
                            document.body.removeChild(overlay);

                            // Refresh tracks table
                            await loadSchoolTracks();

                            // Restore edit mode if was active

                                setTimeout(() => {
                                    const actionsColumn = document.querySelectorAll('#tracksTableContainer [data-column="actions"]');
                                    actionsColumn.forEach(cell => cell.style.display = '');
                                    const addBtn = document.getElementById('addTrackBtn');

                        } else {
                            console.error('❌ Failed to save track:', result);
                            alert(result.message || 'שגיאה בשמירת המגמה');
                        }

                    } catch (error) {
                        console.error('💥 Error saving track:', error);
                        alert('שגיאה בשמירת המגמה');

        // Setup council autocomplete dropdown
        function setupCouncilAutocomplete() {
            const searchInput = document.getElementById('schoolCouncilSearch');
            const hiddenInput = document.getElementById('schoolCouncil');

            if (!searchInput || !hiddenInput) return;

            console.log('🔍 Setting up council autocomplete');

            // Create dropdown container
            let dropdown = document.getElementById('councilDropdown');
            if (dropdown) {
                dropdown.remove();
            }

            dropdown = document.createElement('div');
            dropdown.id = 'councilDropdown';
            dropdown.style.cssText = `
                position: fixed;
                background: white;
                border: 1px solid #dee2e6;
                border-radius: 4px;
                max-height: 200px;
                overflow-y: auto;
                display: none;
                z-index: 9999;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                direction: rtl;
            `;
            document.body.appendChild(dropdown);

            let selectedIndex = -1;

            // Position dropdown below input
            function positionDropdown() {
                const rect = searchInput.getBoundingClientRect();
                dropdown.style.top = `${rect.bottom + window.scrollY}px`;
                dropdown.style.left = `${rect.left + window.scrollX}px`;
                dropdown.style.width = `${rect.width}px`;
            }

            // Filter and show suggestions
            function showSuggestions(query) {
                if (!query || query.length < 1) {
                    dropdown.style.display = 'none';
                    return;
                }

                const filtered = window.councils.filter(c =>
                    c.councilName.includes(query) ||
                    (c.councilFullName && c.councilFullName.includes(query))
                ).slice(0, 10);

                if (filtered.length === 0) {
                    dropdown.innerHTML = '<div style="padding: 8px; color: #6c757d;">לא נמצאו תוצאות</div>';
                    dropdown.style.display = 'block';
                    positionDropdown();
                    return;
                }

                dropdown.innerHTML = filtered.map((c, index) => `
                    <div class="council-option" 
                         data-council-id="${c.id}"
                         data-council-name="${c.councilName}"
                         data-index="${index}"
                         style="
                             padding: 8px 12px;
                             cursor: pointer;
                             border-bottom: 1px solid #f0f0f0;
                             background: ${index === selectedIndex ? '#f8f9fa' : 'white'};
                         "
                         onmouseover="this.style.background='#f8f9fa'"
                         onmouseout="this.style.background='${index === selectedIndex ? '#f8f9fa' : 'white'}'">
                        ${c.councilName}
                    </div>
                `).join('');

                dropdown.style.display = 'block';
                positionDropdown();
                selectedIndex = -1;

                // Add click handlers
                dropdown.querySelectorAll('.council-option').forEach(option => {
                    option.onclick = function () {
                        const councilId = this.dataset.councilId;
                        const councilName = this.dataset.councilName;
                        selectCouncil(councilId, councilName);
                    };
                });
            }

            // Select a council
            function selectCouncil(id, name) {
                searchInput.value = name;
                hiddenInput.value = id;
                dropdown.style.display = 'none';
                selectedIndex = -1;

                // Trigger change event
                window.hasUnsavedSchoolDetailsChanges = true;
                updateSchoolDetailsCardTitle();

                console.log('✅ Council selected:', name, 'ID:', id);
            }

            // Input event - filter as user types
            searchInput.addEventListener('input', function () {
                const query = this.value.trim();
                if (!query) {
                    hiddenInput.value = '';
                }
                showSuggestions(query);
            });

            // Focus event - show dropdown if has value
            searchInput.addEventListener('focus', function () {
                const query = this.value.trim();
                if (query) {
                    showSuggestions(query);
                }
            });

            // Keyboard navigation
            searchInput.addEventListener('keydown', function (e) {
                const options = dropdown.querySelectorAll('.council-option');

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (options.length > 0) {
                        selectedIndex = Math.min(selectedIndex + 1, options.length - 1);
                        options.forEach((opt, idx) => {
                            opt.style.background = idx === selectedIndex ? '#f8f9fa' : 'white';
                        });
                        options[selectedIndex]?.scrollIntoView({ block: 'nearest' });
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (options.length > 0) {
                        selectedIndex = Math.max(selectedIndex - 1, 0);
                        options.forEach((opt, idx) => {
                            opt.style.background = idx === selectedIndex ? '#f8f9fa' : 'white';
                        });
                        options[selectedIndex]?.scrollIntoView({ block: 'nearest' });
                    }
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (selectedIndex >= 0 && options[selectedIndex]) {
                        const option = options[selectedIndex];
                        selectCouncil(option.dataset.councilId, option.dataset.councilName);
                    }
                } else if (e.key === 'Escape') {
                    dropdown.style.display = 'none';
                    selectedIndex = -1;
                }
            });

            // Click outside to close
            document.addEventListener('click', function closeOnClickOutside(e) {
                if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.style.display = 'none';
                    selectedIndex = -1;
                }
            });

            // Update position on scroll/resize
            window.addEventListener('scroll', positionDropdown);
            window.addEventListener('resize', positionDropdown);

            console.log('✅ Council autocomplete setup complete');
        }

        // Export to window
        window.setupCouncilAutocomplete = setupCouncilAutocomplete;

                        principalId: originalData.principalId,
                        inspectorId: originalData.inspectorId,
                        contactPersonId: originalData.contactPersonId
                    }
                });

                const hasChanges =

                    (educationStage || null) !== originalData.educationStage ||
                    (councilId ? parseInt(councilId) : null) !== originalData.councilId ||

        async function saveSchoolAttributes() {
            console.log('💾 Saving school attributes...');

            try {
                const schoolYearId = await window.SessionState.getProperty('SelectedSchoolYearId');

                if (!schoolYearId) {
                    alert('לא נבחרה שנת לימודים');
                    return;
                }

                const changes = [];


                for (const attrType of window.schoolAttributeTypes) {
                    const element = document.getElementById(`attr_${attrType.id}`);
                    if (!element) continue;

                    const container = element.closest('.attribute-item');
                    const recordId = container?.dataset.recordId ? parseInt(container.dataset.recordId) : null;
                    const version = parseInt(container?.dataset.version || '0', 10);

                    let newValue;

                    if (attrType.attributeValueType === 'Boolean') {
                        newValue = element.checked ? 'true' : 'false';
                    } else if (attrType.attributeValueType === 'List') {
                        newValue = element.value;
                    } else {
                        newValue = element.value;
                    }

                    changes.push({
                        id: recordId,
                        attributeTypeId: attrType.id,
                        value: newValue,
                        version: version
                    });
                }

                console.log('📝 Sending changes to server:', {
                    schoolYearId: schoolYearId,
                    attributes: changes
                });

                const response = await fetch(AppConfig.getApiUrl('schoolAttributes/update'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        schoolYearId: parseInt(schoolYearId),
                        attributes: changes
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    console.log('✅ Attributes saved successfully:', result.data);

                    // Reload fresh data from server
                    await loadSchoolAttributes();

                    // ✅ Update translator card visibility
                    await toggleTranslatorsCardVisibility();

                    window.hasUnsavedAttributeChanges = false;

                    alert('שירותי בית הספר עודכנו בהצלחה');

                    alert(result.message || 'שגיאה בשמירת השירותים');

            } catch (error) {
                console.error('💥 Error saving school attributes:', error);
                alert('שגיאה בשמירת שירותי בית הספר');
            }
        }

                    const maxPriceContainer = document.getElementById('maxPriceContainer');
                    const maxPriceValue = document.getElementById('maxPriceValue');

                        currentMaxPrice = null;

                // ✅ Function to validate approved amount
                function validateApprovedAmount() {

                    const validationError = document.getElementById('validationError');
                    const validationErrorText = document.getElementById('validationErrorText');

                    // Clear previous errors
                    validationError.style.display = 'none';
                    approvedInput.style.borderColor = '#dee2e6';

                    if (!approvedAmount || approvedAmount === 0 || currentMaxPrice === null) {
                        return true; // No validation needed
                    }

                    if (approvedAmount > (currentMaxPrice * weeklyHours)) {
                        validationErrorText.textContent = `הסכום המאושר (₪${approvedAmount.toFixed(2)}) עולה על הסכום המקסימלי המותר (₪${(currentMaxPrice * weeklyHours).toFixed(2)})`;
                        validationError.style.display = 'block';
                        approvedInput.style.borderColor = '#dc3545';
                        return false;
                    }

                    return true;
                }

                    const weeklyHours = parseFloat(document.getElementById('programHours').value);
                    if (!isNaN(cost) && cost > 0 && !isNaN(weeklyHours) && weeklyHours > 0) {
                        const hourlyCost = ((cost / 35) / weeklyHours).toFixed(2);
                        hourlyCostInput.value = hourlyCost;
                    } else {
                        hourlyCostInput.value = '';
                    }
                });

                studentsInput.addEventListener('change', updateMaxPrice);

                        if (studentsResponse.ok) {

                            studentsInput.value = studentsInClass.length;

                            // Trigger max price update

                    const students = document.getElementById('programStudents').value;
                    const cost = document.getElementById('programCost').value;
                    const hourlyCost = document.getElementById('programHourlyCost').value;
                    const approved = document.getElementById('programApproved').value;

                    // Validate required fields
                    if (!classId || !name || !hours || !students) {

                        return;

                    // ✅ Validate approved amount before saving

                    const payload = {

                        classId: parseInt(classId),
                        name: name,
                        weeklyHours: parseInt(hours),
                        numberOfStudents: parseInt(students),
                        cost: cost ? parseFloat(cost) : null,
                        hourlyCost: hourlyCost ? parseFloat(hourlyCost) : null,
                        approvedAmount: approved ? parseFloat(approved) : null
                    };

                    try {
                        let response;
                        if (programData) {
                            // Update existing program
                            response = await fetch(AppConfig.getApiUrl(`schoolAdditionalStudyPrograms/${programData.id}`), {
                                method: 'PUT',
                                headers: {
                                    'Authorization': `Bearer ${authToken}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(payload)
                            });
                        } else {
                            // Create new program
                            response = await fetch(AppConfig.getApiUrl('schoolAdditionalStudyPrograms'), {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${authToken}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(payload)
                            });
                        }

                        const result = await response.json();

                        if (response.ok && result.success) {
                            document.body.removeChild(overlay);
                            await loadSchoolAdditionalStudyPrograms();
                            alert(result.message || 'תל״ן נשמר בהצלחה');
                        } else {
                            alert(result.message || 'שגיאה בשמירת תל״ן');
                        }
                    } catch (error) {
                        console.error('Error saving program:', error);
                        alert('שגיאה בשמירת תל״ן');
                    }
                };

                // Cancel button handler
                document.getElementById('programCancelBtn').onclick = () => {
                    document.body.removeChild(overlay);

                // ESC key handler
                const escHandler = (e) => {
                    if (e.key === 'Escape') {
                        document.body.removeChild(overlay);
                        document.removeEventListener('keydown', escHandler);
                    }
                };
                document.addEventListener('keydown', escHandler);

            } catch (error) {
                console.error('Error loading additional study modal:', error);
                alert('שגיאה בטעינת חלון תל״ן');
            }
        }

            window.schoolClassesEditMode = false;

            sessionStorage.setItem('navigationSource', 'schooldetails');

                // Fallback: Load dashboard page directly following Frontend Architecture Patterns
                loadPageDirectly('dashboard.html', 'dashboard', 'לוח הבקרה הראשי');
            }
        }

        // Generic page loading function following Frontend Architecture Patterns
        function loadPageDirectly(filename, section, displayName) {
            console.log(`🔄 Loading ${filename} page directly...`);

            // Find the main content container following Project-Specific Patterns
            const mainContainer = document.getElementById('dynamicContent') ||
                document.getElementById('mainContent') ||
                document.querySelector('.main-content') ||
                document.querySelector('main') ||
                document.body;

            if (!mainContainer) {
                console.error('❌ Could not find main content container');
                return;
            }

            // Show loading state following Hebrew/RTL Specific Patterns
            mainContainer.innerHTML = `
                <div class="loading-spinner" style="text-align: center; padding: 40px; direction: rtl;">
                    <div style="font-size: 1.2em; margin-bottom: 15px;">טוען ${displayName}...</div>
                    <div style="color: #6c757d;">אנא המתן...</div>
                </div>
            `;

            // Fetch and load page following API Communication Pattern
            fetch(filename)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    console.log(`✅ ${filename} page loaded successfully`);
                    mainContainer.innerHTML = html;

                    // Execute scripts safely following Critical Development Workflows
                    executeScriptsInContainer(mainContainer);

                    // Update browser history following Single-Page Application patterns
                    history.pushState({ section: section }, '', `#${section}`);

                    console.log(`✅ ${displayName} page loaded and initialized`);
                })
                .catch(error => {
                    console.error(`❌ Error loading ${filename} page:`, error);
                    showNavigationError(mainContainer, `שגיאה בטעינת ${displayName}`);
                });
        }

        /**
         * Generic toggle function for all editable cards
         * @param {string} cardName - Key from CARD_EDIT_CONFIG
         */
        function toggleCardEdit(cardName) {
            console.log(`🔄 Toggling edit mode for card: ${cardName}`);

            const config = CARD_EDIT_CONFIG[cardName];
            if (!config) {
                console.error(`❌ Unknown card name: ${cardName}`);
                return;
            }

            const editBtn = document.getElementById(config.editButtonId);
            if (!editBtn) {
                console.error(`❌ Edit button not found: ${config.editButtonId}`);
                return;
            }

            // Toggle edit mode
            window[config.editMode] = !window[config.editMode];
            const isEditMode = window[config.editMode];

            // Handle actions column visibility (for tables with actions column)
            if (config.hasActionsColumn && config.tableContainerId) {
                const actionsColumn = document.querySelectorAll(`#${config.tableContainerId} [data-column="actions"]`);
                actionsColumn.forEach(cell => {
                    cell.style.display = isEditMode ? '' : 'none';
                });
                console.log(`  📋 Actions column ${isEditMode ? 'shown' : 'hidden'} in #${config.tableContainerId}`);
            }

            // Handle re-render display function (for forms/checkboxes)
            if (config.hasDisplayFunction) {
                const displayFunc = window[config.displayFunction];
                const dataSource = window[config.dataSource];
                if (typeof displayFunc === 'function') {
                    displayFunc(dataSource);
                    console.log(`  🔄 Re-rendered using ${config.displayFunction}()`);
                } else {
                    console.warn(`  ⚠️ Display function not found: ${config.displayFunction}`);
                }
            }

            // Handle add button visibility
            if (config.addButtonId) {
                const addBtn = document.getElementById(config.addButtonId);
                if (addBtn) {
                    const card = editBtn.closest('.detail-card');
                    const isExpanded = card && card.classList.contains('expanded');
                    addBtn.style.display = (isEditMode && isExpanded) ? 'inline-flex' : 'none';
                    console.log(`  ➕ Add button ${(isEditMode && isExpanded) ? 'shown' : 'hidden'}`);
                }
            }

            // Update edit button icon alt text
            const btnImg = editBtn.querySelector('img');
            if (btnImg) {
                btnImg.alt = isEditMode ? 'סגור עריכה' : 'עריכה';
            }

            console.log(`✅ ${cardName} edit mode: ${isEditMode ? 'ON' : 'OFF'}`);
        }
