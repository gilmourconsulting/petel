// Load school details following API Communication Pattern
async function loadSchoolDetails() {
    console.log('📊 Loading school details...');
    
    const container = document.getElementById('schoolDetailsContent');
    if (!container) return;
    
    try {
        // Get school year ID from session following Authentication & Session Management
          const selectedSchoolYearId = await sessionManager.getSessionProperty('SelectedSchoolYearId');

                       console.log('📋 School Year Debug before API call:', {
                          schoolYearId: selectedSchoolYearId
                });
        if (!selectedSchoolYearId) {
            console.error('❌ No school year ID in session');
            container.innerHTML = '<p style="color: #721c24; padding: 20px;">לא נמצא מזהה שנת לימודים בהקשר</p>';
            return;
        }

        const authToken = sessionStorage.getItem('authToken');
        if (!authToken) {
            console.error('❌ No auth token found');
            container.innerHTML = '<p style="color: #721c24; padding: 20px;">נדרש אימות. אנא התחבר מחדש.</p>';
            return;
        }

        // Show loading state
        container.innerHTML = '<p style="padding: 20px;">טוען פרטי בית ספר...</p>';

        // API call following API Communication Pattern with Entity-Based Request Flow
        const apiUrl = AppConfig.getApiUrl(`school/by-year/${selectedSchoolYearId}`);
        console.log('🌐 Making API call to:', apiUrl);
        
        const response = await fetch(apiUrl, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`
            }
        });

        console.log('📥 Response:', response.status, response.ok);

        if (response.ok) {
            const result = await response.json();
            console.log('🏫 School details received:', result);
            
            if (result.success && result.data) {
                displaySchoolDetails(result.data);
            } else {
                throw new Error('Invalid response format');
            }
        } else {
            const errorText = await response.text();
            console.error('❌ API Error:', response.status, errorText);
            container.innerHTML = `<p style="color: #721c24; padding: 20px;">שגיאה בטעינת פרטי בית הספר: ${response.status}</p>`;
        }
    } catch (error) {
        console.error('💥 Exception in loadSchoolDetails:', error);
        container.innerHTML = '<p style="color: #721c24; padding: 20px;">שגיאה בטעינת פרטי בית הספר</p>';
    }
}

        // Function to load ReusableTable and enhance existing table
        function loadReusableTableAndEnhance(data) {
            console.log('📦 Loading ReusableTable component to enhance table...');
            
            // Check if script already exists
            const existingScript = document.querySelector('script[src="table-component.js"]');
            if (existingScript) {
                console.log('📋 table-component.js already loaded, waiting...');
                setTimeout(() => {
                    if (typeof ReusableTable !== 'undefined') {
                        enhanceWithReusableTable(data);
                    } else {
                        console.log('⚠️ ReusableTable still not available, keeping simple table');
                    }
                }, 1000);
                return;
            }

            // Load the table component script
            const script = document.createElement('script');
            script.src = 'table-component.js';
            script.onload = () => {
                console.log('✅ table-component.js loaded successfully');
                setTimeout(() => {
                    if (typeof ReusableTable !== 'undefined') {
                        enhanceWithReusableTable(data);
                    } else {
                        console.log('⚠️ ReusableTable not available after load, keeping simple table');
                    }
                }, 500);
            };
            script.onerror = () => {
                console.log('⚠️ Failed to load table-component.js, keeping simple table');
            };
            
            document.head.appendChild(script);
        }

        // Function to enhance existing table with ReusableTable
        function enhanceWithReusableTable(data) {
            console.log('🔧 Enhancing table with ReusableTable component');
            
            const container = document.getElementById('additionalEducationContent');
            if (!container) return;
            
            // Clear existing content
            container.innerHTML = '';
            
            // Define columns following Hebrew/RTL Specific Patterns and Standard Table Component
            const tableColumns = [
                { 
                    key: 'subject', 
                    label: 'מקצוע', 
                    sortable: true, 
                    readOnly: true,
                    render: (item) => {
                        const subject = item.subject || '';
                        return subject.length > 30 ? 
                            `<span title="${subject}">${subject.substring(0, 30)}...</span>` : 
                            subject;
                    }
                },
                { 
                    key: 'grade', 
                    label: 'כיתה', 
                    sortable: true, 
                    readOnly: true 
                },
                { 
                    key: 'level', 
                    label: 'רמה', 
                    sortable: true, 
                    readOnly: true 
                },
                { 
                    key: 'exactHours', 
                    label: 'מספר השעות מדויק', 
                    sortable: true, 
                    readOnly: true,
                    render: (item) => `<span class="hours-cell">${item.exactHours || '0'}</span>`
                },
                { 
                    key: 'priceList', 
                    label: 'מחירון', 
                    sortable: true, 
                    readOnly: true,
                    render: (item) => `<span style="font-weight: 600; color: #28a745;">${item.priceList || ''}</span>`
                },
                { 
                    key: 'lastUpdateDate', 
                    label: 'תאריך עדכון אחרון', 
                    sortable: true, 
                    readOnly: true,
                    render: (item) => `<span class="date-cell">${item.lastUpdateDate || ''}</span>`
                }
            ];

            try {
                // Create ReusableTable with correct constructor following Standard Table Component
                const additionalEducationTable = new ReusableTable('additionalEducationContent', {
                    tableName: 'additionalEducation',
                    isReadOnly: true,
                    allowAdd: false,
                    allowEdit: false,
                    allowDelete: false
                });
                
                console.log('📋 ReusableTable created successfully for additional education');
                
                // Initialize with data and columns following Critical Development Workflows
                additionalEducationTable.init(data, tableColumns);
                
                console.log('✅ Additional education ReusableTable enhanced successfully');

            } catch (error) {
                console.error('❌ Error enhancing with ReusableTable:', error);
                // Fall back to simple table if ReusableTable fails
                createAdditionalEducationSimpleTable(data);
            }
        }

        // Generic page loading function following Frontend Architecture Patterns
        function loadPageDirectly(filename, section, displayName) {
            console.log(`🔄 Loading ${filename} page directly...`);
            
            // Find the main content container following Project-Specific Patterns
            const mainContainer = document.getElementById('dynamicContent') || 
                                 document.getElementById('mainContent') || 
                                 document.querySelector('.main-content') || 
                                 document.querySelector('main') ||
                                 document.body;
            
            if (!mainContainer) {
                console.error('❌ Could not find main content container');
                return;
            }
            
            // Show loading state following Hebrew/RTL Specific Patterns
            mainContainer.innerHTML = `
                <div class="loading-spinner" style="text-align: center; padding: 40px; direction: rtl;">
                    <div style="font-size: 1.2em; margin-bottom: 15px;">טוען ${displayName}...</div>
                    <div style="color: #6c757d;">אנא המתן...</div>
                </div>
            `;
            
            // Fetch and load page following API Communication Pattern
            fetch(filename)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    console.log(`✅ ${filename} page loaded successfully`);
                    mainContainer.innerHTML = html;
                    
                    // Execute scripts safely following Critical Development Workflows
                    executeScriptsInContainer(mainContainer);
                    
                    // Update browser history following Single-Page Application patterns
                    history.pushState({ section: section }, '', `#${section}`);
                    
                    console.log(`✅ ${displayName} page loaded and initialized`);
                })
                .catch(error => {
                    console.error(`❌ Error loading ${filename} page:`, error);
                    showNavigationError(mainContainer, `שגיאה בטעינת ${displayName}`);
                });
        }

        // Utility functions following Critical Development Workflows
        function executeScriptsInContainer(container) {
            try {
                const scripts = container.querySelectorAll('script');
                scripts.forEach(script => {
                    if (script.textContent && script.textContent.trim()) {
                        try {
                            const newScript = document.createElement('script');
                            
                            if (script.src) {
                                newScript.src = script.src;
                            } else {
                                newScript.textContent = script.textContent;
                            }
                            
                            document.head.appendChild(newScript);
                            script.remove();
                            
                        } catch (scriptError) {
                            console.warn('⚠️ Error executing script:', scriptError);
                        }
                    }
                });
            } catch (error) {
                console.error('❌ Error in executeScriptsInContainer:', error);
            }
        }

        function showNavigationError(container, message) {
            container.innerHTML = `
                <div class="error-message" style="
                    text-align: center; 
                    padding: 40px; 
                    direction: rtl;
                    background: #f8d7da;
                    color: #721c24;
                    border: 1px solid #f5c6cb;
                    border-radius: 8px;
                    margin: 20px;
                ">
                    <h3 style="margin-bottom: 15px;">${message}</h3>
                    <p style="margin-bottom: 20px;">לא ניתן לטעון את הדף המבוקש. אנא נסה שוב.</p>
                    <button onclick="window.history.back()" style="
                        background: #007bff;
                        color: white;
                        border: none;
                        padding: 8px 16px;
                        border-radius: 4px;
                        cursor: pointer;
                        font-size: 14px;
                        margin-left: 10px;
                    ">
                        חזרה
                    </button>
                    <button onclick="window.location.reload()" style="
                        background: #28a745;
                        color: white;
                        border: none;
                        padding: 8px 16px;
                        border-radius: 4px;
                        cursor: pointer;
                        font-size: 14px;
                    ">
                        רענן דף
                    </button>
                </div>
            `;
        }

        function showError(message) {
            const contentCard = document.querySelector('.content-card');
            if (contentCard) {
                contentCard.innerHTML = `
                    <div class="error-message" style="
                        text-align: center; 
                        padding: 40px; 
                        direction: rtl;
                        background: #f8d7da;
                        color: #721c24;
                        border: 1px solid #f5c6cb;
                        border-radius: 8px;
                        margin: 20px;
                    ">
                        <h3 style="margin-bottom: 15px;">${message}</h3>
                        <p style="margin-bottom: 20px;">אנא נסה שוב מאוחר יותר.</p>
                        <button onclick="navigateBackToSchoolDashboard()" style="
                            background: #007bff;
                            color: white;
                            border: none;
                            padding: 8px 16px;
                            border-radius: 4px;
                            cursor: pointer;
                            font-size: 14px;
                        ">
                            חזרה ללוח הבקרה
                        </button>
                    </div>
                `;
            }
        }

        // Initialize page following Critical Development Workflows
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🏁 DOMContentLoaded event fired!');
            initializeSchoolDetails();
        });

        // Also try immediate call if DOM is already ready
        if (document.readyState !== 'loading') {
            console.log('📄 Document already ready, calling initializeSchoolDetails immediately');
            initializeSchoolDetails();
        }

        // Make functions globally available following Cross-Component Communication
        window.initializeSchoolDetails = initializeSchoolDetails;
        window.loadSchoolDetailsData = loadSchoolDetailsData;
        window.loadSchoolDetails = loadSchoolDetails;
        window.loadSchoolServices = loadSchoolServices;
        window.loadAdditionalEducationTable = loadAdditionalEducationTable;

        window.initializeAdditionalEducationTable = initializeAdditionalEducationTable;
        //window.initializeAdditionalEducationReusableTable = initializeAdditionalEducationReusableTable;
        window.createAdditionalEducationSimpleTable = createAdditionalEducationSimpleTable;
        window.navigateBackToSchoolDashboard = navigateBackToSchoolDashboard;
        window.navigateBackToDashboard = navigateBackToDashboard;
        window.loadPageDirectly = loadPageDirectly;
        window.executeScriptsInContainer = executeScriptsInContainer;
        window.showNavigationError = showNavigationError;
        window.showError = showError;

        console.log('✅ School details functions registered globally');
