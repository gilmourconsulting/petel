<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פרטי בית ספר - מערכת ניהול פט״ל</title>

<body>
    <!-- Context buttons positioned between menu and main content following Context Buttons Layout -->

    <!-- Main content positioned after menu and context buttons -->

        <!-- Additional Education Table Card -->

                <h2 class="detail-card-title">תל"ן</h2>
            </div>
            <div class="detail-card-content" id="additionalEducationContent">
                <!-- Table will be populated here -->
            </div>
        </div>
    </div>

    <script>
        console.log('🔍 SCRIPT SECTION LOADED - schooldetails.html');
        
        // Global variables following Project-Specific Patterns
        let selectedSchoolId = null;
        let selectedSchoolName = null;

        // Initialize page following Critical Development Workflows
        async function initializeSchoolDetails() {
            console.log('🚀 initializeSchoolDetails FUNCTION CALLED!');
            
            try {
                // Get selected school from session following Authentication & Session Management
                selectedSchoolId = sessionStorage.getItem('selectedSchoolId');
                selectedSchoolName = sessionStorage.getItem('selectedSchoolName');
                
                console.log('📋 School Details Debug:', {
                    schoolId: selectedSchoolId,
                    schoolName: selectedSchoolName
                });
                
                if (!selectedSchoolId || !selectedSchoolName) {
                    console.error('❌ No school selected');
                    showError('לא נבחר בית ספר');
                    return;
                }

                // Update page subtitle with school name
                const subtitleElement = document.getElementById('schoolNameSubtitle');
                if (subtitleElement) {
                    subtitleElement.textContent = `פרטים מפורטים של ${selectedSchoolName}`;
                }

                // Load school details data
                await loadSchoolDetailsData();
                
            } catch (error) {
                console.error('💥 Exception in initializeSchoolDetails:', error);
                showError('שגיאה בטעינת פרטי בית הספר');
            }
        }

        // Load school details data following Multi-Tenant Request Flow
        async function loadSchoolDetailsData() {
            console.log('🏫 Loading school details data for school:', selectedSchoolId);
            
            try {
                // Get session data following Authentication & Session Management
                const tenantId = sessionStorage.getItem('tenantId');
                const authToken = sessionStorage.getItem('authToken');
                
                if (!tenantId) {
                    console.error('❌ No tenant ID found in session');
                    return;
                }

                // Load school characterization data
                await loadSchoolCharacterization();
                
                // Load school services data
                await loadSchoolServices();
                
                // Load additional education table data
                await loadAdditionalEducationTable();
                
            } catch (error) {
                console.error('💥 Exception in loadSchoolDetailsData:', error);
                showError('שגיאה בטעינת נתוני בית הספר');
            }
        }

        // Load school characterization following API Communication Pattern
        async function loadSchoolCharacterization() {
            console.log('📊 Loading school characterization...');
            
            const container = document.getElementById('schoolCharacterizationContent');
            if (!container) return;
            
            try {
                // Get session data following Authentication & Session Management
                const entityId = sessionStorage.getItem('entityId');
                const authToken = sessionStorage.getItem('authToken');
                
                if (!entityId) {
                    console.error('❌ No entity ID found in session');
                    // Use mock data when no entity ID
                    const mockData = generateSchoolCharacterizationMockData();
                    displaySchoolCharacterization(mockData);
                    return;
                }

                // API call following API Communication Pattern with Entity-Based Request Flow
                const apiUrl = AppConfig.getApiUrl(`entities/schoolcharacterization?schoolId=${selectedSchoolId}&entityId=${entityId}`);
                console.log('🌐 Making API call to:', apiUrl);
                
                // Build headers following Entity-Based Request Flow
                const headers = {
                    'Content-Type': 'application/json'
                };

                // Only add Authorization header if token exists
                if (authToken && authToken !== 'undefined') {
                    headers['Authorization'] = `Bearer ${authToken}`;
                }

                console.log('📤 Request headers:', headers);
                
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: headers
                });

                console.log('📥 Response:', response.status, response.ok);

                if (response.ok) {
                    const characterizationData = await response.json();
                    console.log('🏫 School characterization data received:', characterizationData);
                    
                    displaySchoolCharacterization(characterizationData);
                } else {
                    const errorText = await response.text();
                    console.error('❌ API Error:', response.status, errorText);
                    // Fallback to mock data on API error
                    console.log('🔄 Falling back to mock data');
                    const mockData = generateSchoolCharacterizationMockData();
                    displaySchoolCharacterization(mockData);
                }
            } catch (error) {
                console.error('💥 Exception in loadSchoolCharacterization:', error);
                // Fallback to mock data on exception
                console.log('🔄 Falling back to mock data due to exception');
                const mockData = generateSchoolCharacterizationMockData();
                displaySchoolCharacterization(mockData);
            }
        }

                    </div>
                    
                    <div class="info-section">
                        <h4 style="color: #C15A16; margin-bottom: 10px;">שפות הוראה</h4>
                        <p>${data.languages.join(', ')}</p>

        }

        // Load school services following API Communication Pattern
        async function loadSchoolServices() {
            console.log('🏢 Loading school services...');
            
            const container = document.getElementById('schoolServicesContent');
            if (container) {
                container.innerHTML = '<p>טוען שירותי בית ספר...</p>';

            }

        // Load additional education table following Standard Table Component
        async function loadAdditionalEducationTable() {
            console.log('📋 ========== LOADING ADDITIONAL EDUCATION TABLE ==========');
            
            const container = document.getElementById('additionalEducationContent');
            if (!container) {
                console.error('❌ additionalEducationContent container not found in DOM');
                console.log('Available containers:', document.querySelectorAll('[id*="Content"]'));
                return;
            }
            
            console.log('✅ Container found:', container);
            
            // Show loading state
            container.innerHTML = `
                <div style="text-align: center; padding: 20px; direction: rtl; background: white; border: 1px solid #dee2e6; border-radius: 8px;">
                    <div style="font-size: 1.1em; margin-bottom: 10px;">טוען נתוני תל"ן...</div>
                    <div style="color: #6c757d;">אנא המתן...</div>
                </div>
            `;
            
            try {
                console.log('📊 Generating mock data...');
                const mockData = generateAdditionalEducationMockData();
                console.log('📊 Mock data generated successfully:', mockData);
                
                if (!mockData || !Array.isArray(mockData) || mockData.length === 0) {
                    console.error('❌ Invalid mock data generated');
                    showNoDataMessage();
                    return;
                }
                
                // Add delay to show loading state
                setTimeout(() => {
                    console.log('🔧 Initializing table with mock data...');
                    initializeAdditionalEducationTable(mockData);
                }, 300);

            } catch (error) {
                console.error('💥 Exception in loadAdditionalEducationTable:', error);
                showNoDataMessage();
            }
        }

        // Completely rewrite the initializeAdditionalEducationTable function for better reliability
        function initializeAdditionalEducationTable(data) {
            console.log('📊 Initializing additional education table with', data?.length || 0, 'records');
            
            if (!data || !Array.isArray(data) || data.length === 0) {
                console.warn('⚠️ No data provided for additional education table');
                showNoDataMessage();
                return;
            }
            
            const container = document.getElementById('additionalEducationContent');
            if (!container) {
                console.error('❌ Container additionalEducationContent not found');
                return;
            }
            
            // Always use simple table first, then try ReusableTable as enhancement
            console.log('📋 Creating simple table first for reliability');
            createAdditionalEducationSimpleTable(data);
            
            // Then try to enhance with ReusableTable if available
            setTimeout(() => {
                if (typeof ReusableTable !== 'undefined') {
                    console.log('✅ ReusableTable available, enhancing table');
                    enhanceWithReusableTable(data);
                } else {
                    console.log('📦 ReusableTable not available, attempting to load');
                    loadReusableTableAndEnhance(data);
                }
            }, 100);
        }

        // Enhanced simple table that works reliably

                return;

            container.innerHTML = '';

                                <th style="padding: 15px 12px; border-bottom: 2px solid #dee2e6; border-left: 1px solid #dee2e6; min-width: 150px; font-weight: 600; color: #333;">מחירון</th>
                                <th style="padding: 15px 12px; border-bottom: 2px solid #dee2e6; min-width: 180px; font-weight: 600; color: #333;">תאריך עדכון אחרון</th>

                                    <td style="padding: 12px; border-bottom: 1px solid #dee2e6; border-left: 1px solid #dee2e6; font-weight: 600; color: #333;" title="${item.subject || ''}">

                                        ${item.exactHours || '0'}
                                    </td>
                                    <td style="padding: 12px; border-bottom: 1px solid #dee2e6; border-left: 1px solid #dee2e6; font-weight: 600; color: #28a745;">
                                        ${item.priceList || ''}
                                    </td>
                                    <td style="padding: 12px; border-bottom: 1px solid #dee2e6; font-size: 0.9em; color: #6c757d;">

        // Function to show no data message
        function showNoDataMessage() {
            const container = document.getElementById('additionalEducationContent');
            if (container) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #6c757d; direction: rtl; background: white; border: 1px solid #dee2e6; border-radius: 8px;">
                        <h4 style="margin-bottom: 15px; color: #333;">אין נתוני תל"ן</h4>
                        <p>לא נמצאו נתוני תל"ן עבור בית ספר זה.</p>
                        <button onclick="loadAdditionalEducationTable()" style="
                            background: #C15A16;
                            color: white;
                            border: none;
                            padding: 8px 16px;
                            border-radius: 4px;
                            cursor: pointer;
                            font-size: 14px;
                            margin-top: 15px;
                        ">
                            נסה שוב
                        </button>
                    </div>
                `;
            }
        }

        // Function to load ReusableTable and enhance existing table
        function loadReusableTableAndEnhance(data) {
            console.log('📦 Loading ReusableTable component to enhance table...');
            
            // Check if script already exists
            const existingScript = document.querySelector('script[src="table-component.js"]');
            if (existingScript) {
                console.log('📋 table-component.js already loaded, waiting...');
                setTimeout(() => {
                    if (typeof ReusableTable !== 'undefined') {
                        enhanceWithReusableTable(data);
                    } else {
                        console.log('⚠️ ReusableTable still not available, keeping simple table');
                    }
                }, 1000);
                return;
            }

            // Load the table component script
            const script = document.createElement('script');
            script.src = 'table-component.js';
            script.onload = () => {
                console.log('✅ table-component.js loaded successfully');
                setTimeout(() => {
                    if (typeof ReusableTable !== 'undefined') {
                        enhanceWithReusableTable(data);
                    } else {
                        console.log('⚠️ ReusableTable not available after load, keeping simple table');
                    }
                }, 500);
            };
            script.onerror = () => {
                console.log('⚠️ Failed to load table-component.js, keeping simple table');
            };
            
            document.head.appendChild(script);
        }

        // Function to enhance existing table with ReusableTable
        function enhanceWithReusableTable(data) {
            console.log('🔧 Enhancing table with ReusableTable component');
            
            const container = document.getElementById('additionalEducationContent');
            if (!container) return;
            
            // Clear existing content
            container.innerHTML = '';
            
            // Define columns following Hebrew/RTL Specific Patterns and Standard Table Component
            const tableColumns = [
                { 
                    key: 'subject', 
                    label: 'מקצוע', 
                    sortable: true, 
                    readOnly: true,
                    render: (item) => {
                        const subject = item.subject || '';
                        return subject.length > 30 ? 
                            `<span title="${subject}">${subject.substring(0, 30)}...</span>` : 
                            subject;
                    }
                },
                { 
                    key: 'grade', 
                    label: 'כיתה', 
                    sortable: true, 
                    readOnly: true 
                },
                { 
                    key: 'level', 
                    label: 'רמה', 
                    sortable: true, 
                    readOnly: true 
                },
                { 
                    key: 'exactHours', 
                    label: 'מספר השעות מדויק', 
                    sortable: true, 
                    readOnly: true,
                    render: (item) => `<span class="hours-cell">${item.exactHours || '0'}</span>`
                },
                { 
                    key: 'priceList', 
                    label: 'מחירון', 
                    sortable: true, 
                    readOnly: true,
                    render: (item) => `<span style="font-weight: 600; color: #28a745;">${item.priceList || ''}</span>`
                },
                { 
                    key: 'lastUpdateDate', 
                    label: 'תאריך עדכון אחרון', 
                    sortable: true, 
                    readOnly: true,
                    render: (item) => `<span class="date-cell">${item.lastUpdateDate || ''}</span>`
                }
            ];

            try {
                // Create ReusableTable with correct constructor following Standard Table Component
                const additionalEducationTable = new ReusableTable('additionalEducationContent', {
                    tableName: 'additionalEducation',
                    isReadOnly: true,
                    allowAdd: false,
                    allowEdit: false,
                    allowDelete: false
                });
                
                console.log('📋 ReusableTable created successfully for additional education');
                
                // Initialize with data and columns following Critical Development Workflows
                additionalEducationTable.init(data, tableColumns);
                
                console.log('✅ Additional education ReusableTable enhanced successfully');

            } catch (error) {
                console.error('❌ Error enhancing with ReusableTable:', error);
                // Fall back to simple table if ReusableTable fails
                createAdditionalEducationSimpleTable(data);
            }
        }

        // Context button navigation functions following Single-Page Application with Module Loading
        function navigateBackToSchoolDashboard() {
            console.log('🏫 Navigating back to school dashboard...');
            
            // Store navigation context following Authentication & Session Management
            sessionStorage.setItem('navigationSource', 'schooldetails');
            sessionStorage.setItem('navigationTimestamp', new Date().toISOString());
            
            // Check if navigateTo function is available from main app following Cross-Component Communication
            if (typeof navigateTo === 'function') {
                navigateTo('schooldashboard');
            } else if (typeof window.navigateTo === 'function') {
                window.navigateTo('schooldashboard');
            } else {
                // Fallback: Load school dashboard page directly following Frontend Architecture Patterns
                loadPageDirectly('schooldashboard.html', 'schooldashboard', 'לוח הבקרה של בית הספר');
            }
        }

        function navigateBackToDashboard() {
            console.log('📊 Navigating back to main dashboard...');
            
            // Store navigation context following Authentication & Session Management
            sessionStorage.setItem('navigationSource', 'schooldetails');
            sessionStorage.setItem('returnToDashboard', 'true');
            
            // Check if navigateTo function is available from main app following Cross-Component Communication
            if (typeof navigateTo === 'function') {
                navigateTo('dashboard');
            } else if (typeof window.navigateTo === 'function') {
                window.navigateTo('dashboard');
            } else {
                // Fallback: Load dashboard page directly following Frontend Architecture Patterns
                loadPageDirectly('dashboard.html', 'dashboard', 'לוח הבקרה הראשי');
            }
        }

        // Generic page loading function following Frontend Architecture Patterns
        function loadPageDirectly(filename, section, displayName) {
            console.log(`🔄 Loading ${filename} page directly...`);
            
            // Find the main content container following Project-Specific Patterns
            const mainContainer = document.getElementById('dynamicContent') || 
                                 document.getElementById('mainContent') || 
                                 document.querySelector('.main-content') || 
                                 document.querySelector('main') ||
                                 document.body;
            
            if (!mainContainer) {
                console.error('❌ Could not find main content container');
                return;
            }
            
            // Show loading state following Hebrew/RTL Specific Patterns
            mainContainer.innerHTML = `
                <div class="loading-spinner" style="text-align: center; padding: 40px; direction: rtl;">
                    <div style="font-size: 1.2em; margin-bottom: 15px;">טוען ${displayName}...</div>
                    <div style="color: #6c757d;">אנא המתן...</div>
                </div>
            `;
            
            // Fetch and load page following API Communication Pattern
            fetch(filename)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    console.log(`✅ ${filename} page loaded successfully`);
                    mainContainer.innerHTML = html;
                    
                    // Execute scripts safely following Critical Development Workflows
                    executeScriptsInContainer(mainContainer);
                    
                    // Update browser history following Single-Page Application patterns
                    history.pushState({ section: section }, '', `#${section}`);
                    
                    console.log(`✅ ${displayName} page loaded and initialized`);
                })
                .catch(error => {
                    console.error(`❌ Error loading ${filename} page:`, error);
                    showNavigationError(mainContainer, `שגיאה בטעינת ${displayName}`);
                });
        }

        // Utility functions following Critical Development Workflows
        function executeScriptsInContainer(container) {
            try {
                const scripts = container.querySelectorAll('script');
                scripts.forEach(script => {
                    if (script.textContent && script.textContent.trim()) {
                        try {
                            const newScript = document.createElement('script');
                            
                            if (script.src) {
                                newScript.src = script.src;
                            } else {
                                newScript.textContent = script.textContent;
                            }
                            
                            document.head.appendChild(newScript);
                            script.remove();
                            
                        } catch (scriptError) {
                            console.warn('⚠️ Error executing script:', scriptError);
                        }
                    }
                });
            } catch (error) {
                console.error('❌ Error in executeScriptsInContainer:', error);
            }
        }

        function showNavigationError(container, message) {
            container.innerHTML = `

        }

        // Initialize page following Critical Development Workflows
        document.addEventListener('DOMContentLoaded', function() {

        // Also try immediate call if DOM is already ready
