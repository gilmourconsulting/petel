// Capture original values when loading attributes
function captureOriginalAttributeValues(attributes) {
    window.originalSchoolAttributesValues = {};
    
    const allAttributeTypes = [
        { id: 1, valueType: "Boolean" },
        { id: 2, valueType: "Boolean" },
        { id: 3, valueType: "List" },
        { id: 4, valueType: "Integer" },
        { id: 5, valueType: "Integer" }
    ];
    
    const attrMap = {};
    (attributes || []).forEach(attr => {
        attrMap[attr.attributeId] = attr;
    });
    
    allAttributeTypes.forEach(attrType => {
        const existingAttr = attrMap[attrType.id] || {};
        let value = existingAttr.value;
        
        if (attrType.valueType === 'Boolean') {
            value = value === 'true' || value === '1' || value === 'True' || 
                    value === 'TRUE' || value === true || value === 1;
        } else if (attrType.valueType === 'Integer') {
            value = value || '0';
        } else if (attrType.valueType === 'List') {
            value = value || '';
        }
        
        window.originalSchoolAttributesValues[attrType.id] = value;
    });
    
    window.hasUnsavedAttributeChanges = false;
    console.log('📋 Original attribute values captured:', window.originalSchoolAttributesValues);
}

// Check if any attribute values have changed
function checkForAttributeChanges() {
    const allAttributeTypes = [1, 2, 3, 4, 5];
    
    for (const attrId of allAttributeTypes) {
        const element = document.getElementById(`attr_${attrId}`);
        if (!element) continue;
        
        const valueType = element.dataset.valueType;
        const originalValue = window.originalSchoolAttributesValues[attrId];
        let currentValue;
        
        if (valueType === 'Boolean') {
            currentValue = element.checked;
        } else if (valueType === 'List') {
            currentValue = element.value || '';
        } else {
            currentValue = element.value || '0';
        }
        
        if (String(currentValue) !== String(originalValue)) {
            console.log(`📝 Change detected in attribute ${attrId}:`, {
                original: originalValue,
                current: currentValue
            });
            return true;
        }
    }
    
    return false;
}

// Show confirmation dialog with three options
function showAttributeSaveDialog() {
    return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'dialog-overlay';
        
        const dialog = document.createElement('div');
        dialog.className = 'dialog-box';
        
        dialog.innerHTML = `
            <h3 class="dialog-title">שינויים לא נשמרו</h3>
            <p class="dialog-message">ביצעת שינויים בשירותי בית הספר. מה ברצונך לעשות?</p>
            <div class="dialog-buttons">
                <button id="saveBtn" class="dialog-btn save">שמור</button>
                <button id="dontSaveBtn" class="dialog-btn dont-save">אל תשמור</button>
                <button id="cancelBtn" class="dialog-btn cancel">ביטול</button>
            </div>
        `;
        
        overlay.appendChild(dialog);
        document.body.appendChild(overlay);
        
        const saveBtn = dialog.querySelector('#saveBtn');
        const dontSaveBtn = dialog.querySelector('#dontSaveBtn');
        const cancelBtn = dialog.querySelector('#cancelBtn');
        
        saveBtn.onclick = () => {
            document.body.removeChild(overlay);
            resolve('save');
        };
        
        dontSaveBtn.onclick = () => {
            document.body.removeChild(overlay);
            resolve('dontSave');
        };
        
        cancelBtn.onclick = () => {
            document.body.removeChild(overlay);
            resolve('cancel');
        };
    });
}

// Show navigation warning dialog
function showNavigationWarningDialog() {
    return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'dialog-overlay';
        
        const dialog = document.createElement('div');
        dialog.className = 'dialog-box';
        
        dialog.innerHTML = `
            <h3 class="dialog-title warning">אזהרה</h3>
            <p class="dialog-message warning">לא נשמרו העריכות שביצעת במסך</p>
            <div class="dialog-buttons">
                <button id="stayBtn" class="dialog-btn stay">הישאר במסך</button>
                <button id="leaveBtn" class="dialog-btn leave">עזוב בכל זאת</button>
            </div>
        `;
        
        overlay.appendChild(dialog);
        document.body.appendChild(overlay);
        
        const stayBtn = dialog.querySelector('#stayBtn');
        const leaveBtn = dialog.querySelector('#leaveBtn');
        
        stayBtn.onclick = () => {
            document.body.removeChild(overlay);
            resolve(false);
        };
        
        leaveBtn.onclick = () => {
            document.body.removeChild(overlay);
            resolve(true);
        };
    });
}

// Setup edit attributes button
function setupEditAttributesButton() {
    const editBtn = document.getElementById('editAttributesBtn');
    if (editBtn) {
        editBtn.onclick = async function() {
            if (window.schoolAttributesEditMode) {
                const hasChanges = checkForAttributeChanges();
                
                if (hasChanges) {
                    const action = await showAttributeSaveDialog();
                    
                    if (action === 'save') {
                        console.log('💾 Saving attribute changes...');
                        await saveSchoolAttributes();
                        window.schoolAttributesEditMode = false;
                        window.hasUnsavedAttributeChanges = false;
                        displaySchoolAttributes(window.lastSchoolAttributesData || []);
                    } else if (action === 'dontSave') {
                        console.log('↩️ Reverting to original values');
                        window.schoolAttributesEditMode = false;
                        window.hasUnsavedAttributeChanges = false;
                        displaySchoolAttributes(window.lastSchoolAttributesData || []);
                    } else {
                        console.log('❌ Edit mode toggle cancelled');
                        return;
                    }
                } else {
                    window.schoolAttributesEditMode = false;
                    displaySchoolAttributes(window.lastSchoolAttributesData || []);
                }
            } else {
                window.schoolAttributesEditMode = true;
                displaySchoolAttributes(window.lastSchoolAttributesData || []);
            }
            
            console.log('✏️ Edit mode toggled:', window.schoolAttributesEditMode);
        };
        console.log('✅ Edit attributes button initialized');
    } else {
        console.warn('⚠️ Edit attributes button not found');
    }
}

async function saveSchoolAttributes() {
    console.log('💾 Saving school attributes...');
    
    try {
        const schoolYearId = await window.SessionState.getProperty('SelectedSchoolYearId');
        
        if (!schoolYearId) {
            alert('לא נבחרה שנת לימודים');
            return;
        }

        const changes = [];
        const allAttributeTypes = [1, 2, 3, 4, 5];
        
        for (const attrId of allAttributeTypes) {
            const element = document.getElementById(`attr_${attrId}`);
            if (!element) continue;
            
            const container = element.closest('.attribute-item');
            const recordId = container?.dataset.recordId ? parseInt(container.dataset.recordId) : null;
            const version = parseInt(container?.dataset.version || '0', 10);
            
            const valueType = element.dataset.valueType;
            let newValue;
            
            if (valueType === 'Boolean') {
                newValue = element.checked ? 'true' : 'false';
            } else if (valueType === 'List') {
                // Store the ID from the dropdown (not the display text)
                newValue = element.value;
            } else {
                newValue = element.value;
            }
            
            changes.push({
                id: recordId,
                attributeId: attrId,
                value: newValue,
                version: version
            });
        }
        
        console.log('📝 Sending changes to server:', {
            schoolYearId: schoolYearId,
            attributes: changes
        });
        
        const response = await fetch(AppConfig.getApiUrl('schoolAttributes/update'), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                schoolYearId: parseInt(schoolYearId),
                attributes: changes
            })
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
            console.log('✅ Attributes saved successfully:', result.data);
            
            // Reload fresh data from server
            await loadSchoolattributes();
            
            // Reset flags
            window.hasUnsavedAttributeChanges = false;
            
            alert('שירותי בית הספר עודכנו בהצלחה');
        } else {
            console.error('❌ Failed to save attributes:', result);
            alert(result.message || 'שגיאה בשמירת השירותים');
        }
        
    } catch (error) {
        console.error('💥 Error saving school attributes:', error);
        alert('שגיאה בשמירת שירותי בית הספר');
    }
}

        // Generic page loading function following Frontend Architecture Patterns
        function loadPageDirectly(filename, section, displayName) {
            console.log(`🔄 Loading ${filename} page directly...`);
            
            // Find the main content container following Project-Specific Patterns
            const mainContainer = document.getElementById('dynamicContent') || 
                                 document.getElementById('mainContent') || 
                                 document.querySelector('.main-content') || 
                                 document.querySelector('main') ||
                                 document.body;
            
            if (!mainContainer) {

                return;

            // Show loading state following Hebrew/RTL Specific Patterns
            mainContainer.innerHTML = `
                <div class="loading-spinner" style="text-align: center; padding: 40px; direction: rtl;">

                </div>
            `;
            
            // Fetch and load page following API Communication Pattern
            fetch(filename)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    console.log(`✅ ${filename} page loaded successfully`);
                    mainContainer.innerHTML = html;
                    
                    // Execute scripts safely following Critical Development Workflows
                    executeScriptsInContainer(mainContainer);
                    
                    // Update browser history following Single-Page Application patterns

                    console.log(`✅ ${displayName} page loaded and initialized`);

                .catch(error => {
                    console.error(`❌ Error loading ${filename} page:`, error);
                    showNavigationError(mainContainer, `שגיאה בטעינת ${displayName}`);
                });
        }
