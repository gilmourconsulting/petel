<!-- School Title Section -->

    <h1 class="page-title" id="schoolTitle">ניהול תלמידי חוץ</h1>
</div>
<div class="students-container">

                <div class="detail-card-header">
                    <h2 class="detail-card-title">כיתות בית ספר</h2>
                    <div class="card-header-actions">
                        <button id="editClassesBtn" class="btn-icon" onclick="event.stopPropagation();">
                            <img src="edit_icon.png" alt="עריכה" class="action-icon-natural">

            <!-- School Attributes Card -->

                <div class="detail-card-header">
                    <h2 class="detail-card-title">שירותי בית ספר</h2>
                    <div class="card-header-actions">
                        <button id="editAttributesBtn" class="btn-icon" onclick="event.stopPropagation();">
                            <img src="edit_icon.png" alt="עריכה" class="action-icon-natural">
                        </button>
                        <button class="collapse-toggle" aria-label="הרחב/כווץ">+</button>
                    </div>
                </div>
                <div class="detail-card-content" id="schoolattributesContent">
                    <!-- Content will be populated here -->
                </div>
            </div>

            <!-- School Tracks Card -->
            <div class="detail-card collapsed">
                <div class="detail-card-header">
                    <h2 class="detail-card-title">מגמות בית ספר</h2>
                    <div class="card-header-actions">
                        <button id="editTracksBtn" class="btn-icon" onclick="event.stopPropagation();">
                            <img src="edit_icon.png" alt="עריכה" class="action-icon-natural">
                        </button>
                        <button id="addTrackBtn" class="btn-icon"
                            onclick="event.stopPropagation(); showAddTrackModal();" title="הוספת מגמה חדשה"
                            style="display: none;">
                            <img src="Plus icon.png" alt="הוספה" class="action-icon-natural">
                        </button>
                        <button class="collapse-toggle" aria-label="הרחב/כווץ">+</button>
                    </div>
                </div>
                <div class="detail-card-content" id="schoolCoursesContent">
                    <!-- Content will be populated here -->
                </div>
            </div>

            <!-- Additional Study Programs Card -->
            <div class="detail-card collapsed">
                <div class="detail-card-header">
                    <h2 class="detail-card-title">תל"ן</h2>
                    <div class="card-header-actions">
                        <button id="editAdditionalStudyBtn" class="btn-icon" onclick="event.stopPropagation();">
                            <img src="edit_icon.png" alt="עריכה" class="action-icon-natural">
                        </button>
                        <button id="addAdditionalStudyBtn" class="btn-icon"
                            onclick="event.stopPropagation(); showAddAdditionalStudyModal();" title="הוספת תל״ן חדש"
                            style="display: none;">
                            <img src="Plus icon.png" alt="הוספה" class="action-icon-natural">
                        </button>
                        <button class="collapse-toggle" aria-label="הרחב/כווץ">+</button>
                    </div>
                </div>
                <div class="detail-card-content" id="additionalStudyProgramContent">
                    <!-- Content will be populated here -->
                </div>
            </div>

        </div>
    </div>

    <!-- Person Management Module -->
    <script src="person-management.js"></script>

    <script>
        console.log('🔍 SCRIPT SECTION LOADED - schooldetails.html');


        // Update the loadSchoolTitle function in schooldetails.html
        async function loadSchoolTitle() {
            console.log('📋 Loading school title from SessionState...');

            try {
                // ✅ Use centralized SessionState
                const session = await window.SessionState.getSession();
                const yearValue = await window.SessionState.getProperty('SelectedYearValue');

                let schoolName = session.entityName;

                if (parseInt(session.entityTypeId, 10) === 5) {
                    // Multi-school network - get selected school name
                    const selectedSchoolName = await window.SessionState.getProperty('SelectedSchoolName');
                    if (selectedSchoolName) {
                        schoolName = selectedSchoolName;
                    }
                }

                console.log('🏫 School context:', { schoolName, yearValue });

                const titleElement = document.getElementById('schoolTitle');
                if (titleElement) {
                    titleElement.textContent = yearValue
                        ? `${schoolName} - ${yearValue}`
                        : schoolName;
                    console.log('✅ School title updated via SessionState');
                }

            } catch (error) {
                console.error('❌ Error loading school title:', error);
                const titleElement = document.getElementById('schoolTitle');
                if (titleElement) {
                    titleElement.textContent = 'לוח בקרה של בית ספר';
                }
            }
        }


        // Generic Collapsible Cards - Auto-initialize ALL cards

        function initializeCollapsibleCards() {
            console.log('🎴 Initializing generic collapsible cards...');

            document.querySelectorAll('.detail-card').forEach(card => {
                const header = card.querySelector('.detail-card-header');
                const toggle = card.querySelector('.collapse-toggle');

                if (!header || !toggle) return;

                // ✅ Check if already initialized to prevent duplicate listeners
                if (header.dataset.initialized === 'true') {
                    console.log('⚠️ Card already initialized, skipping:', card.querySelector('.detail-card-title')?.textContent);
                    return;
                }

                // ✅ Mark as initialized
                header.dataset.initialized = 'true';

                // Get action buttons
                const editButton = card.querySelector('.btn-icon[id^="edit"]');
                const addButton = card.querySelector('.btn-icon[id^="add"]');

                // Hide buttons initially
                if (addButton) addButton.style.display = 'none';
                if (editButton) editButton.style.display = 'none';

                // ✅ SEPARATE HANDLER 1: Toggle button click
                toggle.addEventListener('click', function (e) {
                    e.stopPropagation(); // Prevent bubbling to header
                    toggleCardExpansion(card, toggle, editButton, addButton);
                });

                // ✅ SEPARATE HANDLER 2: Header click (excluding buttons)
                header.addEventListener('click', function (e) {
                    // Don't toggle if clicking any button
                    if (e.target.closest('.btn-icon')) {
                        console.log('🚫 Click on button - ignoring');
                        return;
                    }

                    toggleCardExpansion(card, toggle, editButton, addButton);
                });
            });

            console.log('✅ Generic collapsible cards initialized');
        }

        // ✅ SEPARATE FUNCTION: Toggle card expansion logic
        function toggleCardExpansion(card, toggle, editButton, addButton) {
            const isCollapsed = card.classList.contains('collapsed');

            console.log('🎴 Toggling card:', {
                title: card.querySelector('.detail-card-title')?.textContent,
                currentlyCollapsed: isCollapsed,
                willExpand: isCollapsed
            });

            if (isCollapsed) {
                // Expand
                card.classList.remove('collapsed');
                card.classList.add('expanded');
                toggle.textContent = '×';

                // Show edit button when expanded
                if (editButton) {
                    editButton.style.display = 'inline-flex';
                }

                // Only show add button if edit mode is active for this card
                if (addButton) {
                    let isEditMode = false;

                    if (addButton.id === 'addClassBtn') {
                        isEditMode = window.schoolClassesEditMode;
                    } else if (addButton.id === 'addTrackBtn') {
                        isEditMode = window.schoolTracksEditMode;
                    } else if (addButton.id === 'addAdditionalStudyBtn') {
                        isEditMode = window.schoolAdditionalStudyEditMode;
                    }

                    addButton.style.display = isEditMode ? 'inline-flex' : 'none';
                }

                console.log('✅ Card EXPANDED');
            } else {
                // Collapse
                card.classList.remove('expanded');
                card.classList.add('collapsed');
                toggle.textContent = '+';

                // Hide all action buttons when collapsed
                if (editButton) {
                    editButton.style.display = 'none';
                }
                if (addButton) {
                    addButton.style.display = 'none';
                }

                console.log('✅ Card COLLAPSED');
            }
        }

        // ✅ Export both functions to window
        window.initializeCollapsibleCards = initializeCollapsibleCards;
        window.toggleCardExpansion = toggleCardExpansion;
        // School Classes Management Section
        // Store school classes edit mode state globally
        window.schoolClassesEditMode = window.schoolClassesEditMode || false;

        // Store last classes data for re-rendering
        window.lastSchoolClassesData = window.lastSchoolClassesData || [];


        // Setup edit classes button - TOGGLE ACTIONS COLUMN VISIBILITY
        function setupEditClassesButton() {
            const editBtn = document.getElementById('editClassesBtn');
            const addBtn = document.getElementById('addClassBtn');

            if (editBtn) {
                editBtn.onclick = function (event) {
                    event.stopPropagation();

                    window.schoolClassesEditMode = !window.schoolClassesEditMode;


                    // Toggle actions column visibility
                    const actionsColumn = document.querySelectorAll('[data-column="actions"]');
                    actionsColumn.forEach(cell => {
                        cell.style.display = window.schoolClassesEditMode ? '' : 'none';
                    });

                    // Toggle add button ONLY if card is expanded
                    if (addBtn) {
                        const card = editBtn.closest('.detail-card');
                        const isExpanded = card && card.classList.contains('expanded');
                        addBtn.style.display = (window.schoolClassesEditMode && isExpanded) ? 'inline-flex' : 'none';
                    }

                    // Update button icon/text
                    const btnImg = editBtn.querySelector('img');
                    if (btnImg) {
                        btnImg.alt = window.schoolClassesEditMode ? 'סגור עריכה' : 'עריכה';
                    }

                    console.log('✏️ Classes edit mode toggled:', window.schoolClassesEditMode);
                };
                console.log('✅ Edit classes button initialized');
            } else {
                console.warn('⚠️ Edit classes button not found');
            }
        }

        // Load school classes
        async function loadSchoolClasses() {
            console.log('📚 Loading school classes...');

            const container = document.getElementById('schoolClassesContent');
            if (!container) {
                console.error('❌ schoolClassesContent container not found');
                return;
            }

            try {
                const selectedSchoolYearId = await sessionManager.getSessionProperty('SelectedSchoolYearId');

                if (!selectedSchoolYearId) {
                    console.error('❌ No school year ID in session');
                    container.innerHTML = '<p style="color: #721c24; padding: 20px;">לא נמצא מזהה שנת לימודים</p>';
                    return;
                }

                const authToken = sessionStorage.getItem('authToken');
                if (!authToken) {
                    console.error('❌ No auth token found');
                    container.innerHTML = '<p style="color: #721c24; padding: 20px;">נדרש אימות. אנא התחבר מחדש.</p>';
                    return;
                }

                container.innerHTML = '<p style="padding: 20px;">טוען כיתות...</p>';

                const apiUrl = AppConfig.getApiUrl(`schoolClasses/by-school-year/${selectedSchoolYearId}`);
                console.log('🌐 Making API call to:', apiUrl);

                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log('📚 School classes received:', result);

                    if (result.success && result.data) {
                        displaySchoolClasses(result.data);
                    } else {
                        throw new Error('Invalid response format');
                    }
                } else {
                    const errorText = await response.text();
                    console.error('❌ API Error:', response.status, errorText);
                    container.innerHTML = `<p style="color: #721c24; padding: 20px;">שגיאה בטעינת כיתות: ${response.status}</p>`;
                }
            } catch (error) {
                console.error('💥 Exception in loadSchoolClasses:', error);
                container.innerHTML = '<p style="color: #721c24; padding: 20px;">שגיאה בטעינת כיתות בית הספר</p>';
            }
        }


        // Display school classes - READ-ONLY TABLE with HIDDEN ACTIONS COLUMN
        function displaySchoolClasses(classes) {
            console.log('📚 Displaying school classes:', classes);

            const container = document.getElementById('schoolClassesContent');
            if (!container) return;

            window.lastSchoolClassesData = classes || [];

            // Clear container
            container.innerHTML = '';

            // ✅ Just create table container (no add button here)
            const wrapper = document.createElement('div');
            wrapper.innerHTML = `<div id="classesTableContainer"></div>`;
            container.appendChild(wrapper);

            // Define columns - actions column hidden by default
            const columns = [
                {
                    key: 'level',
                    label: 'שכבה',
                    sortable: true,
                    readOnly: true
                },
                {
                    key: 'classNumber',
                    label: 'מספר כיתה',
                    sortable: true,
                    readOnly: true
                },
                {
                    key: 'actions',
                    label: 'פעולות',
                    sortable: false,
                    readOnly: true,
                    render: (item) => `
                <button class="btn-icon" onclick="deleteClassWithConfirmation(${item.id})" title="מחיקת כיתה">
                    <img src="delete_icon.png" alt="מחיקה" class="action-icon-natural">
                </button>
            `
                }
            ];

            // Create ReusableTable
            try {
                window.classesTable = new ReusableTable('classesTableContainer', {
                    tableName: 'schoolClasses',
                    isReadOnly: true,
                    allowAdd: false,
                    allowEdit: false,
                    allowDelete: false
                });

                window.classesTable.init(classes, columns);

                // ✅ HIDE actions column initially
                const actionsHeaders = document.querySelectorAll('#classesTableContainer th:last-child');
                const actionsCells = document.querySelectorAll('#classesTableContainer td:last-child');

                actionsHeaders.forEach(th => {
                    th.style.display = 'none';
                    th.setAttribute('data-column', 'actions');
                });

                actionsCells.forEach(td => {
                    td.style.display = 'none';
                    td.setAttribute('data-column', 'actions');
                });

                console.log('✅ ReusableTable created with hidden actions column');

            } catch (error) {
                console.error('❌ Error creating ReusableTable for classes:', error);
            }
        }

        // Show add class modal with frontend validation
        function showAddClassModal() {
            console.log('➕ Opening add class modal');

            const gradeLevels = [
                'א', 'ב', 'ג', 'ד', 'ה', 'ו',
                'ז', 'ח', 'ט', 'י', 'י״א', 'י״ב'
            ];

            const overlay = document.createElement('div');
            overlay.className = 'dialog-overlay';

            const dialog = document.createElement('div');
            dialog.className = 'dialog-box';
            dialog.style.minWidth = '400px';

            const options = gradeLevels.map(level =>
                `<option value="${level}">${level}</option>`
            ).join('');

            dialog.innerHTML = `
        <h3 class="dialog-title">הוספת כיתה חדשה</h3>
        <div style="margin: 20px 0;">
            <div style="margin-bottom: 15px;">
                <label for="newClassLevel" style="display: block; margin-bottom: 5px; font-weight: 600;">שכבה:</label>
                <select id="newClassLevel" style="
                    width: 100%;
                    padding: 8px;
                    border: 1px solid #dee2e6;
                    border-radius: 4px;
                    font-size: 14px;
                    direction: rtl;
                ">
                    <option value="">בחר שכבה...</option>
                    ${options}
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label for="newClassNumber" style="display: block; margin-bottom: 5px; font-weight: 600;">מספר כיתה:</label>
                <input type="text" id="newClassNumber" placeholder="הזן מספר כיתה" style="
                    width: 100%;
                    padding: 8px;
                    border: 1px solid #dee2e6;
                    border-radius: 4px;
                    font-size: 14px;
                    direction: rtl;
                ">
            </div>
        </div>
        <div class="dialog-buttons">
            <button id="addClassOkBtn" class="dialog-btn save">אישור</button>
            <button id="addClassCancelBtn" class="dialog-btn cancel">ביטול</button>
        </div>
    `;

            overlay.appendChild(dialog);
            document.body.appendChild(overlay);

            setTimeout(() => document.getElementById('newClassLevel')?.focus(), 100);

            // OK button handler
            document.getElementById('addClassOkBtn').onclick = async () => {
                const level = document.getElementById('newClassLevel').value.trim();
                const classNumber = document.getElementById('newClassNumber').value.trim();

                if (!level || !classNumber) {
                    alert('נא למלא את כל השדות');
                    return;
                }

                // ✅ Check if class already exists in current table data
                const exists = window.lastSchoolClassesData.some(cls =>
                    cls.level === level && cls.classNumber === classNumber
                );

                if (exists) {
                    alert(`כיתה ${level} ${classNumber} כבר קיימת`);
                    return;
                }

                document.body.removeChild(overlay);
                await addClassToDatabase(level, classNumber);
            };

            // Cancel button handler
            document.getElementById('addClassCancelBtn').onclick = () => {
                document.body.removeChild(overlay);
            };

            // ESC key to cancel
            const escHandler = (e) => {
                if (e.key === 'Escape' && document.body.contains(overlay)) {
                    document.body.removeChild(overlay);
                    document.removeEventListener('keydown', escHandler);
                }
            };
            document.addEventListener('keydown', escHandler);
        }

        // Add class to database via backend API
        async function addClassToDatabase(level, classNumber) {
            console.log('💾 Adding class to database:', { level, classNumber });

            try {
                const schoolYearId = await window.SessionState.getProperty('SelectedSchoolYearId');

                if (!schoolYearId) {
                    alert('לא נבחרה שנת לימודים');
                    return;
                }

                const response = await fetch(AppConfig.getApiUrl('schoolClasses'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=utf-8',
                        'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                    },
                    body: JSON.stringify({
                        schoolYearId: parseInt(schoolYearId),
                        level: level,
                        classNumber: classNumber
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    console.log('✅ Class added successfully');

                    // Refresh table
                    await loadSchoolClasses();

                    // Re-show actions column if in edit mode
                    if (window.schoolClassesEditMode) {
                        setTimeout(() => {
                            const actionsColumn = document.querySelectorAll('[data-column="actions"]');
                            actionsColumn.forEach(cell => cell.style.display = '');
                        }, 100);
                    }

                    alert('הכיתה נוספה בהצלחה');
                } else {
                    console.error('❌ Failed to add class:', result);
                    alert(result.message || 'שגיאה בהוספת הכיתה');
                }

            } catch (error) {
                console.error('💥 Error adding class:', error);
                alert('שגיאה בהוספת כיתה');
            }
        }

        // Delete class with confirmation and usage check via backend API
        async function deleteClassWithConfirmation(classId) {
            console.log('🗑️ Attempting to delete class:', classId);

            try {
                // ✅ Check if class is in use via backend API
                const checkResponse = await fetch(AppConfig.getApiUrl(`schoolClasses/${classId}/in-use`), {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                    }
                });

                if (!checkResponse.ok) {
                    throw new Error(`HTTP ${checkResponse.status}`);
                }

                const checkResult = await checkResponse.json();

                if (checkResult.success) {
                    if (checkResult.data.inUse) {
                        alert(`לא ניתן למחוק כיתה זו. יש ${checkResult.data.studentCount} תלמידים המשויכים לכיתה.`);
                        return;
                    }

                    // Show confirmation dialog
                    const confirmed = await showDeleteConfirmationDialog();

                    if (!confirmed) {
                        console.log('❌ Delete cancelled by user');
                        return;
                    }

                    // Delete from database via backend API
                    await deleteClassFromDatabase(classId);

                } else {
                    console.error('❌ Failed to check class usage:', checkResult);
                    alert(checkResult.message || 'שגיאה בבדיקת שימוש בכיתה');
                }

            } catch (error) {
                console.error('💥 Error checking class usage:', error);
                alert('שגיאה בבדיקת שימוש בכיתה');
            }
        }


        // Show delete confirmation dialog
        function showDeleteConfirmationDialog() {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'dialog-overlay';

                const dialog = document.createElement('div');
                dialog.className = 'dialog-box';

                dialog.innerHTML = `
            <h3 class="dialog-title warning">אישור מחיקה</h3>
            <p class="dialog-message">האם אתה בטוח שברצונך למחוק כיתה זו?</p>
            <p style="color: #6c757d; font-size: 0.9em; margin-top: 10px;">פעולה זו אינה ניתנת לביטול.</p>
            <div class="dialog-buttons">
                <button id="confirmDeleteBtn" class="dialog-btn delete">כן, מחק</button>
                <button id="cancelDeleteBtn" class="dialog-btn cancel">ביטול</button>
            </div>
        `;

                overlay.appendChild(dialog);
                document.body.appendChild(overlay);

                document.getElementById('confirmDeleteBtn').onclick = () => {
                    document.body.removeChild(overlay);
                    resolve(true);
                };

                document.getElementById('cancelDeleteBtn').onclick = () => {
                    document.body.removeChild(overlay);
                    resolve(false);
                };
            });
        }

        /// Delete class from database via backend API
        async function deleteClassFromDatabase(classId) {
            console.log('💾 Deleting class from database:', classId);

            try {
                const response = await fetch(AppConfig.getApiUrl(`schoolClasses/${classId}`), {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                    }
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    console.log('✅ Class deleted successfully');

                    // Refresh table
                    await loadSchoolClasses();

                    // Re-show actions column and add button if in edit mode
                    if (window.schoolClassesEditMode) {
                        setTimeout(() => {
                            const actionsColumn = document.querySelectorAll('[data-column="actions"]');
                            actionsColumn.forEach(cell => cell.style.display = '');

                            const addBtn = document.getElementById('addClassBtn');
                            if (addBtn) {
                                addBtn.style.display = 'inline-flex';
                            }
                        }, 100);
                    }

                    alert('הכיתה נמחקה בהצלחה');
                } else {
                    console.error('❌ Failed to delete class:', result);
                    alert(result.message || 'שגיאה במחיקת הכיתה');
                }

            } catch (error) {
                console.error('💥 Error deleting class:', error);
                alert('שגיאה במחיקת הכיתה');
            }
        }
        // School Attributes Management Section
        window.schoolAttributeTypes = window.schoolAttributeTypes || [];

        // Store edit mode state globally
        window.schoolAttributesEditMode = window.schoolAttributesEditMode || false;

        // Store last attributes data for re-rendering
        window.lastSchoolAttributesData = window.lastSchoolAttributesData || [];

        // ✅ Simple flag - set to true when ANY field changes
        window.hasUnsavedAttributeChanges = false;



        // Load attribute types dynamically from database
        async function loadAttributeTypes() {
            try {

                    if (window.schoolAttributesEditMode) {

                            if (action === 'save') {

                                await saveSchoolAttributes();
                                window.schoolAttributesEditMode = false;
                                window.hasUnsavedAttributeChanges = false;

                                displaySchoolAttributes(window.lastSchoolAttributesData || []);

        async function showTrackModal(trackData) {

                <div style="margin: 20px 0;">

                        ">
                            <option value="">בחר כיתה...</option>
                            ${classOptions}
                        </select>
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <label for="trackTrack" style="display: block; margin-bottom: 5px; font-weight: 600;">מגמה:</label>
                        <select id="trackTrack" style="
                            width: 100%;
                            padding: 8px;
                            border: 1px solid #dee2e6;
                            border-radius: 4px;
                            font-size: 14px;
                            direction: rtl;
                        " disabled>
                            <option value="">בחר תחילה כיתה...</option>
                        </select>
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <label for="trackLevel" style="display: block; margin-bottom: 5px; font-weight: 600;">רמת מגמה:</label>
                        <select id="trackLevel" style="
                            width: 100%;
                            padding: 8px;
                            border: 1px solid #dee2e6;
                            border-radius: 4px;
                            font-size: 14px;
                            direction: rtl;
                        " disabled>
                            <option value="">בחר תחילה מגמה...</option>
                        </select>
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <label for="trackHours" style="display: block; margin-bottom: 5px; font-weight: 600;">
                            מספר שעות:
                            <span id="hoursConstraint" style="color: #6c757d; font-weight: normal; font-size: 0.9em;"></span>
                        </label>
                        <input type="number" id="trackHours" placeholder="הזן מספר שעות" min="0" step="1"
                            value="${trackData ? trackData.weeklyHours : ''}"
                            style="
                            width: 100%;
                            padding: 8px;
                            border: 1px solid #dee2e6;
                            border-radius: 4px;
                            font-size: 14px;
                            direction: rtl;
                        ">
                        <div id="hoursError" style="color: #dc3545; font-size: 0.85em; margin-top: 5px; display: none;"></div>
                    </div>
                    
                    <input type="hidden" id="trackRecordId" value="${trackData ? trackData.id : ''}">
                </div>
                <div class="dialog-buttons">
                    <button id="trackOkBtn" class="dialog-btn save">אישור</button>
                    <button id="trackCancelBtn" class="dialog-btn cancel">ביטול</button>
                </div>
            `;

                overlay.appendChild(dialog);
                document.body.appendChild(overlay);

                // ✅ Get element references AFTER appending to DOM
                const classSelect = document.getElementById('trackClass');
                const trackSelect = document.getElementById('trackTrack');
                const levelSelect = document.getElementById('trackLevel');
                const hoursInput = document.getElementById('trackHours');
                const hoursConstraint = document.getElementById('hoursConstraint');
                const hoursError = document.getElementById('hoursError');

                // ✅ Setup class selection change handler - loads tracks filtered by class level
                classSelect.onchange = async function () {
                    const classId = this.value;

                    // Reset track and level dropdowns
                    trackSelect.innerHTML = '<option value="">טוען מגמות...</option>';
                    trackSelect.disabled = true;
                    levelSelect.innerHTML = '<option value="">בחר תחילה מגמה...</option>';
                    levelSelect.disabled = true;

                    if (hoursConstraint) hoursConstraint.textContent = '';
                    if (hoursError) hoursError.style.display = 'none';

                    if (!classId) {
                        trackSelect.innerHTML = '<option value="">בחר תחילה כיתה...</option>';
                        return;
                    }

                    try {
                        // ✅ Get class level from the selected option
                        const selectedOption = this.options[this.selectedIndex];
                        const classLevel = selectedOption.getAttribute('data-level');

                        if (!classLevel) {
                            console.error('❌ No class level found for selected class');
                            trackSelect.innerHTML = '<option value="">שגיאה: לא נמצאה שכבה</option>';
                            return;
                        }

                        console.log(`📚 Loading tracks for year ${selectedYearId} and class level ${classLevel}`);

                        // ✅ Load tracks filtered by year and class level
                        const tracksResponse = await fetch(
                            AppConfig.getApiUrl(`tracks/by-year/${selectedYearId}/class-level/${encodeURIComponent(classLevel)}`),
                            {
                                method: 'GET',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                                }
                            }
                        );

                        if (!tracksResponse.ok) {
                            throw new Error('Failed to load tracks for class level');
                        }

                        const tracksResult = await tracksResponse.json();
                        console.log('📚 Tracks API response:', tracksResult);

                        const tracks = tracksResult.success ? tracksResult.data : [];
                        console.log(`📚 Tracks loaded: ${tracks.length} tracks`);

                        if (tracks.length === 0) {
                            trackSelect.innerHTML = `<option value="">אין מגמות זמינות לשכבה ${classLevel}</option>`;
                            trackSelect.disabled = true;
                            return;
                        }

                        const trackOptions = tracks.map(t =>
                            `<option value="${t.id}" ${trackData && trackData.trackId === t.id ? 'selected' : ''}>
                            ${t.name}
                        </option>`
                        ).join('');

                        trackSelect.innerHTML = `<option value="">בחר מגמה...</option>${trackOptions}`;
                        trackSelect.disabled = false;

                        console.log(`✅ Loaded ${tracks.length} tracks for class level ${classLevel}`);

                        // ✅ If editing and track is pre-selected, trigger track change
                        if (trackData && trackData.trackId) {
                            trackSelect.value = trackData.trackId;
                            await trackSelect.onchange.call(trackSelect);
                        }

                    } catch (error) {
                        console.error('❌ Error loading tracks for class:', error);
                        trackSelect.innerHTML = '<option value="">שגיאה בטעינת מגמות</option>';
                        trackSelect.disabled = true;
                    }
                };

                // Setup track selection change handler - loads track levels
                trackSelect.onchange = async function () {
                    const trackId = this.value;
                    levelSelect.innerHTML = '<option value="">טוען רמות...</option>';
                    levelSelect.disabled = true;

                    if (hoursConstraint) hoursConstraint.textContent = '';
                    if (hoursError) hoursError.style.display = 'none';

                    if (!trackId) {
                        levelSelect.innerHTML = '<option value="">בחר תחילה מגמה...</option>';
                        return;
                    }

                    try {
                        // Load track levels for selected track
                        const levelsResponse = await fetch(AppConfig.getApiUrl(`trackLevels/by-track/${trackId}`), {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                            }
                        });

                        if (!levelsResponse.ok) {
                            throw new Error('Failed to load track levels');
                        }

                        const levelsResult = await levelsResponse.json();
                        const levels = levelsResult.success ? levelsResult.data : [];

                        if (levels.length === 0) {
                            levelSelect.innerHTML = '<option value="">אין רמות זמינות</option>';
                            levelSelect.disabled = true;
                            return;
                        }

                        // ✅ Store constraints for each level
                        window.trackLevelConstraints.clear();
                        levels.forEach(l => {
                            window.trackLevelConstraints.set(l.id, {
                                minHours: l.minHours,
                                maxHours: l.maxHours
                            });
                        });

                        const levelOptions = levels.map(l =>
                            `<option value="${l.id}" data-min="${l.minHours}" data-max="${l.maxHours || ''}">
                            ${l.levelName || l.level || ''}
                        </option>`
                        ).join('');

                        levelSelect.innerHTML = `<option value="">בחר רמת מגמה...</option>${levelOptions}`;
                        levelSelect.disabled = false;

                        // ✅ If editing, set the selected level
                        if (trackData && trackData.trackLevelId) {
                            levelSelect.value = trackData.trackLevelId;
                            if (levelSelect.onchange) {
                                levelSelect.onchange();
                            }
                        }

                    } catch (error) {
                        console.error('❌ Error loading track levels:', error);
                        levelSelect.innerHTML = '<option value="">שגיאה בטעינת רמות</option>';
                        levelSelect.disabled = true;
                    }
                };

                // ✅ Setup level selection change handler - update hours constraint display
                levelSelect.onchange = function () {
                    const levelId = parseInt(this.value);
                    if (hoursError) hoursError.style.display = 'none';

                    if (!levelId) {
                        if (hoursConstraint) hoursConstraint.textContent = '';
                        return;
                    }

                    const constraints = window.trackLevelConstraints.get(levelId);
                    if (constraints && hoursConstraint) {
                        const minText = `מינימום: ${constraints.minHours}`;
                        const maxText = constraints.maxHours ? `, מקסימום: ${constraints.maxHours}` : '';
                        hoursConstraint.textContent = `(${minText}${maxText})`;
                    }
                };

                // ✅ Validate hours on input
                hoursInput.oninput = function () {
                    const levelId = parseInt(levelSelect.value);
                    if (!levelId) return;

                    const hours = parseInt(this.value);
                    const constraints = window.trackLevelConstraints.get(levelId);

                    if (!constraints || isNaN(hours) || !hoursError) {
                        if (hoursError) hoursError.style.display = 'none';
                        return;
                    }

                    if (hours < constraints.minHours) {
                        hoursError.textContent = `מספר השעות חייב להיות לפחות ${constraints.minHours}`;
                        hoursError.style.display = 'block';
                    } else if (constraints.maxHours && hours > constraints.maxHours) {
                        hoursError.textContent = `מספר השעות לא יכול לעבור ${constraints.maxHours}`;
                        hoursError.style.display = 'block';
                    } else {
                        hoursError.style.display = 'none';
                    }
                };

                // ✅ If editing with pre-selected class, trigger class change to load tracks
                if (trackData && trackData.classId) {
                    classSelect.value = trackData.classId;
                    await classSelect.onchange.call(classSelect);
                }

                // OK button handler with validation and save
                document.getElementById('trackOkBtn').onclick = async () => {
                    const classId = document.getElementById('trackClass').value;
                    const trackId = document.getElementById('trackTrack').value;
                    const levelId = document.getElementById('trackLevel').value;
                    const hours = parseInt(document.getElementById('trackHours').value);
                    const recordId = document.getElementById('trackRecordId').value;

                    // Validate required fields
                    if (!classId || !trackId || !hours) {
                        alert('נא למלא את כל השדות הנדרשים');
                        return;
                    }

                    // ✅ Validate hours against track level constraints
                    if (levelId) {
                        const constraints = window.trackLevelConstraints.get(parseInt(levelId));
                        if (constraints) {
                            if (hours < constraints.minHours) {
                                alert(`מספר השעות חייב להיות לפחות ${constraints.minHours}`);
                                return;
                            }
                            if (constraints.maxHours && hours > constraints.maxHours) {
                                alert(`מספר השעות לא יכול לעבור ${constraints.maxHours}`);
                                return;
                            }
                        }
                    }

                    console.log('📝 Saving track:', {
                        recordId: recordId || null,
                        schoolYearId: selectedSchoolYearId,
                        trackId,
                        trackLevelId: levelId || null,
                        classId,
                        weeklyHours: hours,
                        isEdit: !!recordId
                    });

                    try {
                        const url = recordId
                            ? AppConfig.getApiUrl(`schoolTracks/${recordId}`)
                            : AppConfig.getApiUrl('schoolTracks');

                        const method = recordId ? 'PUT' : 'POST';

                        const payload = {
                            schoolYearId: parseInt(selectedSchoolYearId),
                            trackId: parseInt(trackId),
                            trackLevelId: levelId ? parseInt(levelId) : null,
                            classId: parseInt(classId),
                            weeklyHours: hours
                        };

                        if (recordId) {
                            payload.id = parseInt(recordId);
                        }

                        const response = await fetch(url, {
                            method: method,
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                            },
                            body: JSON.stringify(payload)
                        });

                        const result = await response.json();

                        if (response.ok && result.success) {
                            console.log('✅ Track saved successfully');
                            document.body.removeChild(overlay);

                            // Refresh tracks table
                            await loadSchoolTracks();

                        } else {
                            console.error('❌ Failed to save track:', result);
                            alert(result.message || 'שגיאה בשמירת המגמה');
                        }

                    } catch (error) {

        async function confirmSaveSchoolDetails() {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'dialog-overlay';

                const dialog = document.createElement('div');
                dialog.className = 'dialog-box';

                dialog.innerHTML = `
            <h3 class="dialog-title">אישור שמירת שינויים</h3>
            <p class="dialog-message">האם אתה בטוח שברצונך לשמור את השינויים בפרטי בית הספר?</p>
            <p style="color: #6c757d; font-size: 0.9em; margin-top: 10px;">שינויים אלה יישמרו כגרסה חדשה.</p>
            <div class="dialog-buttons">
                <button id="confirmSaveBtn" class="dialog-btn save">כן, שמור</button>
                <button id="cancelSaveBtn" class="dialog-btn cancel">ביטול</button>
            </div>
        `;

                overlay.appendChild(dialog);
                document.body.appendChild(overlay);

                document.getElementById('confirmSaveBtn').onclick = () => {
                    document.body.removeChild(overlay);
                    resolve(true);
                };

                document.getElementById('cancelSaveBtn').onclick = () => {
                    document.body.removeChild(overlay);
                    resolve(false);
                };

                // ESC key handler
                const escHandler = (e) => {
                    if (e.key === 'Escape' && document.body.contains(overlay)) {
                        document.body.removeChild(overlay);
                        document.removeEventListener('keydown', escHandler);
                        resolve(false);
                    }
                };
                document.addEventListener('keydown', escHandler);
            });
        }

        //  Save school details without reloading data including address and person references
        async function saveSchoolDetails() {
            console.log('💾 Saving school details with versioning...');

            try {
                const schoolYearId = await sessionManager.getSessionProperty('SelectedSchoolYearId');

                if (!schoolYearId) {
                    alert('לא נמצא מזהה שנת לימודים');
                    return false;
                }

                // ✅ Get values from form fields
                const symbol = document.getElementById('schoolSymbol')?.value.trim();
                const characterizationId = document.getElementById('schoolCharacterization')?.value;
                const educationStage = document.getElementById('schoolEducationStage')?.value;
                const councilId = document.getElementById('schoolCouncil')?.value;
                const phone = document.getElementById('schoolPhone')?.value.trim();
                const email = document.getElementById('schoolEmail')?.value.trim();

                // ✅ Get address and person references from CURRENT cached data
                const currentData = window.lastSchoolDetailsData;

                const street = currentData.street || null;
                const houseNumber = currentData.houseNumber || null;
                const city = currentData.city || null;
                const postCode = currentData.postCode || null;

                const principalId = currentData.principalId || null;
                const inspectorId = currentData.inspectorId || null;
                const contactPersonId = currentData.contactPersonId || null;

                // ✅ Compare against ORIGINAL data (not current cached data)
                const originalData = window.originalSchoolDetailsData || currentData;

                console.log('🔍 Comparing for changes:', {
                    current: {
                        symbol,
                        characterizationId: characterizationId ? parseInt(characterizationId) : null,
                        educationStage,
                        councilId: councilId ? parseInt(councilId) : null,
                        phone,
                        email,
                        street,
                        houseNumber,
                        city,
                        postCode,
                        principalId,
                        inspectorId,
                        contactPersonId
                    },
                    original: {
                        symbol: originalData.symbol,
                        characterizationId: originalData.characterizationId,
                        educationStage: originalData.educationStage,
                        councilId: originalData.councilId,
                        phone: originalData.phone,
                        email: originalData.email,
                        street: originalData.street,
                        houseNumber: originalData.houseNumber,
                        city: originalData.city,
                        postCode: originalData.postCode,
                        principalId: originalData.principalId,
                        inspectorId: originalData.inspectorId,
                        contactPersonId: originalData.contactPersonId
                    }
                });

                const hasChanges =
                    symbol !== (originalData.symbol || '') ||
                    (characterizationId ? parseInt(characterizationId) : null) !== originalData.characterizationId ||
                    (educationStage || null) !== originalData.educationStage ||
                    (councilId ? parseInt(councilId) : null) !== originalData.councilId ||
                    (phone || null) !== originalData.phone ||
                    (email || null) !== originalData.email ||
                    street !== originalData.street ||
                    houseNumber !== originalData.houseNumber ||
                    city !== originalData.city ||
                    postCode !== originalData.postCode ||
                    principalId !== originalData.principalId ||
                    inspectorId !== originalData.inspectorId ||
                    contactPersonId !== originalData.contactPersonId;

                console.log('📊 Has changes:', hasChanges);

                if (!hasChanges) {
                    console.log('ℹ️ No changes detected - skipping save');
                    return true;
                }

                // Validate required fields
                if (!symbol) {
                    alert('נא להזין סמל בית ספר');
                    document.getElementById('schoolSymbol')?.focus();
                    return false;
                }

                if (!/^\d{1,8}$/.test(symbol)) {
                    alert('סמל בית ספר חייב להכיל ספרות בלבד (עד 8 ספרות)');
                    document.getElementById('schoolSymbol')?.focus();
                    return false;
                }

                if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    alert('כתובת דוא"ל לא תקינה');
                    document.getElementById('schoolEmail')?.focus();
                    return false;
                }

                // ✅ Build complete payload
                const payload = {
                    schoolYearId: parseInt(schoolYearId),
                    symbol: symbol,
                    characterizationId: characterizationId ? parseInt(characterizationId) : null,
                    educationStage: educationStage || null,
                    councilId: councilId ? parseInt(councilId) : null,
                    phone: phone || null,
                    email: email || null,
                    street: street,
                    houseNumber: houseNumber,
                    city: city,
                    postCode: postCode,
                    principalId: principalId,
                    inspectorId: inspectorId,
                    contactPersonId: contactPersonId
                };

                console.log('📝 Sending school details update with versioning:', payload);

                const response = await fetch(AppConfig.getApiUrl('school/update-details'), {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    console.log('✅ School details saved successfully with new version:', result.data.newVersion);

                    // Reset flags
                    window.hasUnsavedSchoolDetailsChanges = false;
                    updateSchoolDetailsCardTitle();

                    alert('פרטי בית הספר עודכנו בהצלחה');
                    return true;
                } else {
                    console.error('❌ Failed to save school details:', result);
                    alert(result.message || 'שגיאה בשמירת פרטי בית הספר');
                    return false;
                }

            } catch (error) {
                console.error('💥 Error saving school details:', error);
                alert('שגיאה בשמירת פרטי בית הספר');
                return false;
            }
        }

        // Load school attributes following API Communication Pattern
        async function loadSchoolAttributes() {
            console.log('🏢 Loading school attributes...');

            const container = document.getElementById('schoolattributesContent');
            if (!container) {
                console.error('❌ schoolattributesContent container not found');
                return;
            }

            try {
                const selectedSchoolYearId = await sessionManager.getSessionProperty('SelectedSchoolYearId');

                if (!selectedSchoolYearId) {
                    console.error('❌ No school year ID in session');
                    container.innerHTML = '<p style="color: #721c24; padding: 20px;">לא נמצא מזהה שנת לימודים</p>';
                    return;
                }

                const authToken = sessionStorage.getItem('authToken');
                if (!authToken) {
                    console.error('❌ No auth token found');
                    container.innerHTML = '<p style="color: #721c24; padding: 20px;">נדרש אימות. אנא התחבר מחדש.</p>';
                    return;
                }

                // Show loading state
                container.innerHTML = '<p style="padding: 20px;">טוען שירותי בית ספר...</p>';

                // API call following API Communication Pattern
                const apiUrl = AppConfig.getApiUrl(`schoolAttributes/by-school-year/${selectedSchoolYearId}`);
                console.log('🌐 Making API call to:', apiUrl);

                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                console.log('📥 Response:', response.status, response.ok);

                if (response.ok) {
                    const result = await response.json();
                    console.log('🏢 School attributes received:', result);

                    if (result.success && result.data) {
                        displaySchoolAttributes(result.data);
                    } else {
                        throw new Error('Invalid response format');
                    }
                } else {
                    const errorText = await response.text();
                    console.error('❌ API Error:', response.status, errorText);
                    container.innerHTML = `<p style="color: #721c24; padding: 20px;">שגיאה בטעינת שירותי בית הספר: ${response.status}</p>`;
                }
            } catch (error) {
                console.error('💥 Exception in loadSchoolAttributes:', error);
                container.innerHTML = '<p style="color: #721c24; padding: 20px;">שגיאה בטעינת שירותי בית הספר</p>';
            }
        }

        // Update displaySchoolAttributes to capture original values and add onchange handlers
        function displaySchoolAttributes(attributes) {
            console.log('🏢 Displaying school attributes:', attributes);

            const container = document.getElementById('schoolattributesContent');
            if (!container) return;

            // Map existing attributes by attributeId
            const attrMap = {};
            (attributes || []).forEach(attr => {
                attrMap[attr.attributeTypeId] = attr;
            });

            // Save for re-rendering when edit mode changes
            window.lastSchoolAttributesData = attributes || [];


            const isEditMode = !!window.schoolAttributesEditMode;
            console.log('🔧 Rendering attributes in edit mode:', isEditMode);

            // Create attributes display with editable fields following Hebrew/RTL patterns
            // Create attributes display dynamically from database types
            const attributesHTML = `
        <div class="attributes-grid" style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            direction: rtl;
        ">
            ${window.schoolAttributeTypes.map(attrType => {
                // Get existing attribute data or use defaults
                const existingAttr = attrMap[attrType.id] || {};

                // Capture all required fields for update
                const recordId = existingAttr.id || null;
                const version = existingAttr.version || 0;

                let value = existingAttr.value;
                let displayValue = existingAttr.displayValue;

                // Set default values if missing
                if (attrType.attributeValueType === 'Boolean') {
                    const boolValue = value === 'true' ||
                        value === '1' ||
                        value === 'True' ||
                        value === 'TRUE' ||
                        value === true ||
                        value === 1;
                    value = boolValue;
                    displayValue = boolValue ? 'כן' : 'לא';
                } else if (attrType.attributeValueType === 'Integer') {
                    value = value || '0';
                    displayValue = value;
                } else if (attrType.attributeValueType === 'List') {
                    value = value || '';
                }

                // Render based on attribute type
                let inputField = '';

                if (attrType.attributeValueType === 'Boolean') {
                    const isChecked = !!value;
                    inputField = `
                        <div class="attribute-checkbox-container">
                            <input type="checkbox" 
                                   class="attribute-checkbox"
                                   id="attr_${attrType.id}"
                                   data-attribute-id="${attrType.id}"
                                   data-value-type="Boolean"
                                   ${isChecked ? 'checked' : ''} 
                                   ${isEditMode ? '' : 'disabled'}
                                   onchange="window.hasUnsavedAttributeChanges = true;">
                            <label for="attr_${attrType.id}" class="attribute-checkbox-label">
                                ${displayValue}
                            </label>
                        </div>
                    `;
                } else if (attrType.attributeValueType === 'Integer') {
                    inputField = `
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <input type="number" 
                                   class="attribute-input"
                                   id="attr_${attrType.id}"
                                   data-attribute-id="${attrType.id}"
                                   data-value-type="Integer"
                                   value="${value}"
                                   min="0"
                                   step="1"
                                   ${isEditMode ? '' : 'disabled'}
                                   onchange="window.hasUnsavedAttributeChanges = true;">
                            <span class="attribute-suffix">שעות</span>
                        </div>
                    `;
                } else if (attrType.attributeValueType === 'List') {
                    const currentValueId = value || '';
                    const possibleValues = attrType.possibleValues || [];

                    inputField = `
                        <select class="attribute-select"
                                id="attr_${attrType.id}"
                                data-attribute-id="${attrType.id}"
                                data-value-type="List"
                                ${isEditMode ? '' : 'disabled'}
                                onchange="window.hasUnsavedAttributeChanges = true;">
                            <option value="">בחר...</option>
                            ${possibleValues.map(option => `
                                <option value="${option.id}" ${currentValueId == option.id ? 'selected' : ''}>
                                    ${option.value}
                                </option>
                            `).join('')}
                        </select>
                    `;
                }

                return `
                    <div class="attribute-item"
                         data-record-id="${recordId || ''}"
                         data-version="${version}">
                        <label for="attr_${attrType.id}" class="attribute-label">
                            ${attrType.hebrewName}
                        </label>
                        ${inputField}
                    </div>
                `;
            }).join('')}

        async function saveSchoolAttributes() {
            console.log('💾 Saving school attributes...');

            try {
                const schoolYearId = await window.SessionState.getProperty('SelectedSchoolYearId');

                if (!schoolYearId) {
                    alert('לא נבחרה שנת לימודים');
                    return;
                }

                const changes = [];


                for (const attrType of window.schoolAttributeTypes) {
                    const element = document.getElementById(`attr_${attrType.id}`);
                    if (!element) continue;

                    const container = element.closest('.attribute-item');
                    const recordId = container?.dataset.recordId ? parseInt(container.dataset.recordId) : null;
                    const version = parseInt(container?.dataset.version || '0', 10);

                    let newValue;

                    if (attrType.attributeValueType === 'Boolean') {
                        newValue = element.checked ? 'true' : 'false';
                    } else if (attrType.attributeValueType === 'List') {
                        newValue = element.value;
                    } else {
                        newValue = element.value;
                    }

                    changes.push({
                        id: recordId,
                        attributeTypeId: attrType.id,
                        value: newValue,
                        version: version
                    });
                }

                console.log('📝 Sending changes to server:', {
                    schoolYearId: schoolYearId,
                    attributes: changes
                });

                const response = await fetch(AppConfig.getApiUrl('schoolAttributes/update'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        schoolYearId: parseInt(schoolYearId),
                        attributes: changes
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    console.log('✅ Attributes saved successfully:', result.data);

                    // Reload fresh data from server
                    await loadSchoolAttributes();

                    // Reset flags
                    window.hasUnsavedAttributeChanges = false;

                    alert('שירותי בית הספר עודכנו בהצלחה');
                } else {
                    console.error('❌ Failed to save attributes:', result);
                    alert(result.message || 'שגיאה בשמירת השירותים');
                }

            } catch (error) {
                console.error('💥 Error saving school attributes:', error);
                alert('שגיאה בשמירת שירותי בית הספר');
            }
        }

        // Generic page loading function following Frontend Architecture Patterns
        function loadPageDirectly(filename, section, displayName) {
            console.log(`🔄 Loading ${filename} page directly...`);

            // Find the main content container following Project-Specific Patterns
            const mainContainer = document.getElementById('dynamicContent') ||
                document.getElementById('mainContent') ||
                document.querySelector('.main-content') ||
                document.querySelector('main') ||
                document.body;

            if (!mainContainer) {
                console.error('❌ Could not find main content container');
                return;
            }

            // Show loading state following Hebrew/RTL Specific Patterns
            mainContainer.innerHTML = `
                <div class="loading-spinner" style="text-align: center; padding: 40px; direction: rtl;">
                    <div style="font-size: 1.2em; margin-bottom: 15px;">טוען ${displayName}...</div>
                    <div style="color: #6c757d;">אנא המתן...</div>
                </div>
            `;

            // Fetch and load page following API Communication Pattern
            fetch(filename)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    console.log(`✅ ${filename} page loaded successfully`);
                    mainContainer.innerHTML = html;

                    // Execute scripts safely following Critical Development Workflows
                    executeScriptsInContainer(mainContainer);

                    // Update browser history following Single-Page Application patterns
                    history.pushState({ section: section }, '', `#${section}`);

                    console.log(`✅ ${displayName} page loaded and initialized`);
                })
                .catch(error => {
                    console.error(`❌ Error loading ${filename} page:`, error);
                    showNavigationError(mainContainer, `שגיאה בטעינת ${displayName}`);
                });
        }
