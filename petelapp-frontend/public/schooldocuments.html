<!-- School Title Section -->
<div class="school-title-section">
    <div class="page-title-container">
        
        <div class="page-title" id="schoolTitle">מסמכים בית ספריים</div>
        
        <div id="schoolDocumentYearDisplay" class="text-branded" style="text-align: center;"></div>
        <div class="left-spacer"></div>
    </div>
</div>
<div class="students-container">
    <!-- Context buttons -->
    <div class="context-buttons-section">
        <button class="context-btn" onclick="generateDocumentsForSchool()">
            עדכן רשימת מסמכים לבית הספר
        </button>
        <div class="context-spacer"></div>
        <button class="context-navigation-btn" onclick="navigateToSchoolDashboard()">לדף בית הספר</button>
        <button class="context-navigation-btn" onclick="navigateBackToSchoolList()" title="חזרה לרשימת בתי הספר">
            חזרה לרשימת בתי הספר
        </button>
    </div>

    <!-- Main content area -->
    <div class="students-content">

        <div class="content-card">

            <!-- Documents table component will be rendered here -->
            <div id="schoolDocumentsContainer"></div>
        </div>
    </div>
</div>

<script src="documents-table.js"></script>
<script>
    (function () {
        'use strict';
        console.log('📄 School Documents page loaded');

        // Update the loadSchoolTitle function in schooldocuments.html
        async function loadSchoolTitle() {
            console.log('📋 Loading school title from SessionState...');

            try {
                // ✅ Use centralized SessionState
                const session = await window.SessionState.getSession();
                const yearValue = await window.SessionState.getProperty('SelectedYearValue');

                let schoolName = session.entityName;

                //   if (parseInt(session.entityTypeId, 10) === 5) {
                // Multi-school network - get selected school name
                const selectedSchoolName = await window.SessionState.getProperty('SelectedSchoolName');
                if (selectedSchoolName) {
                    schoolName = selectedSchoolName;
                }
                //  }

                console.log('🏫 School context:', { schoolName, yearValue });

                const titleElement = document.getElementById('schoolTitle');
                const yearElement = document.getElementById('schoolDocumentYearDisplay');

                if (titleElement) {
                    titleElement.textContent = "מסמכים בית ספריים - "  + schoolName;
                    console.log('✅ School title updated via SessionState');
                }

                if (yearElement && yearValue) {
                    yearElement.textContent = yearValue;
                }

            } catch (error) {
                console.error('❌ Error loading school title:', error);
                const titleElement = document.getElementById('schoolTitle');
                if (titleElement) {
                    titleElement.textContent = 'לוח בקרה של בית ספר';
                }
            }
        }



        let documentsComponent = null;

        // Initialize page
        async function initializeDocumentsPage() {
            try {
                console.log('🔧 Initializing school documents page...');

                // Get session context
                const session = await window.SessionState.getSession();
                const selectedSchoolId = await window.SessionState.getProperty('SelectedSchoolId');
                const selectedYearId = await window.SessionState.getProperty('SelectedYearId');
                const selectedSchoolName = await window.SessionState.getProperty('SelectedSchoolName');



                // Validate session context
                if (!selectedSchoolId) {
                    console.error('❌ No school selected, redirecting to school list');
                    alert('לא נבחר בית ספר. חוזר לרשימת בתי הספר...');
                    if (typeof window.navigateTo === 'function') {
                        window.navigateTo('schoollist');
                    }
                    return;
                }

                const displayName = selectedSchoolName || 'לא ידוע';

                console.log('📋 Documents for school context:',
                    selectedSchoolId,
                    selectedYearId, displayName
                );



                await loadSchoolTitle();

                // Initialize documents table component
                documentsComponent = new DocumentsTableComponent('schoolDocumentsContainer', {
                    showUploadForm: false,
                    allowDelete: false,
                    allowDownload: true,
                    allowUpload: true,
                    entityId: selectedSchoolId,
                    entityType: 'school',
                    yearId: selectedYearId,
                    onUploadSuccess: (result) => {
                        console.log('📄 Document uploaded:', result);
                    },
                    onDeleteSuccess: (documentId) => {
                        console.log('🗑 Document deleted:', documentId);
                    }
                });

                // Create global reference for button onclick handlers
                window[`documentsTableInstance_schoolDocumentsContainer`] = documentsComponent;

                await documentsComponent.init();

                console.log('✅ School documents page initialized');
            } catch (error) {
                console.error('❌ Error initializing documents page:', error);
                alert('שגיאה באתחול עמוד המסמכים');
            }
        }



        // ✅ Cleanup function - called when leaving the page
        function cleanupSchoolDocumentsPage() {
            try {
                console.log('🧹 Cleaning up documents page...');

                // Cleanup component instance
                if (documentsComponent) {
                    // Clear table reference
                    if (documentsComponent.documentsTable) {
                        documentsComponent.documentsTable = null;
                    }

                    // Clear document types
                    documentsComponent.documentTypes = [];

                    // Null the component
                    documentsComponent = null;
                }

                // Remove global reference
                if (window[`documentsTableInstance_schoolDocumentsContainer`]) {
                    delete window[`documentsTableInstance_schoolDocumentsContainer`];
                }

                // Clear container HTML
                const container = document.getElementById('schoolDocumentsContainer');
                if (container) {
                    container.innerHTML = '';
                }

                console.log('✅ Documents page cleanup complete');
            } catch (error) {
                console.error('❌ Error during cleanup:', error);
            }
        }

        // Navigation functions




        async function navigateToSchoolDashboard() {
            console.log('📊 Navigating to school dashboard...');
            try {


                if (typeof window.navigateTo === 'function') {
                    window.navigateTo('schooldashboard');
                } else {
                    console.error('❌ navigateTo function not available');
                    alert('שגיאה בניווט ללוח בקרה');
                }
            } catch (error) {
                console.error('💥 Error navigating to school dashboard:', error);
                alert('שגיאה בטעינת לוח בקרה');
            }
        }


        /**
 * Generate missing documents for the current school
 */
        async function generateDocumentsForSchool() {
            try {
                const schoolId = await window.SessionState.getProperty('SelectedSchoolId');
                const schoolYearId = await window.SessionState.getProperty('SelectedSchoolYearId');
                const yearId = await window.SessionState.getProperty('SelectedYearId');

                if (!schoolId) {
                    alert('לא נמצא בית ספר נבחר');
                    return;
                }

                if (!yearId) {
                    alert('לא נמצאה שנת לימודים נבחרת');
                    return;
                }

                console.log(`📄 Generating documents for school entity ${schoolId} in year ${yearId}`);

                // Show loading message
                const loadingDiv = document.createElement('div');
                loadingDiv.id = 'schoolDocumentGenerationLoading';
                loadingDiv.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10000;
            text-align: center;
            direction: rtl;
        `;
                loadingDiv.innerHTML = `
            <div style="font-size: 18px; font-weight: bold; margin-bottom: 15px;">
                מייצר מסמכים חסרים לבית הספר...
            </div>
            <div style="font-size: 14px; color: #666;">אנא המתן</div>
        `;
                document.body.appendChild(loadingDiv);

                const response = await fetch(
                    AppConfig.getApiUrl(`documents/generate-school-documents?schoolId=${schoolId}&yearId=${yearId}&schoolYearId=${schoolYearId}`),
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                // Remove loading message
                const loading = document.getElementById('schoolDocumentGenerationLoading');
                if (loading) loading.remove();

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'שגיאה ביצירת מסמכים');
                }

                const result = await response.json();

                console.log('✅ School document generation result:', result);

                // Show success message
                alert(
                    `${result.message}\n\n` +
                    `נוספו: ${result.addedCount} מסמכים\n` +
                    `קיימים (דולגו): ${result.skippedCount} מסמכים\n` +
                    `לא רלוונטיים: ${result.notRequiredCount || 0} מסמכים\n` +
                    `סה"כ סוגי מסמכים: ${result.totalTypes}`
                );

                // ✅ Refresh the documents list
                if (documentsComponent && typeof documentsComponent.loadDocumentsTable === 'function') {
                    console.log('🔄 Refreshing documents list...');
                    await documentsComponent.loadDocumentsTable();
                    console.log('✅ Documents list refreshed');
                } else {
                    console.warn('⚠️ Documents component not available for refresh');


                }
            }
            catch (error) {
                console.error('❌ Error generating school documents:', error);

                // Remove loading message if still present
                const loading = document.getElementById('schoolDocumentGenerationLoading');
                if (loading) loading.remove();

                alert(`שגיאה ביצירת מסמכים לבית הספר: ${error.message}`);
            }
        }

        window.generateDocumentsForSchool = generateDocumentsForSchool;



        // ✅ CORRECTED - Proper screen flow pattern
        async function navigateBackToSchoolList() {
            console.log('⬅️ Navigating back to school list...');

            try {


                // Clear school-specific session properties using SessionState
                await window.SessionState.setProperty('SelectedSchoolId', '');
                await window.SessionState.setProperty('SelectedSchoolName', '');


                console.log('🧹 Cleared school-specific session properties');

                // Use centralized navigation function
                if (typeof window.navigateTo === 'function') {
                    window.navigateTo('schoollist');
                } else {
                    console.error('❌ navigateTo function not available');
                    alert('שגיאה בחזרה לרשימת בתי הספר');
                }
            } catch (error) {
                console.error('💥 Error navigating back to school list:', error);
                alert('שגיאה בחזרה לרשימת בתי הספר');
            }
        }
        // Make functions globally available

        window.navigateToSchoolDashboard = navigateToSchoolDashboard;
        window.navigateBackToSchoolList = navigateBackToSchoolList;
        window.cleanupSchoolDocumentsPage = cleanupSchoolDocumentsPage;

        // Initialize on load - Common Gotchas pattern
        document.addEventListener('DOMContentLoaded', initializeDocumentsPage);
        if (document.readyState !== 'loading') {
            setTimeout(initializeDocumentsPage, 50);
        }
    })();
</script>
