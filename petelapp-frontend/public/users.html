<div class="school-title-section">
    <h1 class="page-title">ניהול משתמשים</h1>
</div>

<div class="main-container">
    <!-- Context buttons - LEFT SIDE POSITIONING -->
    <div class="context-buttons-section">
        <button class="context-btn" onclick="refreshUsersData()">
            רענן נתונים
        </button>
        <button class="context-btn" onclick="showCreateUserDialog()">
            הוסף משתמש חדש
        </button>
        <button class="context-btn" onclick="navigateToMainDashboard()">
            חזרה לדף ראשי
        </button>
        <button class="context-btn" onclick="navigateToRoles()">
            ניהול תפקידים
        </button>
    </div>

    <!-- Main content area -->
    <div class="students-content">
        <div class="content-card">
            <h2 id="usersTitle" class="page-title">ניהול משתמשים</h2>

            <!-- Users summary info -->
            <div class="users-summary">
                <div class="summary-grid">
                    <div class="summary-card">
                        <div class="summary-icon">👥</div>
                        <div class="summary-info">
                            <div class="summary-value" id="totalUsers">0</div>
                            <div class="summary-label">סה"כ משתמשים</div>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-icon">✅</div>
                        <div class="summary-info">
                            <div class="summary-value" id="activeUsers">0</div>
                            <div class="summary-label">משתמשים פעילים</div>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-icon">🚫</div>
                        <div class="summary-info">
                            <div class="summary-value" id="inactiveUsers">0</div>
                            <div class="summary-label">משתמשים לא פעילים</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Users table - ReusableTable component -->
            <div class="users-table-section">
                <h3>רשימת משתמשים</h3>
                <div id="usersTableContainer">
                    <div class="loading-spinner">
                        טוען נתוני משתמשים...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Manage User Roles Dialog -->
<div id="manageRolesDialog" class="modal-overlay" style="display: none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h3 id="manageRolesDialogTitle">ניהול תפקידים למשתמש</h3>
            <button class="modal-close" onclick="closeManageRolesDialog()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="manageRolesUserId">

            <div class="roles-management-container">
                <div class="roles-section">
                    <h4>תפקידים זמינים</h4>
                    <div class="roles-search">
                        <input type="text" id="availableRolesSearch" placeholder="חיפוש תפקיד..."
                            onkeyup="filterAvailableRoles()">
                    </div>
                    <div id="availableRolesList" class="roles-list available-roles-list">
                        <div class="loading-spinner">טוען...</div>
                    </div>
                </div>

                <div class="roles-section">
                    <h4>תפקידים משויכים</h4>
                    <div id="assignedRolesList" class="roles-list assigned-roles-list">
                        <div class="loading-spinner">טוען...</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-primary" onclick="closeManageRolesDialog()">סגור</button>
        </div>
    </div>
</div>


<!-- Change Password Dialog -->
<div id="changePasswordDialog" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="changePasswordDialogTitle">שינוי סיסמה</h3>
            <button class="modal-close" onclick="closeChangePasswordDialog()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="changePasswordForm" onsubmit="handleChangePasswordSubmit(event)">
                <input type="hidden" id="changePasswordUserId">

                <div class="form-group">
                    <label for="newPassword">סיסמה חדשה *</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6">
                    <small>לפחות 6 תווים</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">אימות סיסמה *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                    <small>הזן את הסיסמה שוב לאימות</small>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeChangePasswordDialog()">ביטול</button>
            <button type="submit" form="changePasswordForm" class="btn-primary">שמור סיסמה</button>
        </div>
    </div>
</div>

<!-- Create/Edit User Dialog -->
<div id="userDialog" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="userDialogTitle">משתמש חדש</h3>
            <button class="modal-close" onclick="closeUserDialog()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="userForm" onsubmit="handleUserFormSubmit(event)">
                <input type="hidden" id="userId" name="userId">
                <input type="hidden" id="isEditMode" name="isEditMode" value="false">

                <div class="form-group">
                    <label for="userUsername">שם משתמש *</label>
                    <input type="text" id="userUsername" name="username" required>
                    <small id="usernameHint">שם משתמש ייחודי</small>
                </div>

                <div class="form-row">
                    <div class="form-group form-col">
                        <label for="userFirstName">שם פרטי *</label>
                        <input type="text" id="userFirstName" name="firstName" required>
                    </div>
                    <div class="form-group form-col">
                        <label for="userLastName">שם משפחה *</label>
                        <input type="text" id="userLastName" name="lastName" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group form-col">
                        <label for="userEmail">דוא"ל</label>
                        <input type="email" id="userEmail" name="email">
                    </div>
                    <div class="form-group form-col">
                        <label for="userPhone">טלפון</label>
                        <input type="tel" id="userPhone" name="phone">
                    </div>
                </div>

                <div class="form-group">
                    <label for="userEntityId">ישות *</label>
                    <select id="userEntityId" name="entityId" required>
                        <option value="">בחר ישות...</option>
                    </select>
                </div>

                <div id="passwordGroup" class="form-group">
                    <label for="userPassword">סיסמה *</label>
                    <input type="password" id="userPassword" name="password" required>
                    <small>לפחות 6 תווים</small>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="userIsActive" name="isActive" checked>
                        משתמש פעיל
                    </label>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeUserDialog()">ביטול</button>
            <button type="submit" form="userForm" class="btn-primary">שמור</button>
        </div>
    </div>
</div>

<script>
    // ✅ Window-scoped variables to prevent redeclaration errors
    window.usersTableInstance = window.usersTableInstance || null;
    window.currentEditingUserId = null;
    window.allUsersData = [];
    window.allEntities = window.allEntities || [];

    /**
     * Load entities on page initialization
     */
    async function loadEntities() {
        try {
            console.log('📋 Loading entities...');

            const authToken = sessionStorage.getItem('authToken');
            if (!authToken) {
                console.error('❌ No auth token for loading entities');
                return;
            }

            const response = await fetch(AppConfig.getApiUrl('entities/login'), {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const entities = await response.json();
                window.allEntities = entities;
                console.log(`✅ Loaded ${entities.length} entities`);
            } else {
                console.error('❌ Failed to load entities:', response.status);
            }
        } catch (error) {
            console.error('❌ Error loading entities:', error);
        }
    }

    /**
     * Populate entities dropdown
     */
    function populateEntitiesDropdown(selectedEntityId = null) {
        const dropdown = document.getElementById('userEntityId');
        if (!dropdown) return;

        if (!window.allEntities || window.allEntities.length === 0) {
            dropdown.innerHTML = '<option value="">טוען ישויות...</option>';
            return;
        }

        const options = window.allEntities.map(entity =>
            `<option value="${entity.id}" ${selectedEntityId == entity.id ? 'selected' : ''}>${entity.name}</option>`
        ).join('');

        dropdown.innerHTML = '<option value="">בחר ישות...</option>' + options;
    }

    /**
     * Load and display all users
     */
    async function loadUsersData() {
        console.log('📋 Loading users data...');

        try {
            const authToken = sessionStorage.getItem('authToken');
            if (!authToken) {
                console.error('❌ No auth token found');
                showLoadingError('נדרש אימות. אנא התחבר מחדש.');
                return;
            }

            console.log('🔗 Fetching from:', AppConfig.getApiUrl('users'));

            const response = await fetch(AppConfig.getApiUrl('users'), {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                }
            });

            console.log('📨 Response status:', response.status);

            if (!response.ok) {
                throw new Error(`Failed to load users: ${response.status}`);
            }

            const result = await response.json();
            console.log('📦 Raw response:', result);
            console.log('📊 Users data received:', result.data);
            console.log(`✅ Loaded ${result.data?.length || 0} users`);

            if (!result.data || !Array.isArray(result.data)) {
                console.error('❌ Invalid data format:', result.data);
                showLoadingError('פורמט נתונים לא תקין מהשרת');
                return;
            }

            window.allUsersData = result.data;
            updateUsersSummary(result.data);
            renderUsersTable(result.data);

        } catch (error) {
            console.error('❌ Error loading users:', error);
            showLoadingError('שגיאה בטעינת נתוני המשתמשים');
        }
    }

    /**
     * Update summary statistics
     */
    function updateUsersSummary(users) {
        const totalUsers = users.length;
        const activeUsers = users.filter(u => u.isActive).length;
        const inactiveUsers = totalUsers - activeUsers;

        document.getElementById('totalUsers').textContent = totalUsers;
        document.getElementById('activeUsers').textContent = activeUsers;
        document.getElementById('inactiveUsers').textContent = inactiveUsers;

        console.log(`📊 Summary: Total=${totalUsers}, Active=${activeUsers}, Inactive=${inactiveUsers}`);
    }

    /**
     * Render users table using ReusableTable component
     */
    function renderUsersTable(usersData) {
        console.log('🎨 Rendering users table...');

        const columns = [
            { key: 'id', label: 'מזהה', sortable: true, readOnly: true },
            { key: 'username', label: 'שם משתמש', sortable: true, readOnly: true },
            { key: 'fullName', label: 'שם מלא', sortable: true, readOnly: false },
            { key: 'email', label: 'דוא"ל', sortable: true, readOnly: false },
            { key: 'phone', label: 'טלפון', sortable: false, readOnly: false },
            { key: 'entityName', label: 'ישות', sortable: true, readOnly: true },
            {
                key: 'isActive',
                label: 'פעיל',
                sortable: true,
                readOnly: true,
                render: (data) => data.isActive ? '✓ פעיל' : '✗ לא פעיל'
            },
            {
                key: 'isLocked',
                label: 'סטטוס נעילה',
                sortable: true,
                readOnly: true,
                render: (data) => {
                    if (data.isLocked) {
                        return '<span style="color: #d32f2f; font-weight: bold;">🔒 נעול</span>';
                    }
                    return '<span style="color: #388e3c;">🔓 פתוח</span>';
                }
            },
            {
                key: 'lastLogin',
                label: 'התחברות אחרונה',
                sortable: true,
                readOnly: true,
                render: (data) => data.lastLogin
                    ? new Date(data.lastLogin).toLocaleDateString('he-IL')
                    : 'מעולם לא'
            },
            {
                key: 'passwordChangedAt',
                label: 'שינוי סיסמה אחרון',
                sortable: true,
                readOnly: true,
                render: (data) => {
                    if (!data.passwordChangedAt) return 'לא ידוע';

                    const changedDate = new Date(data.passwordChangedAt);
                    const daysSince = Math.floor((new Date() - changedDate) / (1000 * 60 * 60 * 24));

                    let color = '#388e3c'; // Green
                    if (daysSince > 150) color = '#d32f2f'; // Red - nearing expiration
                    else if (daysSince > 120) color = '#f57c00'; // Orange - warning

                    return `<span style="color: ${color};">${changedDate.toLocaleDateString('he-IL')} (${daysSince} ימים)</span>`;
                }
            },
            {
                key: 'passwordChangeRequired',
                label: 'שינוי סיסמה נדרש',
                sortable: true,
                readOnly: true,
                render: (data) => data.passwordChangeRequired
                    ? '<span style="color: #d32f2f; font-weight: bold;">✓ נדרש</span>'
                    : '<span style="color: #666;">✗ לא נדרש</span>'
            },
            {
                key: 'actions',
                label: 'פעולות',
                sortable: false,
                readOnly: true,
                render: (data) => `
                    <div style="display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;">
                        <button onclick="editUser(${data.id})" class="btn-icon" title="ערוך משתמש">
                            <img src="edit_icon.png" alt="ערוך" class="action-icon-natural">
                        </button>
                        <button onclick="manageUserRoles(${data.id}, '${data.username}')" class="btn-icon" title="ניהול תפקידים">
                            <img src="stats_icon.png" alt="תפקידים" class="action-icon-natural">
                        </button>
                        <button onclick="changeUserPassword(${data.id}, '${data.username}')" class="btn-icon" title="שנה סיסמה">
                            <img src="view_icon.png" alt="סיסמה" class="action-icon-natural">
                        </button>
                        <button onclick="forcePasswordChange(${data.id}, '${data.username}')" class="btn-icon" title="דרוש שינוי סיסמה">
                            <img src="change_password.png" alt="שינוי סיסמה" class="action-icon-natural">
                        </button>
                        ${data.isLocked
                        ? `<button onclick="unlockUser(${data.id})" class="btn-icon" title="שחרר נעילה">
                                   <img src="unlock_icon.png" alt="שחרר נעילה" class="action-icon-natural">
                               </button>`
                        : `<button onclick="lockUser(${data.id})" class="btn-icon" title="נעל משתמש">
                                   <img src="lock_icon.png" alt="נעל משתמש" class="action-icon-natural">
                               </button>`
                    }
                    </div>
                `
            }
        ];

        // Cleanup previous instance
        if (window.usersTableInstance) {
            window.usersTableInstance.cleanup();
            window.usersTableInstance = null;
        }

        // Create new table instance
        window.usersTableInstance = new ReusableTable('usersTableContainer', {
            tableName: 'users',
            isReadOnly: false,
            allowAdd: false,
            allowEdit: false,
            allowDelete: false
        });

        window.usersTableInstance.init(usersData, columns);
        console.log('✅ Users table rendered');
    }

    /**
     * Lock a user account
     */
    async function lockUser(userId) {
        console.log(`🔒 Locking user ${userId}...`);

        if (!confirm('האם אתה בטוח שברצונך לנעול את המשתמש הזה?')) {
            return;
        }

        try {
            const response = await fetch(AppConfig.getApiUrl(`users/${userId}/lock`), {
                method: 'POST',
                ...AppConfig.getDefaultFetchOptions()
            });

            const result = await response.json();

            if (response.ok && result.success) {
                alert('המשתמש ננעל בהצלחה');
                await loadUsersData();  // Refresh table
            } else {
                alert(result.message || 'שגיאה בנעילת המשתמש');
            }
        } catch (error) {
            console.error('Error locking user:', error);
            alert('שגיאה בנעילת המשתמש');
        }
    }

    /**
     * Unlock a user account
     */
    async function unlockUser(userId) {
        console.log(`🔓 Unlocking user ${userId}...`);

        if (!confirm('האם אתה בטוח שברצונך לשחרר את נעילת המשתמש?')) {
            return;
        }

        try {
            const response = await fetch(AppConfig.getApiUrl(`users/${userId}/unlock`), {
                method: 'POST',
                ...AppConfig.getDefaultFetchOptions()
            });

            const result = await response.json();

            if (response.ok && result.success) {
                alert('המשתמש שוחרר בהצלחה');
                await loadUsersData();  // Refresh table
            } else {
                alert(result.message || 'שגיאה בשחרור המשתמש');
            }
        } catch (error) {
            console.error('Error unlocking user:', error);
            alert('שגיאה בשחרור המשתמש');
        }
    }

    // Export new functions
    window.lockUser = lockUser;
    window.unlockUser = unlockUser;

    /**
     * Navigate to roles management
     */
    async function navigateToRoles() {
        console.log('🔄 Navigating to roles...');
        await window.navigateTo('roles');
    }

    /**
     * Refresh users data from server
     */
    async function refreshUsersData() {
        console.log('🔄 Refreshing users data...');
        await loadUsersData();
    }

    /**
     * Navigate to main dashboard
     */
    async function navigateToMainDashboard() {
        console.log('🔄 Navigating to main dashboard...');
        await window.navigateTo('maindashboard');
    }

    /**
     * Show create user dialog
     */
    async function showCreateUserDialog() {
        console.log('📝 Opening create user dialog...');

        document.getElementById('userDialogTitle').textContent = 'משתמש חדש';
        document.getElementById('isEditMode').value = 'false';

        // Clear form
        document.getElementById('userForm').reset();
        document.getElementById('userId').value = '';
        document.getElementById('userUsername').value = '';
        document.getElementById('userUsername').removeAttribute('readonly');
        document.getElementById('usernameHint').textContent = 'שם משתמש ייחודי';

        // Load entities if not already loaded
        if (!window.allEntities || window.allEntities.length === 0) {
            await loadEntities();
        }

        // Populate dropdown
        populateEntitiesDropdown();

        // Show password field for new users
        document.getElementById('passwordGroup').style.display = 'block';
        document.getElementById('userPassword').required = true;

        // Show dialog
        document.getElementById('userDialog').style.display = 'flex';
    }

    /**
     * Edit user - load user data and show dialog
     */
    async function editUser(userId) {
        console.log(`✏️ Editing user ${userId}...`);

        try {
            const user = window.allUsersData.find(u => u.id === userId);
            if (!user) {
                alert('משתמש לא נמצא');
                return;
            }

            document.getElementById('userDialogTitle').textContent = 'עדכון משתמש';
            document.getElementById('isEditMode').value = 'true';

            // Load entities if not already loaded
            if (!window.allEntities || window.allEntities.length === 0) {
                await loadEntities();
            }

            // Populate dropdown with selected value
            populateEntitiesDropdown(user.entityId);

            // Populate form
            document.getElementById('userId').value = user.id;
            document.getElementById('userUsername').value = user.username;
            document.getElementById('userUsername').setAttribute('readonly', 'readonly');
            document.getElementById('usernameHint').textContent = 'שם משתמש לא ניתן לעדכון';
            document.getElementById('userFirstName').value = user.firstName;
            document.getElementById('userLastName').value = user.lastName;
            document.getElementById('userEmail').value = user.email || '';
            document.getElementById('userPhone').value = user.phone || '';
            document.getElementById('userIsActive').checked = user.isActive;

            // Hide password field for existing users
            document.getElementById('passwordGroup').style.display = 'none';
            document.getElementById('userPassword').required = false;

            // Show dialog
            document.getElementById('userDialog').style.display = 'flex';
        } catch (error) {
            console.error('❌ Error editing user:', error);
            alert('שגיאה בטעינת פרטי המשתמש');
        }
    }

    /**
     * Delete user
     */
    async function deleteUser(userId) {
        console.log(`🗑️ Deleting user ${userId}...`);

        if (!confirm('האם אתה בטוח שברצונך להסיר את המשתמש הזה?')) {
            return;
        }

        try {
            const authToken = sessionStorage.getItem('authToken');
            if (!authToken) {
                alert('נדרש אימות. אנא התחבר מחדש.');
                return;
            }

            const response = await fetch(AppConfig.getApiUrl(`users/${userId}`), {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                }
            });

            const result = await response.json();

            if (response.ok) {
                console.log('✅ User deleted successfully');
                alert('המשתמש הוסר בהצלחה');

                // ✅ Remove from local array immediately
                window.allUsersData = window.allUsersData.filter(u => u.id !== userId);
                updateUsersSummary(window.allUsersData);
                renderUsersTable(window.allUsersData);
            } else {
                console.error('❌ Delete failed:', result.message);
                alert(`שגיאה: ${result.message}`);
            }
        } catch (error) {
            console.error('❌ Error deleting user:', error);
            alert('שגיאה בהסרת המשתמש');
        }
    }

    /**
     * Handle user form submission
     */
    async function handleUserFormSubmit(event) {
        event.preventDefault();

        const isEditMode = document.getElementById('isEditMode').value === 'true';
        const userId = document.getElementById('userId').value;

        const formData = {
            firstName: document.getElementById('userFirstName').value,
            lastName: document.getElementById('userLastName').value,
            email: document.getElementById('userEmail').value || null,
            phone: document.getElementById('userPhone').value || null,
            isActive: document.getElementById('userIsActive').checked
        };

        try {
            const authToken = sessionStorage.getItem('authToken');
            if (!authToken) {
                alert('נדרש אימות. אנא התחבר מחדש.');
                return;
            }

            let url, method, body;

            if (isEditMode) {
                // Update existing user
                console.log(`📝 Updating user ${userId}...`);
                url = AppConfig.getApiUrl(`users/${userId}`);
                method = 'PUT';
                body = JSON.stringify(formData);
            } else {
                // Create new user - get entity ID directly from select
                const entityId = document.getElementById('userEntityId').value;

                if (!entityId) {
                    alert('נא לבחור ישות');
                    return;
                }

                console.log('📝 Creating new user...');
                url = AppConfig.getApiUrl('users');
                method = 'POST';
                body = JSON.stringify({
                    username: document.getElementById('userUsername').value,
                    password: document.getElementById('userPassword').value,
                    entityId: parseInt(entityId),
                    ...formData
                });
            }

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                },
                body: body
            });

            const result = await response.json();

            if (response.ok) {
                console.log('✅ User saved successfully');
                alert(result.message || 'נשמרו הנתונים בהצלחה');
                closeUserDialog();

                // ✅ IMMEDIATE UPDATE: Add new user to local array or update existing
                if (!isEditMode && result.data) {
                    // Get entity name for display
                    const entity = window.allEntities.find(e => e.id === result.data.entityId);
                    const newUser = {
                        id: result.data.id,
                        username: result.data.username,
                        firstName: result.data.firstName,
                        lastName: result.data.lastName,
                        fullName: `${result.data.firstName} ${result.data.lastName}`,
                        email: result.data.email,
                        phone: result.data.phone,
                        isActive: result.data.isActive,
                        entityId: result.data.entityId,
                        entityName: entity ? entity.name : '',
                        lastLogin: null
                    };

                    // Add to array immediately
                    window.allUsersData.push(newUser);
                    console.log('✅ Added new user to local array immediately');
                } else if (isEditMode) {
                    // Update existing user in array
                    const index = window.allUsersData.findIndex(u => u.id === parseInt(userId));
                    if (index !== -1) {
                        const entity = window.allEntities.find(e => e.id === window.allUsersData[index].entityId);
                        window.allUsersData[index] = {
                            ...window.allUsersData[index],
                            firstName: formData.firstName,
                            lastName: formData.lastName,
                            fullName: `${formData.firstName} ${formData.lastName}`,
                            email: formData.email,
                            phone: formData.phone,
                            isActive: formData.isActive,
                            entityName: entity ? entity.name : window.allUsersData[index].entityName
                        };
                        console.log('✅ Updated user in local array immediately');
                    }
                }

                // Update UI immediately without server call
                updateUsersSummary(window.allUsersData);
                renderUsersTable(window.allUsersData);

            } else {
                console.error('❌ Save failed:', result.message);
                alert(`שגיאה: ${result.message}`);
            }
        } catch (error) {
            console.error('❌ Error saving user:', error);
            alert('שגיאה בשמירת הנתונים');
        }
    }

    /**
     * Close user dialog
     */
    function closeUserDialog() {
        console.log('🔐 Closing user dialog');
        document.getElementById('userDialog').style.display = 'none';
        document.getElementById('userForm').reset();
    }

    /**
     * Show loading error message
     */
    function showLoadingError(message) {
        const container = document.getElementById('usersTableContainer');
        container.innerHTML = `
        <div class="error-message">

    /**
 * Force user to change password on next login
 */
    async function forcePasswordChange(userId, userName) {
        console.log(`🔑 Forcing password change for user ${userId}...`);

        if (!confirm(`האם אתה בטוח שברצונך לדרוש מ-${userName} להחליף סיסמה בהתחברות הבאה?`)) {
            return;
        }

        try {
            const response = await fetch(AppConfig.getApiUrl(`users/${userId}/force-password-change`), {
                method: 'POST',
                ...AppConfig.getDefaultFetchOptions()
            });

            const result = await response.json();

            if (response.ok && result.success) {
                alert('המשתמש יידרש להחליף סיסמה בהתחברות הבאה');
                await loadUsersData();  // Refresh table
            } else {
                alert(result.message || 'שגיאה בסימון שינוי סיסמה');
            }
        } catch (error) {
            console.error('Error forcing password change:', error);
            alert('שגיאה בסימון שינוי סיסמה');
        }
    }

    /**
     * Export cleanup function for PageLifecycleManager
     */
    function cleanupUsersPage() {
        console.log('🧹 Cleaning up users page...');

        try {
            if (window.usersTableInstance) {
                window.usersTableInstance = null;
            }

            window.allUsersData = [];

            const container = document.getElementById('usersTableContainer');
            if (container) {
                container.innerHTML = '<div class="loading-spinner">טוען...</div>';
            }

            console.log('✅ Users page cleanup complete');
        } catch (error) {
            console.error('❌ Error during cleanup:', error);
        }
    }

    /**
     * Manage user roles with drag and drop
     */
    async function manageUserRoles(userId, userName) {
        console.log(`🔑 Managing roles for user ${userId}...`);

        document.getElementById('manageRolesUserId').value = userId;
        document.getElementById('manageRolesDialogTitle').textContent = `ניהול תפקידים: ${userName}`;

        // Show dialog
        document.getElementById('manageRolesDialog').style.display = 'flex';

        // Load roles
        await loadUserRolesData(userId);
    }

    /**
     * Load available and assigned roles for user
     */
    async function loadUserRolesData(userId) {
        try {
            const authToken = sessionStorage.getItem('authToken');
            if (!authToken) {
                alert('נדרש אימות. אנא התחבר מחדש.');
                return;
            }

            console.log(`🔍 Loading roles for user ${userId}...`);

            // Load assigned roles first
            console.log(`📡 Fetching: ${AppConfig.getApiUrl(`users/${userId}/roles`)}`);
            const assignedResponse = await fetch(AppConfig.getApiUrl(`users/${userId}/roles`), {
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                }
            });

            console.log(`📨 Assigned roles response status: ${assignedResponse.status}`);

            if (!assignedResponse.ok) {
                const errorText = await assignedResponse.text();
                console.error('❌ Assigned roles error response:', errorText);
                throw new Error(`Failed to load assigned roles: ${assignedResponse.status}`);
            }

            const assignedResult = await assignedResponse.json();
            console.log('📦 Assigned roles result:', assignedResult);
            const assignedRoles = assignedResult.data || assignedResult || [];
            console.log(`✅ Assigned roles count: ${assignedRoles.length}`);

            // Load available roles
            console.log(`📡 Fetching: ${AppConfig.getApiUrl(`users/available-roles?userId=${userId}`)}`);
            const availableResponse = await fetch(AppConfig.getApiUrl(`users/available-roles?userId=${userId}`), {
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                }
            });

            console.log(`📨 Available roles response status: ${availableResponse.status}`);

            if (!availableResponse.ok) {
                const errorText = await availableResponse.text();
                console.error('❌ Available roles error response:', errorText);
                throw new Error(`Failed to load available roles: ${availableResponse.status}`);
            }

            const availableResult = await availableResponse.json();
            console.log('📦 Available roles result:', availableResult);
            const availableRoles = availableResult.data || availableResult || [];
            console.log(`✅ Available roles count: ${availableRoles.length}`);

            renderAvailableRoles(availableRoles);
            renderAssignedRoles(assignedRoles);

        } catch (error) {
            console.error('❌ Error loading roles:', error);
            console.error('❌ Error stack:', error.stack);
            alert('שגיאה בטעינת התפקידים: ' + error.message);
        }
    }

    /**
     * Render available roles list
     */
    function renderAvailableRoles(roles) {
        const container = document.getElementById('availableRolesList');

        if (roles.length === 0) {
            container.innerHTML = '<div class="empty-message">אין תפקידים זמינים</div>';
            return;
        }

        let html = '';
        roles.forEach(role => {
            html += `
                <div class="role-item draggable" draggable="true" data-role-id="${role.id}" data-role-name="${role.name}">
                    <span class="role-name">${role.name}</span>
                    <button class="btn-icon-small" onclick="addRoleToUser(${role.id})" title="הוסף תפקיד">
                        <img src="Plus icon.png" alt="הוסף" class="action-icon-natural">
                    </button>
                </div>
            `;
        });

        container.innerHTML = html;

        // Add drag event listeners
        container.querySelectorAll('.draggable').forEach(item => {
            item.addEventListener('dragstart', handleDragStart);
            item.addEventListener('dragend', handleDragEnd);
        });
    }

    /**
     * Render assigned roles list
     */
    function renderAssignedRoles(roles) {
        const container = document.getElementById('assignedRolesList');

        if (roles.length === 0) {
            container.innerHTML = '<div class="empty-message">אין תפקידים משויכים</div>';
        } else {
            let html = '';
            roles.forEach(role => {
                html += `
                    <div class="role-item assigned" data-role-id="${role.id}">
                        <span class="role-name">${role.name}</span>
                        <button class="btn-icon-small" onclick="removeRoleFromUser(${role.id})" title="הסר תפקיד">
                            <img src="delete_icon.png" alt="הסר" class="action-icon-natural">
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Enable drop on assigned list
        container.addEventListener('dragover', handleDragOver);
        container.addEventListener('drop', handleDrop);
        container.addEventListener('dragleave', handleDragLeave);
    }

    /**
     * Filter available roles by search
     */
    function filterAvailableRoles() {
        const searchText = document.getElementById('availableRolesSearch').value.toLowerCase();
        const items = document.querySelectorAll('#availableRolesList .role-item');

        items.forEach(item => {
            const roleName = item.getAttribute('data-role-name').toLowerCase();
            if (roleName.includes(searchText)) {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });
    }

    /**
     * Drag and drop handlers
     */
    let draggedElement = null;

    function handleDragStart(e) {
        draggedElement = this;
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/html', this.innerHTML);
    }

    function handleDragEnd(e) {
        this.classList.remove('dragging');
    }

    function handleDragOver(e) {
        if (e.preventDefault) {
            e.preventDefault();
        }
        e.dataTransfer.dropEffect = 'move';
        this.classList.add('drag-over');
        return false;
    }

    function handleDragLeave(e) {
        this.classList.remove('drag-over');
    }

    async function handleDrop(e) {
        if (e.stopPropagation) {
            e.stopPropagation();
        }
        e.preventDefault();

        this.classList.remove('drag-over');

        if (draggedElement) {
            const roleId = parseInt(draggedElement.getAttribute('data-role-id'));
            await addRoleToUser(roleId);
        }

        return false;
    }

    /**
     * Add role to user
     */
    async function addRoleToUser(roleId) {
        const userId = document.getElementById('manageRolesUserId').value;

        try {
            const authToken = sessionStorage.getItem('authToken');
            const response = await fetch(AppConfig.getApiUrl(`users/${userId}/roles`), {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ roleId: roleId })
            });

            const result = await response.json();

            if (response.ok) {
                console.log('✅ Role added to user');
                await loadUserRolesData(userId);
            } else {
                alert(`שגיאה: ${result.message}`);
            }
        } catch (error) {
            console.error('❌ Error adding role:', error);
            alert('שגיאה בהוספת התפקיד');
        }
    }

    /**
     * Remove role from user
     */
    async function removeRoleFromUser(roleId) {
        const userId = document.getElementById('manageRolesUserId').value;

        if (!confirm('האם אתה בטוח שברצונך להסיר את התפקיד הזה?')) {
            return;
        }

        try {
            const authToken = sessionStorage.getItem('authToken');
            const response = await fetch(AppConfig.getApiUrl(`users/${userId}/roles/${roleId}`), {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                }
            });

            const result = await response.json();

            if (response.ok) {
                console.log('✅ Role removed from user');
                await loadUserRolesData(userId);
            } else {
                alert(`שגיאה: ${result.message}`);
            }
        } catch (error) {
            console.error('❌ Error removing role:', error);
            alert('שגיאה בהסרת התפקיד');
        }
    }

    /**
     * Close manage roles dialog
     */
    function closeManageRolesDialog() {
        document.getElementById('manageRolesDialog').style.display = 'none';
    }

    /**
     * Show change password dialog
     */
    function changeUserPassword(userId, userName) {
        console.log(`🔑 Changing password for user ${userId}...`);

        document.getElementById('changePasswordDialogTitle').textContent = `שינוי סיסמה: ${userName}`;
        document.getElementById('changePasswordUserId').value = userId;

        // Clear form
        document.getElementById('changePasswordForm').reset();

        // Show dialog
        document.getElementById('changePasswordDialog').style.display = 'flex';
    }

    /**
     * Handle change password form submission
     */
    async function handleChangePasswordSubmit(event) {
        event.preventDefault();

        const userId = document.getElementById('changePasswordUserId').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Validate passwords match
        if (newPassword !== confirmPassword) {
            alert('הסיסמאות אינן תואמות');
            return;
        }

        // Validate password length
        if (newPassword.length < 6) {
            alert('הסיסמה חייבת להכיל לפחות 6 תווים');
            return;
        }

        try {
            const authToken = sessionStorage.getItem('authToken');
            if (!authToken) {
                alert('נדרש אימות. אנא התחבר מחדש.');
                return;
            }

            console.log(`🔐 Changing password for user ${userId}...`);

            const response = await fetch(AppConfig.getApiUrl(`users/${userId}/change-password`), {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    newPassword: newPassword
                })
            });

            const result = await response.json();

            if (response.ok) {
                console.log('✅ Password changed successfully');
                alert('הסיסמה שונתה בהצלחה');
                closeChangePasswordDialog();
            } else {
                console.error('❌ Password change failed:', result.message);
                alert(`שגיאה: ${result.message}`);
            }
        } catch (error) {
            console.error('❌ Error changing password:', error);
            alert('שגיאה בשינוי הסיסמה');
        }
    }

    /**
     * Close change password dialog
     */
    function closeChangePasswordDialog() {
        console.log('🔐 Closing change password dialog');
        document.getElementById('changePasswordDialog').style.display = 'none';
        document.getElementById('changePasswordForm').reset();
    }

    // Export functions
    window.changeUserPassword = changeUserPassword;
    window.closeChangePasswordDialog = closeChangePasswordDialog;
    window.cleanupUsersPage = cleanupUsersPage;
    window.loadUsersData = loadUsersData;
    window.refreshUsersData = refreshUsersData;
    window.navigateToRoles = navigateToRoles;
    window.navigateToMainDashboard = navigateToMainDashboard;
    window.showCreateUserDialog = showCreateUserDialog;
    window.manageUserRoles = manageUserRoles;
    window.loadEntities = loadEntities;
    window.populateEntitiesDropdown = populateEntitiesDropdown;
    window.forcePasswordChange = forcePasswordChange;

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', async function () {
        await loadEntities();
        await loadUsersData();
    });
</script>
