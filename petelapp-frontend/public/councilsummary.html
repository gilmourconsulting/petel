<!-- Context buttons positioned between menu and main content following Context Buttons Layout -->
<div class="students-container">
    <div class="context-buttons-section">
        <button class="context-btn" onclick="navigateBackToSchoolsList()" title="חזרה לרשימת בתי ספר">
            חזרה לרשימת בתי ספר
        </button>

        <button class="context-btn" onclick="navigateBackToDashboard()" title="חזרה ללוח הבקרה הראשי">
            חזרה ללוח הבקרה
        </button>
    </div>

    <!-- Main content positioned after menu and context buttons -->
    <div class="students-content">
        <div class="content-header">
            <h1 class="page-title">סיכום לפי רשויות אגרות חוץ - <span id="yearDisplay">תשפ"ו</span></h1>
            <p class="page-subtitle">סיכום נתוני התלמידים והבקשות לפי רשות</p>
        </div>

        <!-- Loading indicator -->
        <div id="councilsLoading" class="loading-indicator" style="display: none;">
            <p>טוען נתוני רשויות...</p>
        </div>

        <!-- Table container for TableComponent with horizontal scrolling -->
        <div id="councilsTableContainer">
            <!-- TableComponent will render here -->
        </div>
    </div>
</div>

<script>
    console.log('🔍 SCRIPT SECTION LOADED - councilsummary.html');

    // Global variables following Component Variable Scope
    window.allCouncils = window.allCouncils || [];
    window.councilsTable = window.councilsTable || null;

    // Load councils data from backend API following Entity-Based Request Flow
    async function loadCouncilsData() {
        console.log('🚀 loadCouncilsData FUNCTION CALLED!');

        // Show loading indicator
        const loadingElement = document.getElementById('councilsLoading');
        if (loadingElement) {
            loadingElement.style.display = 'block';
            console.log('✅ Loading indicator shown');
        }

        try {
            // Get auth token following Authentication & Session Management
            const authToken = sessionStorage.getItem('authToken');

            if (!authToken || authToken === 'undefined') {
                console.error('❌ No valid auth token found in session');
                alert('נדרש אימות. אנא התחבר מחדש.');
                return;
            }

            // Get SelectedYearId from session
            const selectedYearId = await window.SessionState.getProperty('SelectedYearId');
            console.log('📅 Selected Year ID:', selectedYearId);

            // API call following Frontend Configuration Requirements
            const apiUrl = AppConfig.getApiUrl('entities/councils/summary') +
                (selectedYearId ? `?yearId=${selectedYearId}` : '');
            console.log('🌐 Making API call to:', apiUrl);

            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                }
            });

            console.log('📥 Response:', response.status, response.ok);

            if (response.ok) {
                const result = await response.json();
                console.log('📦 Raw API response:', result);

                if (result.success && result.data) {
                    const councils = result.data;
                    console.log('🏛️ Councils data:', councils);
                    console.log('🔍 Number of councils:', councils.length);

                    // Update year display if available
                    await updateYearDisplay(result.yearId);

                    window.allCouncils = councils;
                    initializeTableWithData(councils);
                } else {
                    console.error('❌ API returned unsuccessful response:', result);
                    showNoDataMessage('לא נמצאו נתוני רשויות לשנה נבחרת');
                }
            } else {
                const errorText = await response.text();
                console.error('❌ API Error:', response.status, errorText);

                if (response.status === 401) {
                    alert('פג תוקף ההתחברות. אנא התחבר מחדש.');
                    window.location.href = 'login.html';
                } else {
                    showNoDataMessage('שגיאה בטעינת נתוני רשויות');
                }
            }
        } catch (error) {
            console.error('💥 Exception in loadCouncilsData:', error);
            showNoDataMessage('שגיאה בטעינת נתוני רשויות');
        } finally {
            const loadingElement = document.getElementById('councilsLoading');
            if (loadingElement) {
                loadingElement.style.display = 'none';
                console.log('✅ Loading indicator hidden');
            }
        }
    }

    // Update year display in header
    async function updateYearDisplay() {
        // Get the Hebrew year name from session
        const selectedYearValue = await window.SessionState.getProperty('SelectedYearValue');
        const yearDisplay = document.getElementById('yearDisplay');

        if (yearDisplay) {
            if (selectedYearValue) {
                yearDisplay.textContent = selectedYearValue;
            } else {
                yearDisplay.textContent = 'לא נבחרה שנה';
            }
        }
    }

    // Show no data message
    function showNoDataMessage(message) {
        const container = document.getElementById('councilsTableContainer');
        if (container) {
            container.innerHTML = `
                <div class="table-container">
                    <div style="text-align: center; padding: 40px; color: #6c757d;">
                        <p style="font-size: 1.1em; margin-bottom: 10px;">${message}</p>
                        <p>בחר שנת לימודים מהתפריט העליון</p>
                    </div>
                </div>
            `;
        }
    }

    // Initialize table with data following Standard Table Component
    function initializeTableWithData(councils) {
        console.log('📊 Initializing table with', councils.length, 'councils');

        if (councils.length === 0) {
            console.log('⚠️ No councils data available');
            showNoDataMessage('אין נתונים זמינים לשנה הנבחרת');
            return;
        }

        // Use ReusableTable component following Standard Table Component
        if (typeof ReusableTable !== 'undefined') {
            console.log('✅ Using ReusableTable component');
            initializeReusableTable(councils);
        } else {
            console.error('❌ ReusableTable component not available');
            const container = document.getElementById('councilsTableContainer');
            if (container) {
                container.innerHTML = `
                    <div class="loading-indicator">
                        <p>רכיב הטבלה לא זמין. אנא טען מחדש את הדף.</p>
                    </div>
                `;
            }
        }
    }

    // Use ReusableTable following Standard Table Component
    function initializeReusableTable(councils) {
        console.log('📊 Initializing ReusableTable with', councils.length, 'councils');
        console.log('📋 Sample council data:', councils[0]);

        // Define columns following Hebrew/RTL Specific Patterns with Standard Icon Set
        const tableColumns = [
            {
                key: 'councilName',
                label: 'רשות שולחת',
                sortable: true,
                readOnly: true,
                render: (council) => council.councilName || 'לא ידוע'
            },
            {
                key: 'numberOfStudents',
                label: 'מספר תלמידים',
                sortable: true,
                readOnly: true,
                render: (council) => council.numberOfStudents.toLocaleString('he-IL')
            },
            {
                key: 'totalRequested',
                label: 'סה"כ נדרש',
                sortable: true,
                readOnly: true,
                render: (council) => council.totalRequestedFormatted ||
                    (council.totalRequested ? council.totalRequested.toLocaleString('he-IL', {
                        style: 'currency',
                        currency: 'ILS'
                    }) : '0.00 ₪')
            },
            {
                key: 'actions',
                label: 'פעולות',
                sortable: false,
                readOnly: true,
                render: (council) => `
                    <div class="actions-cell">
                        <button class="btn btn-sm btn-icon" onclick="viewCouncil(${council.id})" title="צפייה ברשות">
                            <img src="view_icon.png" alt="צפייה" class="action-icon-natural">
                        </button>
                    </div>
                `
            }
        ];

        try {
            // Cleanup existing table if present following Page Cleanup Pattern
            if (window.councilsTable && typeof window.councilsTable.cleanup === 'function') {
                window.councilsTable.cleanup();
            }

            // Create ReusableTable with correct constructor following Standard Table Component
            window.councilsTable = new ReusableTable('councilsTableContainer', {
                tableName: 'councils',
                isReadOnly: true,
                allowAdd: false,
                allowEdit: false,
                allowDelete: false
            });

            console.log('📋 ReusableTable created successfully');

            // Initialize with data and columns
            window.councilsTable.init(councils, tableColumns);
            console.log('✅ Councils table initialized successfully');

        } catch (error) {
            console.error('❌ Error creating ReusableTable:', error);
            console.error('Error details:', {
                message: error.message,
                stack: error.stack
            });

            const container = document.getElementById('councilsTableContainer');
            if (container) {
                container.innerHTML = `
                    <div class="loading-indicator">
                        <p>שגיאה בטעינת טבלת הרשויות. אנא טען מחדש את הדף.</p>
                    </div>
                `;
            }
        }
    }

    // Council management function
    // Council management function - navigate to students list
    async function viewCouncil(councilId) {
        console.log('👁️ Viewing council:', councilId);
        const council = window.allCouncils.find(c => c.id === councilId);

        if (council) {
            // Store selected council information in session
            await window.SessionState.setProperty('SelectedCouncilId', councilId.toString());
            await window.SessionState.setProperty('SelectedCouncilName', council.councilName || 'לא ידוע');

            console.log('Selected council stored:', {
                id: councilId,
                name: council.councilName
            });

            // Navigate to council students page
            if (typeof window.navigateTo === 'function') {
                await window.navigateTo('councilstudents');
            } else {
                console.error('❌ window.navigateTo not available');
            }
        } else {
            console.error('Council not found with ID:', councilId);
            alert('הרשות המבוקשת לא נמצאה.');
        }
    }

    // Context button navigation functions following Page Lifecycle Management
    async function navigateBackToSchoolsList() {
        console.log('🏫 Navigating back to schools list...');

        if (typeof window.navigateTo === 'function') {
            await window.navigateTo('schoollist');
        } else {
            console.error('❌ window.navigateTo not available');
        }
    }

    async function navigateBackToDashboard() {
        console.log('📊 Navigating back to dashboard...');

        if (typeof window.navigateTo === 'function') {
            await window.navigateTo('maindashboard');
        } else {
            console.error('❌ window.navigateTo not available');
        }
    }

    // Cleanup function following Page Cleanup Pattern
    function cleanupCouncilSummary() {
        console.log('🧹 Cleaning up council summary page...');

        try {
            if (window.councilsTable && typeof window.councilsTable.cleanup === 'function') {
                window.councilsTable.cleanup();
            }
            window.councilsTable = null;
            window.allCouncils = [];

            const container = document.getElementById('councilsTableContainer');
            if (container) {
                container.innerHTML = '<div class="loading-spinner">טוען...</div>';
            }

            console.log('✅ Council summary cleanup complete');
        } catch (error) {
            console.error('❌ Error during cleanup:', error);
        }
    }

    // Initialize page following Critical Development Workflows
    document.addEventListener('DOMContentLoaded', function () {
        console.log('🏁 DOMContentLoaded event fired!');
        loadCouncilsData();
    });

    // Also try immediate call if DOM is already ready
    if (document.readyState !== 'loading') {
        console.log('📄 Document already ready, calling loadCouncilsData immediately');
        loadCouncilsData();
    }

    // Export functions to window following Cross-Component Communication
    window.loadCouncilsData = loadCouncilsData;
    window.initializeTableWithData = initializeTableWithData;
    window.viewCouncil = viewCouncil;
    window.navigateBackToSchoolsList = navigateBackToSchoolsList;
    window.navigateBackToDashboard = navigateBackToDashboard;
    window.cleanupCouncilSummary = cleanupCouncilSummary;

    console.log('✅ Council summary functions registered globally');
</script>
