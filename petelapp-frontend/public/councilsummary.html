        .error-message {

            direction: rtl;
            text-align: center;
            padding: 30px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;

        }

        .error-message h3 {

        }

        .error-message p {
            font-size: 1em;

    <!-- Keep your existing script section unchanged -->
    <script>
        console.log('🔍 SCRIPT SECTION LOADED - councilsummary.html');
        
        // Global variables following Project-Specific Patterns
        let allCouncils = [];
        let councilsTable = null;

        // Load councils data following Entity-Based Request Flow
        async function loadCouncilsData() {
            console.log('🚀 loadCouncilsData FUNCTION CALLED!');
            
            // Show loading indicator
            const loadingElement = document.getElementById('councilsLoading');
            if (loadingElement) {
                loadingElement.style.display = 'block';
                console.log('✅ Loading indicator shown');
            }

            try {
                // Get auth token following Authentication & Session Management
                const authToken = sessionStorage.getItem('authToken');
                
                console.log('📋 Session Debug:', {
                    authToken: authToken ? 'present' : 'null',
                    hasAuthToken: !!authToken
                });
                
                if (!authToken || authToken === 'undefined') {
                    console.error('❌ No valid auth token found in session');
                    // Use mock data when no auth token
                    const mockCouncils = generateMockData();
                    allCouncils = mockCouncils;
                    initializeTableWithData(mockCouncils);
                    return;
                }

                // API call following API Communication Pattern
                const apiUrl = AppConfig.getApiUrl('entities/councils');
                console.log('🌐 Making API call to:', apiUrl);
                
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                console.log('📥 Response:', response.status, response.ok);

                if (response.ok) {
                    const result = await response.json();
                    console.log('📦 Raw API response:', result);
                    
                    // Handle different response formats following API Communication Pattern
                    const councils = result.data || result.councils || result || [];
                    console.log('🏛️ Councils data extracted:', councils);
                    console.log('🔍 First council structure:', councils[0]);
                    
                    // Transform councils data to summary format
                    const councilsSummary = transformCouncilsToSummary(councils);
                    console.log('📊 Transformed councils summary:', councilsSummary);
                    
                    allCouncils = councilsSummary;
                    initializeTableWithData(councilsSummary);
                } else {
                    const errorText = await response.text();
                    console.error('❌ API Error:', response.status, errorText);
                    
                    if (response.status === 401) {
                        console.error('❌ Authentication failed - redirecting to login');
                        // Optionally redirect to login
                        // window.location.href = 'login.html';
                    }
                    
                    // Fallback to mock data on API error
                    console.log('🔄 Falling back to mock data');
                    const mockCouncils = generateMockData();
                    allCouncils = mockCouncils;
                    initializeTableWithData(mockCouncils);
                }
            } catch (error) {
                console.error('💥 Exception in loadCouncilsData:', error);
                // Fallback to mock data on exception
                console.log('🔄 Falling back to mock data due to exception');
                const mockCouncils = generateMockData();
                allCouncils = mockCouncils;
                initializeTableWithData(mockCouncils);
            } finally {
                const loadingElement = document.getElementById('councilsLoading');
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                    console.log('✅ Loading indicator hidden');
                }
            }
        }

        // Transform councils data to summary format following Entity-Based Request Flow
        function transformCouncilsToSummary(councils) {
            console.log('🔄 Transforming councils to summary format');
            
            // For now, create summary with basic council info
            // This will be enhanced when we have actual student-council relationships
            return councils.map(council => ({
                id: council.id,
                council: council.councilShortName || council.councilLongName || council.name || 'לא ידוע',
                councilShortName: council.councilShortName,
                councilLongName: council.councilLongName,
                numberOfStudents: 0, // To be calculated from students data
                status: 'ממתין',
                totalRequested: '-',
                lastUpdate: council.updatedAt ? new Date(council.updatedAt).toLocaleDateString('he-IL') : '-'
            }));
        }

        // Generate mock data following Project-Specific Patterns
        function generateMockData() {
            console.log('📊 Generating mock council data');
            
            const mockData = [
                {
                    id: 1,

                    councilShortName: '-תל-אביב-יפו',
                    numberOfStudents: 2,
                    status: 'נשלחו טפסים',
                    totalRequested: '32,406 ₪',
                    lastUpdate: new Date().toLocaleDateString('he-IL')
                },
                {
                    id: 2,

                    councilShortName: 'הוד השרון',
                    numberOfStudents: 2,
                    status: 'מוכן לשליחה',
                    totalRequested: '15,178 ₪',
                    lastUpdate: new Date(Date.now() - 24 * 60 * 60 * 1000).toLocaleDateString('he-IL')
                },
                {
                    id: 3,
                    councilShortName: 'הרצליה',
                    numberOfStudents: 1,
                    status: 'ממתין',
                    totalRequested: '-',
                    lastUpdate: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toLocaleDateString('he-IL')
                }
            ];
            
            console.log('✅ Mock data generated:', mockData);
            return mockData;
        }

        // Initialize table with data following Standard Table Component
        function initializeTableWithData(councils) {
            console.log('📊 Initializing table with', councils.length, 'councils');
            
            if (councils.length === 0) {
                console.log('⚠️ No councils data available, creating empty table');
                createEmptyTable();
                return;
            }
            
            // Use ReusableTable component following Standard Table Component
            if (typeof ReusableTable !== 'undefined') {
                console.log('✅ Using ReusableTable component');
                initializeReusableTable(councils);
            } else {
                console.error('❌ ReusableTable component not available');
                // Show loading message instead of fallback following Standard Table Component
                const container = document.getElementById('councilsTableContainer');
                if (container) {
                    container.innerHTML = `
                        <div class="loading-indicator">
                            <p>רכיב הטבלה לא זמין. אנא טען מחדש את הדף.</p>
                        </div>
                    `;
                }
            }
        }

        // Use ReusableTable following Standard Table Component
        function initializeReusableTable(councils) {
            console.log('📊 Initializing ReusableTable with', councils.length, 'councils');
            console.log('📋 Sample council data:', councils[0]);
            
            // Define columns following Hebrew/RTL Specific Patterns with Standard Icon Set
            const tableColumns = [
                { 
                    key: 'councilShortName', 
                    label: 'רשות שולחת', 
                    sortable: true,
                    readOnly: false,
                    render: (council) => council.councilShortName || '123456'
                },
                { 
                    key: 'numberOfStudents', 
                    label: 'מספר תלמידים', 
                    sortable: true,
                    readOnly: false
                },
                { 
                    key: 'status', 
                    label: 'סטטוס', 
                    sortable: true,
                    readOnly: false,
                    render: (council) => {
                        const status = council.status || 'לא ידוע';
                        const statusClass = status.replace(/\s+/g, '-').toLowerCase();
                        return `<span class="status-badge status-${statusClass}">${status}</span>`;
                    }
                },
                { 
                    key: 'totalRequested', 
                    label: 'סה"כ נדרש', 
                    sortable: true,
                    readOnly: false
                },
                { 
                    key: 'lastUpdate', 
                    label: 'עדכון אחרון', 
                    sortable: true,
                    readOnly: false
                },
                { 
                    key: 'actions', 
                    label: 'פעולות', 
                    sortable: false,
                    readOnly: true,
                    render: (council) => `
                        <div class="actions-cell">
                            <button class="btn btn-sm btn-icon" onclick="viewCouncil(${council.id})" title="צפייה ברשות">
                                <img src="view_icon.png" alt="צפייה" class="action-icon-natural">
                            </button>
                        </div>
                    `
                }
            ];

            try {
                // Create ReusableTable with correct constructor following Standard Table Component
                councilsTable = new ReusableTable('councilsTableContainer', {
                    tableName: 'councils',
                    isReadOnly: true,
                    allowAdd: false,
                    allowEdit: false,
                    allowDelete: false
                });
                
                console.log('📋 ReusableTable created successfully');
                
                // Initialize with data and columns following Critical Development Workflows
                councilsTable.init(councils, tableColumns);
                console.log('✅ Councils table initialized successfully');

            } catch (error) {
                console.error('❌ Error creating ReusableTable:', error);
                console.error('Error details:', {
                    message: error.message,
                    stack: error.stack
                });
                
                // Show loading message on error instead of fallback following Standard Table Component
                const container = document.getElementById('councilsTableContainer');
                if (container) {
                    container.innerHTML = `
                        <div class="loading-indicator">
                            <p>שגיאה בטעינת טבלת הרשויות. אנא טען מחדש את הדף.</p>
                        </div>
                    `;
                }
            }
        }

        // Simple table fallback when ReusableTable fails
 
        // Create empty table when no data available
        function createEmptyTable() {
            console.log('📊 Creating empty table');
            
            const container = document.getElementById('councilsTableContainer');
            if (!container) return;

            const tableHTML = `
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>רשות שולחת</th>
                                <th>מספר תלמידים</th>
                                <th>סטטוס</th>
                                <th>סה"כ נדרש</th>
                                <th>עדכון אחרון</th>
                                <th>פעולות</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 40px; color: #6c757d;">
                                    אין נתוני רשויות זמינים
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = tableHTML;
            console.log('✅ Empty table created');
        }

        // Council management function following Cross-Component Communication
        function viewCouncil(councilId) {
            console.log('👁️ Viewing council:', councilId);
            const council = allCouncils.find(c => c.id === councilId);
            
            if (council) {
                // Store selected council information in session following Authentication & Session Management
                sessionStorage.setItem('selectedCouncilId', councilId);
                sessionStorage.setItem('selectedCouncilName', council.council);
                
                console.log('Selected council stored:', {
                    id: councilId,
                    name: council.council
                });
                
                // For now, show a simple alert - this can be extended to navigate to a detailed view
                alert(`צפייה ברשות: ${council.council}\nמספר תלמידים: ${council.numberOfStudents}\nסטטוס: ${council.status}\nסכום נדרש: ${council.totalRequested}`);
            } else {
                console.error('Council not found with ID:', councilId);
            }
        }

        // Context button navigation functions following Single-Page Application with Module Loading
        function navigateBackToSchoolsList() {
            console.log('🏫 Navigating back to schools list...');
            
            // Store navigation context following Authentication & Session Management
            sessionStorage.setItem('navigationSource', 'councilsummary');
            sessionStorage.setItem('navigationTimestamp', new Date().toISOString());
            
            // Check if loadSchoolListPage function is available following Cross-Component Communication
            if (typeof window.loadSchoolListPage === 'function') {
                window.loadSchoolListPage();
            } else {
                // Fallback: Load schools list page directly following Frontend Architecture Patterns
                loadPageDirectly('schoollist.html', 'schoollist', 'רשימת בתי ספר');
            }
        }

        function navigateBackToDashboard() {
            console.log('📊 Navigating back to dashboard...');
            
            // Store navigation context following Authentication & Session Management
            sessionStorage.setItem('navigationSource', 'councilsummary');
            sessionStorage.setItem('returnToDashboard', 'true');
            
            // Check if loadMainDashboard function is available following Cross-Component Communication
            if (typeof window.loadMainDashboard === 'function') {
                window.loadMainDashboard();
            } else if (typeof window.navigateToMainDashboard === 'function') {
                window.navigateToMainDashboard();
            } else {
                // Fallback: Load dashboard page directly following Frontend Architecture Patterns
                loadPageDirectly('maindashboard.html', 'maindashboard', 'לוח הבקרה הראשי');
            }
        }

        // Generic page loading function following Frontend Architecture Patterns
        function loadPageDirectly(filename, section, displayName) {
            console.log(`🔄 Loading ${filename} page directly...`);
            
            // Find the main content container following Project-Specific Patterns
            const mainContainer = document.getElementById('dynamicContent') ||
                                 document.getElementById('mainContent') || 
                                 document.querySelector('.main-content') || 
                                 document.querySelector('main') ||
                                 document.body;
    
            if (!mainContainer) {
                console.error('❌ Could not find main content container');
                return;
            }

            // Show loading state following Hebrew/RTL Specific Patterns
            mainContainer.innerHTML = `
                <div class="loading-spinner" style="text-align: center; padding: 40px; direction: rtl;">
                    <div style="font-size: 1.2em; margin-bottom: 15px;">טוען ${displayName}...</div>
                    <div style="color: #6c757d;">אנא המתן...</div>
                </div>
            `;
            
            // Fetch and load page following API Communication Pattern
            fetch(filename)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    console.log(`✅ ${filename} page loaded successfully`);
                    mainContainer.innerHTML = html;
                    
                    // Execute scripts safely following Critical Development Workflows
                    executeScriptsInContainer(mainContainer);
                    
                    // Update browser history following Single-Page Application patterns
                    history.pushState({ section: section }, '', `#${section}`);
                    
                    console.log(`✅ ${displayName} page loaded and initialized`);
                })
                .catch(error => {
                    console.error(`❌ Error loading ${filename} page:`, error);
                    showNavigationError(mainContainer, `שגיאה בטעינת ${displayName}`);
                });
        }

        // Utility functions following Critical Development Workflows
        function executeScriptsInContainer(container) {
            try {
                const scripts = container.querySelectorAll('script');
                scripts.forEach(script => {
                    if (script.textContent && script.textContent.trim()) {
                        try {
                            const newScript = document.createElement('script');
                            
                            if (script.src) {
                                newScript.src = script.src;
                            } else {
                                newScript.textContent = script.textContent;
                            }
                            
                            document.head.appendChild(newScript);
                            script.remove();
                            
                        } catch (scriptError) {
                            console.warn('⚠️ Error executing script:', scriptError);
                        }
                    }
                });
            } catch (error) {
                console.error('❌ Error in executeScriptsInContainer:', error);
            }
        }

        function showNavigationError(container, message) {
            container.innerHTML = `
                <div class="error-message">
                    <h3>${message}</h3>
                    <p>לא ניתן לטעון את הדף המבוקש. אנא נסה שוב.</p>
                    <button onclick="window.history.back()">חזרה</button>
                    <button onclick="window.location.reload()">רענן דף</button>
                </div>
            `;
        }

        // Initialize page following Critical Development Workflows
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🏁 DOMContentLoaded event fired!');
            loadCouncilsData();
        });

        // Also try immediate call if DOM is already ready
        if (document.readyState !== 'loading') {
            console.log('📄 Document already ready, calling loadCouncilsData immediately');
            loadCouncilsData();
        }

        // Make functions globally available following Cross-Component Communication
        window.loadCouncilsData = loadCouncilsData;
        window.generateMockData = generateMockData;
        window.initializeTableWithData = initializeTableWithData;
        window.viewCouncil = viewCouncil;
        window.navigateBackToSchoolsList = navigateBackToSchoolsList;
        window.navigateBackToDashboard = navigateBackToDashboard;
        window.loadPageDirectly = loadPageDirectly;
        window.executeScriptsInContainer = executeScriptsInContainer;
        window.showNavigationError = showNavigationError;

        console.log('✅ Council summary functions registered globally');
    </script>
</body>
</html>
