<script>
    console.log('🔍 Main Dashboard script loaded');

async function loadDashboardCardData(cardId) {
    console.log('📊 Loading dashboard card data for:', cardId);

    try {
        // Get selected school ID from session
        const session = await window.SessionState.getSession();
        let schoolId;

        if (parseInt(session.entityTypeId, 10) === 5) {
            // Multi-school network - use SelectedSchoolId
            const selectedSchoolId = await window.SessionState.getProperty('SelectedSchoolId');
            if (!selectedSchoolId) {
                console.warn('⚠️ No SelectedSchoolId in session');
                const containerElement = document.getElementById(cardId.replace('Card', 'InternalCards'));
                if (containerElement) {
                    containerElement.innerHTML = '<div class="no-data-message">לא נמצא בית ספר נבחר</div>';
                }
                return;
            }
            schoolId = selectedSchoolId;
        } else {
            // Single school - use entity ID
            schoolId = session.entityId;
        }

        console.log('🏫 Loading alerts for school:', schoolId);

        // Load data from backend via AlertsEventsManager
        const data = await window.AlertsEventsManager.loadAlertEventsData(schoolId);

        if (cardId === 'alertsCard') {
            // ✅ Pass schoolId to render function
            window.AlertsEventsManager.renderAlerts(data.alerts, 'alertsInternalCards', schoolId);
        } else if (cardId === 'eventsCard') {
            // ✅ Pass schoolId to render function
            window.AlertsEventsManager.renderEvents(data.events, 'eventsInternalCards', schoolId);
        }
    } catch (error) {
        console.error('❌ Error loading dashboard data:', error);
        const containerElement = document.getElementById(cardId.replace('Card', 'InternalCards'));
        if (containerElement) {
            containerElement.innerHTML = '<div class="error-message">שגיאה בטעינת הנתונים</div>';
        }
    }
}

    // Update the loadSchoolTitle function in schooldashboard.html
    async function loadSchoolTitle() {

            const session = await window.SessionState.getSession();
            const yearValue = await window.SessionState.getProperty('SelectedYearValue');

            console.log('🏫 School context:', { schoolName, yearValue });

            const titleElement = document.getElementById('schoolTitle');
            if (titleElement) {

                    ? `${schoolName} - ${yearValue}`

                console.log('✅ School title updated via SessionState');
            }

        } catch (error) {
            console.error('❌ Error loading school title:', error);
            const titleElement = document.getElementById('schoolTitle');
            if (titleElement) {
                titleElement.textContent = 'לוח בקרה של בית ספר';
            }
        }
    }

    // Resolve SelectedSchoolYearId (school_years.id) from backend and store in session
    async function resolveSelectedSchoolYearId() {
        try {
            const selectedYearId = await window.SessionState.getProperty('SelectedYearId');
            const selectedSchoolId = await window.SessionState.getProperty('SelectedSchoolId');

            console.log('🔎 Resolving SelectedSchoolYearId:', { selectedYearId, selectedSchoolId });

            if (!selectedYearId || !selectedSchoolId) {
                console.warn('⚠ Missing SelectedYearId or SelectedSchoolId; skipping school_year lookup');
                return null;
            }

            const url = AppConfig.getApiUrl(`schoolYears/by-year-and-school?yearId=${encodeURIComponent(selectedYearId)}&schoolId=${encodeURIComponent(selectedSchoolId)}`);
            console.log('🌐 Fetching school_year id from:', url);

            const authToken = sessionStorage.getItem('authToken');
            const resp = await fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': authToken ? `Bearer ${authToken}` : ''
                }
            });

            if (!resp.ok) {
                console.warn('⚠ school_year lookup returned non-OK status', resp.status);
                return null;
            }

            const payload = await resp.json();
            // Accept either { id: 123 } or plain numeric response
            const schoolYearId = payload && (payload.id ?? payload) ? (payload.id ?? payload) : null;

            if (schoolYearId) {
                await window.SessionState.setProperty('SelectedSchoolYearId', String(schoolYearId));
                console.log('✅ Stored SelectedSchoolYearId in session:', schoolYearId);
                return schoolYearId;
            } else {
                console.warn('⚠ school_year not found for given yearId/schoolId', { selectedYearId, selectedSchoolId });
                // Ensure property is cleared if not found
                await window.SessionState.setProperty('SelectedSchoolYearId', '');
                return null;
            }
        } catch (err) {
            console.error('❌ Error resolving SelectedSchoolYearId:', err);
            return null;
        }
    }
