<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שנתון בית ספר</title>
</head>
<body>
    <div class="main-dashboard-container">
        <!-- School Title Section -->
        <div class="school-title-section">
            <h1 class="school-title" id="schoolTitle">בית ספר שמע - ניהול תלמידי חוץ תשפ"ו</h1>
        </div>
        
        <!-- Navigation Link to Main Page -->
        <div class="dashboard-flex-row">
            <!-- Dashboard cards -->
            <div class="dashboard-cards-wrapper">
                <div class="dashboard-card" id="alertsCard">
                    <div class="dashboard-card-header">
                        <div class="dashboard-card-icon">🔔</div>
                        <div class="dashboard-card-title">התראות</div>
                        <!-- Plus icon as leftmost item -->
                        <img src="Plus icon.png" alt="הוספה" class="dashboard-card-plus" 
                            onclick="showAddModal('alertsCard')" 
                            title="הוספת התראה חדשה" />
                    </div>
                    
                    <div class="internal-cards-container" id="alertsInternalCards">
                        <!-- Internal cards will be populated here -->
                    </div>
                </div>
                
                <div class="dashboard-card" id="eventsCard">
                    <div class="dashboard-card-header">
                        <div class="dashboard-card-icon">🗓</div>
                        <div class="dashboard-card-title">אירועים</div>
                        <!-- Plus icon as leftmost item -->
                        <img src="Plus icon.png" alt="הוספה" class="dashboard-card-plus" 
                            onclick="showAddModal('eventsCard')" 
                            title="הוספת אירוע חדש" />
                    </div>
                    
                    <div class="internal-cards-container" id="eventsInternalCards">
                        <!-- Internal cards will be populated here -->
                    </div>
                </div>
            </div>
            
            <div class="context-buttons-section">
                <button class="context-btn" onclick="navigateToStudents()">תלמידים</button>
                <button class="context-btn" >פרטי בית ספר</button>
                <button class="context-btn" >מסמכים בית ספריים</button>
            </div>
        </div>

        <div class="content-card">
            <div class="form-footer" style="text-align: center; color: #666; font-size: 12px;">
                פט"ל - פתרונות טכנולגים לחינוך - גרסה <span id="systemVersion">טוען...</span>
            </div>
        </div>
    </div>

    <script>
        console.log('🔍 Main Dashboard script loaded');

        // Load dashboard card data following Project-Specific Patterns
        function loadDashboardCardData(cardId) {
            console.log('📊 Loading dashboard card data for:', cardId);
            
            const mockData = {
                alertsCard: {
                    items: [
                        {
                            content: "גרסה 2.1 זמינה להורדה",
                            timestamp: "לפני 10 דקות",
                            priority: "high"
                        },
                        {
                            content: "גיבוי יומי מתוכנן ב-23:00",
                            timestamp: "לפני שעה",
                            priority: "medium"
                        },
                        {
                            content: "משתמש חדש ממתין לאישור",
                            timestamp: "לפני 2 שעות",
                            priority: "low"
                        }
                    ]
                },
                eventsCard: {
                    items: [
                        {
                            content: "ישיבה שבועית - חדר ישיבות A",
                            timestamp: "מחר 09:00",
                            priority: "high"
                        },
                        {
                            content: "הצגת תוצאות חודש מרץ",
                            timestamp: "יום רביעי 14:00",
                            priority: "medium"
                        },
                        {
                            content: "הדרכה על תכונות חדשות במערכת",
                            timestamp: "יום חמישי 10:30",
                            priority: "medium"
                        },
                        {
                            content: "תחזוקה שבועית של השרתים",
                            timestamp: "יום ראשון 08:00",
                            priority: "low"
                        }
                    ]
                }
            };

            const cardData = mockData[cardId];
            if (!cardData) {
                console.error('❌ No data found for cardId:', cardId);
                return;
            }

            // Get the internal cards container
            const containerElement = document.getElementById(cardId.replace('Card', 'InternalCards'));
            if (!containerElement) {
                console.error('❌ Container not found for:', cardId.replace('Card', 'InternalCards'));
                return;
            }

            console.log('✅ Container found, clearing and populating...');

            // Clear existing content
            containerElement.innerHTML = '';

            // Create internal cards following Hebrew/RTL Specific Patterns
            cardData.items.forEach((item, index) => {
                const internalCard = document.createElement('div');
                internalCard.className = 'internal-card';
                internalCard.setAttribute('data-priority', item.priority);
                
                internalCard.innerHTML = `
                    <div class="internal-card-content">${item.content}</div>
                    <div class="internal-card-timestamp">${item.timestamp}</div>
                `;

                // Add click handler following Cross-Component Communication
                internalCard.addEventListener('click', () => {
                    console.log(`Internal card clicked: ${item.content} in ${cardId}`);
                    const cardClickEvent = new CustomEvent('internalCardClicked', {
                        detail: {
                            cardId: cardId,
                            itemIndex: index,
                            item: item
                        }
                    });
                    window.dispatchEvent(cardClickEvent);
                });

                containerElement.appendChild(internalCard);
            });

            console.log(`✅ ${cardData.items.length} cards loaded for ${cardId}`);
        }
        // Add navigation function following Project-Specific Patterns
        async function navigateToStudents() {
            try {
                // Hide current content
                document.getElementById('dynamicContent').style.display = 'block';
                
                // Load students.html following Frontend Architecture Patterns
                const response = await fetch('students.html');
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById('dynamicContent').innerHTML = html;
                    
                    // Re-execute scripts in loaded content following Common Gotchas
                    executeScriptsInContainer(document.getElementById('dynamicContent'));
                    
                    // Update browser history following Single-Page Application patterns
                    history.pushState({ section: 'students' }, '', '#students');
                    
                    console.log('✅ Students page loaded successfully');
                } else {
                    console.error('Failed to load students.html:', response.status);
                }
            } catch (error) {
                console.error('Error loading students page:', error);
            }
        }

        // Load system version following API Communication Pattern
        async function loadSystemVersion() {
            try {
                const response = await fetch(AppConfig.getApiUrl('systemAttributes'));
                if (response.ok) {
                    const attributes = await response.json();
                    const versionAttr = attributes.find(attr => attr.name === "System Version");
                    const versionElement = document.getElementById('systemVersion');
                    if (versionElement) {
                        versionElement.textContent = versionAttr ? versionAttr.value : '1.0';
                    }
                } 
            } catch (error) {
                console.log('Could not load system version, using default');
                const versionElement = document.getElementById('systemVersion');
                if (versionElement) {
                    versionElement.textContent = '1.0';
                }
            }
        }

        // Load school title dynamically following Authentication & Session Management
        function loadSchoolTitle() {
            console.log('📋 Loading school title...');
            
            // Get selected school from session storage
            const selectedSchoolName = sessionStorage.getItem('selectedSchoolName');
            const currentYearValue = sessionStorage.getItem('currentYearValue');
            
            // Use fallback values if session data not available
            const schoolName = selectedSchoolName || 'בית ספר שמע - ניהול תלמידי חוץ';
            const yearValue = currentYearValue || 'תשפ"ו';
            
            console.log('School context:', {
                schoolName: schoolName,
                yearValue: yearValue
            });
            
            // Update title element
            const titleElement = document.getElementById('schoolTitle');
            if (titleElement) {
                titleElement.textContent = `${schoolName} - ${yearValue}`;
                console.log('✅ School title updated:', titleElement.textContent);
            } else {
                console.error('❌ School title element not found');
            }
        }




        // Execute scripts in dynamically loaded content following Common Gotchas
        function executeScriptsInContainer(container) {
            const scripts = container.querySelectorAll('script');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                if (script.src) {
                    newScript.src = script.src;
                } else {
                    newScript.textContent = script.textContent;
                }
                script.parentNode.replaceChild(newScript, script);
            });
        }

        // Show add modal placeholder function following Frontend Architecture Patterns
        function showAddModal(cardType) {
            const cardName = cardType === 'alertsCard' ? 'התראה' : 'אירוע';
            alert(`הוספת ${cardName} חדש - תכונה זו תתווסף בעתיד`);
        }

        // Debug function to check if elements exist
        function debugDashboardElements() {
            console.log('🔍 Dashboard Debug:', {
                alertsContainer: document.getElementById('alertsInternalCards'),
                eventsContainer: document.getElementById('eventsInternalCards'),
                systemVersionElement: document.getElementById('systemVersion'),
                contextButtons: document.querySelectorAll('.context-btn'),
                documentReady: document.readyState
            });
        }

        // Initialize dashboard following Critical Development Workflows
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🏁 School Dashboard DOMContentLoaded');
            
            // Load dashboard data and context buttons
            setTimeout(async () => {
                loadSchoolTitle(); // Load school name and year
                loadDashboardCardData('alertsCard');
                loadDashboardCardData('eventsCard');
                loadSystemVersion();
                
                console.log('✅ School Dashboard initialized successfully');
            }, 100);
        });

        // Also try immediate call if DOM is already ready following Frontend Architecture Patterns
        if (document.readyState !== 'loading') {
            console.log('📄 Document already ready, calling initialization immediately');
            setTimeout(async () => {
                loadSchoolTitle(); // Load school name and year
                loadDashboardCardData('alertsCard');
                loadDashboardCardData('eventsCard');
                loadSystemVersion();
                console.log('✅ School Dashboard initialized immediately');
            }, 50);
        }

        // Make functions globally available following Cross-Component Communication
        window.loadDashboardCardData = loadDashboardCardData;
        window.showAddModal = showAddModal;
        window.loadSystemVersion = loadSystemVersion;
        window.updateContextButtonLabels = updateContextButtonLabels;
        window.storeSelectedYearInSession = storeSelectedYearInSession;
        window.showSchoolYear = showSchoolYear;
        window.loadSchoolListPage = loadSchoolListPage;
        window.loadSchoolYearPage = loadSchoolYearPage;
        window.executeScriptsInContainer = executeScriptsInContainer;
        window.debugDashboardElements = debugDashboardElements;

        console.log('✅ School Dashboard functions registered globally');
    </script>
</body>
</html>
