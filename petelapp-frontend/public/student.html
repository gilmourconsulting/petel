    /**
     * Initialize documents table component for selected student
     */
    async function initializeStudentDocuments() {
        try {
            console.log('📄 Initializing student documents table...');

            // Get student ID from backend session
            const studentId = await window.SessionState.getProperty('SelectedStudentId');
            const selectedYearId = await window.SessionState.getProperty('SelectedYearId');

            if (!studentId) {
                console.error('❌ No student ID in session');
                const container = document.getElementById('documentsTableContainer');
                if (container) {
                    container.innerHTML = `
                    <div class="table-error" style="
                        padding: 20px; 
                        background: #f8d7da; 
                        color: #721c24; 
                        border: 1px solid #f5c6cb; 
                        border-radius: 8px;
                        text-align: center;
                        direction: rtl;
                    ">
                        <h4>לא נמצא מזהה תלמיד</h4>
                        <button onclick="navigateToStudents()" class="btn btn-primary" style="margin-top: 10px;">
                            חזרה לרשימת תלמידים
                        </button>
                    </div>
                `;
                }
                return;
            }

            console.log('🔍 Loading documents for student ID:', studentId);

            // Initialize documents table component
            documentsComponent = new DocumentsTableComponent('documentsTableContainer', {
                showUploadForm: false,
                allowDelete: false,
                allowDownload: true,
                allowUpload: true,
                entityId: studentId,
                entityType: 'student',
                yearId: selectedYearId,
                onUploadSuccess: (result) => {
                    console.log('📄 Document uploaded for student:', result);
                },
                onDeleteSuccess: (documentId) => {
                    console.log('🗑 Document deleted:', documentId);
                }
            });

            // Create global reference for button onclick handlers
            window[`documentsTableInstance_documentsTableContainer`] = documentsComponent;

            await documentsComponent.init();

            console.log('✅ Student documents table initialized');
        } catch (error) {
            console.error('❌ Error initializing student documents:', error);
            const container = document.getElementById('documentsTableContainer');
            if (container) {
                container.innerHTML = `
                <div class="table-error" style="
                    padding: 20px; 
                    background: #f8d7da; 
                    color: #721c24; 
                    border: 1px solid #f5c6cb; 
                    border-radius: 8px;
                    text-align: center;
                    direction: rtl;
                ">
                    <h4>שגיאה בטעינת רשימת המסמכים</h4>
                    <button onclick="initializeStudentDocuments()" class="btn btn-primary" style="margin-top: 10px;">
                        נסה שוב
                    </button>
                </div>
            `;
            }
        }
    }


    /**
     * Cleanup function called by PageLifecycleManager when leaving page
     */
    function cleanupStudentPage() {
        console.log('🧹 Cleaning up student page...');

        try {
            // ✅ ADD: Cleanup documents component FIRST
            if (documentsComponent) {
                console.log('🧹 Cleaning up documents component instance...');

                // Call component cleanup if available
                if (typeof documentsComponent.cleanup === 'function') {
                    documentsComponent.cleanup();
                }

                // Clear table reference
                if (documentsComponent.documentsTable) {
                    documentsComponent.documentsTable = null;
                }

                // Clear document types
                if (documentsComponent.documentTypes) {
                    documentsComponent.documentTypes = [];
                }

                // Null the component
                documentsComponent = null;
                console.log('✅ Documents component nullified');
            }

            // Remove global reference
            const globalKey = 'documentsTableInstance_documentsTableContainer';
            if (window[globalKey]) {
                delete window[globalKey];
                console.log('✅ Global documents instance removed:', globalKey);
            }

            // Clear container HTML
            const documentsContainer = document.getElementById('documentsTableContainer');
            if (documentsContainer) {
                documentsContainer.innerHTML = '<div class="loading-spinner">טוען מסמכים...</div>';
                console.log('✅ Documents container cleared');
            }

            // ✅ Clear student-specific table instances
            if (window.currentStudentsData) {
                window.currentStudentsData = null;
                console.log('✅ Current students data cleared');
            }

            // ✅ Clear students table container
            const studentsContainer = document.getElementById('studentsTableContainer');
            if (studentsContainer) {
                studentsContainer.innerHTML = '<div class="loading-spinner">טוען נתוני תלמידים...</div>';
                console.log('✅ Students container cleared');
            }

            // ✅ Clear modal states
            const pricingModal = document.getElementById('pricingModal');
            if (pricingModal) {
                pricingModal.style.display = 'none';

                // Clear pricing table container
                const pricingContainer = document.getElementById('pricingTableContainer');
                if (pricingContainer) {
                    pricingContainer.innerHTML = '<div class="loading-spinner">טוען נתונים...</div>';
                }
            }

            console.log('✅ Student page cleanup complete');
        } catch (error) {
            console.error('❌ Error during student page cleanup:', error);
        }
    }
    window.cleanupStudentPage = cleanupStudentPage;

    // Calculate student pricing from section header
    async function calculateStudentPricingFromSection() {
        try {
            console.log('🔢 Starting pricing calculation from section...');

            // Get student ID from backend session
            const studentId = await window.SessionState.getProperty('SelectedStudentId');

            if (!studentId) {
                console.error('❌ No student ID in session');
                alert('לא נמצא מזהה תלמיד');
                return;
            }

            // Get student name from current data
            let studentName = 'תלמיד';
            if (window.currentStudentsData && window.currentStudentsData.length > 0) {
                studentName = window.currentStudentsData[0].name || 'תלמיד';
            }

            // Confirm calculation
            const confirmCalc = confirm(`האם לחשב רכיבי תמחור עבור ${studentName}?\n\nפעולה זו תחליף את רכיבי התמחור הקיימים.`);

            if (!confirmCalc) {
                console.log('⚠️ Pricing calculation cancelled by user');
                return;
            }

            // Show loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'calculatingIndicator';
            loadingDiv.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 50px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10000;
            text-align: center;
            direction: rtl;
        `;
            loadingDiv.innerHTML = `
            <div class="loading-spinner" style="margin-bottom: 15px;">⏳</div>
            <div style="font-size: 16px; font-weight: bold;">מחשב רכיבי תמחור...</div>
            <div style="font-size: 14px; color: #666; margin-top: 10px;">אנא המתן</div>
        `;
            document.body.appendChild(loadingDiv);

            // Call calculation API
            const token = window.sessionManager.getToken();
            if (!token) {
                throw new Error('No authentication token found');
            }

            console.log(`📡 Calling calculation API for student ${studentId}...`);

            const response = await fetch(AppConfig.getApiUrl(`studentpricing/calculate/${studentId}?save=true`), {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            // Remove loading indicator
            document.body.removeChild(loadingDiv);

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                console.error('❌ API Error Response:', errorData);
                throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
            }

            const result = await response.json();
            console.log('📦 Full API Response:', result);

            if (result.success) {
                // Ensure data object exists
                const data = result.data || result;
                
                // ✅ Check if no changes were detected
                if (data.noChangeDetected) {
                    console.log('ℹ️ No pricing changes detected:', data);

                    let message = `✅ חישוב התמחור הושלם בהצלחה!\n\n`;
                    message += `ℹ️ לא התגלו שינויים ברכיבי התמחור\n`;
                    
                    if (data.elementsCount !== undefined) {
                        message += `📊 ${data.elementsCount} רכיבי תמחור תקפים\n`;
                    }
                    
                    if (data.totalPrice !== undefined) {
                        message += `💰 סכום כולל: ₪${data.totalPrice.toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\n`;
                    }
                    
                    message += `\nהנתונים הקיימים עדיין תקפים - לא נוצרה גרסה חדשה.`;

                    alert(message);

                    // No need to refresh data since nothing changed
                    // Optionally, show current pricing
                    const showResults = confirm('האם להציג את רכיבי התמחור הקיימים?');
                    if (showResults) {
                        await viewStudentPricing(studentId, studentName);
                    }
                } else {
                    // Changes detected - new version created
                    console.log('✅ Pricing calculation successful:', data);

                    // ✅ Update session with the new student version ID
                    if (data.newStudentId) {
                        console.log(`📝 Updating session with new student ID: ${data.newStudentId} (was: ${studentId})`);
                        await window.SessionState.setProperty('SelectedStudentId', data.newStudentId.toString());

                        // ✅ Reload student data to get the new version with updated cost
                        await refreshStudentDataAfterPricing(data.newStudentId);
                    }

                    // Show success message with details
                    let message = `✅ חישוב התמחור הושלם בהצלחה!\n\n`;
                    
                    if (data.elementsCount !== undefined) {
                        message += `📊 ${data.elementsCount} רכיבי תמחור חושבו\n`;
                    }
                    
                    if (data.totalPrice !== undefined) {
                        message += `💰 סכום כולל: ₪${data.totalPrice.toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\n`;
                    }

                    if (data.warnings && data.warnings.length > 0) {
                        message += `\n⚠️ אזהרות:\n`;
                        data.warnings.slice(0, 3).forEach(warning => {
                            message += `  • ${warning}\n`;
                        });
                        if (data.warnings.length > 3) {
                            message += `  ... ו-${data.warnings.length - 3} אזהרות נוספות\n`;
                        }
                    }

                    alert(message);

                    // Optionally, auto-open the pricing view to show calculated elements
                    const showResults = confirm('האם להציג את רכיבי התמחור שחושבו?');
                    if (showResults) {
                        // ✅ Use the NEW student ID for viewing pricing
                        const newStudentId = data.newStudentId || studentId;
                        await viewStudentPricing(newStudentId, studentName);
                    }
                }

            } else {
                // ✅ Enhanced error handling
                console.error('❌ API returned success=false:', result);
                const errorMessage = result.message || result.error || 'Calculation failed';
                throw new Error(errorMessage);
            }

        } catch (error) {
            console.error('❌ Error calculating pricing:', error);

            // Remove loading indicator if still present
            const loadingDiv = document.getElementById('calculatingIndicator');
            if (loadingDiv) {
                document.body.removeChild(loadingDiv);
            }

            alert(`❌ שגיאה בחישוב תמחור:\n${error.message}`);
        }
    }

    // ✅ NEW: Refresh student data after pricing calculation
    async function refreshStudentDataAfterPricing(newStudentId) {
        try {
            console.log('🔄 Refreshing student data for new version:', newStudentId);

            const token = window.sessionManager.getToken();
            if (!token) {
                console.error('❌ No auth token found');
                return;
            }

            const schoolYearId = await window.SessionState.getProperty('SelectedSchoolYearId');

            // Fetch the new student version data
            const response = await fetch(AppConfig.getApiUrl(`students?schoolYearId=${schoolYearId}`), {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const result = await response.json();

                if (result.success && result.data) {
                    // Find the new student version in the response
                    const newStudentData = result.data.find(s => s.id === newStudentId);

                    if (newStudentData) {
                        // Transform the data
                        const transformedStudent = {
                            id: newStudentData.id,
                            idNumber: newStudentData.idNumber || '',
                            name: `${newStudentData.firstName || ''} ${newStudentData.lastName || ''}`.trim(),
                            gender: newStudentData.gender === 1 ? 'זכר' : newStudentData.gender === 2 ? 'נקבה' : '',
                            address: [
                                newStudentData.street,
                                newStudentData.houseNumber,
                                newStudentData.city,
                                newStudentData.postCode
                            ].filter(Boolean).join(', '),
                            class: newStudentData.className || newStudentData.classId?.toString() || '',
                            classId: newStudentData.classId,
                            startDate: newStudentData.startDate ? new Date(newStudentData.startDate).toLocaleDateString('he-IL') : '',
                            endDate: newStudentData.endDate ? new Date(newStudentData.endDate).toLocaleDateString('he-IL') : '',
                            status: newStudentData.statusName || '',
                            category: newStudentData.disabilityCategory || '',
                            totalAmount: newStudentData.cost != null ? newStudentData.cost.toString() : '0',
                            sendingCouncil: newStudentData.councilName || newStudentData.sendingCouncil?.toString() || '',
                            sendingCouncilId: newStudentData.sendingCouncil
                        };

                        // Update current students data
                        window.currentStudentsData = [transformedStudent];

                        // Update session with new student data
                        await window.SessionState.setProperty('SelectedStudentData', JSON.stringify(transformedStudent));

                        // Refresh the table display
                        createStudentsTable([transformedStudent]);

                        console.log('✅ Student data refreshed with new version:', transformedStudent);
                    } else {
                        console.warn('⚠️ New student version not found in API response');
                    }
                }
            } else {
                console.error('❌ Failed to refresh student data:', response.status);
            }
        } catch (error) {
            console.error('❌ Error refreshing student data:', error);
        }
    }

    window.calculateStudentPricingFromSection = calculateStudentPricingFromSection;
    window.refreshStudentDataAfterPricing = refreshStudentDataAfterPricing;

    window.calculateStudentPricingFromSection = calculateStudentPricingFromSection;

    // Fallback copy function for older browsers following Frontend Architecture Patterns
    function fallbackCopyTextToClipboard(text) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        textArea.style.top = '-999999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
            const successful = document.execCommand('copy');
            if (successful) {
                alert('הקישור הועתק ללוח');
            } else {
                alert('לא ניתן להעתיק את הקישור');
            }
        } catch (err) {
            console.error('Fallback copy failed:', err);
            alert('לא ניתן להעתיק את הקישור');
        }

        document.body.removeChild(textArea);
        closeDocumentModal();
    }

    // View student pricing elements
    async function viewStudentPricing(studentId, studentName) {
        console.log('💰 Viewing pricing elements for student:', studentId);

        try {
            // Show modal
            const modal = document.getElementById('pricingModal');
            const studentNameSpan = document.getElementById('pricingStudentName');
            const container = document.getElementById('pricingTableContainer');

            if (!modal || !studentNameSpan || !container) {
                console.error('❌ Modal elements not found');
                return;
            }

            // Set student name
            studentNameSpan.textContent = studentName;

            // Show loading
            container.innerHTML = '<div class="loading-spinner">טוען נתונים...</div>';
            modal.style.display = 'flex';

            // Fetch pricing data
            const token = window.sessionManager.getToken();
            if (!token) {
                throw new Error('No authentication token found');
            }

            const response = await fetch(AppConfig.getApiUrl(`studentpricing/${studentId}`), {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const result = await response.json();

            if (result.success && result.data) {
                console.log('✅ Pricing data loaded:', result.data);
                createPricingTable(result.data);
            } else {
                throw new Error(result.message || 'Failed to load pricing data');
            }

        } catch (error) {
            console.error('❌ Error loading pricing elements:', error);
            showPricingTableError('שגיאה בטעינת נתוני תמחור');
        }
    }

    // Create pricing elements table
    function createPricingTable(data) {
        console.log('📊 Creating pricing table with ReusableTable component');

        if (typeof ReusableTable === 'undefined') {
            console.log('⚠️ ReusableTable not loaded, loading component...');
            loadReusableTableComponentForPricing(data);
            return;
        }

        initializePricingTable(data);
    }

    // Load ReusableTable for pricing
    function loadReusableTableComponentForPricing(data) {
        const existingScript = document.querySelector('script[src="table-component.js"]');
        if (existingScript) {
            console.log('table-component.js already loaded, waiting for ReusableTable...');
            setTimeout(() => {
                if (typeof ReusableTable !== 'undefined') {
                    initializePricingTable(data);
                } else {
                    showPricingTableError('שגיאה בטעינת רכיב הטבלה');
                }
            }, 500);
            return;
        }

        const script = document.createElement('script');
        script.src = 'table-component.js';
        script.onload = () => {
            console.log('✅ table-component.js loaded for pricing');
            setTimeout(() => {
                initializePricingTable(data);
            }, 100);
        };
        script.onerror = () => {
            console.error('❌ Failed to load table-component.js');
            showPricingTableError('שגיאה בטעינת רכיב הטבלה');
        };
        document.head.appendChild(script);
    }

 // Initialize pricing table
function initializePricingTable(responseData) {
    console.log('🔧 Initializing pricing ReusableTable with data:', responseData);

    // ✅ Extract data and summary from response
    const data = responseData.data || responseData;
    const summary = responseData.summary || {};

    if (!data || data.length === 0) {

// Update viewStudentPricing to pass full result
async function viewStudentPricing(studentId, studentName) {
    console.log('💰 Viewing pricing elements for student:', studentId);

    try {
        // Show modal
        const modal = document.getElementById('pricingModal');
        const studentNameSpan = document.getElementById('pricingStudentName');
        const container = document.getElementById('pricingTableContainer');

        if (!modal || !studentNameSpan || !container) {
            console.error('❌ Modal elements not found');
            return;
        }

        // Set student name
        studentNameSpan.textContent = studentName;

        // Show loading
        container.innerHTML = '<div class="loading-spinner">טוען נתונים...</div>';
        modal.style.display = 'flex';

        // Fetch pricing data
        const token = window.sessionManager.getToken();
        if (!token) {
            throw new Error('No authentication token found');
        }

        const response = await fetch(AppConfig.getApiUrl(`studentpricing/${studentId}`), {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        });

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const result = await response.json();

        if (result.success) {
            console.log('✅ Pricing data loaded:', result);
            // ✅ Pass the full result object with summary data
            createPricingTable(result);
        } else {
            throw new Error(result.message || 'Failed to load pricing data');
        }

    } catch (error) {
        console.error('❌ Error loading pricing elements:', error);
        showPricingTableError('שגיאה בטעינת נתוני תמחור');
    }
}
