// Close document modal function - MISSING FUNCTION following Critical Development Workflows
function closeDocumentModal() {
    const modal = document.querySelector('.document-access-modal');
    if (modal) {
        modal.remove();
        console.log('✅ Document modal closed');
    }
}

// Copy document URL to clipboard function following Frontend Architecture Patterns
function copyDocumentUrl(url) {
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(() => {
            alert('הקישור הועתק ללוח');
            closeDocumentModal();
        }).catch(err => {
            console.error('Failed to copy URL:', err);
            fallbackCopyTextToClipboard(url);
        });
    } else {
        fallbackCopyTextToClipboard(url);
    }
}

// Fallback copy function for older browsers following Frontend Architecture Patterns
function fallbackCopyTextToClipboard(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.left = '-999999px';
    textArea.style.top = '-999999px';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    
    try {
        const successful = document.execCommand('copy');
        if (successful) {
            alert('הקישור הועתק ללוח');
        } else {
            alert('לא ניתן להעתיק את הקישור');
        }
    } catch (err) {
        console.error('Fallback copy failed:', err);
        alert('לא ניתן להעתיק את הקישור');
    }
    
    document.body.removeChild(textArea);
    closeDocumentModal();
}

// Enhanced document viewing function with better error handling following Frontend Architecture Patterns
function viewDocumentDetails(documentId) {
    console.log('👁️ Viewing document details:', documentId);
    
    const documentData = getDocumentById(documentId);
    if (documentData) {
        // Store in session following Authentication & Session Management
        sessionStorage.setItem('selectedDocumentId', documentId);
        sessionStorage.setItem('selectedDocumentForm', documentData.form);
        
        // Get document URL from mapping following Project-Specific Patterns
        const documentUrl = DOCUMENT_URL_MAP[documentId];
        
        if (!documentUrl) {
            console.error('❌ No URL mapped for document:', documentId);
            alert(`לא נמצא קישור למסמך "${documentData.form}". אנא פנה למנהל המערכת.`);
            return;
        }
        
        // Build full URL following API Communication Pattern
        const baseUrl = window.location.origin;
        const fullDocumentUrl = `${baseUrl}/${documentUrl}`;
        
        console.log('🔗 Attempting to open document URL:', fullDocumentUrl);
        
        // First, check if the document exists following Critical Development Workflows
        fetch(fullDocumentUrl, { method: 'HEAD' })
            .then(response => {
                if (response.ok) {
                    // Document exists, try to open it
                    openDocumentWindow(documentData, fullDocumentUrl);
                } else {
                    console.warn(`⚠️ Document not found at: ${fullDocumentUrl}`);
                    // Show alternative options since document doesn't exist
                    showDocumentNotFoundOptions(documentData);
                }
            })
            .catch(error => {
                console.error('❌ Error checking document availability:', error);
                // Still try to open, maybe it's a CORS issue
                openDocumentWindow(documentData, fullDocumentUrl);
            });
    } else {
        console.error('❌ Document not found:', documentId);
        alert('המסמך המבוקש לא נמצא במערכת.');
    }
}

// Separate function to handle document opening following Single-Page Application with Module Loading
function openDocumentWindow(documentData, fullDocumentUrl) {
    try {
        // Open document in new window following Frontend Architecture Patterns
        const windowFeatures = 'noopener,noreferrer,scrollbars=yes,resizable=yes,width=1200,height=800';
        const newWindow = window.open(fullDocumentUrl, '_blank', windowFeatures);
        
        if (newWindow) {
            console.log('✅ Document opened successfully in new window');
            console.log(`📄 Document URL: ${fullDocumentUrl}`);
            newWindow.focus();
            
            // Log document access following Critical Development Workflows
            console.log(`📄 Document accessed: ID=${documentData.id}, Form="${documentData.form}", Status="${documentData.status}"`);
            
        } else {
            // Handle popup blocker following Hebrew/RTL Specific Patterns
            console.warn('⚠️ Could not open document - popup may be blocked');
            showDocumentAccessOptions(documentData, fullDocumentUrl);
        }
        
    } catch (error) {
        console.error('❌ Error opening document:', error);
        alert(`שגיאה בפתיחת המסמך "${documentData.form}":\n${error.message}\n\nאנא נסה שוב או פנה למנהל המערכת.`);
    }
}

// Enhanced download function with better error handling following Project-Specific Patterns
function downloadDocument(documentId) {
    console.log('📥 Downloading document:', documentId);
    
    const documentData = getDocumentById(documentId);
    if (documentData) {
        const documentUrl = DOCUMENT_URL_MAP[documentId];
        if (documentUrl) {
            // Build full URL following API Communication Pattern
            const baseUrl = window.location.origin;
            const fullDocumentUrl = `${baseUrl}/${documentUrl}`;
            
            // Check if document exists before attempting download
            fetch(fullDocumentUrl, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        // Document exists, proceed with download
                        initiateDownload(documentData, fullDocumentUrl);
                    } else {
                        console.warn(`⚠️ Document not found for download: ${fullDocumentUrl}`);
                        alert(`המסמך "${documentData.form}" אינו זמין להורדה כרגע.`);
                    }
                })
                .catch(error => {
                    console.error('❌ Error checking document for download:', error);
                    // Still try to download, maybe it's a CORS issue
                    initiateDownload(documentData, fullDocumentUrl);
                });
        } else {
            alert(`לא נמצא קישור להורדת המסמך "${documentData.form}"`);
        }
    } else {
        alert('המסמך המבוקש לא נמצא במערכת.');
    }
}

// Separate function to handle actual download following Frontend Architecture Patterns
function initiateDownload(documentData, fullDocumentUrl) {
    try {
        // Create a temporary link to initiate download
        const link = document.createElement('a');
        link.href = fullDocumentUrl;
        link.download = `${documentData.form.replace(/[^a-zA-Z0-9\u0590-\u05FF]/g, '_')}.pdf`;
        link.style.display = 'none';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        console.log(`📥 Download initiated for: ${documentData.form}`);
        
        // Show Hebrew success message following Hebrew/RTL Specific Patterns
        setTimeout(() => {
            alert(`הורדת המסמך "${documentData.form}" החלה. בדוק את תיקיית ההורדות שלך.`);
        }, 500);
        
    } catch (error) {
        console.error('❌ Error downloading document:', error);
        alert(`שגיאה בהורדת המסמך "${documentData.form}". המסמך עשוי להיות לא זמין.`);
    }
}

// Load ReusableTable component for documents
function loadReusableTableComponentForDocuments(data) {
    const existingScript = document.querySelector('script[src="table-component.js"]');
    if (existingScript) {
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                initializeDocumentsTable(data);
            } else {
                console.error('❌ ReusableTable still not available for documents table');
                showDocumentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 500);
        return;
    }

    const script = document.createElement('script');
    script.src = 'table-component.js';
    script.onload = () => {
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                initializeDocumentsTable(data);
            } else {
                console.error('❌ ReusableTable not available for documents table');
                showDocumentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 100);
    };
    script.onerror = () => {
        console.error('❌ Failed to load table-component.js for documents');
        showDocumentsTableError('שגיאה בטעינת רכיב הטבלה');
    };
    document.head.appendChild(script);
}

// Initialize the documents ReusableTable

    console.log('🔧 Initializing documents ReusableTable with data:', data);
    
    const columns = [
        { key: 'id', label: 'מספר', sortable: true, readOnly: true },
        { key: 'form', label: 'טופס', sortable: true, readOnly: false },
