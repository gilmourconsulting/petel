// Close document modal function - MISSING FUNCTION following Critical Development Workflows
function closeDocumentModal() {
    const modal = document.querySelector('.document-access-modal');
    if (modal) {
        modal.remove();
        console.log('✅ Document modal closed');
    }
}

// Copy document URL to clipboard function following Frontend Architecture Patterns
function copyDocumentUrl(url) {
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(() => {
            alert('הקישור הועתק ללוח');
            closeDocumentModal();
        }).catch(err => {
            console.error('Failed to copy URL:', err);
            fallbackCopyTextToClipboard(url);
        });
    } else {
        fallbackCopyTextToClipboard(url);
    }
}

// Fallback copy function for older browsers following Frontend Architecture Patterns
function fallbackCopyTextToClipboard(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.left = '-999999px';
    textArea.style.top = '-999999px';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    
    try {
        const successful = document.execCommand('copy');
        if (successful) {
            alert('הקישור הועתק ללוח');
        } else {
            alert('לא ניתן להעתיק את הקישור');
        }
    } catch (err) {
        console.error('Fallback copy failed:', err);
        alert('לא ניתן להעתיק את הקישור');
    }
    
    document.body.removeChild(textArea);
    closeDocumentModal();
}

// Enhanced document viewing function - with delayed popup check following Frontend Architecture Patterns
async function viewDocumentDetails(documentId) {
    console.log('👁️ Viewing document details:', documentId);
    
    const documentData = getDocumentById(documentId);
    if (!documentData) {
        alert('המסמך המבוקש לא נמצא במערכת.');
        return;
    }
    
    try {
        // ✅ Store in backend session via SessionState
        await window.SessionState.setProperty('SelectedDocumentId', documentId);
        await window.SessionState.setProperty('SelectedDocumentForm', documentData.form);
        
        console.log('✅ Document selection stored in backend session');
        
        const documentUrl = DOCUMENT_URL_MAP[documentId];
        
        if (!documentUrl) {
            showDocumentNotFoundOptions(documentData);
            return;
        }
        
        const baseUrl = window.location.origin;
        const fullDocumentUrl = `${baseUrl}/${documentUrl}`;
        
        const windowFeatures = 'noopener,noreferrer,scrollbars=yes,resizable=yes,width=1200,height=800';
        const newWindow = window.open(fullDocumentUrl, '_blank', windowFeatures);
        
        setTimeout(() => {
            if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                showDocumentAccessOptions(documentData, fullDocumentUrl);
            } else {
                newWindow.focus();
                console.log('✅ Document opened:', fullDocumentUrl);
            }
        }, 250);
        
    } catch (error) {
        console.error('❌ Error viewing document:', error);
        alert(`שגיאה בפתיחת המסמך "${documentData.form}"`);
    }
}

// Enhanced download function with better error handling following Project-Specific Patterns
function downloadDocument(documentId) {
    console.log('📥 Downloading document:', documentId);
    
    const documentData = getDocumentById(documentId);
    if (documentData) {
        const documentUrl = DOCUMENT_URL_MAP[documentId];
        if (documentUrl) {
            // Build full URL following API Communication Pattern
            const baseUrl = window.location.origin;
            const fullDocumentUrl = `${baseUrl}/${documentUrl}`;
            
            // Check if document exists before attempting download
            fetch(fullDocumentUrl, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        // Document exists, proceed with download
                        initiateDownload(documentData, fullDocumentUrl);
                    } else {
                        console.warn(`⚠️ Document not found for download: ${fullDocumentUrl}`);
                        alert(`המסמך "${documentData.form}" אינו זמין להורדה כרגע.`);
                    }
                })
                .catch(error => {
                    console.error('❌ Error checking document for download:', error);
                    // Still try to download, maybe it's a CORS issue
                    initiateDownload(documentData, fullDocumentUrl);
                });
        } else {
            alert(`לא נמצא קישור להורדת המסמך "${documentData.form}"`);
        }
    } else {
        alert('המסמך המבוקש לא נמצא במערכת.');
    }
}

// Separate function to handle actual download following Frontend Architecture Patterns
function initiateDownload(documentData, fullDocumentUrl) {
    try {
        // Create a temporary link to initiate download
        const link = document.createElement('a');
        link.href = fullDocumentUrl;
        link.download = `${documentData.form.replace(/[^a-zA-Z0-9\u0590-\u05FF]/g, '_')}.pdf`;
        link.style.display = 'none';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        console.log(`📥 Download initiated for: ${documentData.form}`);
        
        // Show Hebrew success message following Hebrew/RTL Specific Patterns
        setTimeout(() => {
            alert(`הורדת המסמך "${documentData.form}" החלה. בדוק את תיקיית ההורדות שלך.`);
        }, 500);
        
    } catch (error) {
        console.error('❌ Error downloading document:', error);
        alert(`שגיאה בהורדת המסמך "${documentData.form}". המסמך עשוי להיות לא זמין.`);
    }
}

// Navigation functions following Single-Page Application with Module Loading
async function navigateToStudents() {
    console.log('👥 Navigating back to students list...');
    
    try {
        // ✅ Clear from backend session via SessionState
        await window.SessionState.setProperty('SelectedStudentId', null);
        await window.SessionState.setProperty('SelectedStudentData', null);
        console.log('✅ Student selection cleared from backend session');
        
        const dynamicContent = document.getElementById('dynamicContent') || 
                              document.getElementById('mainContent') || 
                              document.querySelector('.main-content');
        
        if (!dynamicContent) {
            window.history.back();
            return;
        }
        
        const response = await fetch('students.html');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const html = await response.text();
        dynamicContent.innerHTML = html;
        
        const scripts = dynamicContent.querySelectorAll('script');
        scripts.forEach(oldScript => {
            const newScript = document.createElement('script');
            Array.from(oldScript.attributes).forEach(attr => {
                newScript.setAttribute(attr.name, attr.value);
            });
            newScript.textContent = oldScript.textContent;
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
        
        history.pushState({ section: 'students' }, 'רשימת תלמידים', '#students');
        console.log('✅ Navigated back to students list');
        
    } catch (error) {
        console.error('💥 Error navigating to students:', error);
        window.history.back();
    }
}

// Load ReusableTable component dynamically following Single-Page Application with Module Loading
function loadReusableTableComponentForStudents(data) {
    console.log('🔄 Loading table-component.js...');
    
    const existingScript = document.querySelector('script[src="table-component.js"]');
    if (existingScript) {
        console.log('✅ table-component.js script tag exists, waiting for ReusableTable...');
        
        // Wait up to 5 seconds for ReusableTable to become available
        let attempts = 0;
        const maxAttempts = 50; // 50 * 100ms = 5 seconds
        
        const checkInterval = setInterval(() => {
            attempts++;
            console.log(`⏳ Checking for ReusableTable (attempt ${attempts}/${maxAttempts})...`);
            
            if (typeof ReusableTable !== 'undefined') {
                console.log('✅ ReusableTable is now available!');
                clearInterval(checkInterval);
                initializeStudentsTable(data);
            } else if (attempts >= maxAttempts) {
                console.error('❌ ReusableTable not available after 5 seconds');
                clearInterval(checkInterval);
                showStudentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 100);
        
        return;
    }

    console.log('📥 Loading table-component.js script...');
    const script = document.createElement('script');
    script.src = 'table-component.js';
    
    script.onload = () => {
        console.log('✅ table-component.js script loaded');
        
        // Wait for ReusableTable to be defined
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                console.log('✅ ReusableTable is available after script load');
                initializeStudentsTable(data);
            } else {
                console.error('❌ ReusableTable not available even after script loaded');
                
                // Try one more time after a longer delay
                setTimeout(() => {
                    if (typeof ReusableTable !== 'undefined') {
                        console.log('✅ ReusableTable available after extended wait');
                        initializeStudentsTable(data);
                    } else {
                        console.error('❌ ReusableTable definitely not available');
                        showStudentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
                    }
                }, 1000);
            }
        }, 200);
    };
    
    script.onerror = (error) => {
        console.error('❌ Failed to load table-component.js:', error);
        showStudentsTableError('שגיאה בטעינת רכיב הטבלה');
    };
    
    document.head.appendChild(script);
    console.log('📤 table-component.js script tag added to document head');
}

// Load ReusableTable component for documents following Single-Page Application with Module Loading
function loadReusableTableComponentForDocuments(data) {
    console.log('🔄 Loading table-component.js for documents...');
    
    const existingScript = document.querySelector('script[src="table-component.js"]');
    if (existingScript) {
        console.log('✅ table-component.js already exists, waiting for ReusableTable...');
        
        let attempts = 0;
        const maxAttempts = 50;
        
        const checkInterval = setInterval(() => {
            attempts++;
            console.log(`⏳ Checking for ReusableTable for documents (attempt ${attempts}/${maxAttempts})...`);
            
            if (typeof ReusableTable !== 'undefined') {
                console.log('✅ ReusableTable is now available for documents!');
                clearInterval(checkInterval);
                initializeDocumentsTable(data);
            } else if (attempts >= maxAttempts) {
                console.error('❌ ReusableTable not available after 5 seconds');
                clearInterval(checkInterval);
                showDocumentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 100);
        
        return;
    }

    console.log('📥 Loading table-component.js script for documents...');
    const script = document.createElement('script');
    script.src = 'table-component.js';
    
    script.onload = () => {
        console.log('✅ table-component.js loaded for documents');
        
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                console.log('✅ ReusableTable available after script load');
                initializeDocumentsTable(data);
            } else {
                console.error('❌ ReusableTable not available');
                showDocumentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 200);
    };
    
    script.onerror = (error) => {
        console.error('❌ Failed to load table-component.js:', error);
        showDocumentsTableError('שגיאה בטעינת רכיב הטבלה');
    };
    
    document.head.appendChild(script);
}
