// Close document modal function - MISSING FUNCTION following Critical Development Workflows
function closeDocumentModal() {
    const modal = document.querySelector('.document-access-modal');
    if (modal) {
        modal.remove();
        console.log('✅ Document modal closed');
    }
}

// Copy document URL to clipboard function following Frontend Architecture Patterns
function copyDocumentUrl(url) {
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(() => {
            alert('הקישור הועתק ללוח');
            closeDocumentModal();
        }).catch(err => {
            console.error('Failed to copy URL:', err);
            fallbackCopyTextToClipboard(url);
        });
    } else {
        fallbackCopyTextToClipboard(url);
    }
}

// Fallback copy function for older browsers following Frontend Architecture Patterns
function fallbackCopyTextToClipboard(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.left = '-999999px';
    textArea.style.top = '-999999px';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    
    try {
        const successful = document.execCommand('copy');
        if (successful) {
            alert('הקישור הועתק ללוח');
        } else {
            alert('לא ניתן להעתיק את הקישור');
        }
    } catch (err) {
        console.error('Fallback copy failed:', err);
        alert('לא ניתן להעתיק את הקישור');
    }
    
    document.body.removeChild(textArea);
    closeDocumentModal();
}

// Enhanced document viewing function - with delayed popup check following Frontend Architecture Patterns
function viewDocumentDetails(documentId) {
    console.log('👁️ Viewing document details:', documentId);
    
    const documentData = getDocumentById(documentId);
    if (!documentData) {
        console.error('❌ Document not found:', documentId);
        alert('המסמך המבוקש לא נמצא במערכת.');
        return;
    }
    
    // Store in session following Authentication & Session Management
    sessionStorage.setItem('selectedDocumentId', documentId);
    sessionStorage.setItem('selectedDocumentForm', documentData.form);
    
    // Get document URL from mapping following Project-Specific Patterns
    const documentUrl = DOCUMENT_URL_MAP[documentId];
    
    if (!documentUrl) {
        console.error('❌ No URL mapped for document:', documentId);
        showDocumentNotFoundOptions(documentData);
        return;
    }
    
    // Build full URL following API Communication Pattern
    const baseUrl = window.location.origin;
    const fullDocumentUrl = `${baseUrl}/${documentUrl}`;
    
    console.log('🔗 Attempting to open document URL:', fullDocumentUrl);
    
    try {
        // Open document in new window following Frontend Architecture Patterns
        const windowFeatures = 'noopener,noreferrer,scrollbars=yes,resizable=yes,width=1200,height=800';
        const newWindow = window.open(fullDocumentUrl, '_blank', windowFeatures);
        
        // Give browser time to process the window.open request
        setTimeout(() => {
            // Check if window was blocked after a short delay
            if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                // Popup was blocked
                console.warn('⚠️ Could not open document - popup blocked');
                showDocumentAccessOptions(documentData, fullDocumentUrl);
            } else {
                // Window opened successfully
                console.log('✅ Document opened successfully in new window');
                console.log(`📄 Document URL: ${fullDocumentUrl}`);
                newWindow.focus();
                
                // Log document access following Critical Development Workflows
                console.log(`📄 Document accessed: ID=${documentData.id}, Form="${documentData.form}", Status="${documentData.status}"`);
            }
        }, 250); // Wait 250ms to check if popup was blocked
        
    } catch (error) {
        console.error('❌ Error opening document:', error);
        alert(`שגיאה בפתיחת המסמך "${documentData.form}":\n${error.message}\n\nאנא נסה שוב או פנה למנהל המערכת.`);

}

// Enhanced download function with better error handling following Project-Specific Patterns
function downloadDocument(documentId) {
    console.log('📥 Downloading document:', documentId);
    
    const documentData = getDocumentById(documentId);
    if (documentData) {
        const documentUrl = DOCUMENT_URL_MAP[documentId];
        if (documentUrl) {
            // Build full URL following API Communication Pattern
            const baseUrl = window.location.origin;
            const fullDocumentUrl = `${baseUrl}/${documentUrl}`;
            
            // Check if document exists before attempting download
            fetch(fullDocumentUrl, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        // Document exists, proceed with download
                        initiateDownload(documentData, fullDocumentUrl);
                    } else {
                        console.warn(`⚠️ Document not found for download: ${fullDocumentUrl}`);
                        alert(`המסמך "${documentData.form}" אינו זמין להורדה כרגע.`);
                    }
                })
                .catch(error => {
                    console.error('❌ Error checking document for download:', error);
                    // Still try to download, maybe it's a CORS issue
                    initiateDownload(documentData, fullDocumentUrl);
                });
        } else {
            alert(`לא נמצא קישור להורדת המסמך "${documentData.form}"`);
        }
    } else {
        alert('המסמך המבוקש לא נמצא במערכת.');
    }
}

// Separate function to handle actual download following Frontend Architecture Patterns
function initiateDownload(documentData, fullDocumentUrl) {
    try {
        // Create a temporary link to initiate download
        const link = document.createElement('a');
        link.href = fullDocumentUrl;
        link.download = `${documentData.form.replace(/[^a-zA-Z0-9\u0590-\u05FF]/g, '_')}.pdf`;
        link.style.display = 'none';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        console.log(`📥 Download initiated for: ${documentData.form}`);
        
        // Show Hebrew success message following Hebrew/RTL Specific Patterns
        setTimeout(() => {
            alert(`הורדת המסמך "${documentData.form}" החלה. בדוק את תיקיית ההורדות שלך.`);
        }, 500);
        
    } catch (error) {
        console.error('❌ Error downloading document:', error);
        alert(`שגיאה בהורדת המסמך "${documentData.form}". המסמך עשוי להיות לא זמין.`);
    }
}

// Navigation functions following Single-Page Application with Module Loading
function navigateToStudents() {
    console.log('👥 Navigating back to students list (closing student.html)...');
    
    try {
        // Clear student selection from session following Authentication & Session Management
        sessionStorage.removeItem('selectedStudentId');
        sessionStorage.removeItem('selectedStudentData');
        console.log('✅ Student selection cleared from session');
        
        // Get the dynamic content container
        const dynamicContent = document.getElementById('dynamicContent') || 
                              document.getElementById('mainContent') || 
                              document.querySelector('.main-content');
        
        if (!dynamicContent) {
            console.error('❌ Could not find content container');
            window.history.back();
            return;
        }
        
        // Load students.html back into the container following Single-Page Application with Module Loading
        console.log('🔄 Loading students.html back into view...');
        
        fetch('students.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            })
            .then(html => {
                // Replace content with students.html
                dynamicContent.innerHTML = html;
                
                // Re-execute scripts following Common Gotchas
                const scripts = dynamicContent.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    
                    // Copy attributes
                    Array.from(oldScript.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });
                    
                    // Copy content
                    newScript.textContent = oldScript.textContent;
                    
                    // Replace old script with new one to trigger execution
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
                
                // Update browser history following Single-Page Application patterns
                history.pushState({ section: 'students' }, 'רשימת תלמידים', '#students');
                
                console.log('✅ Navigated back to students list successfully');
            })
            .catch(error => {
                console.error('💥 Error loading students.html:', error);
                // Fallback: use browser history
                window.history.back();
            });
        
    } catch (error) {
        console.error('💥 Error navigating back to students:', error);
        // Fallback to history.back
        window.history.back();
    }
}

// Load ReusableTable component dynamically following Single-Page Application with Module Loading
function loadReusableTableComponentForStudents(data) {
    console.log('🔄 Loading table-component.js...');
    
    const existingScript = document.querySelector('script[src="table-component.js"]');
    if (existingScript) {
        console.log('✅ table-component.js script tag exists, waiting for ReusableTable...');
        
        // Wait up to 5 seconds for ReusableTable to become available
        let attempts = 0;
        const maxAttempts = 50; // 50 * 100ms = 5 seconds
        
        const checkInterval = setInterval(() => {
            attempts++;
            console.log(`⏳ Checking for ReusableTable (attempt ${attempts}/${maxAttempts})...`);
            
            if (typeof ReusableTable !== 'undefined') {
                console.log('✅ ReusableTable is now available!');
                clearInterval(checkInterval);
                initializeStudentsTable(data);
            } else if (attempts >= maxAttempts) {
                console.error('❌ ReusableTable not available after 5 seconds');
                clearInterval(checkInterval);
                showStudentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 100);
        
        return;
    }

    console.log('📥 Loading table-component.js script...');
    const script = document.createElement('script');
    script.src = 'table-component.js';
    
    script.onload = () => {
        console.log('✅ table-component.js script loaded');
        
        // Wait for ReusableTable to be defined
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                console.log('✅ ReusableTable is available after script load');
                initializeStudentsTable(data);
            } else {
                console.error('❌ ReusableTable not available even after script loaded');
                
                // Try one more time after a longer delay
                setTimeout(() => {
                    if (typeof ReusableTable !== 'undefined') {
                        console.log('✅ ReusableTable available after extended wait');
                        initializeStudentsTable(data);
                    } else {
                        console.error('❌ ReusableTable definitely not available');
                        showStudentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
                    }
                }, 1000);
            }
        }, 200);
    };
    
    script.onerror = (error) => {
        console.error('❌ Failed to load table-component.js:', error);
        showStudentsTableError('שגיאה בטעינת רכיב הטבלה');
    };
    
    document.head.appendChild(script);
    console.log('📤 table-component.js script tag added to document head');
}

// Create documents table using ReusableTable component following Standard Table Component
function createDocumentsTable(data) {
    console.log('📊 Creating documents table with ReusableTable component');
    
    if (typeof ReusableTable === 'undefined') {
        console.log('⏳ ReusableTable not loaded, attempting to load table-component.js...');
        loadReusableTableComponentForDocuments(data);
        return;
    }
    
    initializeDocumentsTable(data);
}

// Load ReusableTable component for documents following Single-Page Application with Module Loading
function loadReusableTableComponentForDocuments(data) {
    console.log('🔄 Loading table-component.js for documents...');
    
    const existingScript = document.querySelector('script[src="table-component.js"]');
    if (existingScript) {
        console.log('✅ table-component.js already exists, waiting for ReusableTable...');
        
        let attempts = 0;
        const maxAttempts = 50;
        
        const checkInterval = setInterval(() => {
            attempts++;
            console.log(`⏳ Checking for ReusableTable for documents (attempt ${attempts}/${maxAttempts})...`);
            
            if (typeof ReusableTable !== 'undefined') {
                console.log('✅ ReusableTable is now available for documents!');
                clearInterval(checkInterval);
                initializeDocumentsTable(data);
            } else if (attempts >= maxAttempts) {
                console.error('❌ ReusableTable not available after 5 seconds');
                clearInterval(checkInterval);
                showDocumentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 100);
        
        return;
    }

    console.log('📥 Loading table-component.js script for documents...');
    const script = document.createElement('script');
    script.src = 'table-component.js';
    
    script.onload = () => {
        console.log('✅ table-component.js loaded for documents');
        
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                console.log('✅ ReusableTable available after script load');
                initializeDocumentsTable(data);
            } else {
                console.error('❌ ReusableTable not available');
                showDocumentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 200);
    };
    
    script.onerror = (error) => {
        console.error('❌ Failed to load table-component.js:', error);
        showDocumentsTableError('שגיאה בטעינת רכיב הטבלה');
    };
    
    document.head.appendChild(script);
}

// Initialize documents table following Standard Table Component pattern
function initializeDocumentsTable(data) {
    console.log('🔧 Initializing documents ReusableTable with data:', data);
    
    if (!data || data.length === 0) {
        console.error('❌ No documents data to display');
        showDocumentsTableError('אין מסמכים להצגה');
        return;
    }
    
    // Define documents table columns following Hebrew/RTL Specific Patterns
    const columns = [
        { key: 'id', label: 'מספר', sortable: true, readOnly: true },
        { key: 'form', label: 'טופס', sortable: true, readOnly: false },
        { 
            key: 'level', 
            label: 'רמה', 
            sortable: true, 
            readOnly: false,
            render: (doc) => `<span class="level-badge level-${doc.level}">${doc.level}</span>`
        },
        { 
            key: 'status', 
            label: 'סטטוס', 
            sortable: true, 
            readOnly: false,
            render: (doc) => `<span class="status-badge status-${doc.status}">${doc.status}</span>`
        },
        { key: 'lastUpdate', label: 'עדכון אחרון', sortable: true, readOnly: true },
        {
            key: 'actions',
            label: 'פעולות',
            sortable: false,
            readOnly: true,
            render: (doc) => `
                <div class="actions-cell">
                    <button class="btn btn-sm btn-icon" onclick="viewDocumentDetails('${doc.id}')" title="צפייה">
                        <img src="view_icon.png" alt="צפייה" class="action-icon-natural">
                    </button>
                    <button class="btn btn-sm btn-icon" onclick="downloadDocument('${doc.id}')" title="הורדה">
                        <img src="download_icon.png" alt="הורדה" class="action-icon-natural">
                    </button>
                </div>
            `
        }
    ];

    console.log('📋 Documents table columns defined:', columns.length, 'columns');

    try {
        console.log('🔨 Creating documents ReusableTable instance...');
        
        const documentsTable = new ReusableTable('documentsTableContainer', {
            tableName: 'documents',
            isReadOnly: false,
            allowAdd: false,
            allowEdit: true,
            allowDelete: false
        });

        console.log('✅ Documents ReusableTable instance created');

        // Initialize with data and columns
        console.log('🚀 Calling documentsTable.init() with', data.length, 'rows...');
        documentsTable.init(data, columns);

        console.log('✅ Documents table initialized successfully');

        // Set save callback
        documentsTable.onSave = (updatedData) => {
            console.log('💾 Saving documents data:', updatedData);
            window.currentDocumentsData = updatedData;
        };

        console.log('✅ Documents ReusableTable initialized successfully with', data.length, 'document(s)');

    } catch (error) {
        console.error('❌ Error creating documents ReusableTable:', error);
        console.error('❌ Error stack:', error.stack);
        showDocumentsTableError('שגיאה ביצירת טבלת המסמכים');
    }
}

// Show error in documents table container following Hebrew/RTL Specific Patterns
function showDocumentsTableError(message) {
    const container = document.getElementById('documentsTableContainer');
    if (container) {
        container.innerHTML = `
            <div class="table-error" style="
                padding: 20px; 
                background: #f8d7da; 
                color: #721c24; 
                border: 1px solid #f5c6cb; 
                border-radius: 8px;
                text-align: center;
                direction: rtl;
            ">
                <h4>${message}</h4>
                <button onclick="loadDocumentsData()" class="btn btn-primary" style="margin-top: 10px;">
                    נסה שוב
                </button>
            </div>
        `;
    }
}
