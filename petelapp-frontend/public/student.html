// Create documents table using ReusableTable component
function createDocumentsTable(data) {
    console.log('📊 Creating documents table with ReusableTable component');
    
    // Check if ReusableTable is already loaded
    if (typeof ReusableTable === 'undefined') {
        console.log('Loading ReusableTable component for documents...');
        loadReusableTableComponentForDocuments(data);
        return;
    }
    
    initializeDocumentsTable(data);
}

// Load ReusableTable component for documents
function loadReusableTableComponentForDocuments(data) {
    // Check if script already exists to prevent duplicates
    const existingScript = document.querySelector('script[src="table-component.js"]');
    if (existingScript) {
        console.log('table-component.js already loaded, waiting for ReusableTable...');
        // Wait a bit for the script to execute
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                initializeDocumentsTable(data);
            } else {
                console.error('❌ ReusableTable still not available after script load');
                showDocumentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 500);
        return;
    }

    // Load the script
    const script = document.createElement('script');
    script.src = 'table-component.js';
    script.onload = () => {
        console.log('✅ table-component.js loaded');
        setTimeout(() => {
            if (typeof ReusableTable !== 'undefined') {
                initializeDocumentsTable(data);
            } else {
                console.error('❌ ReusableTable not available after script load');
                showDocumentsTableError('רכיב הטבלה לא נטען. אנא רענן את הדף.');
            }
        }, 100);
    };
    script.onerror = () => {
        console.error('❌ Failed to load table-component.js');
        showDocumentsTableError('שגיאה בטעינת רכיב הטבלה');
    };
    document.head.appendChild(script);
}

// Initialize the documents ReusableTable
function initializeDocumentsTable(data) {
    console.log('🔧 Initializing documents ReusableTable with data:', data);
    
    // Define table columns for documents
    const columns = [
        { key: 'id', label: 'מספר', sortable: true, readOnly: true },
        { key: 'form', label: 'טופס', sortable: true, readOnly: false },
        { key: 'appendix', label: 'נספח', sortable: true, readOnly: false },
        { 
            key: 'documentLevel', 
            label: 'רמת מסמך', 
            sortable: true, 
            readOnly: false,
            render: (document) => `<span class="level-badge level-${document.documentLevel}">${document.documentLevel}</span>`
        },
        { 
            key: 'status', 
            label: 'סטטוס', 
            sortable: true, 
            readOnly: false,
            render: (document) => `<span class="status-badge status-${document.status}">${document.status}</span>`
        },
        { key: 'lastUpdate', label: 'עדכון אחרון', sortable: true, readOnly: false },
        {
            key: 'actions',
            label: 'פעולות',
            sortable: false,
            readOnly: true,
            render: (document) => `
                <div class="actions-cell">
                    <button class="btn btn-sm btn-secondary" onclick="viewDocumentDetails('${document.id}')" title="צפייה">👁️</button>
                    <button class="btn btn-sm btn-primary" onclick="editDocument('${document.id}')" title="עריכה">✏️</button>
                    <button class="btn btn-sm btn-success" onclick="downloadDocument('${document.id}')" title="הורדה">📥</button>
                </div>
            `
        }
    ];

    try {
        // Create ReusableTable instance for documents
        const documentsTable = new ReusableTable('documentsTableContainer', {
            tableName: 'documents',
            isReadOnly: false,
            allowAdd: true,
            allowEdit: true,
            allowDelete: false
        });

        console.log('✅ Documents ReusableTable instance created');

        // Initialize with data and columns
        documentsTable.init(data, columns);

        // Set save callback for when data is edited
        documentsTable.onSave = (updatedData) => {
            console.log('💾 Saving documents data:', updatedData);
            window.currentDocumentsData = updatedData;
        };

        console.log('✅ Documents ReusableTable initialized successfully with', data.length, 'documents');

    } catch (error) {
        console.error('❌ Error creating documents ReusableTable:', error);
        showDocumentsTableError('שגיאה ביצירת טבלת המסמכים');
    }
}

    const container = document.getElementById('documentsTableContainer');

                border-radius: 8px;

            ">
                <h4>${message}</h4>
                <button onclick="refreshStudentsData()" class="btn btn-primary" style="margin-top: 10px;">
                    נסה שוב
                </button>
            </div>
        `;
    }
}

                    <button class="btn btn-sm btn-primary" onclick="editStudent('${student.id}')" title="עריכה">✏️</button>
                    <button class="btn btn-sm btn-success" onclick="viewStudentGrades('${student.id}')" title="ציונים">📊</button>
                </div>
            `
        }
    ];

    try {
        // Create ReusableTable instance following Project-Specific Patterns
        const studentsTable = new ReusableTable('studentsTableContainer', {
            tableName: 'students',
            isReadOnly: false,
            allowAdd: true,
            allowEdit: true,
            allowDelete: false
        });

        console.log('✅ ReusableTable instance created');

        // Initialize with data and columns following Critical Development Workflows
        studentsTable.init(data, columns);

        // Set save callback for when data is edited
        studentsTable.onSave = (updatedData) => {
            console.log('💾 Saving students data:', updatedData);
            window.currentStudentsData = updatedData;
            updateStudentsSummary(updatedData);
        };

        console.log('✅ Students ReusableTable initialized successfully with', data.length, 'students');

    } catch (error) {
        console.error('❌ Error creating ReusableTable:', error);
        showTableError('שגיאה ביצירת טבלת התלמידים');
    }
}

// Refresh students data function
function refreshStudentsData() {
    console.log('🔄 Refreshing students data...');
    
    // Show loading state for students
    const studentsContainer = document.getElementById('studentsTableContainer');
    if (studentsContainer) {
        studentsContainer.innerHTML = `

            </div>
        `;

            </div>
        `;
    }

    loadStudentsData();
}

// Initialize the page when loaded following Critical Development Workflows
document.addEventListener('DOMContentLoaded', function() {

}
