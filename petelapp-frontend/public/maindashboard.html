    <script>
        console.log('🔍 Main Dashboard script loaded');

        // Load dashboard card data from backend API 
      function loadDashboardCardData(cardId) {
        console.log('📊 Loading dashboard card data for:', cardId);

        const mockData = {
            alertsCard: {
                items: [
                    {
                        content: "ביום שלישי 16/11 בשעה 17:00 המערכת תעודכן ותהיה זמינה למחרת",
                        timestamp: "לפני 10 דקות",
                        priority: "high"
                    }
                ]
            },
            eventsCard: {
                items: [
                    {
                        content: "יום אחרון לרישום ליום סייעות עירוני",
                        timestamp: "מחר 09:00",
                        priority: "high"
                    }
                ]
            }
        };

        const cardData = mockData[cardId];
        if (!cardData) {
            console.error('❌ No data found for cardId:', cardId);
            return;
        }

        // Get the internal cards container
        const containerElement = document.getElementById(cardId.replace('Card', 'InternalCards'));
        if (!containerElement) {
            console.error('❌ Container not found for:', cardId.replace('Card', 'InternalCards'));
            return;
        }

        console.log('✅ Container found, clearing and populating...');

        // Clear existing content
        containerElement.innerHTML = '';

        // Create internal cards following Hebrew/RTL Specific Patterns
        cardData.items.forEach((item, index) => {
            const internalCard = document.createElement('div');
            internalCard.className = 'internal-card';
            internalCard.setAttribute('data-priority', item.priority);

            internalCard.innerHTML = `
                    <div class="internal-card-content">${item.content}</div>
                    <div class="internal-card-timestamp">${item.timestamp}</div>
                `;

            // Add click handler following Cross-Component Communication
            internalCard.addEventListener('click', () => {
                console.log(`Internal card clicked: ${item.content} in ${cardId}`);
                const cardClickEvent = new CustomEvent('internalCardClicked', {
                    detail: {
                        cardId: cardId,
                        itemIndex: index,
                        item: item
                    }
                });
                window.dispatchEvent(cardClickEvent);
            });

            containerElement.appendChild(internalCard);
        });

        console.log(`✅ ${cardData.items.length} cards loaded for ${cardId}`);
    }

        // Update context button labels with year values following Project-Specific Patterns
        async function updateContextButtonLabels() {
            console.log('Updating context button labels with year values...');
            try {
                const response = await fetch(AppConfig.getApiUrl('systemAttributes'));
                if (!response.ok) {
                    throw new Error('Failed to load system attributes');
                }
                const attributes = await response.json();
                if (!Array.isArray(attributes)) {
                    console.error('System attributes response is not an array:', attributes);
                    return;
                }

                // Find year attributes by name
                const previousYearAttr = attributes.find(attr => attr.name === "Previous Year");
                const currentYearAttr  = attributes.find(attr => attr.name === "Current Year");
                const nextYearAttr     = attributes.find(attr => attr.name === "Next Year");

                // ✅ Store in backend session via SessionState instead of sessionStorage
                if (previousYearAttr) {
                    window.previousYearId = previousYearAttr.foreignId;
                    await window.SessionState.setProperty('PreviousYearId', previousYearAttr.foreignId.toString());
                    await window.SessionState.setProperty('PreviousYearValue', previousYearAttr.value);
                    const prevButton = document.querySelector('.context-btn[onclick*="previous"]');
                    if (prevButton) prevButton.textContent = previousYearAttr.value;
                }

                if (currentYearAttr) {
                    window.currentYearId = currentYearAttr.foreignId;
                    await window.SessionState.setProperty('CurrentYearId', currentYearAttr.foreignId.toString());
                    await window.SessionState.setProperty('CurrentYearValue', currentYearAttr.value);
                    const currentButton = document.querySelector('.context-btn[onclick*="current"]');
                    if (currentButton) currentButton.textContent = currentYearAttr.value;
                }

                if (nextYearAttr) {
                    window.nextYearId = nextYearAttr.foreignId;
                    await window.SessionState.setProperty('NextYearId', nextYearAttr.foreignId.toString());
                    await window.SessionState.setProperty('NextYearValue', nextYearAttr.value);
                    const nextButton = document.querySelector('.context-btn[onclick*="next"]');
                    if (nextButton) nextButton.textContent = nextYearAttr.value;
                }

                console.log('✅ Context button labels updated and stored in backend session via SessionState');
            } catch (error) {
                console.error('Error loading context button data:', error);
            }
        }

        // Update the storeSelectedYearInSession function to use direct API calls
 
        
async function storeSelectedYearInSession(yearId, yearType) {
    console.log('Storing selected year in session:', yearId, yearType);
    
    try {
        // ✅ Get year value from backend session instead of sessionStorage
        let yearValue = '';
        if (yearType === 'previous') {
            yearValue = await window.SessionState.getProperty('PreviousYearValue') || '';
        } else if (yearType === 'current') {
            yearValue = await window.SessionState.getProperty('CurrentYearValue') || '';
        } else if (yearType === 'next') {
            yearValue = await window.SessionState.getProperty('NextYearValue') || '';
        }
        
        // ✅ Use centralized SessionState
        await window.SessionState.setProperty('SelectedYearId', yearId.toString());
        await window.SessionState.setProperty('SelectedYearType', yearType);
        
        if (yearValue) {
            await window.SessionState.setProperty('SelectedYearValue', yearValue);
        }
        
        console.log('✅ Selected year stored via SessionState');
        
        return true;
        
    } catch (error) {
        console.error('❌ Error storing selected year:', error);
        throw error;
    }
}

// Update the showSchoolYear function to handle session storage errors gracefully
   // Show school year with proper error handling following Frontend Architecture Patterns
async function showSchoolYear(yearId, yearType) {
    console.log('🗓️ showSchoolYear called:', yearId, yearType);
    
    if (!yearId || !yearType) {
        console.error('❌ Invalid year parameters');
        alert('שגיאה: פרמטרי שנה לא תקינים');
        return;
    }
    
    try {
        await storeSelectedYearInSession(yearId, yearType);
        
        // ✅ Use centralized SessionState
        const session = await window.SessionState.getSession();
        const entityTypeId = parseInt(session.entityTypeId, 10);
        
        console.log('📋 Entity type:', entityTypeId);
        
        if (entityTypeId === 5) {
            console.log('🏫 Multi-school network - navigating to school list');
            await loadSchoolListPage();
        } else {
            console.log('🏫 Single school - navigating to school dashboard');
            await loadSchoolDashboardPage();
        }
        
    } catch (error) {
        console.error('💥 Error in showSchoolYear:', error);
        alert('שגיאה בטעינת שנת לימודים. אנא נסה שוב.');
    }
}


async function loadSchoolListPage() {
    console.log('🔄 Navigating to school list...');
    
    if (typeof window.navigateTo === 'function') {
        await window.navigateTo('schoollist');
    } else {
        console.error('❌ window.navigateTo not available');
        alert('שגיאה בטעינת רשימת בתי הספר');
    }
}


// Load school dashboard page for single school entities
async function loadSchoolDashboardPage() {
    console.log('🔄 Navigating to school dashboard...');
    
    if (typeof window.navigateTo === 'function') {
        await window.navigateTo('schooldashboard');
    } else {
        console.error('❌ window.navigateTo not available');
        alert('שגיאה בטעינת לוח בקרה של בית הספר');
    }
}
 

        // Show add modal placeholder function following Frontend Architecture Patterns
        function showAddModal(cardType) {
            const cardName = cardType === 'alertsCard' ? 'התראה' : 'אירוע';
            alert(`הוספת ${cardName} חדש - תכונה זו תתווסף בעתיד`);
        }

        // Debug function to check if elements exist
        function debugDashboardElements() {
            console.log('🔍 Dashboard Debug:', {
                alertsContainer: document.getElementById('alertsInternalCards'),
                eventsContainer: document.getElementById('eventsInternalCards'),
                systemVersionElement: document.getElementById('systemVersion'),
                contextButtons: document.querySelectorAll('.context-btn'),
                documentReady: document.readyState
            });
        }

        // Initialize dashboard following Critical Development Workflows
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🏁 Main Dashboard DOMContentLoaded');
            
            // Load dashboard data and context buttons
            setTimeout(async () => {
                loadDashboardCardData('alertsCard');
                loadDashboardCardData('eventsCard');
               // loadSystemVersion();
                
                // Update context button labels with actual year values
                await updateContextButtonLabels();
                
                console.log('✅ Main Dashboard initialized successfully');
            }, 100);
        });

        // Also try immediate call if DOM is already ready following Frontend Architecture Patterns
        if (document.readyState !== 'loading') {
            console.log('📄 Document already ready, calling initialization immediately');
            setTimeout(async () => {
                loadDashboardCardData('alertsCard');
                loadDashboardCardData('eventsCard');
              // loadSystemVersion();
                await updateContextButtonLabels();
                console.log('✅ Main Dashboard initialized immediately');
            }, 50);
        }

        // Make functions globally available following Cross-Component Communication
        window.loadDashboardCardData = loadDashboardCardData;
        window.showAddModal = showAddModal;
      //  window.loadSystemVersion = loadSystemVersion;
        window.updateContextButtonLabels = updateContextButtonLabels;
        window.storeSelectedYearInSession = storeSelectedYearInSession;
        window.showSchoolYear = showSchoolYear;

         window.debugDashboardElements = debugDashboardElements;

        console.log('✅ Main Dashboard functions registered globally');
    </script>
