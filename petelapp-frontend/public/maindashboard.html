<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מסך ראשי - מערכת פט"ל</title>
</head>
<body>
    <div class="main-dashboard-container">
        <!-- Navigation Link to Main Page -->
        <div class="dashboard-flex-row">
            <!-- Dashboard cards -->
            <div class="dashboard-cards-wrapper">
                <div class="dashboard-card" id="alertsCard">
                    <div class="dashboard-card-header">
                        <div class="dashboard-card-icon">🔔</div>
                        <div class="dashboard-card-title">התראות</div>
                        <!-- Plus icon as leftmost item -->
                        <img src="Plus icon.png" alt="הוספה" class="dashboard-card-plus" 
                            onclick="showAddModal('alertsCard')" 
                            title="הוספת התראה חדשה" />
                    </div>
                    
                    <div class="internal-cards-container" id="alertsInternalCards">
                        <!-- Internal cards will be populated here -->
                    </div>
                </div>
                
                <div class="dashboard-card" id="eventsCard">
                    <div class="dashboard-card-header">
                        <div class="dashboard-card-icon">🗓</div>
                        <div class="dashboard-card-title">אירועים</div>
                        <!-- Plus icon as leftmost item -->
                        <img src="Plus icon.png" alt="הוספה" class="dashboard-card-plus" 
                            onclick="showAddModal('eventsCard')" 
                            title="הוספת אירוע חדש" />
                    </div>
                    
                    <div class="internal-cards-container" id="eventsInternalCards">
                        <!-- Internal cards will be populated here -->
                    </div>
                </div>
            </div>
            
            <div class="context-buttons-section">
                <button class="context-btn" onclick="showSchoolYear(window.previousYearId, 'previous')">שנה קודמת</button>
                <button class="context-btn" onclick="showSchoolYear(window.currentYearId, 'current')">שנה נוכחית</button>
                <button class="context-btn" onclick="showSchoolYear(window.nextYearId, 'next')">שנה הבאה</button>
            </div>
        </div>

        <div class="content-card">
            <div class="form-footer" style="text-align: center; color: #666; font-size: 12px;">
                פט"ל - פתרונות טכנולגים לחינוך - גרסה <span id="systemVersion">טוען...</span>
            </div>
        </div>
    </div>

    <script>
        console.log('🔍 Main Dashboard script loaded');

        // Load dashboard card data from backend API
        async function loadDashboardCardData(cardId) {
            console.log('📊 Loading dashboard card data for:', cardId);

            let endpoint = '';
            if (cardId === 'alertsCard') {
                endpoint = AppConfig.getApiUrl('alerts');
            } else if (cardId === 'eventsCard') {
                endpoint = AppConfig.getApiUrl('events');
            } else {
                console.error('❌ Unknown cardId:', cardId);
                return;
            }

            try {
                const response = await fetch(endpoint, {
                    headers: {
                        'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`Failed to load data for ${cardId}: ${response.status}`);
                }
                const cardData = await response.json();

                const containerElement = document.getElementById(cardId.replace('Card', 'InternalCards'));
                if (!containerElement) {
                    console.error('❌ Container not found for:', cardId.replace('Card', 'InternalCards'));
                    return;
                }

                containerElement.innerHTML = '';

                // Expecting cardData.items to be an array of items
                (cardData.items || []).forEach((item, index) => {
                    const internalCard = document.createElement('div');
                    internalCard.className = 'internal-card';
                    internalCard.setAttribute('data-priority', item.priority);

                    internalCard.innerHTML = `
                        <div class="internal-card-content">${item.content}</div>
                        <div class="internal-card-timestamp">${item.timestamp}</div>
                    `;

                    internalCard.addEventListener('click', () => {
                        console.log(`Internal card clicked: ${item.content} in ${cardId}`);
                        const cardClickEvent = new CustomEvent('internalCardClicked', {
                            detail: {
                                cardId: cardId,
                                itemIndex: index,
                                item: item
                            }
                        });
                        window.dispatchEvent(cardClickEvent);
                    });

                    containerElement.appendChild(internalCard);
                });

                console.log(`✅ ${(cardData.items || []).length} cards loaded for ${cardId}`);
            } catch (error) {
                console.error(`❌ Error loading data for ${cardId}:`, error);
            }
        }

        // Load system version following API Communication Pattern
        async function loadSystemVersion() {
            try {
                const response = await fetch(AppConfig.getApiUrl('systemAttributes'));
                if (response.ok) {
                    const attributes = await response.json();
                    const versionAttr = attributes.find(attr => attr.name === "System Version");
                    const versionElement = document.getElementById('systemVersion');
                    if (versionElement) {
                        versionElement.textContent = versionAttr ? versionAttr.value : '1.0';
                    }
                } 
            } catch (error) {
                console.log('Could not load system version, using default');
                const versionElement = document.getElementById('systemVersion');
                if (versionElement) {
                    versionElement.textContent = '1.0';
                }
            }
        }

        // Update context button labels with year values following Project-Specific Patterns
        async function updateContextButtonLabels() {
            console.log('Updating context button labels with year values...');
            try {
                const response = await fetch(AppConfig.getApiUrl('systemAttributes'));
                if (!response.ok) {
                    throw new Error('Failed to load system attributes');
                }
                const attributes = await response.json();
                // Expecting attributes to be an array
                if (!Array.isArray(attributes)) {
                    console.error('System attributes response is not an array:', attributes);
                    return;
                }

                // Find year attributes by name
                const previousYearAttr = attributes.find(attr => attr.name === "Previous Year");
                const currentYearAttr  = attributes.find(attr => attr.name === "Current Year");
                const nextYearAttr     = attributes.find(attr => attr.name === "Next Year");

                // Update previous year button
                if (previousYearAttr) {
                    window.previousYearId = previousYearAttr.foreignId;
                    sessionStorage.setItem('previousYearId', previousYearAttr.foreignId);
                    sessionStorage.setItem('previousYearValue', previousYearAttr.value);
                    const prevButton = document.querySelector('.context-btn[onclick*="previous"]');
                    if (prevButton) prevButton.textContent = previousYearAttr.value;
                }

                // Update current year button
                if (currentYearAttr) {
                    window.currentYearId = currentYearAttr.foreignId;
                    sessionStorage.setItem('currentYearId', currentYearAttr.foreignId);
                    sessionStorage.setItem('currentYearValue', currentYearAttr.value);
                    const currentButton = document.querySelector('.context-btn[onclick*="current"]');
                    if (currentButton) currentButton.textContent = currentYearAttr.value;
                }

                // Update next year button
                if (nextYearAttr) {
                    window.nextYearId = nextYearAttr.foreignId;
                    sessionStorage.setItem('nextYearId', nextYearAttr.foreignId);
                    sessionStorage.setItem('nextYearValue', nextYearAttr.value);
                    const nextButton = document.querySelector('.context-btn[onclick*="next"]');
                    if (nextButton) nextButton.textContent = nextYearAttr.value;
                }

                console.log('Context button labels updated with year values and foreign IDs');
            } catch (error) {
                console.error('Error loading context button data:', error);
            }
        }

        // Update the storeSelectedYearInSession function to use direct API calls
 
        
async function storeSelectedYearInSession(yearId, yearType) {
    console.log('Storing selected year in session:', yearId, yearType);
    
    try {
        // Get year value from stored session data
        let yearValue = '';
        if (yearType === 'previous') {
            yearValue = sessionStorage.getItem('previousYearValue') || '';
        } else if (yearType === 'current') {
            yearValue = sessionStorage.getItem('currentYearValue') || '';
        } else if (yearType === 'next') {
            yearValue = sessionStorage.getItem('nextYearValue') || '';
        }
        
        // ✅ Use centralized SessionState
        await window.SessionState.setProperty('CurrentSchoolYearId', yearId.toString());
        await window.SessionState.setProperty('SelectedYearType', yearType);
        
        if (yearValue) {
            await window.SessionState.setProperty('SelectedYearValue', yearValue);
        }
        
        console.log('✅ Selected year stored via SessionState');
        
        return true;
        
    } catch (error) {
        console.error('❌ Error storing selected year:', error);
        throw error;
    }
}
// Update the showSchoolYear function to handle session storage errors gracefully
   // Show school year with proper error handling following Frontend Architecture Patterns
async function showSchoolYear(yearId, yearType) {
    console.log('🗓️ showSchoolYear called:', yearId, yearType);
    
    if (!yearId || !yearType) {
        console.error('❌ Invalid year parameters');
        alert('שגיאה: פרמטרי שנה לא תקינים');
        return;
    }
    
    try {
        await storeSelectedYearInSession(yearId, yearType);
        
        // ✅ Use centralized SessionState
        const session = await window.SessionState.getSession();
        const entityTypeId = parseInt(session.entityTypeId, 10);
        
        console.log('📋 Entity type:', entityTypeId);
        
        if (entityTypeId === 5) {
            console.log('🏫 Multi-school network - navigating to school list');
            await loadSchoolListPage();
        } else {
            console.log('🏫 Single school - navigating to school dashboard');
            await loadSchoolDashboardPage();
        }
        
    } catch (error) {
        console.error('💥 Error in showSchoolYear:', error);
        alert('שגיאה בטעינת שנת לימודים. אנא נסה שוב.');
    }
}

        // Load school list page for multi-school entities
async function loadSchoolListPage() {
    try {
        console.log('🔄 Loading school list page...');
        
        const response = await fetch('schoollist.html');
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const html = await response.text();
        
        // Use navigateTo if available, otherwise load directly
        if (typeof window.navigateTo === 'function') {
            window.navigateTo('schoollist');
        } else {
            const mainContainer = document.getElementById('dynamicContent') || 
                                 document.getElementById('mainContent') || 
                                 document.querySelector('.main-content');
            
            if (mainContainer) {
                mainContainer.innerHTML = html;
                executeScriptsInContainer(mainContainer);
                history.pushState({ section: 'schoollist' }, '', '#schoollist');
                console.log('✅ School list page loaded successfully');
            } else {
                throw new Error('Main content container not found');
            }
        }
    } catch (error) {
        console.error('💥 Error loading school list page:', error);
        throw new Error('שגיאה בטעינת רשימת בתי הספר');
    }
}

// Load school dashboard page for single school entities
async function loadSchoolDashboardPage() {
    try {
        console.log('🔄 Loading school dashboard page...');
        
        // Use navigateTo if available
        if (typeof window.navigateTo === 'function') {
            window.navigateTo('schooldashboard');
        } else {
            const response = await fetch('schooldashboard.html');
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const html = await response.text();
            const mainContainer = document.getElementById('dynamicContent') || 
                                 document.getElementById('mainContent') || 
                                 document.querySelector('.main-content');
            
            if (mainContainer) {
                mainContainer.innerHTML = html;
                executeScriptsInContainer(mainContainer);
                history.pushState({ section: 'schooldashboard' }, '', '#schooldashboard');
                console.log('✅ School dashboard page loaded successfully');
            } else {
                throw new Error('Main content container not found');
            }
        }
    } catch (error) {
        console.error('💥 Error loading school dashboard page:', error);
        throw new Error('שגיאה בטעינת לוח בקרה של בית הספר');
    }
}

        // Execute scripts in dynamically loaded content following Common Gotchas
        function executeScriptsInContainer(container) {
            const scripts = container.querySelectorAll('script');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                if (script.src) {
                    newScript.src = script.src;
                } else {
                    newScript.textContent = script.textContent;
                }
                script.parentNode.replaceChild(newScript, script);
            });
        }

        // Show add modal placeholder function following Frontend Architecture Patterns
        function showAddModal(cardType) {
            const cardName = cardType === 'alertsCard' ? 'התראה' : 'אירוע';
            alert(`הוספת ${cardName} חדש - תכונה זו תתווסף בעתיד`);
        }

        // Debug function to check if elements exist
        function debugDashboardElements() {
            console.log('🔍 Dashboard Debug:', {
                alertsContainer: document.getElementById('alertsInternalCards'),
                eventsContainer: document.getElementById('eventsInternalCards'),
                systemVersionElement: document.getElementById('systemVersion'),
                contextButtons: document.querySelectorAll('.context-btn'),
                documentReady: document.readyState
            });
        }

        // Initialize dashboard following Critical Development Workflows
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🏁 Main Dashboard DOMContentLoaded');
            
            // Load dashboard data and context buttons
            setTimeout(async () => {
                loadDashboardCardData('alertsCard');
                loadDashboardCardData('eventsCard');
                loadSystemVersion();
                
                // Update context button labels with actual year values
                await updateContextButtonLabels();
                
                console.log('✅ Main Dashboard initialized successfully');
            }, 100);
        });

        // Also try immediate call if DOM is already ready following Frontend Architecture Patterns
        if (document.readyState !== 'loading') {
            console.log('📄 Document already ready, calling initialization immediately');
            setTimeout(async () => {
                loadDashboardCardData('alertsCard');
                loadDashboardCardData('eventsCard');
                loadSystemVersion();
                await updateContextButtonLabels();
                console.log('✅ Main Dashboard initialized immediately');
            }, 50);
        }

        // Make functions globally available following Cross-Component Communication
        window.loadDashboardCardData = loadDashboardCardData;
        window.showAddModal = showAddModal;
        window.loadSystemVersion = loadSystemVersion;
        window.updateContextButtonLabels = updateContextButtonLabels;
        window.storeSelectedYearInSession = storeSelectedYearInSession;
        window.showSchoolYear = showSchoolYear;
        window.loadSchoolListPage = loadSchoolListPage;
        
        window.loadSchoolYearPage = loadSchoolYearPage;
        window.executeScriptsInContainer = executeScriptsInContainer;
        window.debugDashboardElements = debugDashboardElements;

        console.log('✅ Main Dashboard functions registered globally');
    </script>
</body>
</html>
