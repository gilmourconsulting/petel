<!-- Create new file: c:\dev\PetelFullApp\petelapp-frontend\public\maindashboard.html -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מסך ראשי - מערכת פט"ל</title>
</head>
<body>
    <div class="main-dashboard-container">
        <!-- Navigation Link to Main Page -->
        <div class="dashboard-flex-row">
            <!-- Dashboard cards -->
            <div class="dashboard-cards-wrapper">
                <div class="dashboard-card" id="alertsCard">
                    <div class="dashboard-card-header">
                        <div class="dashboard-card-icon">🔔</div>
                        <div class="dashboard-card-title">התראות</div>
                        <!-- Plus icon as leftmost item -->
                        <img src="Plus icon.png" alt="הוספה" class="dashboard-card-plus" 
                            onclick="showAddModal('alertsCard')" 
                            title="הוספת התראה חדשה" />
                    </div>
                    
                    <div class="internal-cards-container" id="alertsInternalCards">
                        <!-- Internal cards will be populated here -->
                    </div>
                </div>
                
                <div class="dashboard-card" id="eventsCard">
                    <div class="dashboard-card-header">
                        <div class="dashboard-card-icon">🗓</div>
                        <div class="dashboard-card-title">אירועים</div>
                        <!-- Plus icon as leftmost item -->
                        <img src="Plus icon.png" alt="הוספה" class="dashboard-card-plus" 
                            onclick="showAddModal('eventsCard')" 
                            title="הוספת אירוע חדש" />
                    </div>
                    
                    <div class="internal-cards-container" id="eventsInternalCards">
                        <!-- Internal cards will be populated here -->
                    </div>
                </div>
            </div>
            
            <div class="context-buttons-section">
                <button class="context-btn" onclick="showSchoolYear(window.previousYearId, 'previous')">שנה קודמת</button>
                <button class="context-btn" onclick="showSchoolYear(window.currentYearId, 'current')">שנה נוכחית</button>
                <button class="context-btn" onclick="showSchoolYear(window.nextYearId, 'next')">שנה הבאה</button>
            </div>
        </div>

        <div class="content-card">
            <div class="form-footer" style="text-align: center; color: #666; font-size: 12px;">
                פט"ל - פתרונות טכנולגים לחינוך - גרסה <span id="systemVersion">טוען...</span>
            </div>
        </div>
    </div>

    <script>
        console.log('🔍 Main Dashboard script loaded');

        // Load dashboard card data following Project-Specific Patterns
        function loadDashboardCardData(cardId) {
            console.log('📊 Loading dashboard card data for:', cardId);
            
            const mockData = {
                alertsCard: {
                    items: [
                        {
                            content: "בית ספר מאור חיים עדכנו את מצבת התלמידים",
                            timestamp: "לפני 10 דקות",
                            priority: "high"
                        },
                        {
                            content: "הועלה אישור אבטחה של עיריית אלעד",
                            timestamp: "לפני שעה",
                            priority: "medium"
                        }

                    ]
                },
                eventsCard: {
                    items: [
                        {
                            content: "לתזכר את עיריית פתח תקוה לשלוח אישור שעות פסיכולוג",
                            timestamp: "מחר 09:00",
                            priority: "high"
                        }
                    ]
                }
            };

            const cardData = mockData[cardId];
            if (!cardData) {
                console.error('❌ No data found for cardId:', cardId);
                return;
            }

            // Get the internal cards container
            const containerElement = document.getElementById(cardId.replace('Card', 'InternalCards'));
            if (!containerElement) {
                console.error('❌ Container not found for:', cardId.replace('Card', 'InternalCards'));
                return;
            }

            console.log('✅ Container found, clearing and populating...');

            // Clear existing content
            containerElement.innerHTML = '';

            // Create internal cards following Hebrew/RTL Specific Patterns
            cardData.items.forEach((item, index) => {
                const internalCard = document.createElement('div');
                internalCard.className = 'internal-card';
                internalCard.setAttribute('data-priority', item.priority);
                
                internalCard.innerHTML = `
                    <div class="internal-card-content">${item.content}</div>
                    <div class="internal-card-timestamp">${item.timestamp}</div>
                `;

                // Add click handler following Cross-Component Communication
                internalCard.addEventListener('click', () => {
                    console.log(`Internal card clicked: ${item.content} in ${cardId}`);
                    const cardClickEvent = new CustomEvent('internalCardClicked', {
                        detail: {
                            cardId: cardId,
                            itemIndex: index,
                            item: item
                        }
                    });
                    window.dispatchEvent(cardClickEvent);
                });

                containerElement.appendChild(internalCard);
            });

            console.log(`✅ ${cardData.items.length} cards loaded for ${cardId}`);
        }

        // Load system version following API Communication Pattern
        async function loadSystemVersion() {
            try {
                const response = await fetch(AppConfig.getApiUrl('systemAttributes'));
                if (response.ok) {
                    const attributes = await response.json();
                    const versionAttr = attributes.find(attr => attr.name === "System Version");
                    const versionElement = document.getElementById('systemVersion');
                    if (versionElement) {
                        versionElement.textContent = versionAttr ? versionAttr.value : '1.0';
                    }
                } 
            } catch (error) {
                console.log('Could not load system version, using default');
                const versionElement = document.getElementById('systemVersion');
                if (versionElement) {
                    versionElement.textContent = '1.0';
                }
            }
        }

        // Update context button labels with year values following Project-Specific Patterns
        async function updateContextButtonLabels() {
            console.log('Updating context button labels with year values...');
            
            try {
                // Load system attributes to get year values
                const response = await fetch(AppConfig.getApiUrl('systemAttributes'));
                if (response.ok) {
                    const result = await response.json();
                    console.log('System attributes response:', result);
                    
                    // Extract attributes array based on API response structure
                    let attributesArray = [];
                    
                    // Handle different possible response formats
                    if (result && result.success) {
                        if (Array.isArray(result.data)) {
                            attributesArray = result.data;
                        } else if (result.data && typeof result.data === 'object') {
                            // Convert object values to array
                            attributesArray = Object.values(result.data);
                        }
                    } else if (Array.isArray(result)) {
                        attributesArray = result;
                    }
                    
                    console.log('Processed attributes array:', attributesArray);
                    
                    // Find year attributes
                    const previousYearAttr = attributesArray.find(attr => 
                        (attr.name === "Previous Year") || 
                        (attr.attributeName === "Previous Year")
                    );
                    
                    const currentYearAttr = attributesArray.find(attr => 
                        (attr.name === "Current Year") || 
                        (attr.attributeName === "Current Year")
                    );
                    
                    const nextYearAttr = attributesArray.find(attr => 
                        (attr.name === "Next Year") || 
                        (attr.attributeName === "Next Year")
                    );
                    
                    // Store year IDs and values globally following Authentication & Session Management
                    if (previousYearAttr) {
                        const foreignId = previousYearAttr.foreignId || previousYearAttr.ForeignId;
                        const value = previousYearAttr.value || previousYearAttr.Value;
                        
                        window.previousYearId = foreignId;
                        sessionStorage.setItem('previousYearId', foreignId);
                        sessionStorage.setItem('previousYearValue', value);
                        
                        // Update button text
                        const prevButton = document.querySelector('.context-btn[onclick*="previous"]');
                        if (prevButton) {
                            prevButton.textContent = `${value}`;
                        }
                    }
                    
                    if (currentYearAttr) {
                        const foreignId = currentYearAttr.foreignId || currentYearAttr.ForeignId;
                        const value = currentYearAttr.value || currentYearAttr.Value;
                        
                        window.currentYearId = foreignId;
                        sessionStorage.setItem('currentYearId', foreignId);
                        sessionStorage.setItem('currentYearValue', value);
                        
                        // Update button text
                        const currentButton = document.querySelector('.context-btn[onclick*="current"]');
                        if (currentButton) {
                            currentButton.textContent = `${value}`;
                        }
                    }
                    
                    if (nextYearAttr) {
                        const foreignId = nextYearAttr.foreignId || nextYearAttr.ForeignId;
                        const value = nextYearAttr.value || nextYearAttr.Value;
                        
                        window.nextYearId = foreignId;
                        sessionStorage.setItem('nextYearId', foreignId);
                        sessionStorage.setItem('nextYearValue', value);
                        
                        // Update button text
                        const nextButton = document.querySelector('.context-btn[onclick*="next"]');
                        if (nextButton) {
                            nextButton.textContent = `${value}`;
                        }
                    }
                    
                    console.log('Context button labels updated with year values and foreign IDs');
                } else {
                    console.warn('Could not load system attributes for context buttons');
                }
            } catch (error) {
                console.error('Error loading context button data:', error);
            }
        }

        // Update the storeSelectedYearInSession function to use direct API calls
        async function storeSelectedYearInSession(yearId, yearType) {
            console.log('Storing selected year in session:', yearId, yearType);
            
            try {
                // Store year selection on server-side session following API Communication Pattern
                const updateRequests = [
                    {
                        key: 'selectedYearId',
                        value: yearId.toString()
                    },
                    {
                        key: 'selectedYearType', 
                        value: yearType
                    }
                ];
                
                // Get year value from stored session data
                let yearValue = '';
                if (yearType === 'previous') {
                    yearValue = sessionStorage.getItem('previousYearValue') || '';
                } else if (yearType === 'current') {
                    yearValue = sessionStorage.getItem('currentYearValue') || '';
                } else if (yearType === 'next') {
                    yearValue = sessionStorage.getItem('nextYearValue') || '';
                }
                
                if (yearValue) {
                    updateRequests.push({
                        key: 'selectedYearValue',
                        value: yearValue
                    });
                }
                
                // Update each session data key using SessionController
                for (const request of updateRequests) {
                    const response = await fetch(AppConfig.getApiUrl('session/data'), {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
                        },
                        body: JSON.stringify(request)
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Failed to update session data for ${request.key}: ${response.status}`);
                    }
                }
                
                // Store locally for immediate access following Authentication & Session Management
                sessionStorage.setItem('selectedYearId', yearId.toString());
                sessionStorage.setItem('selectedYearType', yearType);
                sessionStorage.setItem('selectedYearValue', yearValue);
                
                console.log('Selected year stored in server session:', {
                    yearId: yearId,
                    yearType: yearType,
                    yearValue: yearValue
                });
                
                // Dispatch school year changed event following Cross-Component Communication
                const yearChangedEvent = new CustomEvent('schoolYearChanged', {
                    detail: {
                        yearId: yearId,
                        yearType: yearType,
                        yearValue: yearValue
                    }
                });
                window.dispatchEvent(yearChangedEvent);
                
            } catch (error) {
                console.error('Error storing selected year:', error);
                // Don't throw error - allow navigation to continue even if session storage fails
                console.warn('Continuing with navigation despite session storage error');
            }
        }

        // Update the showSchoolYear function to handle session storage errors gracefully
        async function showSchoolYear(yearId, yearType) {
            console.log('🗓️ showSchoolYear called with yearId:', yearId, 'yearType:', yearType);
            
            // Validate inputs
            if (!yearId || !yearType) {
                console.error('❌ Invalid year parameters:', { yearId, yearType });
                return;
            }
            
            try {
                // Store the selected year (this will not fail the navigation)
                await storeSelectedYearInSession(yearId, yearType);
            } catch (error) {
                console.warn('⚠️ Session storage failed, continuing with navigation:', error.message);
            }
            
            // Check entity type to determine navigation following Project-Specific Patterns
            const entityTypeId = parseInt(sessionStorage.getItem('entityTypeId')) || 0;
            console.log('📋 Entity type check:', { entityTypeId });
            
            if (entityTypeId === 5) {
                console.log('🏫 Entity type 5 (multi-school network) - navigating to school list');
                await loadSchoolListPage();
            } else {
                console.log('🏫 Single school entity - navigating to school year management');
                await loadSchoolYearPage();
            }
        }

        // Load school list page following Single-Page Application with Module Loading
        async function loadSchoolListPage() {
            try {
                console.log('🔄 Loading school list page...');
                
                const response = await fetch('schoollist.html');
                if (response.ok) {
                    const html = await response.text();
                    
                    // Find the main content container following Project-Specific Patterns
                    const mainContainer = document.getElementById('dynamicContent') || 
                                         document.getElementById('mainContent') || 
                                         document.querySelector('.main-content') || 
                                         document.body;
                    
                    if (mainContainer) {
                        mainContainer.innerHTML = html;
                        
                        // Re-execute scripts following Common Gotchas pattern
                        executeScriptsInContainer(mainContainer);
                        
                        // Update browser history following Single-Page Application patterns
                        history.pushState({ section: 'schoollist' }, '', '#schoollist');
                        
                        console.log('✅ School list page loaded successfully');
                    } else {
                        console.error('❌ Could not find main content container');
                    }
                } else {
                    console.error('❌ Failed to load schoollist.html:', response.status);
                    alert('שגיאה בטעינת רשימת בתי הספר');
                }
            } catch (error) {
                console.error('💥 Error loading school list page:', error);
                alert('שגיאה בטעינת רשימת בתי הספר');
            }
        }

        // Load school year page following Single-Page Application with Module Loading
        async function loadSchoolYearPage() {
            try {
                console.log('🔄 Loading school year page...');
                
                const response = await fetch('schoolyear.html');
                if (response.ok) {
                    const html = await response.text();
                    
                    // Find the main content container following Project-Specific Patterns
                    const mainContainer = document.getElementById('dynamicContent') || 
                                         document.getElementById('mainContent') || 
                                         document.querySelector('.main-content') || 
                                         document.body;
                    
                    if (mainContainer) {
                        mainContainer.innerHTML = html;
                        
                        // Re-execute scripts following Common Gotchas pattern
                        executeScriptsInContainer(mainContainer);
                        
                        // Update browser history following Single-Page Application patterns
                        history.pushState({ section: 'schoolyear' }, '', '#schoolyear');
                        
                        console.log('✅ School year page loaded successfully');
                    } else {
                        console.error('❌ Could not find main content container');
                    }
                } else {
                    console.error('❌ Failed to load schoolyear.html:', response.status);
                    alert('שגיאה בטעינת ניהול שנת לימודים');
                }
            } catch (error) {
                console.error('💥 Error loading school year page:', error);
                alert('שגיאה בטעינת ניהול שנת לימודים');
            }
        }

        // Execute scripts in dynamically loaded content following Common Gotchas
        function executeScriptsInContainer(container) {
            const scripts = container.querySelectorAll('script');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                if (script.src) {
                    newScript.src = script.src;
                } else {
                    newScript.textContent = script.textContent;
                }
                script.parentNode.replaceChild(newScript, script);
            });
        }

        // Show add modal placeholder function following Frontend Architecture Patterns
        function showAddModal(cardType) {
            const cardName = cardType === 'alertsCard' ? 'התראה' : 'אירוע';
            alert(`הוספת ${cardName} חדש - תכונה זו תתווסף בעתיד`);
        }

        // Debug function to check if elements exist
        function debugDashboardElements() {
            console.log('🔍 Dashboard Debug:', {
                alertsContainer: document.getElementById('alertsInternalCards'),
                eventsContainer: document.getElementById('eventsInternalCards'),
                systemVersionElement: document.getElementById('systemVersion'),
                contextButtons: document.querySelectorAll('.context-btn'),
                documentReady: document.readyState
            });
        }

        // Initialize dashboard following Critical Development Workflows
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🏁 Main Dashboard DOMContentLoaded');
            
            // Load dashboard data and context buttons
            setTimeout(async () => {
                loadDashboardCardData('alertsCard');
                loadDashboardCardData('eventsCard');
                loadSystemVersion();
                
                // Update context button labels with actual year values
                await updateContextButtonLabels();
                
                console.log('✅ Main Dashboard initialized successfully');
            }, 100);
        });

        // Also try immediate call if DOM is already ready following Frontend Architecture Patterns
        if (document.readyState !== 'loading') {
            console.log('📄 Document already ready, calling initialization immediately');
            setTimeout(async () => {
                loadDashboardCardData('alertsCard');
                loadDashboardCardData('eventsCard');
                loadSystemVersion();
                await updateContextButtonLabels();
                console.log('✅ Main Dashboard initialized immediately');
            }, 50);
        }

        // Make functions globally available following Cross-Component Communication
        window.loadDashboardCardData = loadDashboardCardData;
        window.showAddModal = showAddModal;
        window.loadSystemVersion = loadSystemVersion;
        window.updateContextButtonLabels = updateContextButtonLabels;
        window.storeSelectedYearInSession = storeSelectedYearInSession;
        window.showSchoolYear = showSchoolYear;
        window.loadSchoolListPage = loadSchoolListPage;
        window.loadSchoolYearPage = loadSchoolYearPage;
        window.executeScriptsInContainer = executeScriptsInContainer;
        window.debugDashboardElements = debugDashboardElements;

        console.log('✅ Main Dashboard functions registered globally');
    </script>
</body>
</html>
