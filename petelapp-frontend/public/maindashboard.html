<script src="alerts-modal.js"></script>
<script src="alerts-events-manager.js"></script>
<script>
    console.log('🔍 Main Dashboard script loaded');

    /**
* Wait for component to be available
* Following Frontend Architecture Patterns for component loading
*/
    function waitForComponent(componentName, maxAttempts = 50) {
        return new Promise((resolve, reject) => {
            let attempts = 0;

            const checkInterval = setInterval(() => {
                attempts++;

                if (window[componentName]) {
                    clearInterval(checkInterval);
                    console.log(`✅ ${componentName} available after ${attempts} attempts`);
                    resolve(window[componentName]);
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.error(`❌ ${componentName} not available after ${maxAttempts} attempts`);
                    reject(new Error(`${componentName} failed to load`));
                }
            }, 100); // Check every 100ms
        });
    }

    // Load dashboard card data from backend
    async function loadDashboardCardData(cardId) {
        console.log('📊 Loading dashboard card data for:', cardId);

        try {
            // ✅ Wait for AlertsEventsManager to be available
            await waitForComponent('AlertsEventsManager');

            // Get entity ID from session
            const session = await window.SessionState.getSession();
            const entityId = session.entityId;

            if (!entityId) {
                console.error('❌ No entity ID in session');
                const containerElement = document.getElementById(cardId.replace('Card', 'InternalCards'));
                if (containerElement) {
                    containerElement.innerHTML = '<div class="error-message">לא נמצא מזהה ישות</div>';
                }
                return;
            }

            console.log('🏢 Loading alerts for entity:', entityId);

            // Load data from backend via AlertsEventsManager
            const data = await window.AlertsEventsManager.loadAlertEventsData(entityId);

            if (cardId === 'alertsCard') {
                // ✅ Pass entityId to render function
                window.AlertsEventsManager.renderAlerts(data.alerts, 'alertsInternalCards', entityId);
            } else if (cardId === 'eventsCard') {
                // ✅ Pass entityId to render function
                window.AlertsEventsManager.renderEvents(data.events, 'eventsInternalCards', entityId);
            }
        } catch (error) {
            console.error('❌ Error loading dashboard data:', error);
            const containerElement = document.getElementById(cardId.replace('Card', 'InternalCards'));
            if (containerElement) {
                containerElement.innerHTML = '<div class="error-message">שגיאה בטעינת הנתונים</div>';
            }
        }
    }


    /**
     * Show add modal for alert or event
     * Following Cross-Component Communication pattern
     */
    async function showAddModal(cardType) {
        try {
            // ✅ Wait for modal component to be available
            await waitForComponent('alertsModal');

            const isEvent = cardType === 'eventsCard';
            window.alertsModal.show(isEvent);
        } catch (error) {
            console.error('❌ Error showing modal:', error);
            alert('שגיאה בפתיחת חלון הוספה');
        }
    }

// Update the updateContextButtonLabels function to call checkSchoolYearAvailability
async function updateContextButtonLabels() {
    console.log('Updating context button labels with year values...');
    try {
        const response = await fetch(AppConfig.getApiUrl('systemAttributes'));
        if (!response.ok) {
            throw new Error('Failed to load system attributes');
        }
        const attributes = await response.json();
        if (!Array.isArray(attributes)) {
            console.error('System attributes response is not an array:', attributes);
            return;
        }

        // Find year attributes by name
        const previousYearAttr = attributes.find(attr => attr.name === "Previous Year");
        const currentYearAttr = attributes.find(attr => attr.name === "Current Year");
        const nextYearAttr = attributes.find(attr => attr.name === "Next Year");

        // ✅ Store in backend session via SessionState instead of sessionStorage
        if (previousYearAttr) {
            window.previousYearId = previousYearAttr.foreignId;
            await window.SessionState.setProperty('PreviousYearId', previousYearAttr.foreignId.toString());
            await window.SessionState.setProperty('PreviousYearValue', previousYearAttr.value);
            const prevButton = document.querySelector('.context-btn[onclick*="previous"]');
            if (prevButton) prevButton.textContent = previousYearAttr.value;
        }

        if (currentYearAttr) {
            window.currentYearId = currentYearAttr.foreignId;
            await window.SessionState.setProperty('CurrentYearId', currentYearAttr.foreignId.toString());
            await window.SessionState.setProperty('CurrentYearValue', currentYearAttr.value);
            const currentButton = document.querySelector('.context-btn[onclick*="current"]');
            if (currentButton) currentButton.textContent = currentYearAttr.value;
        }

        const nextButton = document.querySelector('.context-btn[onclick*="next"]');
        if (nextYearAttr && nextYearAttr.foreignId) {
            await window.SessionState.setProperty('NextYearId', nextYearAttr.foreignId.toString());
            await window.SessionState.setProperty('NextYearValue', nextYearAttr.value);
            const nextButton = document.querySelector('.context-btn[onclick*="next"]');
            if (nextButton) nextButton.textContent = nextYearAttr.value;
                } else {
            console.log('⚠️ No Next Year attribute found, hiding button');
            if (nextButton) {
                nextButton.style.display = 'none'; // ✅ Hide button
            }
        }

        console.log('✅ Context button labels updated and stored in backend session via SessionState');
        
        // ✅ Check school year availability AFTER loading year data
        await checkSchoolYearAvailability();
        
        await setupEntityDetailsButton();
    } catch (error) {
        console.error('Error loading context button data:', error);
    }
}


    /**
 * Check school year availability and disable buttons for missing years
 * Only runs for school entities (entityTypeId = 1 or 4)
 * Following Entity-Based Request Flow pattern
 */
    async function checkSchoolYearAvailability() {
        console.log('🔍 Checking school year availability...');

        try {
            const session = await window.SessionState.getSession();
            const entityTypeId = parseInt(session.entityTypeId, 10);

            // Only check for school entities
            if (entityTypeId !== 1 && entityTypeId !== 4) {
                console.log('⏭️ Not a school entity, skipping year availability check');
                return;
            }

            const schoolId = parseInt(session.entityId, 10);
            console.log('🏫 School entity detected, checking years for schoolId:', schoolId);

            // Get year IDs from session
            const previousYearId = await window.SessionState.getProperty('PreviousYearId');
            const currentYearId = await window.SessionState.getProperty('CurrentYearId');
            const nextYearId = await window.SessionState.getProperty('NextYearId');

            console.log('📅 Year IDs:', { previousYearId, currentYearId, nextYearId });

            const authToken = sessionStorage.getItem('authToken');

            // Check each year
            const yearChecks = [
                { yearId: previousYearId, sessionKey: 'PreviousSchoolYearId', buttonSelector: '[onclick*="previous"]', yearType: 'previous' },
                { yearId: currentYearId, sessionKey: 'CurrentSchoolYearId', buttonSelector: '[onclick*="current"]', yearType: 'current' },
                { yearId: nextYearId, sessionKey: 'NextSchoolYearId', buttonSelector: '[onclick*="next"]', yearType: 'next' }
            ];

            for (const check of yearChecks) {
                if (!check.yearId) {
                    console.log(`⚠️ No ${check.yearType} year ID found, skipping`);
                    continue;
                }

                try {
                    const apiUrl = AppConfig.getApiUrl(`schoolYears/by-year-and-school?yearId=${check.yearId}&schoolId=${schoolId}`);
                    console.log(`🌐 Checking ${check.yearType} year:`, apiUrl);

                    const response = await fetch(apiUrl, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${authToken}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    const button = document.querySelector(check.buttonSelector);

                    if (response.ok) {
                        const data = await response.json();
                        console.log(`✅ ${check.yearType} year exists, school_year.id:`, data.id);

                        // Store school_year.id in session
                        await window.SessionState.setProperty(check.sessionKey, data.id.toString());

                        // Enable button
                        if (button) {
                            button.disabled = false;
                            button.style.opacity = '1';
                            button.style.cursor = 'pointer';
                            button.title = '';
                        }
                    } else {
                        console.log(`❌ ${check.yearType} year does NOT exist in school_years table`);

                        // Clear session property
                        await window.SessionState.setProperty(check.sessionKey, '');

                        // Disable button
                        if (button) {
                            button.disabled = true;
                            button.style.opacity = '0.5';
                            button.style.cursor = 'not-allowed';
                            button.title = 'שנה זו לא קיימת עבור בית הספר';
                            console.log(`🚫 Disabled ${check.yearType} year button`);
                        }
                    }
                } catch (error) {
                    console.error(`❌ Error checking ${check.yearType} year:`, error);

                    // Disable button on error
                    const button = document.querySelector(check.buttonSelector);
                    if (button) {
                        button.disabled = true;
                        button.style.opacity = '0.5';
                        button.style.cursor = 'not-allowed';
                        button.title = 'שגיאה בבדיקת זמינות השנה';
                    }
                }
            }

            console.log('✅ School year availability check complete');

        } catch (error) {
            console.error('❌ Error in checkSchoolYearAvailability:', error);
        }
    }




    // ✅ Setup Entity Details Button visibility
    async function setupEntityDetailsButton() {
        try {
            const session = await window.SessionState.getSession();
            const entityTypeId = parseInt(session.entityTypeId, 10);

            const btn = document.getElementById('btnEntityDetails');
            if (!btn) {
                console.error('❌ Entity Details button not found in HTML');
                return;
            }

            // Show button only for NON-school entities (entityTypeId !== 1 and !== 4)
            if (entityTypeId === 1 || entityTypeId === 4) {
                console.log('🏫 Entity is a school, hiding Entity Details button');
                btn.style.display = 'none';
            } else {
                console.log('🏢 Non-school entity, showing Entity Details button');
                btn.style.display = 'inline-block';
            }

        } catch (error) {
            console.error('❌ Error setting up entity details button:', error);
        }
    }

    // ✅ Navigate to Entity Details screen
    async function navigateToEntityDetails() {
        console.log('🔄 Navigating to Entity Details...');

        try {
            const session = await window.SessionState.getSession();
            
            // Store the entity ID from session
            await window.SessionState.setProperty('ViewEntityId', session.entityId);
            
            // Navigate to entity details page
            if (typeof window.navigateTo === 'function') {
                await window.navigateTo('entitydetails');
            } else {
                console.error('❌ window.navigateTo not available');
                alert('שגיאה בניווט לפרטי ישות');
            }
        } catch (error) {
            console.error('❌ Error navigating to entity details:', error);
            alert('שגיאה בניווט לפרטי ישות');
        }
    }

    async function storeSelectedYearInSession(yearId, yearType) {
        console.log('Storing selected year in session:', yearId, yearType);

        try {
            // ✅ Get year value from backend session instead of sessionStorage
            let yearValue = '';
            if (yearType === 'previous') {
                yearValue = await window.SessionState.getProperty('PreviousYearValue') || '';
            } else if (yearType === 'current') {
                yearValue = await window.SessionState.getProperty('CurrentYearValue') || '';
            } else if (yearType === 'next') {
                yearValue = await window.SessionState.getProperty('NextYearValue') || '';
            }

            // ✅ Use centralized SessionState
            await window.SessionState.setProperty('SelectedYearId', yearId.toString());
            await window.SessionState.setProperty('SelectedYearType', yearType);

            if (yearValue) {
                await window.SessionState.setProperty('SelectedYearValue', yearValue);
            }

            console.log('✅ Selected year stored via SessionState');

            return true;

        } catch (error) {
            console.error('❌ Error storing selected year:', error);
            throw error;
        }
    }

    // Update the showSchoolYear function to handle session storage errors gracefully
    // Show school year with proper error handling following Frontend Architecture Patterns
    async function showSchoolYear(yearId, yearType) {
        console.log('🗓️ showSchoolYear called:', yearId, yearType);

        if (!yearId || !yearType) {
            console.error('❌ Invalid year parameters');
            alert('שגיאה: פרמטרי שנה לא תקינים');
            return;
        }

        try {
            await storeSelectedYearInSession(yearId, yearType);

            // ✅ Use centralized SessionState
            const session = await window.SessionState.getSession();
            const entityTypeId = parseInt(session.entityTypeId, 10);

            console.log('📋 Entity type:', entityTypeId);

            if (entityTypeId !== 1 && entityTypeId !== 4) {
                console.log('🏫 Multi-school network - navigating to school list');
                await loadSchoolListPage();
            } else {    
                console.log('🏫 Single school - navigating to school dashboard');
                await loadSchoolDashboardPage();
            }

        } catch (error) {
            console.error('💥 Error in showSchoolYear:', error);
            alert('שגיאה בטעינת שנת לימודים. אנא נסה שוב.');
        }
    }


    async function loadSchoolListPage() {
        console.log('🔄 Navigating to school list...');

        if (typeof window.navigateTo === 'function') {
            await window.navigateTo('schoollist');
        } else {
            console.error('❌ window.navigateTo not available');
            alert('שגיאה בטעינת רשימת בתי הספר');
        }
    }


// Load school dashboard page for single school entities
async function loadSchoolDashboardPage() {
    console.log('🔄 Navigating to school dashboard...');

    try {
        // ✅ Get the selected year type from session
        const selectedYearType = await window.SessionState.getProperty('SelectedYearType');
        
        console.log('📅 Selected year type:', selectedYearType);

        // ✅ Get the corresponding school_year.id based on year type
        let schoolYearId = '';
        
        if (selectedYearType === 'previous') {
            schoolYearId = await window.SessionState.getProperty('PreviousSchoolYearId');
            console.log('📚 Using Previous School Year ID:', schoolYearId);
        } else if (selectedYearType === 'current') {
            schoolYearId = await window.SessionState.getProperty('CurrentSchoolYearId');
            console.log('📚 Using Current School Year ID:', schoolYearId);
        } else if (selectedYearType === 'next') {
            schoolYearId = await window.SessionState.getProperty('NextSchoolYearId');
            console.log('📚 Using Next School Year ID:', schoolYearId);
        }

        // ✅ Validate school year ID exists
        if (!schoolYearId) {
            console.error('❌ No school year ID found for selected year type:', selectedYearType);
            alert('שגיאה: שנת לימודים לא נמצאה עבור בית הספר');
            return;
        }

        // ✅ Store SelectedSchoolYearId in session
        await window.SessionState.setProperty('SelectedSchoolYearId', schoolYearId);
        console.log('✅ SelectedSchoolYearId set to:', schoolYearId);

        // ✅ Navigate to school dashboard
        if (typeof window.navigateTo === 'function') {
            await window.navigateTo('schooldashboard');
        } else {
            console.error('❌ window.navigateTo not available');
            alert('שגיאה בטעינת לוח בקרה של בית הספר');
        }
    } catch (error) {
        console.error('❌ Error in loadSchoolDashboardPage:', error);
        alert('שגיאה בטעינת לוח הבקרה');
    }
}

    // Initialize dashboard following Critical Development Workflows
    document.addEventListener('DOMContentLoaded', async function () {
        console.log('🏁 Main Dashboard DOMContentLoaded');

        try {
            // ✅ Wait for components to load before initializing
            await Promise.all([
                waitForComponent('AlertsEventsManager'),
                waitForComponent('alertsModal')
            ]);

            // Load dashboard data and context buttons
            await loadDashboardCardData('alertsCard');
            await loadDashboardCardData('eventsCard');
            await updateContextButtonLabels();

            console.log('✅ Main Dashboard initialized successfully');
        } catch (error) {
            console.error('❌ Error initializing dashboard:', error);
            alert('שגיאה בטעינת לוח הבקרה. אנא רענן את העמוד.');
        }
    });

    // Also try immediate call if DOM is already ready following Frontend Architecture Patterns
    if (document.readyState !== 'loading') {
        console.log('📄 Document already ready, calling initialization immediately');
        setTimeout(async () => {
            loadDashboardCardData('alertsCard');
            loadDashboardCardData('eventsCard');
            await updateContextButtonLabels();
            console.log('✅ Main Dashboard initialized immediately');
        }, 50);
    }

    // Make functions globally available following Cross-Component Communication
    window.loadDashboardCardData = loadDashboardCardData;
    window.showAddModal = showAddModal;
    window.updateContextButtonLabels = updateContextButtonLabels;
    window.storeSelectedYearInSession = storeSelectedYearInSession;
    window.showSchoolYear = showSchoolYear;
    window.loadSchoolListPage = loadSchoolListPage;
    window.loadSchoolDashboardPage = loadSchoolDashboardPage;
    window.navigateToEntityDetails = navigateToEntityDetails;

    //  window.debugDashboardElements = debugDashboardElements;
    window.setupEntityDetailsButton = setupEntityDetailsButton;
    window.checkSchoolYearAvailability = checkSchoolYearAvailability;

    console.log('✅ Main Dashboard functions registered globally');
</script>
