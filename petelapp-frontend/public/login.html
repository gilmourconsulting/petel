<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה למערכת</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            z-index: 10;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-title {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
            direction: rtl;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: left 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-left: 40px;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee;
            color: #c53030;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #fed7d7;
            font-size: 14px;
            display: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .credentials-section {
            transition: all 0.4s ease;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
        }

        .credentials-section.show {
            opacity: 1;
            max-height: 200px;
        }

        .tenant-info {
            background: #f8f9ff;
            border: 1px solid #e1e8ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .tenant-info.show {
            display: block;
        }

        .tenant-name {
            font-weight: 600;
            color: #4f46e5;
            margin-bottom: 4px;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="petel_logo.png" alt="לוגו המערכת" />
        </div>
        
        <div class="login-header">
            <h1 class="login-title">כניסה למערכת</h1>
            <p class="login-subtitle">בחר את הארגון שלך ולאחר מכן הזן את פרטי ההתחברות</p>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step1">
                <span class="step-number">1</span>
                <span>בחר ארגון</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" id="step2">
                <span class="step-number">2</span>
                <span>הזן פרטים</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" id="step3">
                <span class="step-number">3</span>
                <span>התחבר</span>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="entity" class="form-label">בית ספר/עיריה/רשת</label>
                <select id="entity" name="entity" class="form-select" required>
                    <option value="">בחר ישות...</option>
                </select>
                <small style="color: #666; font-size: 12px; margin-top: 4px; display: block;">
                    בחר את הארגון שלך לפני הזנת פרטי ההתחברות
                </small>
            </div>

            <div class="credentials-section" id="credentialsSection" style="display: none;">
                <div class="form-group">
                    <label for="username" class="form-label">שם משתמש</label>
                    <input type="text" id="username" name="username" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">סיסמה</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>
            </div>

            <button type="submit" class="login-button" id="loginButton" disabled>
                בחר ישות תחילה
            </button>
        </form>

        <div class="form-footer">
            מערכת ניהול - גרסה <span id="systemVersion">טוען...</span>
        </div>
    </div>

    <script>
        // Mock data - replace with actual API calls to your .NET backend

        // Elements
        const entitySelect = document.getElementById('entity');
        const credentialsSection = document.getElementById('credentialsSection');
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');

        // Load entities on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadEntities();
            loadSystemVersion();
        });

        // Set entity context for API calls
        function setEntityContext(entityId) {
            // Parse to ensure it's a clean integer string
            const cleanEntityId = parseInt(entityId).toString();
            
            // Store entity ID for subsequent API calls
            sessionStorage.setItem('selectedEntityId', cleanEntityId);
            
            console.log('Entity context set:', cleanEntityId);
        }

        // Handle entity selection
        entitySelect.addEventListener('change', function() {
            const selectedEntityId = this.value;
            
            if (selectedEntityId) {
                // Parse to integer to remove any padding
                const entityIdInt = parseInt(selectedEntityId);
                const entityIdString = entityIdInt.toString();
                
                console.log('Entity selected:', {
                    originalValue: selectedEntityId,
                    parsedInt: entityIdInt,
                    finalString: entityIdString
                });
                
                // Update step indicator
                document.getElementById('step1').classList.add('completed');
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                
                // Show credentials section with animation
                credentialsSection.style.display = 'block';
                setTimeout(() => {
                    credentialsSection.classList.add('show');
                }, 100);
                
                // Enable login button
                loginButton.disabled = false;
                loginButton.textContent = 'התחבר';
                
                // Set entity context for API calls (use parsed integer)
                setEntityContext(entityIdString);
                
                // Focus on username field
                setTimeout(() => {
                    document.getElementById('username').focus();
                }, 500);
            } else {
                // Reset steps
                document.getElementById('step1').classList.remove('completed');
                document.getElementById('step1').classList.add('active');
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step3').classList.remove('active');
                
                // Hide credentials section
                credentialsSection.classList.remove('show');
                setTimeout(() => {
                    credentialsSection.style.display = 'none';
                }, 400);
                
                loginButton.disabled = true;
                loginButton.textContent = 'בחר ישות תחילה';
            }
        });

        // Load entities from database
        async function loadEntities() {
            try {
                // Use real API endpoint
                const apiUrl = 'http://localhost:5082/api/entities/login';
                
                console.log('Loading entities from:', apiUrl);
                
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const entities = await response.json();
                console.log('Loaded entities:', entities);
                
                if (!entities || entities.length === 0) {
                    console.log('No entities found, using mock data');
                    loadMockEntities();
                    return;
                }
                
                entities.forEach(entity => {
                    const option = document.createElement('option');
                    // Ensure ID is stored as integer, not string with padding
                    option.value = parseInt(entity.id).toString();
                    option.textContent = entity.name;
                    entitySelect.appendChild(option);
                    
                    // Debug logging
                    console.log('Added entity:', { 
                        originalId: entity.id, 
                        parsedId: parseInt(entity.id), 
                        finalValue: option.value,
                        name: entity.name 
                    });
                });
                
                console.log('Successfully loaded', entities.length, 'entities from database');
            } catch (error) {
                console.error('Error loading entities:', error);
                showError('שגיאה בטעינת הישויות');
                
                // Fallback to mock data for testing
                console.log('Falling back to mock data');
                loadMockEntities();
            }
        }
        

        // Handle form submission
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const entityId = document.getElementById('entity').value;

            if (!username || !password || !entityId) {
                showError('אנא מלא את כל השדות');
                return;
            }

            // Show loading state
            loginButton.disabled = true;
            loginButton.innerHTML = 'מתחבר... <span class="loading"></span>';
            hideError();

            try {
                // Update step indicator to login step
                document.getElementById('step2').classList.add('completed');
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step3').classList.add('active');
                
                // Login data with entity ID
                const entityIdInt = parseInt(entityId);
                const loginData = {
                    username: username,
                    password: password,
                    entityId: entityIdInt // Send entity ID as integer
                };

                console.log('Login attempt:', { 
                    username, 
                    originalEntityId: entityId,
                    parsedEntityId: entityIdInt,
                    entityIdType: typeof entityIdInt,
                    loginData 
                });

                // API call headers (no tenant reference)
                const headers = {
                    'Content-Type': 'application/json'
                };

                console.log('Request headers:', headers);

                // API call to .NET backend
                const response = await fetch('http://localhost:5082/api/auth/login', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(loginData)
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error('Authentication failed');
                }

                const result = await response.json();
                console.log('Login API response:', result);

                // Store session data following Authentication & Session Management
                sessionStorage.setItem('authToken', result.token || 'mock-token');
                sessionStorage.setItem('userFullName', result.userFullName || '');
                sessionStorage.setItem('userId', result.userId || '');
                sessionStorage.setItem('entityId', result.entityId?.toString() || '');
                sessionStorage.setItem('entityName', result.entityName || '');
                sessionStorage.setItem('entityTypeId', result.entityTypeId?.toString() || '');
                sessionStorage.setItem('entityTypeName', result.entityTypeName || '');

                // Debug what was stored
                console.log('Stored entityId:', sessionStorage.getItem('entityId'));
                console.log('Stored entityTypeId:', sessionStorage.getItem('entityTypeId'));

                if (result.success) {
                    // Successful login
                    document.getElementById('step3').classList.add('completed');
                    
                    loginButton.innerHTML = 'התחברות בוצעה בהצלחה!';
                    loginButton.style.background = 'linear-gradient(135deg, #48bb78 0%, #38a169 100%)';
                    
                    console.log('Stored session data:', {
                        authToken: result.token,
                        entityId: result.entityId,
                        entityName: result.entityName,
                        userFullName: result.userFullName,
                        userEmail: result.userEmail
                    });
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        console.log('Redirecting to main page...');
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    // Reset step on failure
                    document.getElementById('step2').classList.remove('completed');
                    document.getElementById('step2').classList.add('active');
                    document.getElementById('step3').classList.remove('active');
                    
                    showError(result.message || 'שם משתמש או סיסמה שגויים, או שאינך רשאי לגשת לארגון זה');
                }

            } catch (error) {
                // Reset step on error
                document.getElementById('step2').classList.remove('completed');
                document.getElementById('step2').classList.add('active');
                document.getElementById('step3').classList.remove('active');
                
                console.error('Login error details:', error);
                
                // Show generic error message only
                showError('שגיאה בהתחברות. אנא נסה שוב.');
            } finally {
                // Reset button state if authentication failed
                if (loginButton.innerHTML.includes('שגיאה') || errorMessage.style.display === 'block') {
                    loginButton.disabled = false;
                    loginButton.innerHTML = 'התחבר';
                }
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        // Load system version from database
        async function loadSystemVersion() {
            try {
                const response = await fetch('http://localhost:5082/api/systemattributes');
                if (response.ok) {
                    const attributes = await response.json();
                    const versionAttr = attributes.find(attr => attr.name === "System Version");
                    document.getElementById('systemVersion').textContent = versionAttr ? versionAttr.value : '1.0';
                } else {
                    document.getElementById('systemVersion').textContent = '1.0';
                }
            } catch (error) {
                console.log('Could not load system version, using default');
                document.getElementById('systemVersion').textContent = '1.0';
            }
        }

 
    </script>
</body>
</html>
