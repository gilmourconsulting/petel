<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה למערכת</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-title {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
            direction: rtl;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: left 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-left: 40px;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee;
            color: #c53030;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #fed7d7;
            font-size: 14px;
            display: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .credentials-section {
            transition: all 0.4s ease;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
        }

        .credentials-section.show {
            opacity: 1;
            max-height: 200px;
        }

        .tenant-info {
            background: #f8f9ff;
            border: 1px solid #e1e8ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .tenant-info.show {
            display: block;
        }

        .tenant-name {
            font-weight: 600;
            color: #4f46e5;
            margin-bottom: 4px;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">כניסה למערכת</h1>
            <p class="login-subtitle">בחר את הארגון שלך ולאחר מכן הזן את פרטי ההתחברות</p>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step1">
                <span class="step-number">1</span>
                <span>בחר ארגון</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" id="step2">
                <span class="step-number">2</span>
                <span>הזן פרטים</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" id="step3">
                <span class="step-number">3</span>
                <span>התחבר</span>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="tenant-info" id="tenantInfo">
            <div class="tenant-name" id="tenantName"></div>
            <div class="tenant-description">אתה מתחבר לארגון זה</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="entity" class="form-label">ישות / ארגון</label>
                <select id="entity" name="entity" class="form-select" required>
                    <option value="">בחר ישות...</option>
                </select>
                <small style="color: #666; font-size: 12px; margin-top: 4px; display: block;">
                    בחר את הארגון שלך לפני הזנת פרטי ההתחברות
                </small>
            </div>

            <div class="credentials-section" id="credentialsSection" style="display: none;">
                <div class="form-group">
                    <label for="username" class="form-label">שם משתמש</label>
                    <input type="text" id="username" name="username" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">סיסמה</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>
            </div>

            <button type="submit" class="login-button" id="loginButton" disabled>
                בחר ישות תחילה
            </button>
        </form>

        <div class="form-footer">
            מערכת ניהול - גרסה 1.0
        </div>
    </div>

    <script>
        // Mock data - replace with actual API calls to your .NET backend
        const mockEntities = [
            { id: 1, name: 'חברת אלפא בע"מ', description: 'חברת טכנולוגיה' },
            { id: 2, name: 'חברת בטא בע"מ', description: 'חברת יעוץ' },
            { id: 3, name: 'חברת גמא בע"מ', description: 'חברת שיווק' },
            { id: 4, name: 'משרד הממשלה', description: 'גוף ציבורי' },
            { id: 5, name: 'עיריית תל אביב', description: 'רשות מקומית' }
        ];

        // Mock users data - in real system, users are validated per tenant
        const mockUsers = [
            { username: 'admin', password: 'admin123', entityId: 1, role: 'מנהל מערכת' },
            { username: 'manager', password: 'manager123', entityId: 2, role: 'מנהל' },
            { username: 'user1', password: 'user123', entityId: 3, role: 'משתמש' },
            { username: 'gov_user', password: 'gov123', entityId: 4, role: 'עובד משרד' },
            { username: 'city_admin', password: 'city123', entityId: 5, role: 'מנהל עירוני' }
        ];

        // Elements
        const entitySelect = document.getElementById('entity');
        const credentialsSection = document.getElementById('credentialsSection');
        const tenantInfo = document.getElementById('tenantInfo');
        const tenantName = document.getElementById('tenantName');
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');

        // Load entities on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadEntities();
        });

        // Handle entity selection
        entitySelect.addEventListener('change', function() {
            const selectedEntityId = this.value;
            const selectedEntity = mockEntities.find(e => e.id == selectedEntityId);
            
            if (selectedEntityId) {
                // Update step indicator
                document.getElementById('step1').classList.add('completed');
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                
                // Show tenant info
                tenantName.textContent = selectedEntity.name;
                tenantInfo.classList.add('show');
                
                // Show credentials section with animation
                credentialsSection.style.display = 'block';
                setTimeout(() => {
                    credentialsSection.classList.add('show');
                }, 100);
                
                // Enable login button
                loginButton.disabled = false;
                loginButton.textContent = 'התחבר';
                
                // Set tenant context for API calls
                setTenantContext(selectedEntityId);
                
                // Focus on username field
                setTimeout(() => {
                    document.getElementById('username').focus();
                }, 500);
            } else {
                // Reset steps
                document.getElementById('step1').classList.remove('completed');
                document.getElementById('step1').classList.add('active');
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step3').classList.remove('active');
                
                // Hide everything
                tenantInfo.classList.remove('show');
                credentialsSection.classList.remove('show');
                setTimeout(() => {
                    credentialsSection.style.display = 'none';
                }, 400);
                
                loginButton.disabled = true;
                loginButton.textContent = 'בחר ישות תחילה';
            }
        });

        // Set tenant context for API calls
        function setTenantContext(tenantId) {
            // Store tenant ID for subsequent API calls
            sessionStorage.setItem('selectedTenant', tenantId);
            
            // You might want to validate tenant access here
            // validateTenantAccess(tenantId);
        }

        // Load entities from database
        async function loadEntities() {
            try {
                // Replace this with actual API call to your .NET backend
                // const response = await fetch('/api/entities');
                // const entities = await response.json();
                
                // Using mock data for demonstration
                const entities = mockEntities;
                
                entities.forEach(entity => {
                    const option = document.createElement('option');
                    option.value = entity.id;
                    option.textContent = entity.name;
                    entitySelect.appendChild(option);
                });
            } catch (error) {
                showError('שגיאה בטעינת הישויות');
            }
        }

        // Handle form submission
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const entityId = document.getElementById('entity').value;

            if (!username || !password || !entityId) {
                showError('אנא מלא את כל השדות');
                return;
            }

            // Show loading state
            loginButton.disabled = true;
            loginButton.innerHTML = 'מתחבר... <span class="loading"></span>';
            hideError();

            try {
                // Multi-tenant login data
                const loginData = {
                    username: username,
                    password: password,
                    tenantId: parseInt(entityId) // Using tenantId instead of entityId
                };

                // In a real multi-tenant system, you would:
                // 1. Set tenant context in headers
                // 2. API validates user belongs to this tenant
                // 3. Return tenant-specific token/session
                
                const headers = {
                    'Content-Type': 'application/json',
                    'X-Tenant-ID': entityId // Tenant context header
                };

                // Replace with actual API call
                // const response = await fetch('/api/auth/login', {
                //     method: 'POST',
                //     headers: headers,
                //     body: JSON.stringify(loginData)
                // });

                // Mock multi-tenant authentication
                const isValid = mockUsers.some(user => 
                    user.username === username && 
                    user.password === password && 
                    user.entityId === parseInt(entityId)
                );

                if (isValid) {
                    // Successful login
                    loginButton.innerHTML = 'התחברות בוצעה בהצלחה!';
                    loginButton.style.background = 'linear-gradient(135deg, #48bb78 0%, #38a169 100%)';
                    
                    // Store tenant information for the session
                    sessionStorage.setItem('authToken', 'mock_jwt_token');
                    sessionStorage.setItem('tenantId', entityId);
                    sessionStorage.setItem('tenantName', mockEntities.find(e => e.id == entityId).name);
                    
                    // Redirect to tenant-specific dashboard
                    setTimeout(() => {
                        alert('התחברות בוצעה בהצלחה! מעביר לעמוד הראשי...');
                        // window.location.href = `/dashboard?tenant=${entityId}`;
                    }, 1000);
                } else {
                    showError('שם משתמש או סיסמה שגויים, או שאינך רשאי לגשת לארגון זה');
                }

            } catch (error) {
                showError('שגיאה בהתחברות. אנא נסה שוב.');
            } finally {
                // Reset button state if authentication failed
                if (loginButton.innerHTML.includes('שגיאה') || errorMessage.style.display === 'block') {
                    loginButton.disabled = false;
                    loginButton.innerHTML = 'התחבר';
                }
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        // API Integration Examples for your .NET backend:
        
        // 1. Load entities from your database:
        /*

            try {
                const response = await fetch('/api/entities', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load entities');
                }
                
                const entities = await response.json();
                
                entities.forEach(entity => {
                    const option = document.createElement('option');
                    option.value = entity.id;
                    option.textContent = entity.name;
                    entitySelect.appendChild(option);
                });
            } catch (error) {
                showError('שגיאה בטעינת הישויות');
            }
        }
        */

        // 2. Authenticate user against your database:
        /*
        async function authenticateUser(loginData) {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(loginData)
                });

                if (!response.ok) {
                    throw new Error('Authentication failed');
                }

                const result = await response.json();
                
                if (result.success) {
                    // Store authentication token if using JWT
                    localStorage.setItem('authToken', result.token);
                    // Redirect to main application
                    window.location.href = '/dashboard';
                } else {
                    showError(result.message || 'שם משתמש, סיסמה או ישות שגויים');
                }
            } catch (error) {
                showError('שגיאה בהתחברות. אנא נסה שוב.');
            }
        }
        */
    </script>
</body>
</html>
