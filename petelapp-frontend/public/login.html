<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה למערכת</title>

    <!-- ✅ Load environment config FIRST -->
    <script src="env-config.js"></script>
    <!-- Then load other scripts -->
    <script src="config.js"></script>

    <!-- Load styles -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/png" href="favicon.png">

</head>

<body>
    <div class="login-container">
        <div class="logo">
            <img src="petel_logo.png" alt="לוגו המערכת" />
        </div>

        <div class="login-header">
            <h1 class="login-title">כניסה למערכת</h1>
            <p class="login-subtitle">בחר את הארגון שלך ולאחר מכן הזן את פרטי ההתחברות</p>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step1">
                <span class="step-number">1</span>
                <span>בחר ארגון</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" id="step2">
                <span class="step-number">2</span>
                <span>הזן פרטים</span>
            </div>
            <div class="step-divider"></div>
            <div class="step" id="step3">
                <span class="step-number">3</span>
                <span>התחבר</span>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="entity" class="form-label">בית ספר/עיריה/רשת</label>
                <div class="autocomplete-container">
                    <input type="text" id="entityAutocomplete" class="autocomplete-input"
                        placeholder="הזן לפחות 3 תווים לחיפוש..." autocomplete="off" required>
                    <div class="autocomplete-arrow"></div>
                    <div class="autocomplete-dropdown" id="entityDropdown"></div>
                </div>
                <input type="hidden" id="entity" name="entity">
                <small style="color: #666; font-size: 12px; margin-top: 4px; display: block;">
                    בחר את הארגון שלך לפני הזנת פרטי ההתחברות
                </small>
            </div>

            <div class="credentials-section" id="credentialsSection" style="display: none;">
                <div class="form-group">
                    <label for="username" class="form-label">שם משתמש</label>
                    <input type="text" id="username" name="username" class="form-input" autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">סיסמה</label>
                    <input type="password" id="password" name="password" class="form-input"
                        autocomplete="current-password" required>
                </div>
            </div>

            <button type="submit" class="login-button" id="loginButton" disabled>
                בחר ישות תחילה
            </button>
        </form>

        <div id="otpContainer" style="display: none;">
            <!-- OTP flows will be injected here -->
        </div>

        <div class="form-footer">
            מערכת ניהול - גרסה <span id="systemVersion">טוען...</span>
        </div>

        <!-- OTP Modal -->
        <div class="modal-overlay" id="otpModalOverlay" style="display: none;">
            <div class="modal-content otp-modal">
                <div class="modal-header">
                    <h2>אימות דו-שלבי</h2>
                </div>
                <div class="modal-body">
                    <div class="otp-input-container">
                        <input type="text" id="otpCode" class="form-input" maxlength="6" pattern="[0-9]{6}"
                            placeholder="הזן 6 ספרות" autocomplete="off" inputmode="numeric">
                            <small>הזן את קוד האימות בן 6 הספרות מאפליקציית האימות שלך</small>
                    </div>
                    <div class="otp-error" id="otpError" style="display: none;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="cancelOtpVerification()">ביטול</button>
                    <button type="button" class="btn-primary" id="verifyOtpButton" onclick="verifyOtp()">אמת</button>
                </div>
           </div>
        </div>

        <!-- OTP Setup Container -->
        <div class="modal-overlay" id="otpContainer" style="display: none;">
            <div class="modal-content otp-setup-modal">
                <div class="modal-header">
                    <h2>הגדרת אימות דו-שלבי</h2>
                </div>
                <div class="modal-body">
                    <div id="otpSetupContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="cancelOtpFlow()">ביטול</button>
                </div>
            </div>
        </div>
    </div>

    <script>

        // Autocomplete functionality
        class EntityAutocomplete {
            constructor(inputId, dropdownId, hiddenInputId) {
                this.input = document.getElementById(inputId);
                this.dropdown = document.getElementById(dropdownId);
                this.hiddenInput = document.getElementById(hiddenInputId);
                this.entities = [];
                this.selectedIndex = -1;
                this.selectedEntity = null;
                this.minChars = 3;

                this.init();
            }

            init() {
                // Input events
                this.input.addEventListener('input', () => this.handleInput());
                this.input.addEventListener('focus', () => this.handleFocus());
                this.input.addEventListener('keydown', (e) => this.handleKeyboard(e));

                // Click outside to close
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.autocomplete-container')) {
                        this.hideDropdown();
                    }
                });
            }

            setEntities(entities) {
                this.entities = entities;
                this.renderOptions(entities);
            }

            handleFocus() {
                const searchTerm = this.input.value.trim();

                // Only show dropdown if minimum characters entered
                if (searchTerm.length >= this.minChars) {
                    this.handleInput();
                } else {
                    this.dropdown.innerHTML = `<div class="autocomplete-no-results">הזן לפחות ${this.minChars} תווים לחיפוש</div>`;
                    this.showDropdown();
                }
            }

            handleInput() {
                const searchTerm = this.input.value.trim();

                // ✅ Require minimum characters based on setting
                if (searchTerm.length < this.minChars) {
                    this.dropdown.innerHTML = `<div class="autocomplete-no-results">הזן לפחות ${this.minChars} תווים לחיפוש</div>`;
                    this.showDropdown();
                    return;
                }

                const searchTermLower = searchTerm.toLowerCase();

                const filtered = this.entities.filter(entity =>
                    entity.name.toLowerCase().includes(searchTermLower)
                );

                this.renderOptions(filtered);
                this.showDropdown();
            }

            renderOptions(entities) {
                this.selectedIndex = -1;

                if (entities.length === 0) {
                    this.dropdown.innerHTML = '<div class="autocomplete-no-results">לא נמצאו תוצאות</div>';
                    return;
                }

                this.dropdown.innerHTML = entities.map((entity, index) => `
                    <div class="autocomplete-option" 
                         data-index="${index}" 
                         data-id="${entity.id}"
                         data-name="${entity.name}">
                        ${entity.name}
                    </div>
                `).join('');

                // Add click handlers
                this.dropdown.querySelectorAll('.autocomplete-option').forEach(option => {
                    option.addEventListener('click', () => {
                        this.selectEntity(option.dataset.id, option.dataset.name);
                    });
                });
            }

            handleKeyboard(e) {
                const options = this.dropdown.querySelectorAll('.autocomplete-option');

                if (!options.length) return;

                switch (e.key) {
                    case 'ArrowDown':
                        e.preventDefault();
                        this.selectedIndex = Math.min(this.selectedIndex + 1, options.length - 1);
                        this.highlightOption();
                        break;

                    case 'ArrowUp':
                        e.preventDefault();
                        this.selectedIndex = Math.max(this.selectedIndex - 1, 0);
                        this.highlightOption();
                        break;

                    case 'Enter':
                        e.preventDefault();
                        if (this.selectedIndex >= 0) {
                            const option = options[this.selectedIndex];
                            this.selectEntity(option.dataset.id, option.dataset.name);
                        }
                        break;

                    case 'Escape':
                        this.hideDropdown();
                        break;
                }
            }

            highlightOption() {
                const options = this.dropdown.querySelectorAll('.autocomplete-option');
                options.forEach((opt, idx) => {
                    opt.classList.toggle('highlighted', idx === this.selectedIndex);
                });

                // Scroll into view
                if (this.selectedIndex >= 0) {
                    options[this.selectedIndex].scrollIntoView({ block: 'nearest' });
                }
            }

            selectEntity(id, name) {
                this.selectedEntity = { id, name };
                this.input.value = name;
                this.hiddenInput.value = id;
                this.hideDropdown();

                // Trigger change event
                const event = new CustomEvent('entitySelected', {
                    detail: { id, name }
                });
                this.input.dispatchEvent(event);
            }

            showDropdown() {
                this.dropdown.classList.add('show');
            }

            hideDropdown() {
                this.dropdown.classList.remove('show');
            }

            clear() {
                this.input.value = '';
                this.hiddenInput.value = '';
                this.selectedEntity = null;
                this.renderOptions(this.entities);
            }
        }

        // Initialize autocomplete
        let entityAutocomplete;
        let tempToken = null;

        // Elements
        const entitySelect = document.getElementById('entity');
        const credentialsSection = document.getElementById('credentialsSection');
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');

        // ✅ Initialize config BEFORE loading any data
        document.addEventListener('DOMContentLoaded', async function () {

            // Initialize autocomplete
            entityAutocomplete = new EntityAutocomplete(
                'entityAutocomplete',
                'entityDropdown',
                'entity'
            );

            // Listen for entity selection
            document.getElementById('entityAutocomplete').addEventListener('entitySelected', (e) => {
                handleEntitySelection(e.detail.id);
            });

            //  Auto-focus OTP input and handle input
            const otpInput = document.getElementById('otpCode');
            otpInput.addEventListener('input', (e) => {
                // Only allow digits
                e.target.value = e.target.value.replace(/[^0-9]/g, '');

                // Auto-submit when 6 digits entered
                if (e.target.value.length === 6) {
                    setTimeout(() => verifyOtp(), 300);
                }
            });

            //  Enter key in OTP input
            otpInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && otpInput.value.length === 6) {
                    verifyOtp();
                }
            });


            loadEntities();
            loadSystemVersion();

            // Step 3: Check for error parameters
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');

            if (error === 'session_expired') {
                showError('פג תוקף ההתחברות. אנא התחבר מחדש.');
            }
        });

        // Set entity context for API calls
        function setEntityContext(entityId) {
            // Parse to ensure it's a clean integer string
            const cleanEntityId = parseInt(entityId).toString();

            // Store entity ID for subsequent API calls
            sessionStorage.setItem('selectedEntityId', cleanEntityId);

            console.log('Entity context set:', cleanEntityId);
        }

        // Handle entity selection
        entitySelect.addEventListener('change', function () {
            const selectedEntityId = this.value;

            if (selectedEntityId) {
                // Parse to integer to remove any padding
                const entityIdInt = parseInt(selectedEntityId);
                const entityIdString = entityIdInt.toString();

                console.log('Entity selected:', {
                    originalValue: selectedEntityId,
                    parsedInt: entityIdInt,
                    finalString: entityIdString
                });

                // Update step indicator
                document.getElementById('step1').classList.add('completed');
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');

                // Show credentials section with animation
                credentialsSection.style.display = 'block';
                setTimeout(() => {
                    credentialsSection.classList.add('show');
                }, 100);

                // Enable login button
                loginButton.disabled = false;
                loginButton.textContent = 'התחבר';

                // Set entity context for API calls (use parsed integer)
                setEntityContext(entityIdString);

                // Focus on username field
                setTimeout(() => {
                    document.getElementById('username').focus();
                }, 500);
            } else {
                // Reset steps
                document.getElementById('step1').classList.remove('completed');
                document.getElementById('step1').classList.add('active');
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step3').classList.remove('active');

                // Hide credentials section
                credentialsSection.classList.remove('show');
                setTimeout(() => {
                    credentialsSection.style.display = 'none';
                }, 400);

                loginButton.disabled = true;
                loginButton.textContent = 'בחר ישות תחילה';
            }
        });

        function handleEntitySelection(entityId) {
            const cleanEntityId = parseInt(entityId).toString();

            console.log('Entity selected:', cleanEntityId);

            // Update step indicator
            document.getElementById('step1').classList.add('completed');
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');

            // Show credentials section
            credentialsSection.style.display = 'block';
            setTimeout(() => {
                credentialsSection.classList.add('show');
            }, 100);

            // Enable login button
            loginButton.disabled = false;
            loginButton.textContent = 'התחבר';

            // Store entity context
            sessionStorage.setItem('selectedEntityId', cleanEntityId);

            // Focus username
            setTimeout(() => {
                document.getElementById('username').focus();
            }, 500);
        }

        // Load entities from database
        async function loadEntities() {
            try {
                // Use AppConfig for API URL
                const apiUrl = AppConfig.getApiUrl('entities/login');

                console.log('Loading entities from:', apiUrl);

                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();

                // Check if the response has the expected structure
                const entities = result.data || result;

                if (!entities || !Array.isArray(entities) || entities.length === 0) {
                    console.log('No entities found');

                    return;
                }

                // Set entities in autocomplete
                entityAutocomplete.setEntities(entities);

                console.log('Successfully loaded', entities.length, 'entities from database');
            } catch (error) {
                console.error('Error loading entities:', error);
                showError('שגיאה בטעינת הישויות');

                // Fallback to mock data for testing
                console.log('No data for entities found');

            }
        }




        // Enhance the error display function for better visibility
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';

            // Add subtle animation for better user attention
            errorMessage.style.animation = 'none';
            setTimeout(() => {
                errorMessage.style.animation = 'errorShake 0.5s ease';
            }, 10);
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        // Load system version from database
        async function loadSystemVersion() {
            try {
                // ✅ Get all system attributes and find id=1
                const apiUrl = AppConfig.getApiUrl('systemattributes');
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const attributes = await response.json();

                // Find attribute with id=1 (handle both lowercase and PascalCase)
                const versionAttr = attributes.find(attr =>
                    (attr.id === 1 || attr.Id === 1)
                );

                if (versionAttr) {
                    const version = versionAttr.value || versionAttr.Value || 'Latest';
                    document.getElementById('systemVersion').textContent = version;
                    console.log('System version (id=1) loaded:', version);
                } else {
                    console.log('System version attribute (id=1) not found');
                    document.getElementById('systemVersion').textContent = "Latest";
                }

            } catch (error) {
                console.error('Error loading system version:', error);
                document.getElementById('systemVersion').textContent = "Latest";
            }
        }




        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const entityId = document.getElementById('entity').value;

            if (!username || !password || !entityId) {
                showError('אנא מלא את כל השדות');
                return;
            }

            loginButton.disabled = true;
            loginButton.innerHTML = 'מתחבר... <span class="loading"></span>';
            hideError();

            try {
                document.getElementById('step2').classList.add('completed');
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step3').classList.add('active');

                const loginData = {
                    username: username.trim(),
                    password: password,
                    entityId: parseInt(entityId)
                };

                const response = await fetch(AppConfig.getApiUrl('auth/login'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData)
                });

                const data = await response.json();
                console.log('Login response:', data);

                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('שם משתמש או סיסמה שגויים');
                    } else if (response.status === 400) {
                        throw new Error(data.message || 'נתונים שגויים בטופס');
                    } else {
                        throw new Error(data.message || 'שגיאה בהתחברות');
                    }
                }

                // Check if OTP is required
                if (data.requiresOtpSetup) {
                    console.log('OTP setup required for this user');
                    tempToken = data.tempToken;
                    sessionStorage.setItem('otpTempToken', data.tempToken);
                    showOtpSetupFlow();
                    return;
                }

                if (data.requiresOtp) {
                    console.log('OTP required for this user');
                    tempToken = data.tempToken;
                    sessionStorage.setItem('otpTempToken', data.tempToken);
                    showOtpModal();
                    return;
                }

                // ✅ Standard login success (no OTP or OTP disabled)
                if (data.success && data.token) {
                    sessionStorage.setItem('authToken', data.token);
                    console.log('Login successful, token stored, redirecting to dashboard');
                    window.location.href = 'index.html';
                } else {
                    throw new Error(data.message || 'שגיאה בהתחברות');
                }

            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('step3').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                showError(error.message || 'שם משתמש או סיסמה שגויים. אנא נסה שוב.');

                document.getElementById('password').focus();
                document.getElementById('password').select();
            } finally {
                loginButton.disabled = false;
                loginButton.innerHTML = 'התחבר';
            }
        });

        //Show OTP modal
        function showOtpModal() {
            const modal = document.getElementById('otpModalOverlay');
            modal.style.display = 'flex';

            // Clear and focus OTP input
            const otpInput = document.getElementById('otpCode');
            otpInput.value = '';
            setTimeout(() => otpInput.focus(), 100);

            // Hide any previous errors
            document.getElementById('otpError').style.display = 'none';
        }

        // Hide OTP modal
        function hideOtpModal() {
            document.getElementById('otpModalOverlay').style.display = 'none';
            document.getElementById('otpCode').value = '';
            document.getElementById('otpError').style.display = 'none';
        }

        // Cancel OTP verification
        function cancelOtpVerification() {
            hideOtpModal();
            tempToken = null;

            // Reset steps
            document.getElementById('step3').classList.remove('active');
            document.getElementById('step2').classList.add('active');

            // Focus back to password
            document.getElementById('password').focus();
        }

        // Verify OTP code
        async function verifyOtp() {
            const otpCode = document.getElementById('otpCode').value.trim();
            const otpError = document.getElementById('otpError');
            const verifyButton = document.getElementById('verifyOtpButton');

            // Validate OTP format
            if (!/^\d{6}$/.test(otpCode)) {
                otpError.textContent = 'יש להזין 6 ספרות בדיוק';
                otpError.style.display = 'block';
                return;
            }

            verifyButton.disabled = true;
            verifyButton.textContent = 'מאמת...';
            otpError.style.display = 'none';

            try {
                const response = await fetch(AppConfig.getApiUrl('otp/validate'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        TempToken: tempToken,
                        Code: otpCode
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'קוד אימות שגוי');
                }

                // ✅ OTP verified successfully
                console.log('OTP verified, completing login');
                sessionStorage.setItem('authToken', data.token);

                // Show success briefly before redirect
                otpError.style.display = 'block';
                otpError.style.backgroundColor = '#d4edda';
                otpError.style.borderColor = '#c3e6cb';
                otpError.style.color = '#155724';
                otpError.textContent = '✓ אומת בהצלחה!';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);

            } catch (error) {
                console.error('OTP verification error:', error);
                otpError.textContent = error.message || 'קוד אימות שגוי. אנא נסה שוב.';
                otpError.style.display = 'block';

                // Clear input and focus
                document.getElementById('otpCode').value = '';
                document.getElementById('otpCode').focus();
            } finally {
                verifyButton.disabled = false;
                verifyButton.textContent = 'אמת';
            }
        }

        // Case A: Regular login - no OTP
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('נא למלא שם משתמש וסיסמה');
                return;
            }

            try {
                const response = await fetch(AppConfig.getApiUrl('auth/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Case A: Regular login - no OTP
                    sessionStorage.setItem('authToken', data.token);
                    window.location.href = 'index.html';
                }
                else if (data.requiresOtpSetup) {
                    // Case B: OTP enabled but not set up - show setup flow
                    sessionStorage.setItem('otpTempToken', data.tempToken);
                    showOtpSetupFlow();
                }
                else if (data.requiresOtp) {
                    // Case C: OTP enabled and verified - show code input
                    sessionStorage.setItem('otpTempToken', data.tempToken);
                    showOtpCodeInput();
                }
                else {
                    alert(data.message || 'שגיאת התחברות');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('שגיאה בהתחברות למערכת');
            }
        }

        // Case B: Show OTP Setup Flow (QR code scanning)
        function showOtpSetupFlow() {
            hideLoginForm();

            const container = document.getElementById('otpContainer');
            container.innerHTML = `
        <div class="otp-setup-container">
            <h2>הגדרת אימות דו-שלבי</h2>
            <p>אנא סרוק את קוד ה-QR באמצעית אפליקציית אימות:</p>
            
            <div id="qrCodeDisplay" style="text-align: center; margin: 20px 0;">
                <div class="loading-spinner">טוען QR...</div>
            </div>
            
            <div class="form-group">
                <label>או הזן את הקוד הבא באופן ידני:</label>
                <div class="secret-code">
                    <code id="manualSecret"></code>
                </div>
            </div>
            
            <div class="form-group">
                <label>הזן קוד אימות מהאפליקציה לאימות ההגדרה:</label>
                <input type="text" id="setupOtpCode" class="form-input" maxlength="6" pattern="[0-9]*" 
                       placeholder="הזן 6 ספרות" autocomplete="off">
            </div>
            
            <button onclick="verifyOtpSetup()" class="btn-primary">אמת והמשך</button>
            <button onclick="cancelOtpFlow()" class="btn-secondary">ביטול</button>
        </div>
    `;
            container.style.display = 'block';

            // Load QR code
            loadOtpSetupQr();
        }

        async function loadOtpSetupQr() {
            const tempToken = sessionStorage.getItem('otpTempToken');

            try {
                const response = await fetch(AppConfig.getApiUrl('otp/setup'), {
                    headers: { 'Authorization': `Bearer ${tempToken}` }
                });

                const data = await response.json();

                // Display QR code
                document.getElementById('qrCodeDisplay').innerHTML =
                    `<img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(data.qrCodeUrl)}" 
                  alt="QR Code" style="border: 2px solid #ccc; padding: 10px;">`;

                // Display manual secret
                document.getElementById('manualSecret').textContent = data.secret;
            } catch (error) {
                console.error('Error loading QR code:', error);
                document.getElementById('qrCodeDisplay').innerHTML =
                    '<p style="color: red;">שגיאה בטעינת QR</p>';
            }
        }

        async function verifyOtpSetup() {
            const code = document.getElementById('setupOtpCode').value.trim();
            const tempToken = sessionStorage.getItem('otpTempToken');

            if (code.length !== 6 || !/^\d+$/.test(code)) {
                alert('אנא הזן קוד בן 6 ספרות');
                return;
            }

            try {
                const response = await fetch(AppConfig.getApiUrl('otp/verify-setup'), {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${tempToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code })
                });

                const result = await response.json();

                if (result.success) {
                    alert('✅ אימות דו-שלבי הוגדר בהצלחה!');
                    // Now complete login with OTP
                    completeOtpLogin(code);
                } else {
                    alert('❌ קוד שגוי, נסה שוב');
                    document.getElementById('setupOtpCode').value = '';
                    document.getElementById('setupOtpCode').focus();
                }
            } catch (error) {
                console.error('Error verifying setup:', error);
                alert('שגיאה באימות הקוד');
            }
        }

        // Case C: Show OTP Code Input (user already has OTP set up)
        function showOtpCodeInput() {
            hideLoginForm();

            const container = document.getElementById('otpContainer');
            container.innerHTML = `
        <div class="otp-verify-container">
            <h2>אימות דו-שלבי</h2>
            <p>הזן את קוד האימות מהאפליקציה שלך:</p>
            
            <div class="form-group">
                <input type="text" id="otpCode" maxlength="6" pattern="[0-9]*" 
                       placeholder="123456" autocomplete="off" autofocus>
            </div>
            
            <button onclick="submitOtpCode()" class="btn-primary">אמת</button>
            <button onclick="cancelOtpFlow()" class="btn-secondary">ביטול</button>
        </div>
    `;
            container.style.display = 'block';

            // Auto-focus input
            setTimeout(() => document.getElementById('otpCode').focus(), 100);
        }

        async function submitOtpCode() {
            const code = document.getElementById('otpCode').value.trim();

            if (code.length !== 6 || !/^\d+$/.test(code)) {
                alert('אנא הזן קוד בן 6 ספרות');
                return;
            }

            completeOtpLogin(code);
        }

        async function completeOtpLogin(code) {
            const tempToken = sessionStorage.getItem('otpTempToken');

            try {
                const response = await fetch(AppConfig.getApiUrl('otp/validate'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tempToken, code })
                });

                const result = await response.json();

                if (result.success) {
                    sessionStorage.setItem('authToken', result.token);
                    sessionStorage.removeItem('otpTempToken');
                    window.location.href = 'index.html';
                } else {
                    alert('❌ קוד שגוי');
                    if (document.getElementById('otpCode')) {
                        document.getElementById('otpCode').value = '';
                        document.getElementById('otpCode').focus();
                    }
                }
            } catch (error) {
                console.error('Error validating OTP:', error);
                alert('שגיאה באימות הקוד');
            }
        }

        function cancelOtpFlow() {
            sessionStorage.removeItem('otpTempToken');
            location.reload();
        }

        function hideLoginForm() {
            document.getElementById('loginForm').style.display = 'none';
        }
    </script>
</body>

</html>
