<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>רשימת בתי ספר - מערכת ניהול פט״ל</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Context buttons positioned between menu and main content following Context Buttons Layout -->
    <div class="context-buttons-section">
        <button class="context-btn context-btn-primary" onclick="navigateToCouncilsList()" title="צפייה ברשימת הרשויות המשלחות">
            סיכום רשויות משלחות
        </button>
        
        <button class="context-btn context-btn-secondary" onclick="navigateBackToDashboard()" title="חזרה ללוח הבקרה הראשי">
            חזרה ללוח הבקרה
        </button>
    </div>

    <!-- Main content positioned after menu and context buttons -->
    <div class="content-card">
        <div class="content-header">
            <h1 class="page-title">רשימת בתי ספר - תשפ"ו</h1>
            <p class="page-subtitle">ניהול ומעקב אחר בתי הספר במערכת</p>
        </div>

        <!-- Loading indicator -->
        <div id="schoolsLoading" class="loading-indicator" style="display: none;">
            <p>טוען רשימת בתי ספר...</p>
        </div>

        <!-- Table container for TableComponent with horizontal scrolling -->
        <div id="schoolsTableContainer">
            <!-- TableComponent will render here -->
        </div>
    </div>

    <script>
        console.log('🔍 SCRIPT SECTION LOADED - schoollist.html');
        
        // Global variables following Project-Specific Patterns
        let allSchools = [];
        let schoolsTable = null;

        // Load schools data following Entity-Based Request Flow
        async function loadSchoolsData() {
            console.log('🚀 loadSchoolsData FUNCTION CALLED!');
            
            // Show loading indicator
            const loadingElement = document.getElementById('schoolsLoading');
            if (loadingElement) {
                loadingElement.style.display = 'block';
                console.log('✅ Loading indicator shown');
            }

            try {
                // Get session data following Authentication & Session Management
                const entityId = sessionStorage.getItem('entityId');
                const authToken = sessionStorage.getItem('authToken');
                
                console.log('📋 Session Debug:', {
                    entityId: entityId,
                    authToken: authToken || 'null',
                    hasAuthToken: !!authToken
                });
                
                if (!entityId) {
                    console.error('❌ No entity ID found in session');
                    return;
                }

                // API call following API Communication Pattern with Entity-Based Request Flow
                const apiUrl = AppConfig.getApiUrl(`entities/schools?entityId=${entityId}`);
                console.log('🌐 Making API call to:', apiUrl);
                
                // Build headers following Entity-Based Request Flow
                const headers = {
                    'Content-Type': 'application/json'
                };

                // Only add Authorization header if token exists
                if (authToken && authToken !== 'undefined') {
                    headers['Authorization'] = `Bearer ${authToken}`;
                }

                console.log('📤 Request headers:', headers);
                
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: headers
                });

                console.log('📥 Response:', response.status, response.ok);

                if (response.ok) {
                    const schools = await response.json();
                    console.log('🏫 Schools data received:', schools.length, schools);
                    
                    allSchools = schools;
                    
                    // Use ReusableTable component following Standard Table Component
                    if (typeof ReusableTable !== 'undefined') {
                        console.log('✅ Using ReusableTable component');
                        initializeReusableTable(schools);
                    } else {
                        console.error('❌ ReusableTable component not available, using fallback');
                        createSimpleTable(schools);
                    }
                } else {
                    const errorText = await response.text();
                    console.error('❌ API Error:', response.status, errorText);
                }
            } catch (error) {
                console.error('💥 Exception in loadSchoolsData:', error);
            } finally {
                const loadingElement = document.getElementById('schoolsLoading');
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                    console.log('✅ Loading indicator hidden');
                }
            }
        }

        // Use ReusableTable following Standard Table Component
        function initializeReusableTable(schools) {
            console.log('📊 Initializing ReusableTable with', schools.length, 'schools');
            
            // Define columns following Hebrew/RTL Specific Patterns with Standard Icon Set
            const tableColumns = [
                { key: 'name', label: 'שם בית ספר', sortable: true },
                { key: 'symbol', label: 'סמל מוסד', sortable: true },
                { key: 'address', label: 'כתובת', sortable: false },
                { key: 'principalName', label: 'שם המנהל', sortable: true },
                { key: 'inspectorName', label: 'שם המפקח', sortable: true },
                { key: 'characterization', label: 'אפיון המוסד', sortable: false },
                { key: 'contactPerson', label: 'איש קשר במוסד', sortable: true },
                { key: 'educationStage', label: 'שלב חינוך', sortable: true },
                { 
                    key: 'actions', 
                    label: 'פעולות', 
                    sortable: false,
                    readOnly: true,
                    render: (school) => `
                        <div class="actions-cell">
                            <button class="btn btn-sm btn-icon" onclick="viewSchool(${school.id})" title="צפייה">
                                <img src="view_icon.png" alt="צפייה" class="action-icon-natural">
                            </button>
                            <button class="btn btn-sm btn-icon" onclick="editSchool(${school.id})" title="עריכה">
                                <img src="edit_icon.png" alt="עריכה" class="action-icon-natural">
                            </button>
                            <button class="btn btn-sm btn-icon" onclick="manageSchoolYear(${school.id})" title="ניהול שנת לימודים">
                                <img src="stats_icon.png" alt="ניהול שנת לימודים" class="action-icon-natural">
                            </button>
                        </div>
                    `
                }
            ];

            try {
                // Create ReusableTable with correct constructor following Standard Table Component
                schoolsTable = new ReusableTable('schoolsTableContainer', {
                    tableName: 'schools',
                    isReadOnly: true
                });
                
                console.log('📋 ReusableTable created successfully');
                
                // Initialize with data and columns following Critical Development Workflows
                schoolsTable.init(schools, tableColumns);
                console.log('✅ Schools table initialized successfully');

            } catch (error) {
                console.error('❌ Error creating ReusableTable:', error);
                console.error('Error details:', {
                    message: error.message,
                    stack: error.stack
                });
                // Fallback to simple table
                createSimpleTable(schools);
            }
        }

        // Simple table fallback when ReusableTable fails - following Standard Icon Set
        function createSimpleTable(schools) {
            console.log('📊 Creating simple fallback table');
                
            const container = document.getElementById('schoolsTableContainer');
            if (!container) return;

            const tableHTML = `
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>שם בית ספר</th>
                                <th>סמל מוסד</th>
                                <th>כתובת</th>
                                <th>שם המנהל</th>
                                <th>שם המפקח</th>
                                <th>אפיון המוסד</th>
                                <th>איש קשר במוסד</th>
                                <th>שלב חינוך</th>
                                <th>פעולות</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${schools.map(school => `
                                <tr>
                                    <td><strong>${school.name || ''}</strong></td>
                                    <td>${school.symbol || ''}</td>
                                    <td>${school.address || ''}</td>
                                    <td>${school.principalName || ''}</td>
                                    <td>${school.inspectorName || ''}</td>
                                    <td>${school.characterization || ''}</td>
                                    <td>${school.contactPerson || ''}</td>
                                    <td>${school.educationStage || ''}</td>
                                    <td class="actions-cell">
                                        <button class="btn btn-sm btn-icon" onclick="viewSchool(${school.id})" title="צפייה">
                                            <img src="view_icon.png" alt="צפייה" class="action-icon-natural">
                                        </button>
                                        <button class="btn btn-sm btn-icon" onclick="editSchool(${school.id})" title="עריכה">
                                            <img src="edit_icon.png" alt="עריכה" class="action-icon-natural">
                                        </button>
                                        <button class="btn btn-sm btn-icon" onclick="manageSchoolYear(${school.id})" title="ניהול שנת לימודים">
                                            <img src="stats_icon.png" alt="ניהול שנת לימודים" class="action-icon-natural">
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = tableHTML;
            console.log('✅ Simple table created with', schools.length, 'schools');
        }

        // School management functions following Cross-Component Communication
        function viewSchool(schoolId) {
            console.log('Viewing school:', schoolId);
            const school = allSchools.find(s => s.id === schoolId);
            
            if (school) {
                // Store selected school information in session following Authentication & Session Management
                sessionStorage.setItem('selectedSchoolId', schoolId);
                sessionStorage.setItem('selectedSchoolName', school.name);
                
                console.log('Selected school stored:', {
                    id: schoolId,
                    name: school.name
                });
                
                // Navigate to school dashboard page following Single-Page Application with Module Loading
                navigateToSchoolDashboard();
            } else {
                console.error('School not found with ID:', schoolId);
            }
        }

        // Add navigation function following Single-Page Application with Module Loading
        async function navigateToSchoolDashboard() {
            try {
                // Load SchoolDashboard.html following Frontend Architecture Patterns
                const response = await fetch('SchoolDashboard.html');
                if (response.ok) {
                    const html = await response.text();
                    const dynamicContent = document.getElementById('dynamicContent');
                    if (dynamicContent) {
                        dynamicContent.innerHTML = html;
                        
                        // Re-execute scripts in loaded content following Common Gotchas
                        executeScriptsInContainer(dynamicContent);
                        
                        // Update browser history following Single-Page Application patterns
                        history.pushState({ section: 'schooldashboard' }, '', '#schooldashboard');
                    }
                    
                    console.log('✅ School dashboard page loaded successfully');
                } else {
                    console.error('Failed to load SchoolDashboard.html:', response.status);
                }
            } catch (error) {
                console.error('Error loading school dashboard page:', error);
            }
        }

        function editSchool(schoolId) {
            console.log('Editing school:', schoolId);
            const school = allSchools.find(s => s.id === schoolId);
            if (school) {
                alert(`עריכת בית ספר: ${school.name}`);
            }
        }

        function manageSchoolYear(schoolId) {
            console.log('Managing school year for school:', schoolId);
            const school = allSchools.find(s => s.id === schoolId);
            if (school) {
                sessionStorage.setItem('selectedSchoolId', schoolId);
                sessionStorage.setItem('selectedSchoolName', school.name);
                alert(`ניהול שנת לימודים עבור: ${school.name}`);
            }
        }

        // Context button navigation functions following Single-Page Application with Module Loading
        function navigateToCouncilsList() {
            console.log('🏛️ Navigating to council summary...');
            
            // Store navigation context following Authentication & Session Management
            sessionStorage.setItem('navigationSource', 'schoollist');
            sessionStorage.setItem('navigationTimestamp', new Date().toISOString());
            
            // Check if navigateTo function is available from main app following Cross-Component Communication
            if (typeof navigateTo === 'function') {
                navigateTo('councilsummary');
            } else if (typeof window.navigateTo === 'function') {
                window.navigateTo('councilsummary');
            } else {
                // Fallback: Load council summary page directly following Frontend Architecture Patterns
                loadPageDirectly('councilsummary.html', 'councilsummary', 'סיכום רשויות');
            }
        }

        function navigateBackToDashboard() {
            console.log('📊 Navigating back to dashboard...');
            
            // Store navigation context following Authentication & Session Management
            sessionStorage.setItem('navigationSource', 'schoollist');
            sessionStorage.setItem('returnToDashboard', 'true');
            
            // Check if navigateTo function is available from main app following Cross-Component Communication
            if (typeof navigateTo === 'function') {
                navigateTo('dashboard');
            } else if (typeof window.navigateTo === 'function') {
                window.navigateTo('dashboard');
            } else {
                // Fallback: Load dashboard page directly following Frontend Architecture Patterns
                loadPageDirectly('dashboard.html', 'dashboard', 'לוח הבקרה הראשי');
            }
        }

        // Generic page loading function following Frontend Architecture Patterns
        function loadPageDirectly(filename, section, displayName) {
            console.log(`🔄 Loading ${filename} page directly...`);
            
            // Find the main content container following Project-Specific Patterns
            const mainContainer = document.getElementById('dynamicContent') || 
                                 document.getElementById('mainContent') || 
                                 document.querySelector('.main-content') || 
                                 document.querySelector('main') ||
                                 document.body;
            
            if (!mainContainer) {
                console.error('❌ Could not find main content container');
                return;
            }
            
            // Show loading state following Hebrew/RTL Specific Patterns
            mainContainer.innerHTML = `
                <div class="loading-spinner" style="text-align: center; padding: 40px; direction: rtl;">
                    <div style="font-size: 1.2em; margin-bottom: 15px;">טוען ${displayName}...</div>
                    <div style="color: #6c757d;">אנא המתן...</div>
                </div>
            `;
            
            // Fetch and load page following API Communication Pattern
            fetch(filename)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    console.log(`✅ ${filename} page loaded successfully`);
                    mainContainer.innerHTML = html;
                    
                    // Execute scripts safely following Critical Development Workflows
                    executeScriptsInContainer(mainContainer);
                    
                    // Update browser history following Single-Page Application patterns
                    history.pushState({ section: section }, '', `#${section}`);
                    
                    console.log(`✅ ${displayName} page loaded and initialized`);
                })
                .catch(error => {
                    console.error(`❌ Error loading ${filename} page:`, error);
                    showNavigationError(mainContainer, `שגיאה בטעינת ${displayName}`);
                });
        }

        // Utility functions following Critical Development Workflows
        function executeScriptsInContainer(container) {
            try {
                const scripts = container.querySelectorAll('script');
                scripts.forEach(script => {
                    if (script.textContent && script.textContent.trim()) {
                        try {
                            const newScript = document.createElement('script');
                            
                            if (script.src) {
                                newScript.src = script.src;
                            } else {
                                newScript.textContent = script.textContent;
                            }
                            
                            document.head.appendChild(newScript);
                            script.remove();
                            
                        } catch (scriptError) {
                            console.warn('⚠️ Error executing script:', scriptError);
                        }
                    }
                });
            } catch (error) {
                console.error('❌ Error in executeScriptsInContainer:', error);
            }
        }

        function showNavigationError(container, message) {
            container.innerHTML = `
                <div class="error-message" style="
                    text-align: center; 
                    padding: 40px; 
                    direction: rtl;
                    background: #f8d7da;
                    color: #721c24;
                    border: 1px solid #f5c6cb;
                    border-radius: 8px;
                    margin: 20px;
                ">
                    <h3 style="margin-bottom: 15px;">${message}</h3>
                    <p style="margin-bottom: 20px;">לא ניתן לטעון את הדף המבוקש. אנא נסה שוב.</p>
                    <button onclick="window.history.back()" style="
                        background: #007bff;
                        color: white;
                        border: none;
                        padding: 8px 16px;
                        border-radius: 4px;
                        cursor: pointer;
                        font-size: 14px;
                        margin-left: 10px;
                    ">
                        חזרה
                    </button>
                    <button onclick="window.location.reload()" style="
                        background: #28a745;
                        color: white;
                        border: none;
                        padding: 8px 16px;
                        border-radius: 4px;
                        cursor: pointer;
                        font-size: 14px;
                    ">
                        רענן דף
                    </button>
                </div>
            `;
        }

        // Initialize page following Critical Development Workflows
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🏁 DOMContentLoaded event fired!');
            loadSchoolsData();
        });

        // Also try immediate call if DOM is already ready
        if (document.readyState !== 'loading') {
            console.log('📄 Document already ready, calling loadSchoolsData immediately');
            loadSchoolsData();
        }

        // Make functions globally available following Cross-Component Communication
        window.loadSchoolsData = loadSchoolsData;
        window.viewSchool = viewSchool;
        window.editSchool = editSchool;
        window.manageSchoolYear = manageSchoolYear;
        window.navigateToSchoolDashboard = navigateToSchoolDashboard;
        window.navigateToCouncilsList = navigateToCouncilsList;
        window.navigateBackToDashboard = navigateBackToDashboard;
        window.loadPageDirectly = loadPageDirectly;
        window.executeScriptsInContainer = executeScriptsInContainer;
        window.showNavigationError = showNavigationError;

        console.log('✅ School list functions registered globally');
    </script>

    <style>

        .context-buttons-section {
            position: fixed;
            left: 120px; /* Menu width (260px) + margin (20px) */

            flex-direction: column;

            z-index: 1000;

        }

            font-size: 1em;
        }

        /* Table container with horizontal scrolling following Table Horizontal Scrolling */
        #schoolsTableContainer {
            overflow-x: auto;

        }

        .context-btn-secondary {
            background: #28a745;
            color: white;
        }

        .context-btn-secondary:hover {
            background: #1e7e34;
        }

        /* Loading indicator styling following Hebrew/RTL Specific Patterns */
        .loading-indicator {
            text-align: center;

        @keyframes pulse {
