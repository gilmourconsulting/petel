</head>
<body>
    <div class="app-container">

        <div class="top-bar">
            <!-- Left Side: System Logo and Info -->
            <div class="top-bar-left">

                </div>
            </div>
            
            <!-- Right Side: Entity Info and Current User -->
            <div class="top-bar-right">

                    <div class="entity-info">
                        <div class="entity-name" id="entityName">שם הישות</div>

                </div>
                
                <div class="user-section">

    <script>
        // Replace the DOMContentLoaded event handler in index.html following Frontend Architecture Patterns:

document.addEventListener('DOMContentLoaded', function() {
    fetch('menu.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('sideMenuContainer').innerHTML = html;
        })
        .catch(err => {
            console.error('Failed to load menu:', err);
        });

    // Initialize page following Critical Development Workflows
    setTimeout(async function() {
        loadUserInfo();
        
        // Load main dashboard by default following Frontend Architecture Patterns
        await loadMainDashboard();
        
        // Set initial history state
        if (!history.state) {
            history.replaceState({page: 'maindashboard'}, '', '#maindashboard');
        }
    }, 100);
});

// Add new function to load main dashboard following SPA patterns
async function loadMainDashboard() {
    try {
        console.log('Loading main dashboard...');
        
        const response = await fetch('maindashboard.html');
        if (response.ok) {
            const html = await response.text();
            document.getElementById('dynamicContent').innerHTML = html;
            
            // Re-execute scripts following Common Gotchas pattern
            executeScriptsInContainer(document.getElementById('dynamicContent'));
            
            console.log('✅ Main dashboard loaded successfully');
        } else {
            console.error('Failed to load maindashboard.html:', response.status);
            document.getElementById('dynamicContent').innerHTML = 
                '<div class="error-message">שגיאה בטעינת המסך הראשי</div>';
        }
    } catch (error) {
        console.error('Error loading main dashboard:', error);
        document.getElementById('dynamicContent').innerHTML = 
            '<div class="error-message">שגיאה בטעינת המסך הראשי</div>';
    }
}

// Update navigation functions following Cross-Component Communication
function navigateToMainDashboard() {
    loadMainDashboard();
    history.pushState({ section: 'maindashboard' }, '', '#maindashboard');
}

// Update browser back/forward handling following SPA pattern
window.addEventListener('popstate', function(event) {
    if (event.state && event.state.section) {
        switch(event.state.section) {
            case 'maindashboard':
                loadMainDashboard();
                break;
            case 'schoollist':
                loadSchoolListPage();
                break;
            case 'schoolyear':
                loadSchoolYearPage();
                break;
            case 'students':
                loadStudentsPage();
                break;
            default:
                loadMainDashboard();
        }
    }
});

// Load user information from session storage following Authentication & Session Management
function loadUserInfo() {
    console.log('=== loadUserInfo started ===');
    
    const userFullName = sessionStorage.getItem('userFullName');
    const entityName = sessionStorage.getItem('entityName'); // Changed from tenantName
    const entityTypeName = sessionStorage.getItem('entityTypeName');
    const entityId = sessionStorage.getItem('entityId'); // Changed from tenantId
    const userEmail = sessionStorage.getItem('userEmail');
    const entityTypeId = sessionStorage.getItem('entityTypeId');
    
    console.log('Session storage values:');
    console.log('userFullName:', userFullName);
    console.log('entityName:', entityName); // Changed from tenantName
    console.log('entityTypeName:', entityTypeName);
    console.log('entityTypeId:', entityTypeId);
    console.log('entityId:', entityId); // Changed from tenantId
    
    // Use fallback values
    const finalUserName = userFullName || 'משתמש לא זוהה';
    const finalEntityName = entityName || 'ישות לא זוהתה'; // Changed from tenantName
    const finalEntityTypeName = entityTypeName || 'מוסד חינוכי';
    
    // Set user and entity display
    const userNameElement = document.getElementById('userName');
    const entityNameElement = document.getElementById('entityName');
    const entityTypeElement = document.getElementById('entityType');
    const userRoleElement = document.getElementById('userRole');
    
    if (userNameElement) {
        userNameElement.textContent = finalUserName;
    }
    
    if (entityNameElement) {
        entityNameElement.textContent = finalEntityName; // Changed from finalTenantName
    }
    
    if (entityTypeElement) {
        entityTypeElement.textContent = finalEntityTypeName;
    }
    
    if (userRoleElement) {
        userRoleElement.textContent = 'משתמש מערכת';
    }
    
    // Load entity logo
    loadEntityLogo();
    
    console.log('=== loadUserInfo completed with entity type:', finalEntityTypeName, '===');
}

// Helper functions for entity type checks following Project-Specific Patterns
function getCurrentEntityTypeId() {
    return parseInt(sessionStorage.getItem('entityTypeId')) || 0;
}

function getCurrentEntityTypeName() {
    return sessionStorage.getItem('entityTypeName') || 'לא ידוע';
}

function isMultiSchoolNetwork() {
    return getCurrentEntityTypeId() === 5;
}

// Load entity logo following Hebrew/RTL Specific Patterns
function loadEntityLogo() {
    const entityId = sessionStorage.getItem('entityId'); // Changed from tenantId
    if (entityId) {
        // Show different icons based on entity type
        const entityTypes = ['🏫', '🏢', '🏛️', '🏥', '🏪'];
        const randomIcon = entityTypes[Math.floor(Math.random() * entityTypes.length)];
        document.getElementById('entityLogo').textContent = randomIcon;
    }
}

// Load system attributes following API Communication Pattern
function loadSystemAttributes() {
    const container = document.getElementById('systemAttributesTable');
    if (!container) return;
    
    container.innerHTML = '<p style="color: #666;">טוען נתונים...</p>';
    
    fetch(AppConfig.getApiUrl('systemAttributes'))
        .then(response => response.json())
        .then(data => {
            if (data && data.length > 0) {
                const table = document.createElement('table');
                table.className = 'attributes-table';
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>שם</th>
                            <th>תיאור</th>
                            <th>ערך</th>
                            <th>סוג ערך</th>
                            <th>מזהה חיצוני</th>
                            <th>עודכן לאחרונה</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(attr => `
                            <tr>
                                <td><strong>${attr.name || ''}</strong></td>
                                <td>${attr.description || ''}</td>
                                <td>${attr.value || ''}</td>
                                <td>${attr.valueType || ''}</td>
                                <td>${attr.foreignId || ''}</td>
                                <td>${attr.updatedAt ? new Date(attr.updatedAt).toLocaleString('he-IL') : ''}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                `;
                container.innerHTML = '';
                container.appendChild(table);
            } else {
                container.innerHTML = '<div class="attributes-empty">אין מאפייני מערכת זמינים</div>';
            }
        })
        .catch(error => {
            console.error('Error loading system attributes:', error);
            container.innerHTML = '<p style="color:red; text-align: center;">שגיאה בטעינת מאפייני מערכת.</p>';
        });
}

// Toggle side menu following Frontend Architecture Patterns
function toggleMenu() {
    const sideMenu = document.getElementById('sideMenu');
    if (!sideMenu) return;
    
    console.log('Toggling menu. Current state:', sideMenu.classList.contains('collapsed'));
    
    if (sideMenu.classList.contains('collapsed')) {
        sideMenu.classList.remove('collapsed');
        console.log('Menu expanded');
    } else {
        sideMenu.classList.add('collapsed');
        console.log('Menu collapsed');
    }
}

// Logout function following Authentication & Session Management
function logout() {
    // Clear session storage
    sessionStorage.clear();
    
    // Redirect to login page
    window.location.href = 'login.html';
}

// Execute scripts in dynamically loaded content following Common Gotchas
function executeScriptsInContainer(container) {
    const scripts = container.querySelectorAll('script');
    scripts.forEach(script => {
        const newScript = document.createElement('script');
        if (script.src) {
            newScript.src = script.src;
        } else {
            newScript.textContent = script.textContent;
        }
        script.parentNode.replaceChild(newScript, script);
    });
}

// Load school list page following Single-Page Application with Module Loading
async function loadSchoolListPage() {
    try {
        console.log('Loading school list page...');
        
        const response = await fetch('schoollist.html');
        if (response.ok) {
            const html = await response.text();
            document.getElementById('dynamicContent').innerHTML = html;
            
            // Re-execute scripts following Common Gotchas pattern
            executeScriptsInContainer(document.getElementById('dynamicContent'));
            
            // Update browser history
            history.pushState({ section: 'schoollist' }, '', '#schoollist');
            
            console.log('✅ School list page loaded successfully');
        } else {
            console.error('Failed to load schoollist.html:', response.status);
        }
    } catch (error) {
        console.error('Error loading school list page:', error);
    }
}

// Make functions globally available following Cross-Component Communication
window.loadMainDashboard = loadMainDashboard;
