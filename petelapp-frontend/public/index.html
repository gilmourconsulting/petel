<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול - עמוד ראשי</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <!-- Left Side: System Logo and Info -->
            <div class="top-bar-left">
                <div class="system-logo-section">
                    <div class="system-logo">
                        <img src="petel_logo.png" alt="לוגו המערכת" />
                    </div>
                    <div class="system-info">
                        <div class="app-title">מערכת ניהול</div>
                    </div>
                </div>
            </div>
            
            <!-- Right Side: Entity Info and Current User -->
            <div class="top-bar-right">
                <div class="entity-section">
                    <div class="entity-logo" id="entityLogo">🏢</div>
                    <div class="entity-info">
                        <div class="entity-name" id="entityName">שם הישות</div>
                        <div class="entity-type" id="entityType">סוג הישות</div>
                    </div>
                </div>
                
                <div class="user-section">
                    <div class="user-name" id="userName">שם המשתמש</div>
                    <div class="user-role" id="userRole">תפקיד</div>
                </div>
                
                <button class="logout-btn" onclick="logout()">יציאה</button>
            </div>
        </div>

        <!-- Main Container -->
        <div class="main-container">
            <!-- Collapsible Side Menu - Operational Area -->
            <div id="sideMenuContainer"></div>

            <!-- Main Content Area -->
            <div class="main-content">
                <div class="content-header">
                    <h1 class="page-title" id="pageTitle">עמוד ראשי</h1>
                    <p class="page-subtitle" id="pageSubtitle">ברוכים הבאים למערכת הניהול</p>
                </div>

                <!-- Dashboard Content -->
                <div id="dashboardContent">
                    <div class="dashboard-flex-row">

                        <!-- Dashboard cards (now on the right in RTL) -->
                        <div class="dashboard-grid">
                            <div class="dashboard-card">
                                <div class="dashboard-card-icon">👥</div>
                                <div class="dashboard-card-title">משתמשים פעילים</div>
                                <div class="dashboard-card-value" id="activeUsers">-</div>
                            </div>
                            <div class="dashboard-card">
                                <div class="dashboard-card-icon">📋</div>
                                <div class="dashboard-card-title">משימות פתוחות</div>
                                <div class="dashboard-card-value" id="openTasks">-</div>
                            </div>
                            <div class="dashboard-card">
                                <div class="dashboard-card-icon">📊</div>
                                <div class="dashboard-card-title">דוחות השבוע</div>
                                <div class="dashboard-card-value" id="weeklyReports">-</div>
                            </div>
                            <div class="dashboard-card">
                                <div class="dashboard-card-icon">🔔</div>
                                <div class="dashboard-card-title">התראות חדשות</div>
                                <div class="dashboard-card-value" id="notifications">-</div>
                            </div>
                        </div>
                                                <div class="context-buttons-section">
                            <button class="context-btn" onclick="showSchoolYear('current')">שנה נוכחית</button>
                            <button class="context-btn" onclick="showSchoolYear('previous')">שנה קודמת</button>
                            <button class="context-btn" onclick="showSchoolYear('next')">שנה הבאה</button>
                        </div>
                    </div>
                        <!-- Context Buttons Section (now on the left of dashboard cards) -->

                    <div class="content-card">
                        <h2 style="margin-bottom: 20px; color: #333;">פעילות אחרונה</h2>
                        <div id="recentActivity">
                            <p style="color: #666; text-align: center; padding: 40px;">טוען נתונים...</p>
                        </div>
                    </div>

                    <div class="content-card">
                        <div class="form-footer" style="text-align: center; color: #666; font-size: 12px;">
                            מערכת ניהול - גרסה <span id="systemVersion">טוען...</span>
                        </div>
                    </div>
                </div>

                <!-- Other page content will be loaded here -->
                <div id="dynamicContent" style="display: none;">
                    <div class="content-card">
                        <h2 style="margin-bottom: 20px; color: #333;">תוכן דינמי</h2>
                        <p style="color: #666;">תוכן העמוד ייטען כאן בהתאם לבחירה בתפריט</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load the menu HTML from a separate file
        document.addEventListener('DOMContentLoaded', function() {
            fetch('menu.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('sideMenuContainer').innerHTML = html;
                })
                .catch(err => {
                    console.error('Failed to load menu:', err);
                });

            // Initialize page
            setTimeout(function() {
                loadUserInfo();
                loadSystemVersion();
                loadDashboardData();
            }, 100);
        });

        // Load user information from session storage
        function loadUserInfo() {
            console.log('=== loadUserInfo started ===');
            
            const userFullName = sessionStorage.getItem('userFullName');
            const tenantName = sessionStorage.getItem('tenantName');
            const tenantId = sessionStorage.getItem('tenantId');
            const userEmail = sessionStorage.getItem('userEmail');
            
            console.log('Raw values from sessionStorage:');
            console.log('userFullName:', userFullName);
            console.log('tenantName:', tenantName);
            console.log('tenantId:', tenantId);
            console.log('userEmail:', userEmail);
            
            // Use fallback values and log when using them
            const finalUserName = userFullName || 'משתמש לא זוהה';
            const finalTenantName = tenantName || 'ישות לא זוהתה';
            
            if (!userFullName) console.warn('userFullName is missing, using fallback');
            if (!tenantName) console.warn('tenantName is missing, using fallback');
            
            console.log('Final values to display:');
            console.log('finalUserName:', finalUserName);
            console.log('finalTenantName:', finalTenantName);
            
            // Set user and entity display
            const userNameElement = document.getElementById('userName');
            const entityNameElement = document.getElementById('entityName');
            const userRoleElement = document.getElementById('userRole');
            
            console.log('DOM elements found:');
            console.log('userNameElement:', userNameElement);
            console.log('entityNameElement:', entityNameElement);
            console.log('userRoleElement:', userRoleElement);
            
            if (userNameElement) {
                userNameElement.textContent = finalUserName;
                console.log('Set userName element to:', finalUserName);
            } else {
                console.error('userName element not found!');
            }
            
            if (entityNameElement) {
                entityNameElement.textContent = finalTenantName;
                console.log('Set entityName element to:', finalTenantName);
            } else {
                console.error('entityName element not found!');
            }
            
            if (userRoleElement) {
                userRoleElement.textContent = 'משתמש מערכת';
                console.log('Set userRole element');
            } else {
                console.error('userRole element not found!');
            }
            
            // Load entity type description from database or set default
            loadEntityTypeDescription(tenantId);
            
            // Try to load entity logo if available
            loadEntityLogo();
            
            console.log('=== loadUserInfo completed ===');
        }

        // Load entity type description
        async function loadEntityTypeDescription(tenantId) {
            try {
                if (tenantId) {
                    const response = await fetch(`http://localhost:5082/api/entities/${tenantId}`);
                    if (response.ok) {
                        const entityData = await response.json();
                        document.getElementById('entityType').textContent = entityData.entityTypeName || 'מוסד חינוכי';
                    } else {
                        document.getElementById('entityType').textContent = 'מוסד חינוכי';
                    }
                } else {
                    document.getElementById('entityType').textContent = 'מוסד חינוכי';
                }
            } catch (error) {
                console.log('Could not load entity type, using default');
                document.getElementById('entityType').textContent = 'מוסד חינוכי';
            }
        }

        // Get entity type description based on entity_type_id (fallback function)
        function getEntityTypeDescription(entityTypeId) {
            const entityTypes = {
                1: 'בית ספר יסודי',
                2: 'בית ספר תיכון', 
                3: 'עיריה',
                4: 'משרד ממשלתי',
                5: 'מוסד חינוכי',
                6: 'רשת בתי ספר'
            };
            return entityTypes[entityTypeId] || 'מוסד חינוכי';
        }

        // Load entity logo (placeholder for now)
        function loadEntityLogo() {
            const tenantId = sessionStorage.getItem('tenantId');
            if (tenantId) {
                // You can add logic here to load entity-specific logo
                // For now, show different icons based on entity type
                const entityTypes = ['🏫', '🏢', '🏛️', '🏥', '🏪'];
                const randomIcon = entityTypes[Math.floor(Math.random() * entityTypes.length)];
                document.getElementById('entityLogo').textContent = randomIcon;
            }
        }

        // Load system version from database
        async function loadSystemVersion() {
            try {
                const response = await fetch('http://localhost:5082/api/test/system-version');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('systemVersion').textContent = data.version || '1.0';
                } else {
                    document.getElementById('systemVersion').textContent = '1.0';
                }
            } catch (error) {
                console.log('Could not load system version, using default');
                document.getElementById('systemVersion').textContent = '1.0';
            }
        }

        // Toggle side menu
        function toggleMenu() {
            const sideMenu = document.getElementById('sideMenu');
            console.log('Toggling menu. Current state:', sideMenu.classList.contains('collapsed'));
            
            if (sideMenu.classList.contains('collapsed')) {
                sideMenu.classList.remove('collapsed');
                console.log('Menu expanded');
            } else {
                sideMenu.classList.add('collapsed');
                console.log('Menu collapsed');
            }
        }

        // Navigate to different sections
        function navigateTo(section) {
            // Update active menu item
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.menu-item').classList.add('active');

            const pageTitle = document.getElementById('pageTitle');
            const pageSubtitle = document.getElementById('pageSubtitle');
            const dashboardContent = document.getElementById('dashboardContent');
            const dynamicContent = document.getElementById('dynamicContent');

            // Sections to load from file
            const sectionFiles = {
                tasks: 'tasks.html',
                analytics: 'analytics.html',
                users: 'users.html',
                reports: 'reports.html'
            };

            if (sectionFiles[section]) {
                pageTitle.textContent = {
                    tasks: 'משימות',
                    analytics: 'ניתוח נתונים',
                    users: 'ניהול משתמשים',
                    reports: 'דוחות'
                }[section];
                pageSubtitle.textContent = {
                    tasks: 'ניהול משימות יומיות ופרויקטים',
                    analytics: 'ניתוח מתקדם של נתוני המערכת',
                    users: 'הוספה, עריכה ומחיקה של משתמשים במערכת',
                    reports: 'צפייה ויצירה של דוחות מערכת'
                }[section];

                dashboardContent.style.display = 'none';
                dynamicContent.style.display = 'block';

                // Load the section HTML
                fetch(sectionFiles[section])
                    .then(response => response.text())
                    .then(html => {
                        dynamicContent.innerHTML = html;
                    })
                    .catch(() => {
                        dynamicContent.innerHTML = '<div class="content-card"><p>שגיאה בטעינת התוכן.</p></div>';
                    });
            } else if (section === 'dashboard') {
                pageTitle.textContent = 'עמוד ראשי';
                pageSubtitle.textContent = 'ברוכים הבאים למערכת הניהול';
                dashboardContent.style.display = 'block';
                dynamicContent.style.display = 'none';
            } else if (section === 'settings') {
                pageTitle.textContent = 'הגדרות מערכת';
                pageSubtitle.textContent = 'ניהול הגדרות המערכת והמשתמש';
                dashboardContent.style.display = 'none';
                dynamicContent.style.display = 'block';
                dynamicContent.innerHTML = '<div class="content-card"><h2>הגדרות</h2></div>';
            } else if (section === 'help') {
                pageTitle.textContent = 'עזרה ותמיכה';
                pageSubtitle.textContent = 'מדריכים ותמיכה טכנית';
                dashboardContent.style.display = 'none';
                dynamicContent.style.display = 'block';
                dynamicContent.innerHTML = '<div class="content-card"><h2>עזרה ותמיכה</h2></div>';
            } else if (section === 'systemAttributes') {
                document.getElementById('pageTitle').textContent = 'מאפייני מערכת';
                document.getElementById('pageSubtitle').textContent = 'רשימת מאפייני המערכת הטעונים';
                document.getElementById('dashboardContent').style.display = 'none';
                document.getElementById('dynamicContent').style.display = 'block';

                fetch('system-attributes.html')
                    .then(response => response.text())
                    .then(html => {
                        document.getElementById('dynamicContent').innerHTML = html;
                        loadSystemAttributes();
                    });
            }
        }

        function loadSystemAttributes() {
            fetch('/api/systemattributes') // Adjust the API endpoint as needed
                .then(response => response.json())
                .then(data => {
                    const table = document.createElement('table');
                    table.className = 'attributes-table';
                    table.innerHTML = `
                        <thead>
                            <tr>
                                <th>שם</th>
                                <th>תיאור</th>
                                <th>ערך</th>
                                <th>סוג ערך</th>
                                <th>עודכן לאחרונה</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(attr => `
                                <tr>
                                    <td>${attr.name}</td>
                                    <td>${attr.description}</td>
                                    <td>${attr.value}</td>
                                    <td>${attr.valueType}</td>
                                    <td>${attr.updatedAt ? new Date(attr.updatedAt).toLocaleString('he-IL') : ''}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    `;
                    const container = document.getElementById('systemAttributesTable');
                    container.innerHTML = '';
                    container.appendChild(table);
                })
                .catch(() => {
                    document.getElementById('systemAttributesTable').innerHTML = '<p style="color:red;">שגיאה בטעינת מאפייני מערכת.</p>';
                });
        }

        // Load dashboard data
        async function loadDashboardData() {
            try {
                // Simulate loading dashboard data
                setTimeout(() => {
                    document.getElementById('activeUsers').textContent = '127';
                    document.getElementById('openTasks').textContent = '23';
                    document.getElementById('weeklyReports').textContent = '8';
                    document.getElementById('notifications').textContent = '5';
                    
                    document.getElementById('recentActivity').innerHTML = `
                        <div style="padding: 20px 0;">
                            <div style="margin-bottom: 15px; padding: 15px; background: #f8f9ff; border-radius: 8px; border-right: 4px solid #667eea;">
                                <strong>עדכון חדש במערכת</strong><br>
                                <span style="color: #666; font-size: 14px;">משתמש חדש נוסף לרשת בית ספר אלון - לפני 10 דקות</span>
                            </div>
                            <div style="margin-bottom: 15px; padding: 15px; background: #f0fff4; border-radius: 8px; border-right: 4px solid #48bb78;">
                                <strong>דוח חודשי הושלם</strong><br>
                                <span style="color: #666; font-size: 14px;">דוח פעילות חודש מרץ מוכן לצפייה - לפני 2 שעות</span>
                            </div>
                            <div style="margin-bottom: 15px; padding: 15px; background: #fff8e1; border-radius: 8px; border-right: 4px solid #ffb74d;">
                                <strong>תזכורת תחזוקה</strong><br>
                                <span style="color: #666; font-size: 14px;">תחזוקה מתוכננת למערכת ביום ראשון 08:00 - לפני 1 יום</span>
                            </div>
                        </div>
                    `;
                }, 1000);
            } catch (error) {
                console.error('Error loading dashboard data:', error);
            }
        }

        // Logout function
        function logout() {
            if (confirm('האם אתה בטוח שברצונך להתנתק?')) {
                // Clear session storage
                sessionStorage.clear();
                
                // Redirect to login page
                window.location.href = 'login.html';
            }
        }

        // Prevent unauthorized access
        function checkAuthentication() {
            console.log('=== checkAuthentication started ===');
            const authToken = sessionStorage.getItem('authToken');
            console.log('Found authToken:', authToken);
            
            if (!authToken) {
                console.warn('No authToken found, redirecting to login');
                alert('לא נמצא אסימון התחברות. מעביר לעמוד ההתחברות...');
                window.location.href = 'login.html';
                return false;
            }
            
            console.log('Authentication check passed');
            return true;
        }

        // Check authentication on page load
        if (checkAuthentication()) {
            console.log('Authentication passed, continuing with page load...');
        } else {
            console.log('Authentication failed, should redirect to login');
        }

        // Debug function to check session storage
        function debugSessionStorage() {
            console.log('=== Session Storage Debug ===');
            console.log('Current URL:', window.location.href);
            console.log('Session Storage Contents:');
            
            // List all session storage items
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const value = sessionStorage.getItem(key);
                console.log(`${key}:`, value);
            }
            
            console.log('Specific items:');
            console.log('authToken:', sessionStorage.getItem('authToken'));
            console.log('userFullName:', sessionStorage.getItem('userFullName'));
            console.log('tenantName:', sessionStorage.getItem('tenantName'));
            console.log('tenantId:', sessionStorage.getItem('tenantId'));
            console.log('userEmail:', sessionStorage.getItem('userEmail'));
            console.log('=== End Debug ===');
        }

        // Call debug function immediately
        debugSessionStorage();

        // Force set test values if nothing in session (for debugging)
        function setTestValues() {
            if (!sessionStorage.getItem('userFullName')) {
                console.log('Setting test values for debugging...');
                sessionStorage.setItem('userFullName', 'משתמש בדיקה');
                sessionStorage.setItem('tenantName', 'ישות בדיקה');
                sessionStorage.setItem('tenantId', '1');
                sessionStorage.setItem('authToken', 'test-token');
            }
        }

        // Uncomment this line to test with dummy values
        // setTestValues();

        function showSchoolYear(type) {
    // Hide dashboard and other dynamic content
    document.getElementById('dashboardContent').style.display = 'none';
    document.getElementById('dynamicContent').style.display = 'block';

    // Load the schoolyear.html content
    fetch('schoolyear.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('dynamicContent').innerHTML = html;

            // Fetch system attributes for years
            fetch('http://localhost:5082/api/systemattributes')
                .then(response => response.json())
                .then(attributes => {
                    const currentYearAttr = attributes.find(attr => attr.name === "Current Year");
                    const previousYearAttr = attributes.find(attr => attr.name === "Previous Year");

                    let label = '';
                    if (type === 'current') {
                        label = 'שנה נוכחית' + (currentYearAttr ? ` (${currentYearAttr.value})` : '');
                    } else if (type === 'previous') {
                        label = 'שנה קודמת' + (previousYearAttr ? ` (${previousYearAttr.value})` : '');
                    } else if (type === 'next') {
                        label = 'שנה הבאה';
                    }
                    document.getElementById('schoolYearInfo').textContent = label;
                    document.getElementById('pageTitle').textContent = 'שנת לימודים';
                    document.getElementById('pageSubtitle').textContent = label;
                });
        });
}

function updateContextButtonLabels() {
    fetch('http://localhost:5082/api/systemattributes')
        .then(response => response.json())
        .then(attributes => {
            const currentYearAttr = attributes.find(attr => attr.name === "Current Year");
            const previousYearAttr = attributes.find(attr => attr.name === "Previous Year");

            document.querySelector('.context-btn[onclick*="current"]').textContent =
                'שנה נוכחית' + (currentYearAttr ? ` (${currentYearAttr.value})` : '');
            document.querySelector('.context-btn[onclick*="previous"]').textContent =
                'שנה קודמת' + (previousYearAttr ? ` (${previousYearAttr.value})` : '');
            // שנה הבאה remains unchanged
        });
}

// Call this after DOMContentLoaded
document.addEventListener('DOMContentLoaded', function() {
    // ...existing code...
    updateContextButtonLabels();
});
    </script>
</body>
</html>
