    <script>
        // Global Session State Manager - Centralized session data cache
        // Following Authentication & Session Management + Cross-Component Communication patterns
        window.SessionState = {
            _sessionData: null,
            _sessionProperties: {},
            _lastFetch: null,
            _cacheDuration: 60000, // 1 minute cache

            // Get full session info (with caching)
            async getSession(forceRefresh = false) {
                const now = Date.now();

                // Return cached data if valid
                if (!forceRefresh &&
                    this._sessionData &&
                    this._lastFetch &&
                    (now - this._lastFetch) < this._cacheDuration) {
                    console.log('✅ Returning cached session data');
                    return this._sessionData;
                }

                console.log('🔄 Fetching fresh session data from server');

                try {
                    const token = sessionStorage.getItem('authToken');
                    if (!token) {
                        throw new Error('No auth token');
                    }

                    const response = await fetch(AppConfig.getApiUrl('session'), {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!response.ok) {
                        if (response.status === 401) {
                            sessionStorage.clear();
                            window.location.href = 'login.html';
                        }
                        throw new Error(`HTTP ${response.status}`);
                    }

                    this._sessionData = await response.json();
                    this._lastFetch = now;

                    console.log('✅ Session data cached:', {
                        userId: this._sessionData.userId,
                        entityId: this._sessionData.entityId,
                        entityTypeId: this._sessionData.entityTypeId
                    });

                    // Dispatch session loaded event
                    window.dispatchEvent(new CustomEvent('sessionLoaded', {
                        detail: this._sessionData
                    }));

                    return this._sessionData;

                } catch (error) {
                    console.error('❌ Error fetching session:', error);
                    throw error;
                }
            },

            // Get session property (with caching)
            async getProperty(key, forceRefresh = false) {
                const now = Date.now();

                // Return cached property if valid
                if (!forceRefresh &&
                    this._sessionProperties[key] &&
                    this._sessionProperties[key].timestamp &&
                    (now - this._sessionProperties[key].timestamp) < this._cacheDuration) {
                    console.log(`✅ Returning cached property: ${key}`);
                    return this._sessionProperties[key].value;
                }

                console.log(`🔄 Fetching property from server: ${key}`);

                try {
                    const token = sessionStorage.getItem('authToken');
                    if (!token) throw new Error('No auth token');

                    const response = await fetch(AppConfig.getApiUrl(`session/property/${key}`), {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (response.status === 404) {
                        this._sessionProperties[key] = { value: null, timestamp: now };
                        return null;
                    }

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const result = await response.json();
                    this._sessionProperties[key] = {
                        value: result.value,
                        timestamp: now
                    };

                    return result.value;

                } catch (error) {
                    console.error(`❌ Error fetching property ${key}:`, error);
                    return null;
                }
            },

            // Set session property (updates cache)
            async setProperty(key, value) {
                console.log(`🔧 Setting property: ${key} = ${value}`);

                try {
                    const token = sessionStorage.getItem('authToken');
                    if (!token) throw new Error('No auth token');

                    const response = await fetch(AppConfig.getApiUrl('session/property'), {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ key, value })
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    // Update local cache
                    this._sessionProperties[key] = {
                        value: value,
                        timestamp: Date.now()
                    };

                    // Dispatch property changed event
                    window.dispatchEvent(new CustomEvent('sessionPropertyChanged', {
                        detail: { key, value }
                    }));

                    console.log(`✅ Property set: ${key}`);
                    return true;

                } catch (error) {
                    console.error(`❌ Error setting property ${key}:`, error);
                    throw error;
                }
            },

            // Clear cache (force refresh on next access)
            clearCache() {
                console.log('🧹 Clearing session cache');
                this._sessionData = null;
                this._sessionProperties = {};
                this._lastFetch = null;
            },

            // Refresh session data
            async refresh() {
                return await this.getSession(true);
            }
        };

        console.log('✅ SessionState initialized');
    </script>
</head>

<body>
    <div class="app-container">

        <div class="top-bar">

                <!-- Dynamic content will be loaded here -->
                <div id="dynamicContent">
                    <div class="content-card">
                        <h2 style="margin-bottom: 20px; color: #333;">ברוכים הבאים למערכת פט"ל</h2>
                        <p style="color: #666;">המערכת טוענת...</p>

                </div>

            <div class="footer-content">

                    <img src="petel_logo.png" alt="לוגו המערכת" style="transition: opacity 0.2s;"
                        onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'" />
                </div>
                פט"ל - פתרונות טכנולגים לחינוך - גרסה <span id="systemVersion">טוען...</span>

            </div>
        </div>

    <script>


        document.addEventListener('DOMContentLoaded', function () {
            console.log('🚀 Application starting...');

            // Check authentication before loading any content following Security Patterns
            if (!checkAuthentication()) {
                return; // checkAuthentication will redirect to login
            }

            console.log('✅ Authentication passed, loading application...');

            // ✅ Use PageLifecycleManager for all navigation
            window.navigateTo = async function (section, fromPopstate = false) {
                await window.PageLifecycleManager.navigateTo(section, fromPopstate);

                // ✅ Automatically configure school list navigation button after page loads
                setTimeout(() => {
                    if (typeof window.configureSchoolListNavigationButton === 'function') {
                        window.configureSchoolListNavigationButton();
                    }
                }, 150); // Small delay to ensure page HTML is rendered
            };



            // Load menu AFTER defining navigation functions
            fetch('menu.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to load menu: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    const menuContainer = document.getElementById('sideMenuContainer');
                    if (menuContainer) {
                        menuContainer.innerHTML = html;
                        console.log('✅ Menu loaded successfully');

                        // Re-execute menu scripts following Common Gotchas
                        executeScriptsInContainer(menuContainer);
                    } else {
                        console.error('❌ Menu container not found');
                    }
                })
                .catch(err => {
                    console.error('❌ Failed to load menu:', err);
                    // Show error in menu area
                    const menuContainer = document.getElementById('sideMenuContainer');
                    if (menuContainer) {
                        menuContainer.innerHTML = `
                    <div style="padding: 20px; color: #e74c3c; direction: rtl;">
                        שגיאה בטעינת תפריט
                    </div>
                `;
                    }
                });

            // Initialize page following Critical Development Workflows
            setTimeout(async function () {
                try {
                    console.log('🔧 Initializing application components...');

                    // Load user info first
                    loadUserInfo();
                    loadSystemVersion();
                    loadSystemLogo();


                    // Use PageLifecycleManager for initial load
                    await window.PageLifecycleManager.navigateTo('maindashboard');

                    if (window.ActionSecurity && typeof window.ActionSecurity.initialize === 'function') {
                        await window.ActionSecurity.initialize();
                    }

                    console.log('✅ Application initialization completed');

                } catch (error) {
                    console.error('❌ Error during application initialization:', error);
                }
            }, 100);
        });

        // Load user information following Authentication & Session Management
        async function loadUserInfo() {
            try {
                // Use centralized session state
                const session = await window.SessionState.getSession();

                const userNameElement = document.getElementById('userName');
                const entityNameElement = document.getElementById('entityName');
                const entityTypeElement = document.getElementById('entityType');
                const entityLogoElement = document.getElementById('entityLogo');

                if (userNameElement) {
                    userNameElement.textContent = session.userFullName || '';
                }
                if (entityNameElement) {
                    entityNameElement.textContent = session.entityName || '';
                }
                if (entityTypeElement) {
                    entityTypeElement.textContent = session.entityTypeName || '';
                }

                // Load entity logo
                if (entityLogoElement && session.entityId) {
                    try {
                        const token = sessionStorage.getItem('authToken');
                        const logoUrl = AppConfig.getApiUrl(`entities/${session.entityId}/logo`);

                        const logoResponse = await fetch(logoUrl, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });

                        if (logoResponse.ok) {
                            const logoBlob = await logoResponse.blob();
                            const logoObjectUrl = URL.createObjectURL(logoBlob);
                            entityLogoElement.innerHTML = `<img src="${logoObjectUrl}" alt="לוגו הישות" style="width: 40px; height: 40px; object-fit: contain; border-radius: 4px;">`;
                            console.log('✅ Entity logo loaded successfully');
                        }
                        // ✅ Silently ignore 404 - keep default emoji
                    } catch (logoError) {
                        // ✅ Silently ignore errors - keep default emoji
                        console.log('ℹ️ Using default entity icon (no custom logo available)');
                    }
                }

                console.log('✅ User info loaded from SessionState cache');

            } catch (error) {
                console.error('❌ Error loading user info:', error);
            }
        }
        // Get current entity type ID following Entity-Based Request Flow
        async function getCurrentEntityTypeId() {
            const session = await sessionManager.getSessionInfo();
            return session?.entityTypeId;
        }


        // Load system logo based on distributor of highest owner
        async function loadSystemLogo() {
            console.log('🎨 Loading system logo based on distributor...');

            try {
                const session = await window.SessionState.getSession();
                const entityId = session.entityId;

                if (!entityId) {
                    console.error('❌ No entity ID in session');
                    return;
                }

                const token = sessionStorage.getItem('authToken');
                const response = await fetch(AppConfig.getApiUrl(`entities/${entityId}/distributor`), {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Distributor logo data:', data);
                    if (data.distributor === 'Nativ') {
                        // Update top-bar logo
                        const topBarLogoDiv = document.getElementById('topBarLogo');
                        let logoHtml = topBarLogoDiv.innerHTML;
                        logoHtml = logoHtml.replace('petel_logo.png', 'images/nativ-logo.png');
                        logoHtml = logoHtml.replace('style="transition: opacity 0.2s;', 'style="transition: opacity 0.2s; width: 175px; height: auto; gap: 100px;"');
                        topBarLogoDiv.innerHTML = logoHtml;
                        const topBarLogo = topBarLogoDiv.querySelector('img');
                        console.log(`✅ Top bar logo set to: ${topBarLogo.src}`);
                    }



                } else {
                    console.warn('⚠️ Failed to load distributor logo, using default');
                }
            } catch (error) {
                console.error('❌ Error loading system logo:', error);
                // Silently fail - keep default logo
            }
        }


        // Check if current entity is a multi-school network following Entity-Based Request Flow
        async function isMultiSchoolNetwork() {
            const entityTypeId = await getCurrentEntityTypeId();
            return entityTypeId === '2';
        }


        // Load system version following API Communication Pattern
        async function loadSystemVersion() {
            try {
                const response = await fetch(AppConfig.getApiUrl('systemAttributes'));
                if (response.ok) {
                    const attributes = await response.json();
                    const versionAttr = attributes.find(attr => attr.name === "System Version");
                    const versionElement = document.getElementById('systemVersion');
                    if (versionElement) {
                        versionElement.textContent = versionAttr ? versionAttr.value : '1.0';
                    }
                }
            } catch (error) {
                console.log('Could not load system version, using default');
                const versionElement = document.getElementById('systemVersion');
                if (versionElement) {
                    versionElement.textContent = '1.0';
                }
            }
        }






        // Update browser back/forward handling with authentication check following SPA pattern
        // ✅ Update browser back/forward handling
        window.addEventListener('popstate', function (event) {
            if (!checkAuthentication()) return;
            window.PageLifecycleManager.handlePopstate(event);
        });

        // Logout function following Authentication & Session Management

        function logout() {
            console.log('🚪 User logout initiated');

            // Stop session timeout manager
            if (window.SessionTimeoutManager) {
                window.SessionTimeoutManager.stop();
            }

            const authToken = sessionStorage.getItem('authToken');

            // Call logout API
            if (authToken) {
                fetch(AppConfig.getApiUrl('auth/logout'), {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                })
                    .then(() => {
                        console.log('✅ Logout API called successfully');
                    })
                    .catch(error => {
                        console.error('❌ Error calling logout API:', error);
                    })
                    .finally(() => {
                        // Clear session and redirect
                        sessionStorage.clear();
                        window.location.href = 'login.html';
                    });
            } else {
                sessionStorage.clear();
                window.location.href = 'login.html';
            }
        }

        // Execute scripts in dynamically loaded content following Common Gotchas
        function executeScriptsInContainer(container) {
            if (!container) {
                console.warn('⚠️ No container provided to executeScriptsInContainer');
                return;
            }

            try {
                const scripts = container.querySelectorAll('script');
                console.log(`🔧 Executing ${scripts.length} scripts in loaded content`);

                scripts.forEach((script, index) => {
                    try {
                        const newScript = document.createElement('script');

                        if (script.src) {
                            console.log(`📦 Loading external script: ${script.src}`);
                            newScript.src = script.src;
                            newScript.onload = () => console.log(`✅ External script loaded: ${script.src}`);
                            newScript.onerror = () => console.error(`❌ Failed to load script: ${script.src}`);
                        } else {
                            console.log(`🔧 Executing inline script ${index + 1}`);
                            newScript.textContent = script.textContent;
                        }

                        // Replace the old script with the new one
                        script.parentNode.replaceChild(newScript, script);

                    } catch (scriptError) {
                        console.error(`❌ Error executing script ${index + 1}:`, scriptError);
                    }
                });

                console.log('✅ Script execution completed');

            } catch (error) {
                console.error('❌ Error in executeScriptsInContainer:', error);
            }
        }

        // Enhanced authentication check with better logging
        // Replace checkAuthentication function (around line 428)

        function checkAuthentication() {
            const authToken = sessionStorage.getItem('authToken');

            console.log('🔐 Authentication check:', {
                hasAuthToken: !!authToken,
                tokenLength: authToken ? authToken.length : 0
            });

            // Only check for auth token - all other data is backend-only
            if (!authToken) {
                console.log('❌ Authentication failed: Missing auth token');

                const dynamicContent = document.getElementById('dynamicContent');
                if (dynamicContent) {
                    dynamicContent.innerHTML = `
                <div class="content-card" style="text-align: center; padding: 40px; direction: rtl;">
                    <h2 style="margin-bottom: 20px; color: #e74c3c;">אין הרשאה</h2>
                    <p style="color: #666;">מפנה לדף התחברות...</p>
                </div>
            `;
                }

                sessionStorage.clear();

                setTimeout(() => {
                    const loginUrl = new URL('login.html', window.location.href);
                    loginUrl.searchParams.set('error', 'session_expired');
                    window.location.href = loginUrl.toString();
                }, 1000);

                return false;
            }

            console.log('✅ Authentication check passed');
            return true;
        }

        // ✅  Use PageLifecycleManager
        function navigateToMainDashboard() {
            if (!checkAuthentication()) return;

            // Use PageLifecycleManager instead of loadMainDashboard()
            window.navigateTo('maindashboard');
        }

        // Logout function following Authentication & Session Management
        function logout() {
            // Clear session storage
            sessionStorage.clear();

            // Redirect to login page
            window.location.href = 'login.html';
        }


        // Add session validation for API calls following API Communication Pattern
        function makeAuthenticatedApiCall(url, options = {}) {
            if (!checkAuthentication()) {
                return Promise.reject(new Error('No valid session'));
            }

            const authToken = sessionStorage.getItem('authToken');
            const defaultOptions = {
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                }
            };

            // Merge options
            const finalOptions = {
                ...defaultOptions,
                ...options,
                headers: {
                    ...defaultOptions.headers,
                    ...options.headers
                }
            };

            return fetch(url, finalOptions);
        }

        // Load system attributes following API Communication Pattern
        function loadSystemAttributes() {
            const container = document.getElementById('systemAttributesTable');
            if (!container) return;

            if (!checkAuthentication()) return;

            container.innerHTML = '<p style="color: #666;">טוען נתונים...</p>';

            makeAuthenticatedApiCall(AppConfig.getApiUrl('systemAttributes'))
                .then(response => {
                    if (response.status === 401) {
                        // Token expired, redirect to login
                        checkAuthentication();
                        return;
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && data.length > 0) {
                        const table = document.createElement('table');
                        table.className = 'attributes-table';
                        table.innerHTML = `
                    <thead>
                        <tr>
                            <th>שם</th>
                            <th>תיאור</th>
                            <th>ערך</th>
                            <th>סוג ערך</th>
                            <th>מזהה חיצוני</th>
                            <th>עודכן לאחרונה</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(attr => `
                            <tr>
                                <td><strong>${attr.name || ''}</strong></td>
                                <td>${attr.description || ''}</td>
                                <td>${attr.value || ''}</td>
                                <td>${attr.valueType || ''}</td>
                                <td>${attr.foreignId || ''}</td>
                                <td>${attr.updatedAt ? new Date(attr.updatedAt).toLocaleString('he-IL') : ''}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                `;
                        container.innerHTML = '';
                        container.appendChild(table);
                    } else {
                        container.innerHTML = '<div class="attributes-empty">אין מאפייני מערכת זמינים</div>';
                    }
                })
                .catch(error => {
                    console.error('Error loading system attributes:', error);
                    container.innerHTML = '<p style="color:red; text-align: center;">שגיאה בטעינת מאפייני מערכת.</p>';
                });
        }

        /**
         * Global function to configure "Back to School List" button visibility
         * Automatically hides the button for single-school entities (types 1, 4)
         * Call this function in any page that has a "Back to School List" button
         * Following Entity-Based Request Flow pattern
         */
        async function configureSchoolListNavigationButton() {
            console.log('🔧 Configuring "Back to School List" button visibility...');

            try {
                const session = await window.SessionState.getSession();
                const entityTypeId = parseInt(session.entityTypeId, 10);

                console.log('📋 Entity type ID:', entityTypeId);

                // Find any button that navigates back to school list
                // Matches onclick="navigateBackToSchoolList()" or similar
                const backButton = document.querySelector('button[onclick*="navigateBackToSchoolList"]') ||
                    document.querySelector('button[onclick*="BackToSchoolList"]') ||
                    document.querySelector('.context-navigation-btn[onclick*="schoollist"]');

                if (!backButton) {
                    console.log('ℹ️ No "Back to School List" button found on this page');
                    return;
                }

                // Hide button for single-school entities (1 = school, 4 = external school)
                if (entityTypeId === 1 || entityTypeId === 4) {
                    backButton.style.display = 'none';
                    console.log('✅ Hid "Back to School List" button for single-school entity');
                } else {
                    backButton.style.display = '';
                    console.log('✅ Showing "Back to School List" button for multi-school entity');
                }

            } catch (error) {
                console.error('❌ Error configuring school list navigation button:', error);
            }
        }

        // Export globally
        window.configureSchoolListNavigationButton = configureSchoolListNavigationButton;


        // Toggle side menu following Frontend Architecture Patterns
        function toggleMenu() {
            const sideMenu = document.getElementById('sideMenu');
            if (!sideMenu) return;

            console.log('Toggling menu. Current state:', sideMenu.classList.contains('collapsed'));

            if (sideMenu.classList.contains('collapsed')) {
                sideMenu.classList.remove('collapsed');
                console.log('Menu expanded');
            } else {
                sideMenu.classList.add('collapsed');
                console.log('Menu collapsed');
            }
        }



        // Make functions globally available following Cross-Component Communication

        window.navigateToMainDashboard = navigateToMainDashboard;
        window.getCurrentEntityTypeId = getCurrentEntityTypeId;


        window.isMultiSchoolNetwork = isMultiSchoolNetwork;
        window.loadUserInfo = loadUserInfo;
        window.loadSystemAttributes = loadSystemAttributes;
        window.toggleMenu = toggleMenu;
        window.logout = logout;
        window.executeScriptsInContainer = executeScriptsInContainer;

        window.checkAuthentication = checkAuthentication;
        window.makeAuthenticatedApiCall = makeAuthenticatedApiCall;


        console.log('✅ All global functions registered successfully');

        /**
         * Ensure a fresh school-year selection flow before navigating to a target section.
         * - Clears any previous year selection
         * - Launches year selection UI (or fallback confirm) and calls callback on selection
         */
        async function ensureFreshYearSelectionAndNavigate(targetSection, targetLoaderFn) {
            try {
                console.log('🔁 Starting fresh year selection flow for', targetSection);

                // Clear previous year selection context (start from scratch)
                sessionStorage.removeItem('selectedYearId');
                sessionStorage.removeItem('selectedYearValue');
                sessionStorage.removeItem('currentYearValue'); // any alternate keys
                console.log('🧹 Cleared existing year selection from sessionStorage');

                // mark navigation source
                sessionStorage.setItem('navigationSource', 'main_context_button');

                // If there's a dedicated year selection page or modal, open it.
                // Prefer an existing function `openYearSelectionModal(callback)` if available.
                if (typeof window.openYearSelectionModal === 'function') {
                    window.openYearSelectionModal(async (selectedYear) => {
                        // selectedYear should be { id, value } or similar
                        if (selectedYear && selectedYear.id) {
                            sessionStorage.setItem('selectedYearId', String(selectedYear.id));
                            sessionStorage.setItem('selectedYearValue', selectedYear.value || '');
                            console.log('✅ Year selected:', selectedYear);

                            // proceed to the target loader (navigateTo or direct load)
                            if (typeof targetLoaderFn === 'function') {
                                await targetLoaderFn();
                            } else if (typeof window.navigateTo === 'function') {
                                window.navigateTo(targetSection);
                            } else {
                                console.warn('⚠️ No navigation function provided, attempting loadPageDirectly fallback');
                                loadPageDirectly(`${targetSection}.html`, targetSection, targetSection);
                            }
                        } else {
                            console.warn('⚠️ Year selection cancelled by user');
                        }
                    });
                    return;
                }

                // Fallback: simple confirm prompt to simulate selection (replace with real UI)
                const proceed = confirm('לא נבחרה שנת לימודים. האם ברצונך לבחור כעת את שנת הלימודים?');
                if (!proceed) {
                    console.log('⏸️ User cancelled year selection');
                    return;
                }

                // Fallback: naive selection prompt
                const yearValue = prompt('הכנס/י את שנת הלימודים (לדוגמה: 2024):', '');
                if (!yearValue) {
                    console.log('⚠️ No year provided, aborting navigation');
                    return;
                }

                // persist chosen year
                sessionStorage.setItem('selectedYearId', yearValue);
                sessionStorage.setItem('selectedYearValue', yearValue);
                console.log('✅ Year set via fallback prompt:', yearValue);

                // Navigate to target
                if (typeof targetLoaderFn === 'function') {
                    await targetLoaderFn();
                } else if (typeof window.navigateTo === 'function') {
                    window.navigateTo(targetSection);
                } else {
                    loadPageDirectly(`${targetSection}.html`, targetSection, targetSection);
                }

            } catch (err) {
                console.error('❌ Error in ensureFreshYearSelectionAndNavigate:', err);
            }
        }

        // Export helper globally
        window.ensureFreshYearSelectionAndNavigate = ensureFreshYearSelectionAndNavigate;
        window.loadSystemVersion = loadSystemVersion;
        // Example adapter for context buttons to use:
        // ensureFreshYearSelectionAndNavigate('schoollist', () => window.loadPageDirectly('schoollist.html','schoollist','רשימת בתי ספר'));
    </script>
