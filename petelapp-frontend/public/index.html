        // Load entity type description
        async function loadEntityTypeDescription(tenantId) {
            try {
                if (tenantId) {
                    const response = await fetch(`http://localhost:5082/api/entities/${tenantId}`);
                    if (response.ok) {
                        const entityData = await response.json();
                        document.getElementById('entityType').textContent = entityData.entityTypeName || 'מוסד חינוכי';
                    } else {
                        document.getElementById('entityType').textContent = 'מוסד חינוכי';
                    }
                } else {
                    document.getElementById('entityType').textContent = 'מוסד חינוכי';
                }
            } catch (error) {
                console.log('Could not load entity type, using default');
                document.getElementById('entityType').textContent = 'מוסד חינוכי';
            }
        }

        // Get entity type description based on entity_type_id (fallback function)

            const entityTypes = {

                4: 'משרד ממשלתי',

            return entityTypes[entityTypeId] || 'מוסד חינוכי';

        // Load system version from database
        async function loadSystemVersion() {

            fetch(AppConfig.getApiUrl('systemAttributes'))
                .then(response => response.json())

                    timestamp: "יום חמישי 10:30",

                    timestamp: "יום ראשון 08:00",
                    priority: "low"
                }

    };

    const cardData = mockData[cardId];

    // Get the internal cards container
    const containerElement = document.getElementById(cardId.replace('Card', 'InternalCards'));
    if (!containerElement) return;

    containerElement.innerHTML = '';

    // Create internal cards with black borders
    cardData.items.forEach((item, index) => {
        const internalCard = document.createElement('div');
        internalCard.className = 'internal-card';
        internalCard.setAttribute('data-priority', item.priority);
        
        internalCard.innerHTML = `
            <div class="internal-card-content">${item.content}</div>
            <div class="internal-card-timestamp">${item.timestamp}</div>
        `;

        // Add click handler for internal card interaction
        internalCard.addEventListener('click', () => {
            console.log(`Internal card clicked: ${item.title} in ${cardId}`);
            // Dispatch custom event following cross-component communication pattern
            const cardClickEvent = new CustomEvent('internalCardClicked', {
                detail: {
                    cardId: cardId,
                    itemIndex: index,
                    item: item

            });
            window.dispatchEvent(cardClickEvent);
        });

        containerElement.appendChild(internalCard);
    });
}

        function showSchoolYear(type) {
    // Add to browser history
    history.pushState({page: 'schoolyear', type: type}, '', '#schoolyear');
    
    // Hide dashboard and other dynamic content
    document.getElementById('dashboardContent').style.display = 'none';
    document.getElementById('dynamicContent').style.display = 'block';

    // Load the schoolyear.html content
    fetch('schoolyear.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('dynamicContent').innerHTML = html;

            // Fetch system attributes for years
            fetch(AppConfig.getApiUrl('systemAttributes'))
                .then(response => response.json())
                .then(attributes => {
                    const currentYearAttr = attributes.find(attr => attr.name === "Current Year");
                    const previousYearAttr = attributes.find(attr => attr.name === "Previous Year");
                    const nextYearAttr = attributes.find(attr => attr.name === "Next Year");

                    let label = '';
                    let yearValue = '';
                    let yearId = null; // This will hold the foreignId of the selected year
                    let selectedAttr = null;
                    
                    if (type === 'current') {
                        selectedAttr = currentYearAttr;
                        label = 'שנה נוכחית' + (currentYearAttr ? ` (${currentYearAttr.value})` : '');
                        yearValue = currentYearAttr ? currentYearAttr.value : '';
                        yearId = currentYearAttr ? currentYearAttr.foreignId : null;
                    } else if (type === 'previous') {
                        selectedAttr = previousYearAttr;
                        label = 'שנה קודמת' + (previousYearAttr ? ` (${previousYearAttr.value})` : '');
                        yearValue = previousYearAttr ? previousYearAttr.value : '';
                        yearId = previousYearAttr ? previousYearAttr.foreignId : null;
                    } else if (type === 'next') {
                        selectedAttr = nextYearAttr;
                        label = 'שנה הבאה' + (nextYearAttr ? ` (${nextYearAttr.value})` : '');
                        yearValue = nextYearAttr ? nextYearAttr.value : '';
                        yearId = nextYearAttr ? nextYearAttr.foreignId : null;
                    }
                    
                    // Update the main school year title with the concatenated year info
                    const schoolYearTitle = document.getElementById('schoolYearTitle');
                    if (schoolYearTitle) {
                        schoolYearTitle.textContent = `שנת לימודים - ${label}`;
                    }
                    
                    // Store current school year info globally for use in other functions
                    window.currentSchoolYear = {
                        type: type,
                        label: label,
                        value: yearValue,
                        id: yearId,
                        fullAttribute: selectedAttr
                    };
                    
                    console.log('School year data stored:', window.currentSchoolYear);
                    
                    // Fetch hours budgets for this school year if we have a yearId (foreignId)
                    if (yearId) {
                        fetchSchoolYearHoursBudgets(yearId);
                    }
                    
                    // Dispatch custom event to notify other components about school year change
                    const schoolYearEvent = new CustomEvent('schoolYearChanged', {
                        detail: window.currentSchoolYear
                    });
                    window.dispatchEvent(schoolYearEvent);
                });
        });
}

// Fetch hours budgets for selected school year
async function fetchSchoolYearHoursBudgets(schoolYearId) {
    try {
        console.log('Fetching hours budgets for school year ID:', schoolYearId);
        
        const response = await fetch(AppConfig.getApiUrl(`hoursBudgets/schoolyear/${schoolYearId}`), {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${sessionStorage.getItem('authToken')}`
            }
        });
        
        if (response.ok) {
            const hoursBudgets = await response.json();
            console.log('Hours budgets fetched successfully:', hoursBudgets);
            
            // Store hours budgets in global scope for access by other components
            window.currentSchoolYearHoursBudgets = hoursBudgets;
            
            // Dispatch custom event to notify components about hours budget data
            const hoursBudgetEvent = new CustomEvent('schoolYearHoursBudgetsLoaded', {
                detail: {
                    schoolYearId: schoolYearId,
                    hoursBudgets: hoursBudgets
                }
            });
            window.dispatchEvent(hoursBudgetEvent);
            
        } else {
            console.warn('Failed to fetch hours budgets:', response.status, response.statusText);
            window.currentSchoolYearHoursBudgets = [];
        }
    } catch (error) {
        console.error('Error fetching school year hours budgets:', error);
        window.currentSchoolYearHoursBudgets = [];
    }
}

function updateContextButtonLabels() {
    fetch(AppConfig.getApiUrl('systemAttributes'))
        .then(response => response.json())
        .then(attributes => {
            const currentYearAttr = attributes.find(attr => attr.name === "Current Year");
            const previousYearAttr = attributes.find(attr => attr.name === "Previous Year");
            const nextYearAttr = attributes.find(attr => attr.name === "Next Year");
            
            // Update previous year button
            const previousBtn = document.querySelector('.context-btn[onclick*="previous"]');
            const previousLabel = 'שנה קודמת' + (previousYearAttr ? ` (${previousYearAttr.value})` : '');
            previousBtn.textContent = previousLabel;
            previousBtn.title = previousLabel; // Add tooltip
            
            // Update current year button
            const currentBtn = document.querySelector('.context-btn[onclick*="current"]');
            const currentLabel = 'שנה נוכחית' + (currentYearAttr ? ` (${currentYearAttr.value})` : '');
            currentBtn.textContent = currentLabel;
            currentBtn.title = currentLabel; // Add tooltip
            
            // Update next year button
            const nextBtn = document.querySelector('.context-btn[onclick*="next"]');
            const nextLabel = 'שנה הבאה' + (nextYearAttr ? ` (${nextYearAttr.value})` : '');
            nextBtn.textContent = nextLabel;
            nextBtn.title = nextLabel; // Add tooltip
        })
        .catch(error => {
            console.error('Error loading system attributes for context buttons:', error);
        });
}

    const modalContent = document.createElement('div');
    modalContent.className = 'modal-content';
    
    // Determine modal title based on card type
    let modalTitle = 'הוספת חדש';
    if (cardId === 'alertsCard') {
        modalTitle = 'הוספת התראה חדשה';
    } else if (cardId === 'eventsCard') {
        modalTitle = 'הוספת אירוע חדש';
    }
    
    modalContent.innerHTML = `
        <div class="modal-title">${modalTitle}</div>
        <div class="modal-buttons">
            <button class="modal-btn modal-btn-primary" onclick="handleAddNew('${cardId}')">
                הוסף
            </button>
            <button class="modal-btn modal-btn-secondary" onclick="closeAddModal()">
                ביטול
            </button>
        </div>
    `;
    
    modalOverlay.appendChild(modalContent);
    document.body.appendChild(modalOverlay);
    
    // Store modal reference for cleanup
    window.currentModal = modalOverlay;
}

function closeAddModal() {
    if (window.currentModal) {
        document.body.removeChild(window.currentModal);
        window.currentModal = null;
    }
}

function handleAddNew(cardId) {
    console.log('Adding new item for card:', cardId);
    
    // Handle different card types
    switch(cardId) {
        case 'alertsCard':
            addNewAlert();
            break;
        case 'eventsCard':
            addNewEvent();
            break;
        default:
            console.log('Unknown card type for adding:', cardId);
    }
    
    // Close the modal
    closeAddModal();
}

function addNewAlert() {
    console.log('Adding new alert...');
    // Following multi-tenant educational SaaS patterns

    // For now, show a success message

}

function addNewEvent() {
    console.log('Adding new event...');
    // Following multi-tenant educational SaaS patterns
    // This would typically make an API call to create a new event
    
    // For now, show a success message
    alert('אירוע חדש נוסף בהצלחה!');
    
    // Reload the events data
    loadDashboardCardData('eventsCard');
}

// Close modal on Escape key
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape' && window.currentModal) {
        closeAddModal();
    }
});

// Make functions globally available
window.showAddModal = showAddModal;
window.closeAddModal = closeAddModal;
window.handleAddNew = handleAddNew;

// Make sure this runs after menu.html is loaded
document.addEventListener('DOMContentLoaded', function() {
    // Load menu first
    fetch('menu.html')
        .then(response => response.text())
        .then(html => {
            // Insert menu into the page
            document.getElementById('sideMenuContainer').innerHTML = html; // Fixed: was 'menuContainer'
            
            // Execute any scripts in the loaded HTML
            const scripts = document.getElementById('sideMenuContainer').querySelectorAll('script');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                newScript.textContent = script.textContent;
                document.head.appendChild(newScript);
            });
            
            // Then load other initialization
            loadUserInfo();
            loadSystemVersion();
            updateContextButtonLabels();
        })
        .catch(err => {
            console.error('Failed to load menu:', err);
        });
});

// Handle browser back/forward buttons
window.addEventListener('popstate', function(event) {
    console.log('Browser back/forward button pressed', event.state);
 
    if (event.state) {
        const page = event.state.page;
        console.log('Navigating to page from history:', page);
        
        switch(page) {
            case 'dashboard':
                navigateTo('dashboard', true);
                break;
            case 'schoolyear':
                if (event.state.type) {
                    showSchoolYear(event.state.type);
                }
                break;
            case 'students':
                navigateTo('students', true);
                break;
            case 'tasks':
                navigateTo('tasks', true);
                break;
            case 'analytics':
                navigateTo('analytics', true);
                break;
            case 'users':
                navigateTo('users', true);
                break;
            case 'reports':
                navigateTo('reports', true);
                break;
            case 'systemAttributes':
                navigateTo('systemAttributes', true);
                break;
            case 'settings':
                navigateTo('settings', true);
                break;
            case 'help':
                navigateTo('help', true);
                break;
            default:
                console.log('Unknown page in history:', page);
                navigateTo('dashboard', true);
        }
    } else {
        // If no state, go to dashboard
      //  navigateTo('dashboard');
    }
});
