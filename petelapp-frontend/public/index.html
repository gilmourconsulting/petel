        internalCard.addEventListener('click', () => {

// Re-execute scripts in loaded HTML following Frontend Architecture Patterns
function executeScriptsInContainer(container) {
    const scripts = container.querySelectorAll('script');
    scripts.forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
            newScript.src = oldScript.src;
        } else {
            newScript.textContent = oldScript.textContent;
        }
        oldScript.parentNode.replaceChild(newScript, oldScript);
    });
}

        // Store selected year in backend session following API communication pattern
async function storeSelectedYearInSession(yearId, yearType) {
    try {
        console.log('Storing selected year in session:', yearId, yearType);
        
        const response = await fetch(AppConfig.getApiUrl('systemAttributes/selectYear'), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                yearType: yearType,
                yearId: yearId
            })
        });

        if (response.ok) {
            const result = await response.json();
            console.log('Selected year stored in session:', result);
            
            // Store in frontend session storage
            sessionStorage.setItem('selectedYear', yearId.toString());
            sessionStorage.setItem('selectedYearType', yearType);
            
        } else {
            console.error('Failed to store selected year:', response.status);
        }
    } catch (error) {
        console.error('Error storing selected year in session:', error);
    }
}

// Update context button labels following system attributes pattern
async function updateContextButtonLabels() {
    try {
        console.log('Updating context button labels with year values...');
        
        // Load system attributes following API communication pattern
        const response = await fetch(AppConfig.getApiUrl('systemAttributes'));
        if (!response.ok) {
            console.warn('Could not load system attributes for context buttons');
            return;
        }
        
        const attributes = await response.json();
        console.log('System attributes loaded:', attributes);
        
        // Find year attributes following system attributes pattern
        const currentYearAttr = attributes.find(attr => attr.name === "Current Year");
        const previousYearAttr = attributes.find(attr => attr.name === "Previous Year");
        const nextYearAttr = attributes.find(attr => attr.name === "Next Year");
        
        // Store year IDs globally following Cross-Component Communication
        if (currentYearAttr) {
            window.currentYearId = currentYearAttr.foreignId;
            sessionStorage.setItem('currentYearValue', currentYearAttr.value);
            sessionStorage.setItem('currentYearId', currentYearAttr.foreignId);
        }
        if (previousYearAttr) {
            window.previousYearId = previousYearAttr.foreignId;
            sessionStorage.setItem('previousYearValue', previousYearAttr.value);
            sessionStorage.setItem('previousYearId', previousYearAttr.foreignId);
        }
        if (nextYearAttr) {
            window.nextYearId = nextYearAttr.foreignId;
            sessionStorage.setItem('nextYearValue', nextYearAttr.value);
            sessionStorage.setItem('nextYearId', nextYearAttr.foreignId);
        }
        
        // Update context button labels with year values following Hebrew/RTL patterns
        const contextButtons = document.querySelectorAll('.context-btn');
        contextButtons.forEach(button => {
            const onClick = button.getAttribute('onclick');
            
            if (onClick && onClick.includes("'previous'") && previousYearAttr) {
                button.textContent = `שנה קודמת (${previousYearAttr.value})`;
                button.setAttribute('data-year-id', previousYearAttr.foreignId?.toString() || '');
            } else if (onClick && onClick.includes("'current'") && currentYearAttr) {
                button.textContent = `שנה נוכחית (${currentYearAttr.value})`;
                button.setAttribute('data-year-id', currentYearAttr.foreignId?.toString() || '');
            } else if (onClick && onClick.includes("'next'") && nextYearAttr) {
                button.textContent = `שנה הבאה (${nextYearAttr.value})`;
                button.setAttribute('data-year-id', nextYearAttr.foreignId?.toString() || '');
            }
        });
        
        console.log('Context button labels updated with year values and foreign IDs');
        
    } catch (error) {
        console.error('Error updating context button labels:', error);
    }
}
