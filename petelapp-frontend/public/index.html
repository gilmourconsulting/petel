        // Replace the DOMContentLoaded event handler in index.html following Frontend Architecture Patterns:

document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 Application starting...');
    
    // Check authentication before loading any content following Security Patterns
    if (!checkAuthentication()) {
        return; // checkAuthentication will redirect to login
    }
    
    console.log('✅ Authentication passed, loading application...');
    
    // Load menu following Single-Page Application with Module Loading
    fetch('menu.html')
        .then(response => {
            if (!response.ok) {
                throw new Error(`Failed to load menu: ${response.status}`);
            }
            return response.text();
        })
        .then(html => {
            const menuContainer = document.getElementById('sideMenuContainer');
            if (menuContainer) {
                menuContainer.innerHTML = html;
                console.log('✅ Menu loaded successfully');
            } else {
                console.error('❌ Menu container not found');
            }
        })
        .catch(err => {
            console.error('❌ Failed to load menu:', err);
            // Show error in menu area
            const menuContainer = document.getElementById('sideMenuContainer');
            if (menuContainer) {
                menuContainer.innerHTML = `
                    <div style="padding: 20px; color: #e74c3c; direction: rtl;">
                        שגיאה בטעינת תפריט
                    </div>
                `;
            }
        });

    // Initialize page following Critical Development Workflows
    setTimeout(async function() {
        try {
            console.log('🔧 Initializing application components...');
            
            // Load user info first
            loadUserInfo();
            
            // Load main dashboard
            await loadMainDashboard();
            
            // Set initial history state
            if (!history.state) {
                history.replaceState({page: 'maindashboard'}, 'לוח בקרה ראשי - מערכת פט"ל', '#maindashboard');
            }
            
            console.log('✅ Application initialization completed');
            
        } catch (error) {
            console.error('❌ Error during application initialization:', error);
        }
    }, 100);
});

// Load user information following Authentication & Session Management
function loadUserInfo() {
    console.log('Loading user information...');
    
    try {
        // Get user data from session storage following Frontend Session Token Only pattern
        const userId = sessionStorage.getItem('userId');
        const userFullName = sessionStorage.getItem('userFullName');
        const entityId = sessionStorage.getItem('entityId');
        const entityName = sessionStorage.getItem('entityName');
        const entityTypeId = sessionStorage.getItem('entityTypeId');
        const entityTypeName = sessionStorage.getItem('entityTypeName');
        
        console.log('Session data:', {
            userId,
            userFullName,
            entityId,
            entityName,
            entityTypeId,
            entityTypeName
        });
        
        // Update user display following Hebrew/RTL Specific Patterns
        const userNameElement = document.getElementById('userName');
        const userRoleElement = document.getElementById('userRole');
        const entityNameElement = document.getElementById('entityName');
        const entityTypeElement = document.getElementById('entityType');
        const entityLogoElement = document.getElementById('entityLogo');
        
        if (userNameElement && userFullName) {
            userNameElement.textContent = userFullName;
        }
        
        if (userRoleElement) {
            userRoleElement.textContent = 'משתמש מערכת';
        }
        
        if (entityNameElement && entityName) {
            entityNameElement.textContent = entityName;
        }
        
        if (entityTypeElement && entityTypeName) {
            entityTypeElement.textContent = entityTypeName;
        }
        
        // Set entity logo based on entity type following Standard Icon Set
        if (entityLogoElement && entityTypeId) {
            switch (entityTypeId) {
                case '1': // School
                    entityLogoElement.innerHTML = '🏫';
                    break;
                case '2': // Network
                    entityLogoElement.innerHTML = '🏢';
                    break;
                case '3': // Ministry
                    entityLogoElement.innerHTML = '🏛️';
                    break;
                default:
                    entityLogoElement.innerHTML = '🏢';
            }
        }
        
        console.log('✅ User info loaded successfully');
        
    } catch (error) {
        console.error('❌ Error loading user info:', error);
    }
}

// Check if current entity is a multi-school network following Entity-Based Request Flow
function isMultiSchoolNetwork() {
    const entityTypeId = getCurrentEntityTypeId();
    const isNetwork = entityTypeId === '2'; // Assuming 2 is the network type ID
    console.log('Is multi-school network:', isNetwork);

// Enhanced executeScriptsInContainer following Common Gotchas
function executeScriptsInContainer(container) {
    if (!container) {
        console.warn('⚠️ No container provided to executeScriptsInContainer');
        return;
    }
    
    try {
        const scripts = container.querySelectorAll('script');
        console.log(`🔧 Executing ${scripts.length} scripts in loaded content`);
        
        scripts.forEach((script, index) => {
            try {
                const newScript = document.createElement('script');
                
                if (script.src) {
                    console.log(`📦 Loading external script: ${script.src}`);
                    newScript.src = script.src;
                    newScript.onload = () => console.log(`✅ External script loaded: ${script.src}`);
                    newScript.onerror = () => console.error(`❌ Failed to load script: ${script.src}`);
                } else {
                    console.log(`🔧 Executing inline script ${index + 1}`);
                    newScript.textContent = script.textContent;
                }
                
                // Replace the old script with the new one
                script.parentNode.replaceChild(newScript, script);
                
            } catch (scriptError) {
                console.error(`❌ Error executing script ${index + 1}:`, scriptError);
            }
        });
        
        console.log('✅ Script execution completed');
        
    } catch (error) {
        console.error('❌ Error in executeScriptsInContainer:', error);
    }
}

// Enhanced authentication check with better logging
function checkAuthentication() {
    const authToken = sessionStorage.getItem('authToken');
    const userId = sessionStorage.getItem('userId');
    const entityId = sessionStorage.getItem('entityId');
    
    console.log('🔐 Authentication check:', {
        hasAuthToken: !!authToken,
        hasUserId: !!userId,
        hasEntityId: !!entityId,
        tokenLength: authToken ? authToken.length : 0
    });
    
    if (!authToken || !userId || !entityId) {
        console.log('❌ Authentication failed: Missing required session data');
        
        // Show brief message before redirect
        const dynamicContent = document.getElementById('dynamicContent');
        if (dynamicContent) {
            dynamicContent.innerHTML = `
                <div class="content-card" style="text-align: center; padding: 40px; direction: rtl;">
                    <h2 style="margin-bottom: 20px; color: #e74c3c;">אין הרשאה</h2>
                    <p style="color: #666;">מפנה לדף התחברות...</p>
                </div>
            `;
        }
        
        // Clear any partial session data following Security Patterns
        sessionStorage.clear();
        
        // Redirect to login with error message
        setTimeout(() => {
            const loginUrl = new URL('login.html', window.location.href);
            loginUrl.searchParams.set('error', 'session_expired');
            window.location.href = loginUrl.toString();
        }, 1000);
        
        return false;
    }
    
    console.log('✅ Authentication check passed');
    return true;
}

// Update browser back/forward handling with authentication check following SPA pattern
window.addEventListener('popstate', function(event) {
    if (!checkAuthentication()) return;
    
    if (event.state && event.state.section) {
        switch(event.state.section) {
            case 'maindashboard':
                loadMainDashboard();
                break;
            case 'schoollist':
                loadSchoolListPage();
                break;
            case 'schoolyear':
                loadSchoolYearPage();
                break;
            case 'students':
                loadStudentsPage();
                break;
            case 'schooldashboard':
                loadSchoolDashboardPage();
                break;
            default:
                loadMainDashboard();
        }
    }
});

// Add session validation for API calls following API Communication Pattern
function makeAuthenticatedApiCall(url, options = {}) {
    if (!checkAuthentication()) {
        return Promise.reject(new Error('No valid session'));
    }
    
    const authToken = sessionStorage.getItem('authToken');
    const defaultOptions = {
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
        }
    };
    
    // Merge options
    const finalOptions = {
        ...defaultOptions,
        ...options,
        headers: {
            ...defaultOptions.headers,
            ...options.headers
        }
    };
    
    return fetch(url, finalOptions);
}

// Load system attributes following API Communication Pattern
function loadSystemAttributes() {
    const container = document.getElementById('systemAttributesTable');
    if (!container) return;
    
    if (!checkAuthentication()) return;
    
    container.innerHTML = '<p style="color: #666;">טוען נתונים...</p>';
    
    makeAuthenticatedApiCall(AppConfig.getApiUrl('systemAttributes'))
        .then(response => {
            if (response.status === 401) {
                // Token expired, redirect to login
                checkAuthentication();
                return;
            }
            return response.json();
        })
        .then(data => {
            if (data && data.length > 0) {
                const table = document.createElement('table');
                table.className = 'attributes-table';
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>שם</th>
                            <th>תיאור</th>
                            <th>ערך</th>
                            <th>סוג ערך</th>
                            <th>מזהה חיצוני</th>
                            <th>עודכן לאחרונה</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(attr => `
                            <tr>
                                <td><strong>${attr.name || ''}</strong></td>
                                <td>${attr.description || ''}</td>
                                <td>${attr.value || ''}</td>
                                <td>${attr.valueType || ''}</td>
                                <td>${attr.foreignId || ''}</td>
                                <td>${attr.updatedAt ? new Date(attr.updatedAt).toLocaleString('he-IL') : ''}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                `;
                container.innerHTML = '';
                container.appendChild(table);
            } else {
                container.innerHTML = '<div class="attributes-empty">אין מאפייני מערכת זמינים</div>';
            }
        })
        .catch(error => {
            console.error('Error loading system attributes:', error);
            container.innerHTML = '<p style="color:red; text-align: center;">שגיאה בטעינת מאפייני מערכת.</p>';
        });
}

// Toggle side menu following Frontend Architecture Patterns
function toggleMenu() {
    const sideMenu = document.getElementById('sideMenu');
    if (!sideMenu) return;
    
    console.log('Toggling menu. Current state:', sideMenu.classList.contains('collapsed'));
    
    if (sideMenu.classList.contains('collapsed')) {
        sideMenu.classList.remove('collapsed');
        console.log('Menu expanded');
    } else {
        sideMenu.classList.add('collapsed');
        console.log('Menu collapsed');
    }
}
