<div class="students-container">
    <div class="students-content">
        <div class="content-card">
            <h2>נתוני סשן - משתמשים פעילים</h2>
            
            <div class="session-info">
                <h3>Session ID: <span id="sessionId"></span></h3>
                <button onclick="refreshSessionData()" class="btn-primary">רענן נתונים</button>
            </div>
            
            <div class="properties-section" style="margin-top: 20px;">
                <h3>Session Properties</h3>
                <div style="overflow-x: auto;">
                    <table class="data-table" id="propertiesTable">
                        <thead>
                            <tr>
                                <th>Property Key</th>
                                <th>Value</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="propertiesBody">
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="add-property-section" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                <h3>הוסף/עדכן מאפיין</h3>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <input type="text" id="propertyKey" placeholder="Property Key" style="flex: 1; padding: 8px;">
                    <input type="text" id="propertyValue" placeholder="Property Value" style="flex: 2; padding: 8px;">
                    <button onclick="addProperty()" class="btn-primary">עדכן</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function refreshSessionData() {
        try {
            const session = await window.SessionState.getSession();
            document.getElementById('sessionId').textContent = session.userId || 'N/A';
            
            // Get all session properties
            const authToken = sessionStorage.getItem('authToken');
            const response = await fetch(AppConfig.getApiUrl('session'), {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            
            if (!response.ok) {
                throw new Error('Failed to load session data');
            }
            
            const sessionData = await response.json();
            const tbody = document.getElementById('propertiesBody');
            tbody.innerHTML = '';
            
            // Display all session properties
            for (const [key, value] of Object.entries(sessionData)) {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td style="font-family: monospace;">${key}</td>
                    <td>${typeof value === 'object' ? JSON.stringify(value) : value}</td>
                    <td>
                        <button onclick="deleteProperty('${key}')" class="btn-icon" title="מחק">
                            <img src="delete_icon.png" alt="Delete" class="action-icon-natural">
                        </button>
                    </td>
                `;
            }
        } catch (error) {
            console.error('Error loading session data:', error);
            alert('שגיאה בטעינת נתוני סשן');
        }
    }
    
    async function addProperty() {
        const key = document.getElementById('propertyKey').value.trim();
        const value = document.getElementById('propertyValue').value.trim();
        
        if (!key || !value) {
            alert('נא להזין גם מפתח וגם ערך');
            return;
        }
        
        try {
            await window.SessionState.setProperty(key, value);
            document.getElementById('propertyKey').value = '';
            document.getElementById('propertyValue').value = '';
            await refreshSessionData();
        } catch (error) {
            console.error('Error setting property:', error);
            alert('שגיאה בעדכון המאפיין');
        }
    }
    
    async function deleteProperty(key) {
        if (!confirm(`למחוק את המאפיין "${key}"?`)) return;
        
        try {
            const authToken = sessionStorage.getItem('authToken');
            const response = await fetch(AppConfig.getApiUrl(`session/property/${key}`), {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${authToken}`
                }
            });
            
            if (response.ok) {
                await refreshSessionData();
            } else {
                alert('שגיאה במחיקת המאפיין');
            }
        } catch (error) {
            console.error('Error deleting property:', error);
            alert('שגיאה במחיקת המאפיין');
        }
    }
    
    // Export functions to window
    window.refreshSessionData = refreshSessionData;
    window.addProperty = addProperty;
    window.deleteProperty = deleteProperty;
    
    // Initialize on load
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Sessions page loaded');
        refreshSessionData();
    });
    
    // Also try immediate call if DOM is already ready
    if (document.readyState !== 'loading') {
        console.log('📄 Document already ready, loading sessions data immediately');
        refreshSessionData();
    }
</script>
